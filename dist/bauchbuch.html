/* ===== js/tresor.js ===== */
/*
 * Die Sicherung mit Passwort.
 *
 * Der wundeste Punkt dieser App hatte nie etwas mit Medizin zu tun: Die
 * Sicherung war eine offene JSON-Datei im Download-Ordner. Ein Tagebuch über
 * den Körper eines Menschen, im Klartext, auf einem Gerät, das man verleiht,
 * verliert oder irgendwann verkauft. Alles andere hier ist gegen Übertragung
 * geschützt – und die einzige Kopie lag frei herum.
 *
 * Verschlüsselt wird im Browser selbst, mit dem, was er ohnehin mitbringt:
 *
 *   PBKDF2  macht aus dem Passwort einen Schlüssel und ist dabei absichtlich
 *           langsam. 250 000 Runden kosten auf einem Handy ein bis zwei
 *           Sekunden – beim Sichern einmal, beim Raten eines Passworts
 *           ebenfalls, und genau darauf kommt es an.
 *   AES-GCM verschlüsselt und versiegelt in einem: Wer an der Datei etwas
 *           ändert, bekommt sie nicht mehr auf, statt stillschweigend Unsinn
 *           zu entschlüsseln.
 *
 * Salz und Startwert stehen unverschlüsselt in der Datei. Das ist richtig so –
 * sie sind keine Geheimnisse, sie sorgen nur dafür, dass zwei Sicherungen mit
 * demselben Passwort verschieden aussehen und dass eine vorberechnete Liste
 * nichts nützt.
 *
 * ZWEI EHRLICHKEITEN, DIE IN DIE ANZEIGE GEHÖREN:
 *
 *   * **Passwort vergessen heißt Sicherung weg.** Es gibt keine Hintertür,
 *     kein Zurücksetzen, niemanden zum Fragen. Das ist der Preis dafür, dass
 *     es auch für alle anderen keine gibt.
 *   * **Ohne sichere Adresse gibt es das nicht.** `crypto.subtle` steht nur in
 *     einem sicheren Kontext zur Verfügung – über https oder auf dem eigenen
 *     Rechner. Die Ein-Datei-Fassung, die per Doppelklick aus dem Download-
 *     Ordner startet (file://), hat keinen. Dort bleibt nur die offene
 *     Sicherung, und die App sagt das, statt einen Knopf anzubieten, der
 *     nichts täte.
 *
 * Kein Netzwerk, keine Bibliothek, keine Abhängigkeit: WebCrypto ist im
 * Browser. tools/pruefung/keine-leitung.py bleibt damit zufrieden.
 */

/** Kennzeichen im Dateikopf, damit das Einlesen die Fassung erkennt. */
const TRESOR_ART = 'bauchbuch-tresor';
const TRESOR_FASSUNG = 1;

/*
 * Runden für die Schlüsselableitung.
 *
 * Hoch genug, dass Durchprobieren teuer wird, niedrig genug, dass ein altes
 * Handy nicht eine halbe Minute steht. Die Zahl steht in der Datei mit drin:
 * Wird sie hier später erhöht, lassen sich ältere Sicherungen trotzdem noch
 * öffnen.
 */
const RUNDEN = 250000;

/** Steht die Verschlüsselung in diesem Browser überhaupt zur Verfügung? */
function tresorMoeglich() {
  try {
    return !!(globalThis.crypto && globalThis.crypto.subtle
      && typeof globalThis.crypto.subtle.deriveKey === 'function');
  } catch {
    return false;
  }
}

const roher = (n) => globalThis.crypto.getRandomValues(new Uint8Array(n));

/*
 * Bytes als Text und zurück.
 *
 * base64 statt einer Zahlenliste: Die Datei wird sonst dreimal so groß, und
 * sie soll sich noch per Nachricht verschicken lassen. In Stücken umgewandelt,
 * weil String.fromCharCode mit einem Argument je Byte bei ein paar hunderttausend
 * Bytes den Aufrufstapel sprengt – genau bei der großen Sicherung also, bei
 * der es darauf ankommt.
 */
function zuBase64(bytes) {
  let s = '';
  const stueck = 0x8000;
  for (let i = 0; i < bytes.length; i += stueck) {
    s += String.fromCharCode.apply(null, bytes.subarray(i, i + stueck));
  }
  return btoa(s);
}

function ausBase64(text) {
  const roh = atob(text);
  const bytes = new Uint8Array(roh.length);
  for (let i = 0; i < roh.length; i++) bytes[i] = roh.charCodeAt(i);
  return bytes;
}

async function schluessel(passwort, salz, runden) {
  const roh = await globalThis.crypto.subtle.importKey(
    'raw', new TextEncoder().encode(passwort), 'PBKDF2', false, ['deriveKey'],
  );
  return globalThis.crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: salz, iterations: runden, hash: 'SHA-256' },
    roh,
    { name: 'AES-GCM', length: 256 },
    false,
    ['encrypt', 'decrypt'],
  );
}

/**
 * Klartext zu einer Tresordatei.
 *
 * Zurück kommt wieder JSON – lesbar genug, dass man sieht, was es ist, und
 * dass ein Fehlversuch beim Einlesen erklärbar bleibt. Was drinsteht, ist
 * ohne Passwort trotzdem nichts.
 */
export async function verschluesseln(klartext, passwort) {
  if (!tresorMoeglich()) throw new Error('Dieser Browser kann nicht verschlüsseln.');
  if (!passwort) throw new Error('Kein Passwort angegeben.');
  const salz = roher(16);
  const iv = roher(12);
  const k = await schluessel(passwort, salz, RUNDEN);
  const daten = new Uint8Array(await globalThis.crypto.subtle.encrypt(
    { name: 'AES-GCM', iv }, k, new TextEncoder().encode(klartext),
  ));
  return JSON.stringify({
    art: TRESOR_ART,
    fassung: TRESOR_FASSUNG,
    hinweis: 'Verschlüsselte Body-Check-Sicherung. Ohne das Passwort ist hier '
      + 'nichts zu holen – auch nicht für den, der sie geschrieben hat.',
    verfahren: 'PBKDF2-SHA256/AES-GCM',
    runden: RUNDEN,
    salz: zuBase64(salz),
    iv: zuBase64(iv),
    daten: zuBase64(daten),
  }, null, 2);
}

/** Ist das eine Tresordatei? Wird beim Einlesen gebraucht, bevor gefragt wird. */
function istTresor(text) {
  try {
    const o = JSON.parse(text);
    return !!o && o.art === TRESOR_ART && typeof o.daten === 'string';
  } catch {
    return false;
  }
}

/**
 * Tresordatei zurück zu Klartext.
 *
 * Ein falsches Passwort und eine beschädigte Datei sehen für AES-GCM gleich
 * aus – beides scheitert an der Prüfsumme. Gemeldet wird deshalb das
 * Wahrscheinlichere, aber mit beiden Möglichkeiten: Wer sein Passwort für
 * richtig hält, soll nicht denken, er habe es vergessen.
 */
export async function entschluesseln(text, passwort) {
  if (!tresorMoeglich()) throw new Error('Dieser Browser kann nicht entschlüsseln.');
  const o = JSON.parse(text);
  if (!o || o.art !== TRESOR_ART) throw new Error('Das ist keine verschlüsselte Sicherung.');
  const runden = Number.isFinite(o.runden) && o.runden > 0 ? o.runden : RUNDEN;
  const k = await schluessel(passwort, ausBase64(o.salz), runden);
  let klar;
  try {
    klar = await globalThis.crypto.subtle.decrypt(
      { name: 'AES-GCM', iv: ausBase64(o.iv) }, k, ausBase64(o.daten),
    );
  } catch {
    throw new Error('Falsches Passwort – oder die Datei ist beschädigt.');
  }
  return new TextDecoder().decode(klar);
}

/* ===== js/briefkasten.js ===== */
/*
 * Die einzige Stelle dieser App, die nach draußen spricht.
 *
 * Bis hierher galt: Die App sendet nichts, punktum. Das war einfach zu prüfen
 * und einfach zu erklären, und es hatte einen Preis, den niemand sah – der
 * Reiter „Ideen" war eine Sackgasse. Wer etwas eintrug, hatte es
 * *aufgeschrieben*; angekommen war es nirgends, solange niemand es von Hand
 * weiterreichte. Der Umweg über das Teilen-Menü half, aber ein Umweg bleibt
 * ein Umweg, und Umwege werden nicht gegangen.
 *
 * DIE ZUSAGE IST DESHALB NICHT WEG, SONDERN GENAUER:
 *
 *   vorher   „Die App sendet nichts."
 *   jetzt    „Die App sendet nichts außer den Ideen, die du selbst eintippst
 *             und selbst abschickst."
 *
 * Was unverändert gilt und der eigentliche Grund für all das war:
 * **Gesundheitsdaten verlassen dieses Gerät nie.** Kein Eintrag, kein Tag,
 * keine Auswertung, kein Bericht, keine Kennung, keine Zählung von Aufrufen.
 *
 * Und das ist keine Absichtserklärung:
 *
 *   * Diese Datei ist die einzige im Projekt, in der eine fremde Adresse
 *     stehen darf. tools/pruefung/keine-leitung.py lässt sie hier zu und
 *     nirgends sonst.
 *   * `schicken()` bekommt einen fertigen Text übergeben und kommt an den
 *     Speicher gar nicht heran – dieses Modul importiert store.js nicht.
 *   * tests/test-still.mjs schreibt im laufenden Browser jede Anfrage mit:
 *     Erlaubt ist genau ein POST an genau diese Adresse, und nur nachdem
 *     jemand den Knopf gedrückt hat. Der Rumpf wird gegen ein volles Tagebuch
 *     gehalten – taucht daraus auch nur ein Wort auf, scheitert der Test.
 *   * tests/test-schweigen.mjs klickt die ganze App mit Tagebuchdaten durch
 *     und verlangt: null Anfragen.
 *
 * Von selbst passiert nie etwas. Kein Wiederholen im Hintergrund, keine
 * Warteschlange, die später doch noch sendet. Geht es nicht, sagt die App das
 * und der Text bleibt stehen – dann entscheidet wieder ein Mensch.
 */

/**
 * Wohin die Ideen gehen.
 *
 * Ein eigener kleiner Kasten (Finanzdienste/Briefkasten), der einen Text
 * entgegennimmt und sonst nichts kann: kein Feld für ein Tagebuch, keins für
 * einen Namen, keins für eine Kennung. Er speichert den Wortlaut und wann er
 * ankam. Mehr gibt es dort nicht.
 */
const KASTEN = 'https://briefkasten.tobias-kruse-184.workers.dev/idee';

/** Länger nimmt der Kasten nicht an. */
const MAX_ZEICHEN = 2000;

/*
 * Hier stand eine Bedenkzeit von einer Minute, und sie ist ersatzlos weg.
 *
 * Der Gedanke war: Wer „Die Uhrzeit ist blö" schreibt und kurz überlegt, soll
 * das noch ausbessern können. Der Preis war eine Uhr, die in der offenen
 * Seite lief und mit dem Zumachen verschwand – wer eintippte und die App
 * schloss, verschickte nie etwas. Eine Vorsichtsmaßnahme, die den Vorgang
 * verhindert, den sie absichern soll, ist keine.
 *
 * Der Knopf „Eintragen" ist die Entscheidung. Was damit wegfällt, wird nicht
 * schöngeredet: Danach ist der Satz draußen. Ihn in der App zu löschen nimmt
 * ihn aus der eigenen Liste, nicht mehr aus dem Kasten. Genau so steht es
 * auch auf dem Reiter – eine Zusage, die man nicht halten kann, ist schlimmer
 * als keine.
 */

/**
 * Einen Text abschicken.
 *
 * Wirft mit einer Meldung, die man jemandem zeigen kann – die Anzeige gibt sie
 * unverändert weiter. „Fehler 500" hilft niemandem; „gerade kein Netz" schon,
 * weil daraus folgt, was man tun kann.
 *
 * @param {string} text  der fertige Ideentext, sonst nichts
 * @returns {Promise<void>}
 */
export async function schicken(text) {
  const inhalt = String(text || '').trim();
  if (!inhalt) throw new Error('Da steht noch nichts.');
  if (inhalt.length > MAX_ZEICHEN) {
    throw new Error(`Das ist zu lang – höchstens ${MAX_ZEICHEN} Zeichen.`);
  }

  /*
   * Abbruch nach zwanzig Sekunden.
   *
   * Ohne ihn hängt der Knopf in einem Funkloch, bis der Browser irgendwann
   * von selbst aufgibt – und solange weiß niemand, ob es geklappt hat. Lieber
   * früh und deutlich scheitern.
   */
  const abbruch = new AbortController();
  const uhr = setTimeout(() => abbruch.abort(), 20000);

  let antwort;
  try {
    antwort = await fetch(KASTEN, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      // Genau ein Feld. Es gibt hier nichts anderes zu schicken.
      body: JSON.stringify({ text: inhalt }),
      signal: abbruch.signal,
    });
  } catch {
    throw new Error('Kein Netz. Der Text bleibt stehen – später noch einmal.');
  } finally {
    clearTimeout(uhr);
  }

  if (antwort.ok) return;

  // Der Kasten begründet seine Absagen; wenn er es tut, hat er den besseren
  // Satz, weil er weiß, woran es lag.
  let grund = '';
  try {
    const d = await antwort.json();
    grund = d && d.fehler ? String(d.fehler) : '';
  } catch { /* dann eben ohne */ }
  throw new Error(grund || `Ging nicht (${antwort.status}).`);
}

/* ===== js/bericht.js ===== */
/*
 * Der Ausdruck für den Arzttermin.
 *
 * Zehn Minuten Sprechstunde und die Frage „und, wie war es?" – darauf ist
 * niemand aus dem Kopf vorbereitet. Diese Datei macht aus Wochen an
 * Eintragungen eine Seite Text: Zeitraum, wie viele Tage mit Beschwerden, wie
 * stark, wann, was auffällig war, welche Mittel genommen wurden.
 *
 * Bewusst reiner Text und kein PDF: Text lässt sich in jede Mail einfügen, auf
 * jedem Gerät ausdrucken und vorher noch ändern. Und was man ändern kann,
 * liest man vorher – bei einem erzeugten PDF tut das erfahrungsgemäß niemand.
 *
 * Der Bericht behauptet nichts. Er zählt, und er sagt dazu, wie oft. Die
 * Einordnung macht die Praxis.
 */





















const prozent = (x) => `${Math.round(x * 100)} %`;

/**
 * Einen langen Satz auf Zeilenbreite umbrechen.
 *
 * Der Bericht ist reiner Text und wird ausgedruckt oder in eine Mail geklebt.
 * Eine 400 Zeichen lange Zeile ist dort entweder abgeschnitten oder unlesbar –
 * und die Sätze aus js/ansprechen.js und js/versuch.js sind genau das.
 */
function umbrochen(satz, breite = 68) {
  const zeilen = [];
  let zeile = '';
  String(satz).split(/\s+/).forEach((wort) => {
    if (zeile && (zeile.length + wort.length + 1) > breite) {
      zeilen.push(zeile);
      zeile = wort;
    } else {
      zeile = zeile ? `${zeile} ${wort}` : wort;
    }
  });
  if (zeile) zeilen.push(zeile);
  return zeilen;
}

/**
 * @param {object} zustand  der gesamte Speicherzustand
 * @param {string} von, bis ISO-Daten, einschließlich
 */
function arztBericht(zustand, von, bis) {
  const { eintraege, tage } = zustand;
  const imZeitraum = eintraege.filter((e) => e.am >= von && e.am <= bis);
  /*
   * Der Tagesspeicher ebenso eingegrenzt – für alles, was Tage zählt. Wer
   * gefilterte Einträge mit ungefilterten Tagesfragen mischt, bekommt aus
   * jedem Tag mit Tagesfrage außerhalb des Zeitraums einen notierten Tag
   * mit Bauchwert null, und aus jedem Zyklus davor einen Zyklus ohne
   * Kopfschmerz. Genau das stand bis zur Gegenprüfung im Kopfabschnitt.
   */
  const tageImZeitraum = Object.fromEntries(Object.entries(tage || {})
    .filter(([iso]) => iso >= von && iso <= bis));
  const z = gesamtZahlen(imZeitraum, tage, von, bis);
  const zeilen = [];
  const sag = (s = '') => zeilen.push(s);

  sag('Magen-Tagebuch');
  sag(`Zeitraum: ${fmtDatum(von, true)} bis ${fmtDatum(bis, true)} `
    + `(${mehrzahl(tageDazwischen(von, bis) + 1, 'Tag', 'Tage')})`);
  // Beginnt der Bericht genau an einem eingetragenen Termin, gehört das in
  // den Kopf: Dann liest niemand die 47 Tage als eine runde Zahl, die eine
  // App sich ausgesucht hat.
  if ((zustand.termine || []).includes(von)) {
    sag('Das ist die Zeit seit dem letzten Termin.');
  }
  sag();

  /*
   * Hier kommt „In Kürze" hin – gefüllt wird es aber erst ganz unten.
   *
   * Die Sätze fassen zusammen, was der Bericht rechnet, also müssen sie nach
   * allem entstehen. Stehen müssen sie trotzdem oben: Zehn Minuten
   * Sprechstunde reichen nicht für zwölf Abschnitte, und was hinten steht,
   * wird nicht gelesen. Die Zeilen werden deshalb am Ende an diese Stelle
   * eingesetzt.
   */
  const kopfMarke = zeilen.length;

  // Ohne einen notierten Bauchtag gibt es keinen Bauchbericht – außer der
  // Kopf hat etwas: Dann stehen die Bauchzeilen auf null, der Kopfabschnitt
  // nicht.
  if (!z.notierteTage && !imZeitraum.some((e) => e.art === 'kopf')) {
    sag('In diesem Zeitraum wurde nichts eingetragen.');
    return zeilen.join('\n');
  }

  const bild = bildLesen({
    eintraege: imZeitraum,
    tage,
    bilanz: ausloeserBilanz(imZeitraum, {
      fenster: zustand.fenster,
      mindestFaelle: zustand.mindestFaelle,
      eigene: zustand.eigeneAusloeser,
    }),
    name: (id) => ausloeserName(id, zustand.eigeneAusloeser),
    istNsar: (name) => {
      const g = wissenZu(name);
      return !!g && (g.id === 'nsar' || g.id === 'kombi');
    },
  });

  // Warnzeichen stehen ganz oben, vor den Zahlen. Wer den Zettel in der Hand
  // hat, soll sie sehen, bevor er zu blättern anfängt.
  if (bild.warnungen.length) {
    sag('!! WARNZEICHEN IM ZEITRAUM');
    bild.warnungen.forEach((w) => {
      sag(`  [${w.dringlichkeit === 'sofort' ? 'sofort' : 'zeitnah'}] ${w.name}`);
      sag(`           ${mehrzahl(w.anzahl, 'Mal', 'Mal')}, zuletzt ${fmtDatum(w.zuletzt, true)}`);
    });
    sag();
  }

  /*
   * Die Waage steht bei den Warnzeichen und nicht bei den Zahlen.
   *
   * Ein ungewollter Verlust von fünf Prozent ist das stärkste einzelne
   * Zeichen, das ein Tagebuch beisteuern kann – und die einzige Angabe darin,
   * die nicht aus einer Selbsteinschätzung stammt.
   */
  const waage = gewichtsBild(zustand.gewicht, bis, zustand.abnehmenGewollt);
  if (waage.urteil !== 'keine' && waage.urteil !== 'zu-kurz') {
    sag(waage.warnung ? '!! GEWICHT' : 'GEWICHT');
    umbrochen(waage.satz).forEach((zl) => sag(`  ${zl}`));
    sag();
  }

  // Der Kopf wird getrennt gezählt (js/kopf.js) und steht in der Übersicht
  // als eigene Zeile – damit niemand die „Tage mit Beschwerden" darüber für
  // Kopfschmerztage hält oder umgekehrt.
  const kz = kopfZahlen(imZeitraum, tageImZeitraum, bis);

  sag('ÜBERSICHT');
  sag(`  Tage mit Eintragung        ${z.notierteTage} von ${z.tage}`);
  sag(`  Tage mit Beschwerden       ${z.tageMitBeschwerden} (${prozent(z.anteil)} der eingetragenen Tage)`);
  sag(`  Stärke im Mittel           ${fmtZahl(z.schnitt)} von 10`);
  sag(`  Höchster Wert              ${z.hoechster} von 10 (${STAERKE_WORT[z.hoechster] || ''})`);
  sag(`  Mahlzeiten eingetragen     ${z.mahlzeiten}`);
  sag(`  Medikamenteneinnahmen      ${z.medikamente}`);
  if (kz.anzahl) sag(`  Kopfschmerztage            ${kz.tage} (getrennt gezählt, siehe unten)`);
  sag();

  /*
   * Wird es besser oder schlechter?
   *
   * Die eine Frage, die in der Sprechstunde immer kommt und die aus dem Kopf
   * niemand beantwortet – „mal so, mal so" ist die ehrliche Antwort und die
   * nutzloseste. Verglichen wird nur innerhalb des Berichtszeitraums: Eine
   * Richtung, die heimlich Tage von vor dem letzten Termin mitzählt, stünde
   * unter einer Überschrift, die etwas anderes verspricht.
   */
  const t = trend(imZeitraum, tage, bis, 14, von);
  if (t.pruefbar) {
    sag('RICHTUNG');
    sag(`  Die letzten ${t.jetzt.tage} notierten Tage gegen die ${t.davor.tage} davor:`);
    sag(`  ${TREND_WORT[t.richtung]}`);
    sag(`  Stärke im Mittel  ${fmtZahl(t.jetzt.schnitt)} zuletzt gegen `
      + `${fmtZahl(t.davor.schnitt)} davor`);
    sag(`  Beschwerdefreie Tage  ${t.jetzt.frei} zuletzt gegen ${t.davor.frei} davor`);
    sag('  (Verglichen werden notierte Tage, nicht Kalendertage – eine Lücke im');
    sag('  Tagebuch ist kein guter Tag. Schwelle für eine Richtung: eine ganze');
    sag('  Stufe Unterschied.)');
    sag();
  }

  const arten = nachArt(imZeitraum);
  if (arten.length) {
    sag('BESCHWERDEN NACH ART');
    arten.slice(0, 8).forEach((a) => {
      sag(`  ${beschwerdeName(a.id).padEnd(24)} ${mehrzahl(a.anzahl, 'Mal', 'Mal')}`);
    });
    sag();
  }

  const zeiten = nachTageszeit(imZeitraum);
  if (zeiten.length) {
    sag('BESCHWERDEN NACH TAGESZEIT');
    zeiten.forEach((t) => {
      sag(`  ${t.name.padEnd(24)} ${String(t.anzahl).padStart(3)} Mal, `
        + `im Mittel ${fmtZahl(t.schnitt)}`);
    });
    sag();
  }

  const alleAusloeser = ausloeserBilanz(imZeitraum, {
    fenster: zustand.fenster,
    mindestFaelle: zustand.mindestFaelle,
    eigene: zustand.eigeneAusloeser,
  });
  const bilanz = alleAusloeser.filter((b) => b.genug
    && einstufung(b) !== 'neutral' && einstufung(b) !== 'unauffaellig');

  /*
   * Bevor ein Auslöser auf dem Zettel steht, wird er gegen die Umstände
   * gehalten.
   *
   * Der rohe Vergleich fragt nur: war es nach diesen Mahlzeiten schlimmer? Er
   * kann nicht wissen, dass es Kaffee vor allem an Arbeitstagen gibt und
   * Arbeitstage die angespannten sind. Wer das ungeprüft als „auffällig" in
   * eine Sprechstunde trägt, streicht am Ende ein Lebensmittel und hat nichts
   * gewonnen. Deshalb wird jeder Fund innerhalb gleicher Anspannung, gleichen
   * Schlafs und gleicher Zyklusphase nachgerechnet – und was dabei
   * verschwindet, steht weiter unten und nicht hier oben.
   */
  const bewertet = bewerteteMahlzeiten(imZeitraum, zustand.fenster);
  const fenster = fensterWerte(imZeitraum);
  const gehalten = bilanz.map((b) => ({
    b,
    stand: haeltStand(bewertet, b.id, tage, { kopfTage: kopfTageVon(imZeitraum) }),
    zeit: zeitProfil(fenster, b.id),
    dosis: dosisBild(imZeitraum, b.id, zustand.fenster),
  }));
  const bleibt = gehalten.filter((x) => x.stand.urteil !== 'verschwindet');
  const zerfallen = gehalten.filter((x) => x.stand.urteil === 'verschwindet');

  const zahlen = (b) => `${fmtZahl(b.schnittMit)} gegen ${fmtZahl(b.schnittOhne)} `
    + `(${b.faelle} Mahlzeiten damit, ${b.gegenFaelle} ohne)`;

  if (bleibt.length) {
    sag(`AUFFÄLLIG IM ZEITRAUM VON ${zustand.fenster} STUNDEN NACH DEM ESSEN`);
    sag('  (Vergleich: mittlere Beschwerdestärke danach gegen alle übrigen Mahlzeiten)');
    // Die Schwelle gehört auf den Zettel: Sie erklärt, warum manches *nicht*
    // dasteht, und das ist in einer Sprechstunde die nützlichere Auskunft.
    const b0 = bleibt[0].b;
    if (Number.isFinite(b0.spielraum)) {
      umbrochen(spielraumSatz(b0.spielraum, b0.vergleiche), 66)
        .forEach((zl) => sag(`  ${zl}`));
    }
    bleibt.slice(0, 8).forEach(({ b, stand, zeit, dosis }) => {
      sag(`  ${ausloeserName(b.id, zustand.eigeneAusloeser).padEnd(24)} ${zahlen(b)}`);
      const wo = stand.urteil === 'nur-dann' ? ` (${(stand.wo || []).join(', ')})` : '';
      sag(`    unter gleichen Umständen: ${SCHICHT_WORT[stand.urteil]}${wo}`
        + (stand.urteil === 'unklar' ? ' – zu wenige Tage mit Angaben zu'
          + ' Anspannung, Schlaf oder Zyklus' : ''));
      // Der Zeitpunkt nur, wenn er deutlich ist. „Verteilt sich" ist für die
      // Sprechstunde keine Auskunft, sondern eine Zeile mehr zu lesen.
      if (zeit.schwerpunkt) {
        const f = zeit.teile.find((t) => t.id === zeit.schwerpunkt);
        sag(`    auffällig vor allem ${f.name.toLowerCase()} (${f.ort})`);
      }
      /*
       * Und die Menge – für die Sprechstunde oft die entscheidende Zeile.
       *
       * „Zwiebeln auffällig" führt zu einer Streichliste, die nach vier Wochen
       * niemand mehr einhält. „Als Würze unauffällig, als Hauptzutat nicht"
       * führt zu einer Empfehlung, die jemand leben kann – und die Angabe
       * kostet den Zettel eine Zeile.
       */
      if (dosis.urteil === 'schwelle') {
        sag(`    ${dosis.gehtBis.satz}: unauffällig (${dosis.gehtBis.faelle} Mahlzeiten), `
          + `${dosis.abStufe.satz}: auffällig (${dosis.abStufe.faelle})`);
      } else if (dosis.urteil === 'ab-hier') {
        sag(`    bisher nur ${dosis.abStufe.satz} geprüft – kleinere Mengen sind offen`);
      }
    });
    sag();
  }

  /*
   * Und was das Fenster gar nicht sehen konnte.
   *
   * Vier Stunden sind eine Konvention, keine Physiologie. Was im Dickdarm
   * vergärt, meldet sich frühestens nach vier bis acht Stunden – für die
   * Bilanz oben existiert es damit nicht. Diese Zeilen sind der Unterschied
   * zwischen „nichts gefunden" und „nicht danach gesucht".
   */
  const spaet = spaeteFunde(
    fenster,
    alleAusloeser.filter((b) => !['auffaellig', 'moeglich'].includes(einstufung(b)))
      .map((b) => b.id),
    zustand.fenster || 4,
  );
  if (spaet.length) {
    sag('ERST NACH DEM FENSTER AUFFÄLLIG');
    sag(`  (Im Fenster von ${zustand.fenster || 4} Stunden unauffällig, später nicht.`);
    sag('  Gezählt sind nur Mahlzeiten, bei denen das späte Fenster überhaupt');
    sag('  beobachtbar war – also nichts dazwischengegessen wurde.)');
    spaet.slice(0, 4).forEach((x) => {
      sag(`  ${ausloeserName(x.id, zustand.eigeneAusloeser).padEnd(24)} `
        + `${fmtZahl(x.teil.schnittMit)} gegen ${fmtZahl(x.teil.schnittOhne)} `
        + `(${x.teil.faelle} damit, ${x.teil.gegenFaelle} ohne)`);
      sag(`    ${x.fensterName}, also ${x.ort}`);
    });
    sag();
  }

  /*
   * Was den Vergleich nicht überstanden hat, wird trotzdem genannt.
   *
   * Es einfach wegzulassen wäre bequem und falsch: In der Sprechstunde kommt
   * derselbe Verdacht sonst beim nächsten Mal wieder, und diesmal ungeprüft.
   */
  if (zerfallen.length) {
    sag('IM ROHEN VERGLEICH AUFFÄLLIG, UNTER GLEICHEN UMSTÄNDEN NICHT MEHR');
    sag('  (Innerhalb gleicher Anspannung, gleichen Schlafs und gleicher');
    sag('  Zyklusphase nachgerechnet bleibt kein Unterschied übrig – der');
    sag('  Verdacht kam vermutlich daher, dass beides zusammenfällt.)');
    zerfallen.slice(0, 6).forEach(({ b }) => {
      sag(`  ${ausloeserName(b.id, zustand.eigeneAusloeser).padEnd(24)} ${zahlen(b)}`);
    });
    sag();
  }

  /*
   * Nach Wirkweise – vor den einzelnen Zutaten wäre falsch herum, danach ist
   * richtig: Wer den Zettel liest, kennt dann schon die Beispiele und sieht
   * hier, was sie gemeinsam haben.
   */
  const klassen = klassenBilanz(imZeitraum, { fenster: zustand.fenster })
    .filter((k) => k.genug && ['auffaellig', 'moeglich'].includes(klassenEinstufung(k)));
  if (klassen.length) {
    sag('NACH WIRKWEISE ZUSAMMENGEFASST');
    sag('  (Mehr Fälle je Vergleich als eine einzelne Zutat; die Zuordnung ist grob.)');
    klassen.slice(0, 6).forEach((k) => {
      sag(`  ${k.kurz.padEnd(24)} ${fmtZahl(k.schnittMit)} gegen ${fmtZahl(k.schnittOhne)} `
        + `(${k.faelle} Mahlzeiten damit, ${k.gegenFaelle} ohne)`);
    });
    sag();
  }

  /*
   * Wie lange nach dem Essen – die Frage nach dem Ort.
   *
   * „Nach dem Essen tut es weh" führt zum Säureblocker; „sechs Stunden nach dem
   * Essen tut es weh" führt zur Ernährungsberatung. Aus dem Kopf beantwortet
   * das niemand, aus dem Tagebuch fällt es ab.
   */
  const zb = zeitBild(imZeitraum);
  if (zb.zugeordnet) {
    sag('WIE LANGE NACH DEM ESSEN');
    zb.teile.forEach((t) => {
      sag(`  ${t.name.padEnd(24)} ${String(t.anzahl).padStart(3)} `
        + `(${prozent(t.anteil)}), im Mittel ${fmtZahl(t.schnitt)}  – ${t.ort}`);
    });
    umbrochen(zb.satz).forEach((z) => sag(`  ${z}`));
    sag(`  Zugeordnet: ${zb.zugeordnet} von ${zb.gesamt} Beschwerden.`);
    umbrochen(`(${zb.hinweis})`, 66).forEach((z) => sag(`  ${z}`));
    sag();
  }

  const s = stuhlZahlen(imZeitraum, tage);
  if (s.gesamt) {
    sag('STUHLGANG (BRISTOL)');
    sag(`  Eingetragen                ${s.gesamt} Mal, ${fmtZahl(s.proTag)} je notiertem Tag`);
    sag(`  Typ 1-2 (hart)             ${s.hart} (${prozent(s.anteilHart)})`);
    sag(`  Typ 3-5 (unauffällig)      ${s.normal} (${prozent(s.anteilNormal)})`);
    sag(`  Typ 6-7 (weich)            ${s.weich} (${prozent(s.anteilWeich)})`);
    if (s.dringend) sag(`  davon dringend             ${s.dringend}`);
    sag();
  }

  /*
   * Kopfschmerzen – getrennt vom Bauch, und mit dem, was beide verbindet.
   *
   * Die Zahlen oben (Stärke, Beschwerdetage, Auslöser) kennen den Kopf nicht;
   * das ist Absicht und steht als Satz dabei. Was hierher gehört, ist das
   * Schmerzmittel: an wie vielen Kopfschmerztagen eines im Tagebuch stand und
   * was der Bauch an den Tagen danach gemacht hat.
   */
  if (kz.anzahl) {
    const gruppeVon = (name) => {
      const g = wissenZu(name);
      return g ? g.id : null;
    };
    /*
     * Zwei Blickwinkel: Was im Berichtszeitraum eingetragen wurde (kz, km),
     * und die Kalenderzahlen der Neurologie über alle Einträge (kzAlle,
     * kmAlle) – „die letzten 30 Tage" sind die letzten 30 Tage, auch wenn
     * der Bericht nur achtzehn umfasst.
     */
    const km = kopfMittel(imZeitraum, gruppeVon, bis);
    const kzAlle = kopfZahlen(eintraege, tage, bis);
    const kmAlle = kopfMittel(eintraege, gruppeVon, bis);
    const befundIds = (zustand.befunde || []).map((b) => b.id);
    const kette = (liste, feld) => liste.map((f, i) => `${i ? 'davor ' : ''}${f[feld]}`).join(' · ');
    sag('KOPFSCHMERZEN');
    sag('  Für die Neurologie, je 30-Tage-Fenster (jüngstes zuerst):');
    sag(`  Kopfschmerztage            ${kette(kzAlle.fenster, 'kopfTage')} `
      + `(${kzAlle.notiert30} der letzten 30 Tage notiert)`);
    if (kmAlle.fenster.some((f) => f.akut)) {
      const sorten = sortenText(kmAlle.fenster[0]);
      sag(`  Tage mit Akutmittel        ${kette(kmAlle.fenster, 'akut')}${sorten ? ` (zuletzt: ${sorten})` : ''}`);
    }
    if (kzAlle.verlauf.ausgefallen || kzAlle.verlauf.eingeschraenkt) {
      sag(`  Ausgefallen (90 Tage)      ${mehrzahl(kzAlle.verlauf.ausgefallen, 'Tag', 'Tage')}`
        + (kzAlle.verlauf.eingeschraenkt ? `, dazu ${kzAlle.verlauf.eingeschraenkt} eingeschränkt` : ''));
    }
    sag('  Im Berichtszeitraum:');
    sag(`  Eingetragen                ${kz.anzahl} Mal an ${kz.tage} Tagen `
      + `(${prozent(kz.anteil)} der notierten Tage)`);
    sag(`  Stärke im Mittel           ${fmtZahl(kz.schnitt)} von 10, höchstens ${kz.hoechster}`);
    kz.dauern.forEach((x) => {
      sag(`  Dauer ${x.name.padEnd(20)} ${mehrzahl(x.anzahl, 'Mal', 'Mal')}`);
    });
    kz.arten.slice(0, 5).forEach((a) => {
      sag(`  ${a.name.slice(0, 26).padEnd(26)} ${mehrzahl(a.anzahl, 'Mal', 'Mal')}`);
    });
    const w = kz.wirkung;
    if (w.weg + w.besser + w.nicht) {
      sag(`  Mittel nach zwei Stunden   weg ${w.weg}×, besser ${w.besser}×, nicht geholfen ${w.nicht}×`);
    }
    if (km.mitAkut) {
      sag(`  Akutmittel am selben Tag   an ${km.mitAkut} von ${kz.tage} Tagen`
        + (km.mitNsar ? `, davon ${km.mitNsar} entzündungshemmend` : '')
        + (km.mitTriptan ? `, ${km.mitTriptan} mit Triptan` : '')
        + (km.mitNichtNsar ? `, ${km.mitNichtNsar} ohne Entzündungshemmung` : ''));
    }
    if (kmAlle.unbekannt.length) {
      sag(`  Nicht zugeordnet           ${kmAlle.unbekannt.map((u) => `${u.name} (${u.tage})`).join(', ')}`);
    }
    /*
     * Der Kopfschmerzkalender: drei Monate nebeneinander, aus allen Einträgen
     * – nicht nur denen im Berichtszeitraum, denn ein Monat, von dem nur die
     * letzte Woche zählt, sähe wie ein guter Monat aus.
     */
    const monate = kopfMonate(eintraege, tage, gruppeVon, bis);
    if (monate.length) {
      sag('  Je Kalendermonat:          Kopfschmerz / Akutmittel / ausgefallen / Periode');
      monate.forEach((mo) => {
        sag(`    ${(mo.name + (mo.angefangen ? ' (bis Berichtsende)' : '')).padEnd(24)} `
          + `${String(mo.kopfTage).padStart(11)} / ${String(mo.akut).padStart(10)}`
          + `${mo.triptan ? ` (Triptan ${mo.triptan})` : ''} / ${String(mo.ausgefallen).padStart(11)} / ${String(mo.blutung).padStart(7)}`);
      });
    }
    const nach = km.nsarTage.length
      ? nsarNachwirkung(imZeitraum, tageImZeitraum, km.nsarTage, km.kopfTageOhneNsar, tagesWert) : null;
    const bauch = bauchAnKopfTagen(imZeitraum, tageImZeitraum, tagesWert);
    const umstaende = kopfUmstaende(imZeitraum, tageImZeitraum, faktorBilanz, zufallsSpielraum);
    [
      statusSatz(kzAlle, bis),
      uebergebrauchSatz(kmAlle),
      chronischSatz(kzAlle),
      nachwirkungSatz(nach, fmtZahl),
      umPeriodeSatz(kopfUmPeriode(imZeitraum, tageImZeitraum, bis)),
      ...umstaendeSaetze(umstaende),
      bauchAnKopfTagenSatz(bauch, fmtZahl),
      unauffaelligeVergleiche({ nach, bauch, umstaende }),
    ].filter(Boolean).forEach((satz) => {
      sag('');
      umbrochen(satz).forEach((zl) => sag(`  ${zl}`));
    });
    const fragen = kopfFragen({ zahlen: kzAlle, mittel: kmAlle, befundIds });
    if (fragen.length) {
      sag('');
      sag('  Fragen für die Sprechstunde:');
      fragen.forEach((f) => umbrochen(f, 64).forEach((zl, j) => sag(`  ${j ? '  ' : '- '}${zl}`)));
    }
    const kp = kopfNachPhase(imZeitraum, tageImZeitraum);
    if (kp.length > 1) {
      sag('');
      sag('  Nach Zyklusphase (geschätzt aus den Blutungstagen):');
      kp.forEach((p) => sag(`    ${p.name.padEnd(24)} an ${p.mit} von ${p.tage} Tagen`));
    }
    sag('  Getrennt vom Bauch gezählt: Kein Kopfschmerz zählt in die Werte oben.');
    sag();
  }

  const mittel = new Map();
  imZeitraum.filter((e) => e.art === 'medikament').forEach((e) => {
    const name = (e.mittel || 'ohne Angabe').trim();
    mittel.set(name, (mittel.get(name) || 0) + 1);
  });
  if (mittel.size) {
    sag('EINGENOMMENE MITTEL');
    [...mittel.entries()].sort((a, b) => b[1] - a[1]).forEach(([name, n]) => {
      sag(`  ${name.padEnd(24)} ${mehrzahl(n, 'Mal', 'Mal')}`);
    });
    sag();
  }

  /*
   * Ob die Mittel etwas bewirkt haben.
   *
   * Für die Sprechstunde ist das oft die nützlichste Zeile des Zettels –
   * besonders, wenn nichts passiert ist: Ein Säureblocker ohne Wirkung nach
   * vier bis acht Wochen ist selbst ein Befund und spricht gegen die Säure als
   * Ursache. Aus dem Kopf beantwortet das niemand belastbar.
   */
  const ansprechen = mittelBilanz(imZeitraum, tage, {
    heute: bis,
    gruppeVon: (name) => {
      const g = wissenZu(name);
      return g ? g.id : null;
    },
  }).filter((m) => m.genug);
  if (ansprechen.length) {
    sag('HAT ES ETWAS BEWIRKT?');
    ansprechen.slice(0, 4).forEach((m) => {
      sag(`  ${m.name} – ${mehrzahl(m.einnahmeTage, 'Einnahmetag', 'Einnahmetage')}, `
        + `seit ${fmtDatum(m.seit, true)}`);
      umbrochen(befund(m)).forEach((z) => sag(`     ${z}`));
    });
    sag();
  }

  const v = zustand.versuch;
  if (v) {
    const e = ergebnis(v, eintraege, tage, bis);
    sag('AUSLASSVERSUCH');
    sag(`  Weggelassen: ${v.art === 'klasse' ? v.ziel : ausloeserName(v.ziel, zustand.eigeneAusloeser)}, `
      + `ab ${fmtDatum(v.start, true)} für ${mehrzahl(v.tage, 'Tag', 'Tage')}`);
    sag(`  Ergebnis: ${e.wort}`);
    sag(`  Davor ${fmtZahl(e.vorher.schnitt)} (${e.vorher.notierte} Tage), `
      + `ohne ${fmtZahl(e.auslass.schnitt)} (${e.auslass.notierte} Tage)`
      + (e.nachher ? `, nach der Wiedereinführung ${fmtZahl(e.nachher.schnitt)} `
        + `(${e.nachher.notierte} Tage)` : ', Wiedereinführung steht noch aus'));
    umbrochen(e.satz).forEach((z) => sag(`  ${z}`));
    sag('  (Ein Versuch an einem einzigen Menschen, ohne Verblindung.)');
    sag();
  }

  /*
   * Der Stufenplan gehört in den Bericht, und zwar als Erstes von allem
   * Geprüften.
   *
   * Er ist das Aufwendigste, was dieses Tagebuch hervorbringt – Wochen –, und
   * die Ernährungsberatung, an die eine Praxis überweist, fängt sonst bei null
   * an: dieselbe Karenz, dieselben Wochen. Ein Plan mit Ergebnissen erspart
   * genau das. Und die Karenzweiche gehört mit hinein, gerade wenn sie negativ
   * ausfiel: „Vier Wochen ohne FODMAPs haben nichts geändert" schließt eine
   * ganze Richtung aus und ist damit eine der nützlichsten Zeilen des Zettels.
   */
  const plan = zustand.stufenplan;
  const plaene = [plan, ...(zustand.stufenplaene || [])].filter(Boolean);
  if (plaene.length) {
    sag('STUFENPLAN (FODMAP)');
    plaene.slice(0, 3).forEach((pl) => {
      const b = planBild(pl, eintraege, tage, bis);
      sag(`  Karenz ab ${fmtDatum(pl.start, true)}, ${mehrzahl(pl.karenzTage, 'Tag', 'Tage')}`
        + ` – ${b.karenz.wort}`);
      sag(`     ${fmtZahl(b.karenz.karenz.schnitt)} während der Karenz gegen `
        + `${fmtZahl(b.karenz.vorher.schnitt)} davor `
        + `(${b.karenz.karenz.notierte} gegen ${b.karenz.vorher.notierte} notierte Tage)`);
      b.stufen.forEach((x) => {
        sag(`     ${x.name}: ${x.wort}`
          + (x.urteil === 'menge' && x.gehtBis ? ` (bis ${x.gehtBis})` : '')
          + (Number.isFinite(x.unterschied) && x.urteil !== 'laeuft'
            ? ` – ${fmtZahl(x.schnitt)} gegen ${fmtZahl(x.basis)} in der Karenz` : ''));
      });
      if (b.offen.length) sag(`     noch nicht geprüft: ${b.offen.length} Gruppen`);
    });
    sag();
  }

  /*
   * Der Provokationstest gehört in den Bericht, und zwar mitsamt seinen
   * Leerdurchgängen.
   *
   * In der Sprechstunde ist „ich vertrage keine Milch" eine Meinung. „Dreimal
   * nüchtern 250 ml, dreimal Beschwerden, an zwei Leermorgen nichts" ist eine
   * Beobachtung mit Protokoll – und sie beantwortet die Frage, die dort als
   * Nächstes kommt: Lohnt ein Atemtest, oder ist die Sache schon geklärt?
   * Ohne die Leerdurchgänge wäre es wieder nur eine Meinung.
   */
  const prov = [zustand.provokation, ...(zustand.provokationen || [])].filter(Boolean);
  if (prov.length) {
    sag('PROVOKATIONSTESTS');
    prov.slice(0, 6).forEach((p) => {
      const b = provokationsBild(p, eintraege, bis);
      sag(`  ${p.was || p.ziel} nüchtern, Fenster ${p.fenster || 4} h – ${b.wort}`);
      sag(`     ${b.echte} Durchgänge, ${b.leere} Leerdurchgänge`
        + (b.verworfen ? `, ${b.verworfen} nicht auswertbar (dabei gegessen)` : '')
        + (Number.isFinite(b.unterschied)
          ? `; ${fmtZahl(b.schnitt)} gegen ${fmtZahl(b.vergleich)} von 10` : ''));
      umbrochen(b.satz).forEach((z) => sag(`     ${z}`));
    });
    sag('  (Nicht verblindet. Ein Test ohne Befund wiegt hier schwerer als einer');
    sag('   mit: Die Erwartung schiebt nur in eine Richtung.)');
    sag();
  }

  /*
   * Was schon geprüft wurde – auch und gerade, was nichts ergab.
   *
   * Ohne diesen Abschnitt schickt jede Sprechstunde denselben Verdacht noch
   * einmal los. Ein Auslassversuch, der dagegen sprach, hat genauso Arbeit
   * gekostet wie einer, der dafür sprach, und ist für die nächste Überlegung
   * genauso viel wert.
   */
  const alte = (zustand.versuche || []).filter((x) => x.start <= bis);
  if (alte.length) {
    sag('SCHON GEPRÜFT');
    alte.slice(0, 8).forEach((x) => {
      const e = ergebnis(x, eintraege, tage, bis);
      const was = x.art === 'klasse' ? x.ziel : ausloeserName(x.ziel, zustand.eigeneAusloeser);
      sag(`  ${was} weggelassen ab ${fmtDatum(x.start, true)}, `
        + `${mehrzahl(x.tage, 'Tag', 'Tage')} – ${e.wort}`);
      sag(`     davor ${fmtZahl(e.vorher.schnitt)}, ohne ${fmtZahl(e.auslass.schnitt)}`
        + (e.nachher ? `, danach ${fmtZahl(e.nachher.schnitt)}` : ''));
    });
    sag();
  }

  const notizen = imZeitraum.filter((e) => e.art === 'notiz' && String(e.text || '').trim());
  if (notizen.length) {
    sag('NOTIZEN');
    notizen.slice(-12).forEach((e) => sag(`  ${fmtDatum(e.am)} ${e.um}  ${e.text.trim()}`));
    sag();
  }

  const phasen = phasenBilanz(imZeitraum, tage, tagesWert);
  if (phasen.length > 1) {
    sag('NACH ZYKLUSPHASE');
    phasen.forEach((p) => {
      sag(`  ${p.name.padEnd(24)} ${String(p.tage).padStart(3)} Tage, `
        + `im Mittel ${fmtZahl(p.schnitt)}`);
    });
    const pu = phasenUrteil(phasen, tage);
    if (pu.pruefbar) umbrochen(pu.satz).forEach((z) => sag(`  ${z}`));
    sag('  (Phasen geschätzt aus den eingetragenen Blutungstagen.)');
    sag();
  }

  /*
   * Und die Frage, die aus beidem zusammen entsteht.
   *
   * Ein Auslöser, der nur in einer Phase wirkt, kommt im Schnitt über vier
   * Wochen als „ein bisschen auffällig" heraus – eine Aussage, die für keinen
   * einzigen Tag stimmt. Für die Sprechstunde ist der Unterschied wichtig:
   * wechselnde Empfindlichkeit ist etwas anderes als eine Unverträglichkeit,
   * und sie wird anders behandelt.
   */
  const wechsel = wechselnde(
    bewertet, alleAusloeser.filter((b) => b.genug).map((b) => b.id), tage,
  );
  if (wechsel.length) {
    sag('WIRKUNG WECHSELT MIT DER ZYKLUSPHASE');
    wechsel.slice(0, 4).forEach((w) => {
      sag(`  ${ausloeserName(w.id, zustand.eigeneAusloeser)}`);
      w.phasen.filter((p) => p.pruefbar).forEach((p) => {
        sag(`    ${p.name.padEnd(22)} ${fmtZahl(p.schnittMit)} gegen `
          + `${fmtZahl(p.schnittOhne)} (${p.faelle} damit, ${p.gegenFaelle} ohne)`);
      });
    });
    sag('  (Dieselbe Menge, andere Wirkung – das spricht eher für eine');
    sag('  wechselnde Empfindlichkeit als für eine Unverträglichkeit.)');
    sag();
  }

  /*
   * Die Kriterien.
   *
   * Sie stehen bewusst *nach* den Zahlen und vor den Fragen: Wer den Zettel
   * liest, soll erst sehen, worauf sie beruhen. Und sie stehen nur da, wenn sie
   * geprüft werden konnten – „nicht prüfbar" als „nicht erfüllt" auszugeben
   * wäre die häufigste Art, mit Kriterien zu lügen.
   */
  const k = kriterien({
    eintraege,
    tage,
    heute: bis,
    beschwerdenSeit: zustand.beschwerdenSeit,
    istSaeuremittel: (name) => {
      const g = wissenZu(name);
      return !!g && ['ppi', 'h2', 'antazida', 'alginat'].includes(g.id);
    },
  });
  const kZeilen = [];
  /*
   * Auch das Nichtprüfbare kommt mit.
   *
   * Ein Regelwerk stillschweigend wegzulassen, weil die Daten nicht reichen,
   * sieht auf dem Papier aus wie „trifft nicht zu" – und das ist etwas ganz
   * anderes. Steht dort stattdessen, *warum* es nicht ging, weiß die Praxis
   * sofort, welche Frage noch offen ist.
   */
  if (k.reizdarm.pruefbar) {
    kZeilen.push(`  Rom IV, Reizdarmsyndrom       ${k.reizdarm.erfuellt ? 'Kriterien erfüllt' : 'nicht erfüllt'}`);
    kZeilen.push(`    Bauchschmerz an ${k.reizdarm.schmerzTage} Tagen `
      + `(${fmtZahl(k.reizdarm.proWoche)} je Woche der notierten Tage),`);
    kZeilen.push(`    ${k.reizdarm.erfuellteMerkmale} von 3 Merkmalen erfüllt`);
    k.reizdarm.merkmale.filter((m) => m.erfuellt)
      .forEach((m) => umbrochen(`${m.name}: ${m.text}`, 62).forEach((z) => kZeilen.push(`      - ${z}`)));
    if (k.reizdarm.typ.typ) kZeilen.push(`    Stuhlform: ${k.reizdarm.typ.name}`);
  } else {
    kZeilen.push('  Rom IV, Reizdarmsyndrom       nicht prüfbar');
    kZeilen.push('    Dafür fehlen Tage ohne Bauchschmerz oder Stuhlgangseinträge,');
    kZeilen.push('    mit denen sich die Schmerztage vergleichen ließen.');
  }
  if (k.dyspepsie.pruefbar) {
    kZeilen.push(`  Rom IV, funktionelle Dyspepsie ${k.dyspepsie.erfuellt ? 'Kriterien erfüllt' : 'nicht erfüllt'}`);
    [k.dyspepsie.pds, k.dyspepsie.eps].forEach((f) => {
      kZeilen.push(`    ${f.erfuellt ? '[x]' : '[ ]'} ${f.name}:`);
      kZeilen.push(`        an ${f.tage} Tagen, ${fmtZahl(f.proWoche)} je Woche der notierten Tage`);
    });
  } else {
    kZeilen.push('  Rom IV, funktionelle Dyspepsie nicht prüfbar (zu wenige notierte Tage)');
  }
  if (k.gerdq.belastbar) {
    kZeilen.push(`  GerdQ (letzte 7 Tage)         ${k.gerdq.punkte} von 18 Punkten`);
    kZeilen.push('    (ab 8 gilt eine Refluxkrankheit als wahrscheinlich)');
  } else {
    kZeilen.push(`  GerdQ (letzte 7 Tage)         nicht belastbar – nur `
      + `${k.gerdq.erfasst} der 7 Tage notiert`);
  }
  if (kZeilen.length) {
    sag('KRITERIEN');
    kZeilen.forEach(sag);
    if (k.dauer.erfuellt === null) {
      sag('    Beginn der Beschwerden nicht angegeben – die Rom-Bedingung');
      sag('    „Beginn vor mindestens sechs Monaten" ist damit ungeprüft.');
    } else {
      sag(`    Beschwerden seit ${k.dauer.seit} (${mehrzahl(k.dauer.monate, 'Monat', 'Monaten')}); `
        + `Rom-Zeitbedingung ${k.dauer.erfuellt ? 'erfüllt' : 'nicht erfüllt'}.`);
    }
    // Formulierung mit Absicht ohne Doppelpunkt nach „Diagnose" – der
    // Berichtstest sucht nach genau diesem Muster, weil es sonst niemandem
    // auffiele, wenn hier eines Tages doch eine zugeschrieben würde.
    sag('  Erfüllte Kriterien sind KEINE Diagnose. Beide Regelwerke setzen');
    sag('  voraus, dass nichts Organisches dahintersteckt. Grundlage sind');
    sag(`  ${k.zeitraum.notierteTage} notierte Tage der letzten 90; ein Tagebuch untererfasst,`);
    sag('  die Zahlen sind daher eher zu niedrig als zu hoch.');
    sag();
  }

  if (bild.muster.length) {
    sag('WORAUF DAS MUSTER HINDEUTET');
    sag('  (Beschreibung des Verlaufs, keine Diagnose – siehe unten.)');
    bild.muster.slice(0, 2).forEach((m, i) => {
      sag(`  ${i + 1}. ${m.name}`);
      m.belege.forEach((x) => umbrochen(x, 62).forEach((z, j) => sag(`     ${j ? '  ' : '- '}${z}`)));
      umbrochen(`Abzuklären wäre: ${m.ursachen.map((u) => u.name).join(', ')}`, 64)
        .forEach((z) => sag(`     ${z}`));
    });
    sag();
  }

  if (bild.fragen.length) {
    sag('FRAGEN');
    bild.fragen.forEach((f) => umbrochen(f, 64).forEach((z, j) => sag(`  ${j ? '  ' : '- '}${z}`)));
    sag();
  }

  /*
   * Und jetzt die Zusammenfassung, die oben eingesetzt wird.
   *
   * Sie rechnet nichts Eigenes (siehe js/lage.js): Jeder Satz stammt aus einem
   * Abschnitt, der weiter unten mit seinen Fallzahlen steht. Wer einen Satz
   * hier nicht wiederfindet, hat einen Fehler gefunden.
   */
  const kurz = wasSacheIst({
    warnungen: bild.warnungen,
    trend: t,
    funde: bleibt.map(({ b, stand }) => ({
      name: ausloeserName(b.id, zustand.eigeneAusloeser),
      differenz: b.differenz,
      faelle: b.faelle,
      gegenFaelle: b.gegenFaelle,
      urteil: stand.urteil,
    })),
    spaet: spaet.map((x) => ({
      name: ausloeserName(x.id, zustand.eigeneAusloeser),
      fensterName: x.fensterName,
      ort: x.ort,
    })),
    wechsel: wechsel.map((w) => ({
      name: ausloeserName(w.id, zustand.eigeneAusloeser),
      phase: w.staerkste.name,
    })),
    zeit: zb,
    gewicht: waage,
    mittel: ansprechen,
    notierteTage: z.notierteTage,
  });
  const kurzZeilen = ['IN KÜRZE'];
  kurz.saetze.forEach((x) => {
    umbrochen(x.text, 66).forEach((zl, i) => kurzZeilen.push(`  ${i ? '  ' : '- '}${zl}`));
  });
  kurzZeilen.push('  (Zusammengefasst aus den Abschnitten unten; dort stehen die Fallzahlen.)');
  kurzZeilen.push('');
  zeilen.splice(kopfMarke, 0, ...kurzZeilen);

  sag('---');
  sag('Selbst geführtes Tagebuch. Die Zahlen sind gezählt, nicht gedeutet;');
  sag('„auffällig" heißt hier nur: nach diesen Mahlzeiten stand im Mittel ein');
  sag('höherer Wert als nach den übrigen – und der Unterschied blieb auch dann');
  sag('bestehen, als nur Tage mit gleicher Anspannung, gleichem Schlaf und');
  sag('gleicher Zyklusphase miteinander verglichen wurden. Das ist kein');
  sag('Wirkungsnachweis: Es bleiben alle Umstände, die niemand einträgt.');
  sag('Der Abschnitt zum Muster ordnet den');
  sag('Verlauf in gebräuchliche Begriffe ein und stellt keine Diagnose – die');
  sag('genannten Möglichkeiten unterscheidet eine Untersuchung, nicht ein Tagebuch.');
  return zeilen.join('\n');
}

/** Dateiname für den Bericht – ohne Umlaute, damit ihn jedes System annimmt. */
function berichtName(von, bis) {
  return `magen-tagebuch-${von}-bis-${bis}.txt`;
}

/* ===== js/app.js ===== */
/*
 * Die Anzeige. Alles, was man sieht und antippt, steht hier.
 *
 * Aufbau in einem Satz: Ein Zustand im Speicher, eine Funktion, die daraus
 * HTML macht, und ein einziger Klick-Empfänger für alles. Kein Rahmenwerk,
 * keine Abhängigkeit, kein Bauschritt – index.html im Browser öffnen genügt.
 *
 * Was hier *nicht* steht, ist das Rechnen. Ob ein Auslöser auffällig ist,
 * entscheidet js/auswertung.js, und zwar ohne von dieser Datei zu wissen. Die
 * Richtung hält nur, solange sie geprüft wird – dafür gibt es
 * tools/pruefung/schichten.py.
 */

const viewEl = document.getElementById('view');
const tabbarEl = document.getElementById('tabbar');
const toastEl = document.getElementById('toast');

const REITER = [
  { id: 'heute', name: 'Tag', icon: '📓' },
  { id: 'verlauf', name: 'Verlauf', icon: '📅' },
  { id: 'muster', name: 'Muster', icon: '🔍' },
  { id: 'ruhe', name: 'Ruhe', icon: '🌬️' },
  { id: 'ideen', name: 'Ideen', icon: '💡' },

const THEMEN = [

];

/*
 * Flüchtiger Zustand: der angesehene Tag, der offene Bogen, der erzeugte
 * Bericht. Bewusst nicht im Speicher – wer die App morgen wieder aufmacht,
 * will beim heutigen Tag anfangen und nicht dort, wo er zuletzt geblättert
 * hat.
 */
const ui = {
  tag: heuteISO(),
  monat: monatsStart(heuteISO()),
  zeitraum: 30,
  bogen: null,      // { art, id, entwurf } – der offene Eingabebogen
  bericht: null,    // erzeugter Berichtstext, solange er angezeigt wird
  // Die Sicherung als Text, solange sie offen steht. Sie gibt es zusätzlich
  // zur Datei, weil ein Herunterladen nicht überall geht: eingebettete
  // Ansichten, der Browser in einer Messenger-App, manche Verwaltungsgeräte.
  // Dort wäre die einzige Kopie, die es je geben wird, sonst nicht erreichbar.
  sicherung: null,
  /*
   * Bleibt die Küchenliste beim Neuzeichnen offen?
   *
   * Klingt nach Kosmetik und war ein echter Bedienfehler: Die Karte klappt
   * zu, sobald etwas darin steht – richtig beim Öffnen der App, falsch direkt
   * nach einem Eintrag. Wer zwei Sachen hintereinander notieren wollte, musste
   * nach jeder wieder aufklappen, weil mit der Klappe auch das Eingabefeld
   * verschwand. Beim ersten Testlauf aufgefallen, nicht beim Lesen.
   */
  kuecheOffen: false,
  // Steht die Passwortabfrage offen, und was ist eingetippt? Das Passwort
  // steht nur hier und nirgends sonst: im Speicher abgelegt wäre es dasselbe,
  // als läge die Sicherung wieder offen da.
  schloss: false,
  tresorWort: '',
  // Der eingefügte Text einer Sicherung – siehe einfuegeKarte().
  einfuegen: null,
  // Hat der Browser zugesagt, diesen Speicher nicht wegzuräumen? null heißt
  // „weiß man nicht", und das wird auch so angezeigt statt beruhigt.
  speicher: null,
  mittel: false,    // steht die ganze Mittelübersicht offen?
  // Die laufende Atemübung: { schritte, i, bisMs, uhr, wecker }. Nicht im
  // Speicher – eine Übung, die beim nächsten Öffnen weiterliefe, wäre keine.
  atem: null,
  // Was im Ideenfeld steht, solange es noch nicht eingetragen ist.
  ideeEntwurf: '',
  // Das Ergebnis eines Umzugs aus Safari, solange die Karte dazu offen ist:
  // { anzahl, vorher, zusammengefuehrt, letzter }.
  umzug: null,
  // Die Fassung, die gerade läuft: { version, stand } oder null, und wann
  // zuletzt nach einer neueren gesucht wurde (ms seit 1970).
  fassung: null,
  gesucht: Date.now(),   // Beim Laden sieht der Browser selbst nach.
  // Flüchtige Schalter rund um den Umzug: Hinweis für diese Sitzung
  // weggetippt, Angebot zum Holen abgelehnt, gerade in Safari kopiert, und
  // das Einfügefeld ist für einen Umzug offen (anderer Hinweistext).
  startbildschirmZu: false,
  umzugHolenZu: false,
  umzugKopiert: false,
  einfuegenUmzug: false,
  // Steht unter „Mehr" gerade die Anleitung (Home-Bildschirm und Sichern)?
  // Flüchtig: Wer „Mehr" antippt, landet wieder auf „Mehr".
  anleitung: false,
};

/*
 * Wie viele Vorgänge gerade laufen, die ein Neuladen abbrechen würde: ein
 * Versand, eine Verschlüsselung, ein Einlesen, ein Teilen-Blatt. Solange die
 * Zahl über null steht, lädt die App nicht von selbst neu – siehe inArbeit().
 */
let beschaeftigt = 0;

/*
 * Wer bediente diese Seite beim Laden?
 *
 * Hier oben und nicht später, weil es auf den Augenblick ankommt: Beim
 * allerersten Besuch übernimmt der Service Worker die Seite per
 * clients.claim(), und das löst dasselbe Ereignis aus wie eine neue Fassung
 * (controllerchange). Wer das nicht auseinanderhält, lädt jede Seite beim
 * ersten Besuch einmal neu – und jeder Test, der gerade etwas in den Speicher
 * schreibt, läuft in dieses Neuladen hinein.
 */
const SW_DA = 'serviceWorker' in navigator && location.protocol.startsWith('http');
const startController = SW_DA ? navigator.serviceWorker.controller : null;
const NEULADEN_MERK = 'bauchbuch.neugeladen';
// Unter diesem Schlüssel steht nach einem Neuladen, wo sie gerade war.
const NACH_NEULADEN = 'bauchbuch.nachNeuladen';
let bereit = null;          // { version, stand } einer neuen Fassung, die wartet
let angefasst = false;      // seit dem Start oder der Rückkehr berührt?
// „Nach neuer Fassung suchen" getippt: Bis zu diesem Zeitpunkt darf sie
// auch unter den Fingern neu laden. Ein Zeitfenster und kein Schalter – ein
// Schalter bliebe nach einer Suche ohne Fund an, und die nächste Fassung
// käme mitten beim Lesen.
let ausdruecklichBis = 0;

/*
 * Auf den Startbildschirm – als App, nicht als Lesezeichen.
 *
 * Android meldet über 'beforeinstallprompt', dass die Seite installierbar ist,
 * und lässt den Dialog *einmal* über dieses Ereignis auslösen. Ohne das liegt
 * die Installation im Browsermenü unter einem Punkt, den niemand sucht – und
 * eine App, die man nicht findet, wird nicht benutzt.
 *
 * Safari kennt das Ereignis nicht; dort geht es nur von Hand über „Teilen".
 * Deshalb steht dort ein Satz statt eines Knopfes.
 */
let installEreignis = null;

function laeuftAlsApp() {
  try {
    return window.matchMedia('(display-mode: standalone)').matches
      || window.navigator.standalone === true;
  } catch {
    return false;
  }
}

/**
 * Was für ein Gerät, und in welchem Browser.
 *
 * Drei Fallen, die alle schon jemanden die falsche Anleitung lesen ließen:
 *
 *   * Safari unter iOS 26 meldet in der Kennung eine eingefrorene
 *     Systemversion („iPhone OS 18_6"). Verlässlich ist nur „Version/26".
 *   * Ein iPad meldet sich in Safari als Mac. Nur die Berührungspunkte
 *     verraten es.
 *   * Wer den Link aus einer Nachricht oder aus Instagram öffnet, landet im
 *     eingebauten Browser dieser App. Dort gibt es kein „Zum Home-Bildschirm".
 */
function geraet() {
  const ua = navigator.userAgent || '';
  const ipad = /Macintosh/.test(ua) && (navigator.maxTouchPoints || 0) > 1;
  const ios = /iPhone|iPad|iPod/.test(ua) || ipad;
  const inApp = /FBAN|FBAV|Instagram|GSA\/|Line\/|WhatsApp|Snapchat|TikTok/i.test(ua);
  const anderer = /CriOS|FxiOS|EdgiOS|OPiOS/.test(ua);
  // Safari auf dem Mac: dieselbe Kennung wie das iPad, nur ohne Berührung.
  // Chrome und Firefox auf dem Mac tragen kein „Version/".
  const mac = /Macintosh/.test(ua) && !ipad && /Version\/\d+/.test(ua) && /Safari\//.test(ua);
  return {
    ios,
    ipad,
    mac,
    inApp,
    anderer,
    version: Number((/Version\/(\d+)/.exec(ua) || [])[1]) || 0,
  };
}

const istApfel = () => geraet().ios;

/*
 * Apple schreibt im Teilen-Menü „Zum Home-Bildschirm", Android
 * „Startbildschirm". Wer den Satz in der App liest und dann das Menü sucht,
 * soll dasselbe Wort finden.
 */
const heim = () => (istApfel() ? 'Home-Bildschirm' : 'Startbildschirm');
const geraetName = (g) => (g.ipad ? 'iPad' : 'iPhone');

/*
 * Wo das Tagebuch liegt, in Worten – und das passende Fürwort dazu: „ihr
 * Speicher" gehört zur App, „sein Speicher" zum Browser. Auf dem iPhone heißt
 * Safari auch Safari; Chrome und eingebaute Browser bleiben „dieser Browser".
 */
function speicherOrt() {
  const g = geraet();
  if (laeuftAlsApp()) return { wo: 'auf diesem Gerät, in dieser App', wessen: 'ihr' };
  if (g.ios && !g.anderer && !g.inApp) return { wo: 'hier in Safari', wessen: 'dieser' };
  return { wo: 'in diesem Browser', wessen: 'sein' };
}

/** Die Schritte auf den Startbildschirm, passend zum Gerät. */
function anleitung(g) {
  const liste = (punkte) => `<ol class="schritte">${punkte.map((x) => `<li>${x}</li>`).join('')}</ol>`;
  if (g.inApp) {
    return `<p class="klein">Du hast Body Check gerade in einer anderen App geöffnet,
      zum Beispiel aus einer Nachricht. Von dort geht es nicht auf den
      Home-Bildschirm. Öffne Body Check in Safari: Tippe auf <b>•••</b> und dann auf
      <b>In Safari öffnen</b>. Siehst du stattdessen ein Kompass-Symbol, tippe
      darauf.</p>`;
  }
  if (g.anderer) {
    return liste([
      'Oben rechts auf das <b>Teilen</b>-Symbol tippen (Quadrat mit Pfeil nach oben).',
      'Auf <b>Zum Home-Bildschirm</b> tippen, dann auf <b>Hinzufügen</b>.',
    ]);
  }
  // Safari auf dem iPad hat keine Leiste unten; dort sitzt alles oben.
  if (g.version >= 26 && g.ipad) {
    return liste([
      'Oben rechts auf das <b>Teilen</b>-Symbol tippen (Quadrat mit Pfeil nach oben). Ist es nicht zu sehen, zuerst auf <b>•••</b> neben der Adresse.',
      'In der Liste <b>Zum Home-Bildschirm</b> antippen. Steht es nicht da, ganz unten auf <b>Aktionen bearbeiten</b> tippen und es hinzufügen.',
      'Der Schalter <b>Als Web-App öffnen</b> muss an sein (grün). Dann auf <b>Hinzufügen</b> tippen.',
    ]);
  }
  /*
   * Unter iOS 26 sitzt das Teilen-Symbol je nach Leiste mal direkt unten,
   * mal hinter „•••". Der Schalter „Als Web-App öffnen" ist an, wenn er grün
   * ist – „eingeschaltet lassen" setzte voraus, dass er es schon ist.
   */
  if (g.version >= 26) {
    return liste([
      'Tippe unten rechts neben der Adresse auf <b>•••</b> und dann auf <b>Teilen</b>. Siehst du unten gleich das <b>Teilen</b>-Symbol (Quadrat mit Pfeil nach oben), tippe direkt darauf.',
      'Weiter unten in der Liste steht <b>Zum Home-Bildschirm</b>. Tippe darauf. Steht es nicht da, tippe ganz unten auf <b>Aktionen bearbeiten</b> und füge es hinzu.',
      'Der Schalter <b>Als Web-App öffnen</b> muss an sein (grün). Dann tippe auf <b>Hinzufügen</b>.',
    ]);
  }
  return liste([
    `${g.ipad ? 'Oben' : 'Unten'} auf das <b>Teilen</b>-Symbol tippen (Quadrat mit Pfeil nach oben).`,
    'In der Liste <b>Zum Home-Bildschirm</b> suchen und antippen.',
    'Oben rechts auf <b>Hinzufügen</b>.',
  ]);
}

const datumKurz = (iso) => {
  const [, m, d] = String(iso || '').split('-');
  return d && m ? `${Number(d)}.${Number(m)}.` : '';
};

/** „der letzte vom 27.10. um 19:30" – zum Vergleichen beider Seiten. */
function letzterText(letzter) {
  if (!letzter) return 'noch kein Eintrag';
  return `der letzte vom ${datumKurz(letzter.am)}${letzter.um ? ` um ${letzter.um}` : ''}`;
}

/**
 * Die Karte „Auf den Startbildschirm".
 *
 * Auf dem iPhone ist das nicht nur Bequemlichkeit. Safari darf gespeicherte
 * Daten einer Seite löschen, die an sieben Tagen mit Safari nicht benutzt
 * wurde; eine App auf dem Home-Bildschirm ist davon ausgenommen (WebKit,
 * „Full Third-Party Cookie Blocking and More", 2020). Nur fängt sie mit einem
 * eigenen, leeren Speicher an – wer schon eingetragen hat, muss seine
 * Einträge mitnehmen, und zwar *bevor* er umzieht. Deshalb steht das hier
 * vorn und nicht in einer Fußnote.
 *
 * `ort` ist 'tag' (der wegklickbare Hinweis oben auf dem Tag-Reiter) oder
 * 'mehr' (dauerhaft unter „Mehr").
 */
function startbildschirmKarte(s, ort) {
  const g = geraet();
  if (laeuftAlsApp()) {
    if (ort !== 'mehr') return '';
    /*
     * Auf Apple-Geräten hat jedes Symbol seinen eigenen Speicher. Wer es
     * löscht oder ein zweites anlegt, steht vor einem leeren Tagebuch – das
     * ist der eine Fehler, den man hier noch machen kann. „Wahrscheinlich":
     * Ob iOS die Daten dabei wirklich löscht oder nur unerreichbar liegen
     * lässt, ist nirgends dokumentiert; für sie läuft es aufs Gleiche hinaus.
     */
    return `<div class="karte">
      <h3>Läuft als App</h3>
      <p class="klein">Body Check liegt auf deinem ${heim()}. Die App öffnet
      sich ohne Browserleiste, läuft ohne Netz und holt neue Fassungen von
      selbst. Was du hier einträgst, steht in dieser App – nicht in Safari.</p>
      ${istApfel() ? `<p class="klein"><b>Lösch das Body-Check-Symbol nicht</b>${s.alterName
    ? ', auch wenn es noch den alten Namen „Bauchbuch“ trägt' : ''}.
      Sonst sind deine Einträge wahrscheinlich weg. Und leg es nicht ein
      zweites Mal an: Ein zweites Symbol hat deine Einträge nicht.</p>` : ''}
    </div>`;
  }
  if (installEreignis) {
    return `<div class="karte karte-merk">
      <h3>Auf den Startbildschirm</h3>
      <p class="klein">Dann liegt Body Check als eigenes Symbol zwischen deinen
      Apps, öffnet sich ohne Browserleiste und startet auch ohne Netz.</p>
      ${knopf('installieren', 'Installieren', 'btn-primary btn-block')}
    </div>`;
  }
  if (g.mac && g.version >= 17) {
    if (ort !== 'mehr') return '';
    return `<div class="karte">
      <h3>Ins Dock</h3>
      <p class="klein">In Safari oben in der Menüleiste <b>Ablage › Zum Dock hinzufügen</b>
      wählen. Danach öffnet sich Body Check wie ein eigenes Programm, mit
      eigenem Speicher – getrennt von dem in Safari.</p>
    </div>`;
  }
  if (!g.ios) {
    if (ort !== 'mehr') return '';
    return `<div class="karte">
      <h3>Auf den Startbildschirm</h3>
      <p class="klein">Im Browsermenü (die drei Punkte) auf <b>App installieren</b>
      oder <b>Zum Startbildschirm hinzufügen</b>. Danach liegt Body Check als
      eigenes Symbol zwischen deinen Apps.</p>
    </div>`;
  }
  if (ort === 'tag' && (s.startbildschirmWeg || ui.startbildschirmZu || s.umzug)) return '';

  const hatDaten = !store.istLeer();
  const mitnehmen = hatDaten ? `
    <p class="klein"><b>Wichtig: Die App auf dem Home-Bildschirm fängt leer an.</b>
    Sie hat ihren eigenen Speicher, getrennt von Safari. Nimm deine Einträge
    vorher mit – das dauert einen Tipp.</p>
    ${s.umzug
    ? `<p class="klein">Mitgenommen am ${datumKurz(s.umzug.am)}:
       ${mehrzahl(s.umzug.anzahl, 'Eintrag', 'Einträge')}, ${letzterText(s.umzug.letzter)}.
       Jetzt Body Check auf den Home-Bildschirm legen, dort öffnen und auf
       <b>Einträge aus Safari holen</b> tippen.</p>
       <p class="klein">Bis dahin liegt dein Tagebuch in der Zwischenablage.
       Kopier in der Zwischenzeit nichts anderes.</p>`
    : ''}
    <div class="reihe">${knopf('umzug-mitnehmen', s.umzug ? 'Nochmal mitnehmen' : '1. Einträge mitnehmen', 'btn-primary')}</div>` : '';

  /*
   * Die Sieben-Tage-Regel gilt für Safari, belegt vom WebKit-Team: gezählt
   * werden Tage, an denen Safari benutzt wurde, und „kann löschen", nicht
   * „löscht". Für Chrome und Co. auf dem iPhone ist sie nicht belegt, also
   * steht sie dort nicht.
   */
  const ding = geraetName(g);
  return `<div class="karte karte-merk">
    <h3>Als App auf den Home-Bildschirm</h3>
    <p class="klein">Dann öffnet sich Body Check mit einem Tipp wie eine App.${g.anderer ? '' : ` Und:
    In Safari kann dein ${ding} deine Einträge löschen, wenn du Body Check eine
    Weile nicht benutzt – im ungünstigsten Fall schon nach sieben Tagen, an
    denen du Safari benutzt hast. Als App auf dem Home-Bildschirm passiert das
    nicht.`}</p>
    ${mitnehmen}
    ${g.inApp ? '' : hatDaten
    ? `<p class="klein"><b>2. Body Check auf den Home-Bildschirm legen.</b>
      Liegt die App dort schon (vielleicht noch unter dem alten Namen
      „Bauchbuch“), lass diesen Schritt aus – ein zweites Symbol hat deine
      Einträge nicht.</p>`
    // Die Frage vor die Schritte: Wer Schritt für Schritt abarbeitet, legt
    // sonst das zweite Symbol an, bevor er sie liest. Den alten Namen nennt
    // sie, weil ein Symbol von vor der Umbenennung ihn behält.
    : `<p class="klein"><b>Liegt Body Check schon auf deinem Home-Bildschirm?</b>
      Vielleicht noch unter dem alten Namen „Bauchbuch“? Dann öffne die App
      dort und leg sie nicht noch einmal an – ein zweites Symbol hat deine
      Einträge nicht.</p>`}
    ${anleitung(g)}
    ${g.inApp ? '' : hatDaten
    ? `<p class="klein"><b>Zum Schluss:</b> Öffne Body Check über das Symbol auf
      deinem Home-Bildschirm und tippe dort auf <b>Einträge aus Safari holen</b>.
      Benutzt du die App schon, steht der Knopf unter „Mehr“ › „Sicherung“ und
      heißt <b>Aus Safari holen</b>.</p>`
    : '<p class="klein">Danach öffnest du Body Check nur noch über das neue Symbol auf deinem Home-Bildschirm.</p>'}
    ${ort === 'tag' ? `<div class="reihe">
      ${knopf('startbildschirm-spaeter', 'Später', 'btn-ghost')}
      ${knopf('startbildschirm-weg', 'Nicht mehr zeigen', 'btn-ghost')}
    </div>` : ''}
  </div>`;
}

/**
 * Einmal, auf „Tag": Bauchbuch heißt jetzt Body Check.
 *
 * Nur in der App auf iPhone und iPad, und nur, wenn ihr Speicher von vor der
 * Umbenennung stammt. Ihr Symbol heißt weiter „Bauchbuch": iOS übernimmt den
 * Namen beim Hinzufügen und fragt danach nie wieder. Ob es auch das alte Bild
 * behält, ist nicht dokumentiert – wahrscheinlich ja. Wer den neuen Namen
 * sehen will, legt sonst ein zweites Symbol an, das leer anfängt, und löscht
 * danach womöglich das alte, in dem die Einträge stehen.
 */
function alterNameKarte(s) {
  if (s.alterName !== 'offen' || !laeuftAlsApp() || !istApfel()) return '';
  return `<div class="karte karte-merk">
    <h3>Bauchbuch heißt jetzt Body Check</h3>
    <p class="klein">Deine Einträge sind alle da. Auf deinem ${heim()}
    heißt das Symbol weiter „Bauchbuch“ und zeigt wahrscheinlich das alte
    Bild. Das bleibt so, und das ist richtig so.</p>
    <p class="klein"><b>Lösch es nicht und leg kein neues an.</b> Ein neues
    Symbol fängt leer an – deine Einträge stehen in diesem.</p>
    <div class="reihe">${knopf('alter-name-weg', 'Verstanden', 'btn-primary')}</div>
  </div>`;
}

/** Die alte Karte unter „Mehr" – jetzt dieselbe wie oben. */
const installKarte = () => startbildschirmKarte(store.zustandLesen(), 'mehr');

/**
 * In Safari, nachdem mitgenommen wurde: auf jedem Reiter oben.
 *
 * Links aus Nachrichten und Mails öffnen auf dem iPhone immer Safari, nie die
 * App auf dem Startbildschirm. Ohne diesen Hinweis wird früher oder später an
 * zwei Orten eingetragen – und keiner der beiden ist dann vollständig.
 */
function umzugHinweis(s, tab) {
  if (!s.umzug || laeuftAlsApp()) return '';
  // Gemessen an den Kennungen von damals: Wer einen Eintrag löscht und einen
  // neuen anlegt, hat trotzdem einen neuen. Ältere Vermerke ohne Kennungen
  // fallen auf den Längenvergleich zurück.
  const damals = Array.isArray(s.umzug.ids) ? new Set(s.umzug.ids) : null;
  const seitdem = damals
    ? s.eintraege.filter((x) => !damals.has(x.id)).length
    : Math.max(0, s.eintraege.length - (s.umzug.anzahl || 0));
  const voll = tab === 'heute';
  return `<div class="karte karte-merk">
    <h3>Mitgenommen am ${datumKurz(s.umzug.am)}</h3>
    <p class="klein">${mehrzahl(s.umzug.anzahl, 'Eintrag', 'Einträge')},
    ${letzterText(s.umzug.letzter)}. <b>Trag ab jetzt bitte nur noch in der
    App auf dem Home-Bildschirm ein.</b> Was du hier in Safari einträgst,
    kommt dort nicht an.</p>
    ${seitdem ? `<p class="klein"><b>Seitdem ${seitdem === 1 ? 'steht hier 1 neuer Eintrag' : `stehen hier ${seitdem} neue Einträge`}.</b>
      Nimm noch einmal mit und hol sie in der App unter „Mehr" › „Aus Safari
      holen" – doppelte Einträge erkennt sie. Was du hier an schon
      mitgenommenen Einträgen änderst, kommt dabei nicht mit; dort gilt der
      Stand der App.</p>
      <div class="reihe">${knopf('umzug-mitnehmen', 'Nochmal mitnehmen', 'btn-primary')}</div>` : ''}
    ${voll ? `<details${ui.umzugKopiert ? ' open' : ''}>
      <summary>So kommt Body Check auf den Home-Bildschirm</summary>
      ${anleitung(geraet())}
      <p class="klein">Dann Body Check über das neue Symbol öffnen und auf
      <b>Einträge aus Safari holen</b> tippen. Bis dahin liegt dein Tagebuch
      in der Zwischenablage – kopier in
      der Zwischenzeit nichts anderes.</p>
    </details>` : ''}
  </div>`;
}

/**
 * In der App, solange sie leer ist: das Angebot, aus Safari zu holen.
 *
 * Steht auch auf der Begrüßung (willkommen()), denn dort landet eine frisch
 * hinzugefügte App – ohne Reiter, und eine Karte auf „Tag" sähe sie erst
 * nach „Anfangen".
 */
function umzugHolenKarte(s) {
  if (!laeuftAlsApp() || s.umzugGeholt || s.eintraege.length || ui.umzugHolenZu) return '';
  return `<div class="karte karte-merk">
    <h3>Schon in Safari eingetragen?</h3>
    <p class="klein">Diese App hat ihren eigenen Speicher. Wenn du vorher in
    Safari auf <b>Einträge mitnehmen</b> getippt hast, hol sie hier herein.
    Gleich erscheint oben ein kleines Feld <b>Einsetzen</b> – darauf tippen.</p>
    <div class="reihe">
      ${knopf('umzug-holen', 'Einträge holen', 'btn-primary')}
      ${knopf('umzug-holen-nein', 'Nein, ich fange hier neu an', 'btn-ghost')}
    </div>
  </div>`;
}

/** Nach dem Holen: was gekommen ist, und was jetzt zu tun bleibt. */
function umzugErgebnisKarte() {
  const e = ui.umzug;
  if (!e) return '';
  return `<div class="karte karte-merk">
    <h3>Deine Einträge sind da</h3>
    <p class="klein"><b>${mehrzahl(e.anzahl, 'Eintrag', 'Einträge')}</b>,
    ${letzterText(e.letzter)}. In Safari stand beim Mitnehmen dieselbe Zahl.
    ${e.zusammengefuehrt ? `Zusammengeführt mit dem, was hier schon stand (vorher ${e.vorher}).` : ''}</p>
    <p class="klein">Zwei Dinge noch: Dein Tagebuch liegt gerade in der
    Zwischenablage – leer sie. Und sichere einmal als Datei; die Kopie in
    Safari kann nach einiger Zeit von selbst verschwinden.</p>
    <div class="reihe">
      ${knopf('ablage-leeren', 'Zwischenablage leeren', 'btn-primary')}
      ${knopf('export', 'Als Datei sichern')}
    </div>
    <div class="reihe">
      ${knopf('rueckgaengig', 'Rückgängig')}
      ${knopf('umzug-fertig', 'Fertig', 'btn-ghost')}
    </div>
  </div>`;
}

/** Nach erfolgreichem Holen – aus der Zwischenablage oder aus dem Feld. */
function umzugAbschliessen(ergebnis) {
  const s = store.zustandLesen();
  const letzter = s.eintraege[s.eintraege.length - 1] || null;
  store.umzugGeholtMerken();
  store.einstellen('tab', 'heute');
  ui.umzug = { ...ergebnis, letzter: letzter ? { am: letzter.am, um: letzter.um || '' } : null };
  ui.tag = heuteISO();
  melden(`${mehrzahl(ergebnis.anzahl, 'Eintrag', 'Einträge')} geholt.`);
}

/*
 * Wie die Sicherungsdateien heißen. Bis zur Umbenennung hießen sie
 * bauchbuch-…, seitdem body-check-… – in „iCloud Drive“ stehen beide, nach
 * Namen sortiert weit auseinander, und die neueste ist nicht mehr die letzte.
 */
const SICHERUNGSNAMEN = 'Deine Sicherungen heißen „body-check-“ und dann das Datum, ältere noch „bauchbuch-“ und dann das Datum.';

/**
 * Fehler so sagen, dass jemand ohne Technikkenntnis weiß, was zu tun ist.
 * Eine rohe Meldung wie „Unexpected token 'H'" hilft niemandem.
 *
 * `ausDatei`: Die Datei kam über „Datei einlesen“. Dann hilft der Dateiname
 * beim nächsten Versuch.
 */
function lesbarerFehler(fehler, ausDatei = false) {
  const m = String(fehler && fehler.message || fehler || '');
  if (/JSON|Unexpected|token|eintraege/i.test(m)) {
    if (ui.einfuegenUmzug) {
      return 'Das ist keine Body-Check-Sicherung. Öffne Body Check in Safari, tippe dort auf „Einträge mitnehmen" und komm dann hierher zurück.';
    }
    // Ohne den Namen der App: Die Sicherungen von vor der Umbenennung
    // heißen bauchbuch-…, und „keine Body-Check-Sicherung" läse sich bei
    // einer beschädigten davon wie „die alten gehen hier nicht".
    return `Ging nicht: Das ist keine Sicherung, oder sie ist beschädigt.${ausDatei ? ` ${SICHERUNGSNAMEN}` : ''}`;
  }
  return `Ging nicht: ${m}`;
}

let toastUhr = null;
function melden(text) {
  toastEl.textContent = text;
  toastEl.classList.add('an');
  clearTimeout(toastUhr);
  // Lange Sätze länger stehen lassen: etwa 60 ms je Zeichen, mindestens 2,4 s.
  toastUhr = setTimeout(() => toastEl.classList.remove('an'), Math.max(2400, String(text).length * 60));
}

/* ==================== Bausteine ==================== */

const knopf = (act, text, klasse = '', extra = '') => `<button type="button" class="btn ${klasse}" data-act="${act}" ${extra}>${text}</button>`;

/** Eine Reihe an- und abwählbarer Marken. */
function marken(liste, gewaehlt, act) {
  return `<div class="marken">${liste.map((m) => `
    <button type="button" class="marke${gewaehlt.includes(m.id) ? ' an' : ''}"
            data-act="${act}" data-id="${esc(m.id)}" aria-pressed="${gewaehlt.includes(m.id)}">
      ${m.icon ? `<span class="marke-i">${m.icon}</span>` : ''}${esc(m.name)}
    </button>`).join('')}</div>`;
}

/** Die Skala von 0 bis 10. Elf Knöpfe statt eines Schiebereglers: Ein Regler
 *  trifft man auf dem Handy nicht genau, und „war es jetzt 6 oder 7" ist
 *  genau die Frage, die eine Eintragung wertlos macht. */
function skala(wert) {
  let raus = '<div class="skala" role="group" aria-label="Stärke von 0 bis 10">';
  for (let i = 0; i <= 10; i++) {
    const stufe = i === 0 ? 'null' : (i >= 7 ? 'hoch' : (i >= 4 ? 'mittel' : 'tief'));
    raus += `<button type="button" class="stufe s-${stufe}${i === wert ? ' an' : ''}"
      data-act="staerke" data-n="${i}" aria-pressed="${i === wert}"
      aria-label="Stärke ${i}: ${STAERKE_WORT[i]}">${i}</button>`;
  }
  return `${raus}</div><p class="skala-wort">${STAERKE_WORT[wert] ?? ''}</p>`;
}

/**
 * Eine Tagesfrage als Reihe von Stufen. `null` heißt: nicht beantwortet.
 *
 * Ein zweites Tippen auf dieselbe Stufe nimmt die Antwort zurück – „ich habe
 * nichts eingetragen" und „ich habe null eingetragen" müssen verschiedene
 * Dinge bleiben, sonst zählt die Auswertung Nichtwissen als Wohlbefinden.
 */
function tagesFrage(frage, wert) {
  return `<p class="feld-name">${esc(frage.name)}</p>
    <div class="vier">${frage.worte.map((w, i) => `
      <button type="button" class="vier-btn${wert === i ? ' an' : ''}"
              data-act="tagfrage" data-id="${frage.id}" data-n="${i}"
              aria-pressed="${wert === i}">${esc(w)}</button>`).join('')}</div>`;
}

/* ==================== Reiter: Tag ==================== */

// „Kopfschmerz" ist eine eigene Art und keine Beschwerdeart – siehe js/kopf.js,
// warum das kein Geschmack ist, sondern die Bedingung dafür, dass die
// Bauchauswertung stimmt.
const ART_NAME = {
  essen: 'Mahlzeit', beschwerde: 'Beschwerden', kopf: 'Kopfschmerz', stuhl: 'Stuhlgang',
  medikament: 'Medikament', notiz: 'Notiz',
};
const ART_ICON = {
  essen: '🍽️', beschwerde: '🔥', kopf: '🤕', stuhl: '🚽', medikament: '💊', notiz: '✏️',
};

function zeileText(e, eigene) {
  if (e.art === 'essen') {
    // Die Rolle steht nur dabei, wenn sie nicht die Vorgabe ist – „Kaffee
    // (Haupt)" bei jedem Kaffee wäre Lärm, „Zwiebel (Würze)" ist die Auskunft.
    const zutaten = zutatenVon(e).map((z) => ausloeserName(z.id, eigene)
      + (z.rolle === ROLLE_VORGABE ? '' : ` (${rolleName(z.rolle, true)})`)).join(', ');
    const portion = e.portion && e.portion !== 'normal' ? ` · ${e.portion === 'gross' ? 'große' : 'kleine'} Portion` : '';
    return `<b>${esc(kuerze(e.was || 'Mahlzeit'))}</b>${portion}`
      + (zutaten ? `<span class="zeile-tags">${esc(zutaten)}</span>` : '');
  }
  if (e.art === 'beschwerde') {
    const arten = (e.arten || []).map(beschwerdeName).join(', ');
    const bezug = STUHLBEZUG.find((b) => b.id === e.stuhlbezug);
    return `<b>Stärke ${e.staerke} – ${STAERKE_WORT[e.staerke] || ''}</b>`
      + (arten ? `<span class="zeile-tags">${esc(arten)}</span>` : '')
      + (bezug && e.stuhlbezug !== 'keiner' ? `<span class="zeile-tags">Stuhlgang: ${esc(bezug.name.toLowerCase())}</span>` : '')
      + (e.notiz ? `<span class="zeile-tags">${esc(kuerze(e.notiz))}</span>` : '');
  }
  if (e.art === 'stuhl') {
    const zusatz = [e.dringend ? 'dringend' : '', e.unvollstaendig ? 'Gefühl, nicht fertig' : '']
      .filter(Boolean).join(', ');
    return `<b>Typ ${e.form} – ${esc(bristolName(e.form, true))}</b>`
      + (zusatz ? `<span class="zeile-tags">${esc(zusatz)}</span>` : '');
  }
  if (e.art === 'medikament') {
    return `<b>${esc(e.mittel || 'Medikament')}</b>`
      + (e.dosis ? `<span class="zeile-tags">${esc(e.dosis)}</span>` : '');
  }
  if (e.art === 'kopf') {
    const arten = (e.kopfArten || []).map(kopfArtName).join(', ');
    const dazu = [
      kopfDauerName(e.dauer),
      kopfVerlaufKurz(e.verlauf),
      e.mittelWirkung ? `Mittel: ${mittelWirkungName(e.mittelWirkung).toLowerCase()}` : '',
    ].filter(Boolean).join(', ');
    return `<b>Kopfschmerz ${e.staerke} – ${STAERKE_WORT[e.staerke] || ''}</b>`
      + (arten ? `<span class="zeile-tags">${esc(arten)}</span>` : '')
      + (dazu ? `<span class="zeile-tags">${esc(dazu)}</span>` : '')
      + (e.notiz ? `<span class="zeile-tags">${esc(kuerze(e.notiz))}</span>` : '');
  }
  return `<b>${esc(kuerze(e.text || '', 90))}</b>`;
}

function tagAnsicht(s) {
  const iso = ui.tag;
  const liste = s.eintraege.filter((e) => e.am === iso);
  const t = tagesWert(s.eintraege, iso, s.tage);
  const tagInfo = store.tagLesen(iso);
  const kuenftig = tageDazwischen(heuteISO(), iso) > 0;

  const kopf = `<div class="tagkopf">
    ${knopf('tag-blaettern', '‹', 'btn-rund', 'data-d="-1" aria-label="Tag zurück"')}
    <div class="tagkopf-mitte">
      <h2>${esc(fmtTag(iso))}</h2>
      <input type="date" class="tag-datum" data-act="tag-datum" value="${iso}"
             max="${heuteISO()}" aria-label="Datum wählen">
    </div>
    ${knopf('tag-blaettern', '›', 'btn-rund', `data-d="1" ${kuenftig || iso === heuteISO() ? 'disabled' : ''} aria-label="Tag vor"`)}
  </div>`;

  /*
   * Die häufigsten Mahlzeiten als Direkttaste – ein Tipp statt fünf.
   *
   * Der Bogen ist gut, wenn man etwas Neues einträgt. Für den Haferbrei, den
   * sie jeden Morgen isst, ist er fünf Handgriffe für null neue Auskunft. Hier
   * wird derselbe Eintrag mit einem Tipp angelegt, vollständig samt Zutaten,
   * Rollen und Portion, mit der aktuellen Uhrzeit.
   *
   * Das ist keine Bequemlichkeit, sondern der Punkt, an dem Tagebücher
   * sterben: Nicht ein Fehler in der Auswertung bringt sie um, sondern dass
   * nach drei Wochen niemand mehr etwas einträgt. Erst ab zwei Vorkommen –
   * eine Mahlzeit, die es einmal gab, ist keine Gewohnheit.
   */
  const schnell = iso === heuteISO()
    ? haeufigeMahlzeiten(s.eintraege, 12).filter((v) => v.anzahl >= 2).slice(0, 3) : [];
  /*
   * Die eigenen Mittel als Direkttaste – auf jedem Tag, nicht nur heute: Wer
   * abends den ganzen Tag nachträgt, trägt auch gestern nach. Ein Häkchen
   * zeigt, was an diesem Tag schon steht; ein zweiter Tipp legt trotzdem
   * einen zweiten Eintrag an, denn manches wird zweimal am Tag genommen.
   */
  const schonDa = (m) => liste.some((x) => x.art === 'medikament'
    && String(x.mittel || '').trim().toLowerCase() === m.mittel.trim().toLowerCase());
  const mittelReihe = s.standardMittel.length && !kuenftig ? `<div class="schnell">
    <p class="feld-name">Meine Mittel – ein Tipp trägt ein</p>
    <div class="marken marken-eng">${s.standardMittel.map((m) => `
      <button type="button" class="marke marke-schnell" data-act="standard-eintragen" data-id="${esc(m.id)}"
              ${schonDa(m) ? 'aria-label="' + esc(mittelText(m)) + ', heute schon eingetragen"' : ''}>
        ${esc(kuerze(mittelText(m), 26))}${schonDa(m) ? ' <span class="marke-zahl">✓</span>' : ''}
      </button>`).join('')}</div>
  </div>` : '';

  const schnellReihe = schnell.length ? `<div class="schnell">
    <p class="feld-name">Noch mal wie immer</p>
    <div class="marken marken-eng">${schnell.map((v, i) => `
      <button type="button" class="marke marke-schnell" data-act="schnell" data-i="${i}">
        ${esc(kuerze(v.text, 22))} <span class="marke-zahl">${v.anzahl}×</span>
      </button>`).join('')}</div>
  </div>` : '';

  const anlegen = `<div class="anlegen">
    ${['essen', 'beschwerde', 'kopf', 'stuhl', 'medikament', 'notiz'].map((a) => `
      <button type="button" class="anlegen-btn a-${a}" data-act="neu" data-art="${a}">
        <span class="anlegen-i">${ART_ICON[a]}</span>${ART_NAME[a]}
      </button>`).join('')}
  </div>`;

  const zeilen = liste.length ? `<ul class="strang">${liste.map((e) => `
    <li class="strang-zeile z-${e.art}">
      <span class="strang-uhr"${e.ungefaehr ? ' title="ungefähre Zeit"' : ''}>${e.ungefaehr ? '≈' : ''}${esc(e.um)}</span>
      <span class="strang-punkt" aria-hidden="true">${ART_ICON[e.art]}</span>
      <button type="button" class="strang-text" data-act="bearbeiten" data-id="${e.id}">
        ${zeileText(e, s.eigeneAusloeser)}${zeitWorte(e)}
      </button>
      <button type="button" class="strang-weg" data-act="loeschen" data-id="${e.id}"
              aria-label="Eintrag löschen">×</button>
    </li>`).join('')}</ul>`
    : `<p class="leer">Für ${esc(fmtTag(iso))} ist noch nichts eingetragen.</p>`;

  /*
   * Ein Tag mit nur einem Kopfeintrag ist für den Bauch eine Lücke, kein
   * beschwerdefreier Tag (siehe tagesWert). Die Karte sagt das, statt mit
   * einem grünen „beschwerdefrei" das Gegenteil zu behaupten.
   */
  const bilanz = t.notiert ? `<div class="karte tagbilanz">
    <div class="gross ${t.wert === 0 ? 'gut' : (t.wert >= 7 ? 'schlecht' : 'mittel')}">
      ${t.wert === 0 ? (t.kopf ? 'Bauch beschwerdefrei' : 'beschwerdefrei') : `Stärke ${t.wert}`}
    </div>
    <p class="klein">${mehrzahl(t.mahlzeiten, 'Mahlzeit', 'Mahlzeiten')},
      ${mehrzahl(t.anzahl, 'Beschwerde', 'Beschwerden')}${t.medikamente ? `, ${mehrzahl(t.medikamente, 'Medikament', 'Medikamente')}` : ''}${t.kopf ? `, Kopfschmerz bis ${t.kopf}` : ''}</p>
  </div>` : (t.kopf ? `<div class="karte tagbilanz">
    <div class="gross ${t.kopf >= 7 ? 'schlecht' : 'mittel'}">Kopfschmerz bis ${t.kopf}</div>
    <p class="klein">Zum Bauch ist nichts eingetragen – für den Bauch zählt der Tag
      als Lücke, nicht als beschwerdefrei.</p>
  </div>` : '');

  const fragen = sichtbareFragen(s.tagesfragen);
  const umstaende = fragen.length ? `<div class="karte">
    <h3>Wie war der Tag sonst?</h3>
