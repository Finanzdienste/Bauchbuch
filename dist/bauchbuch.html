/**
 * Der ganze Zettel.
 *
 * @param {object} d
 *   kriterien (aus js/kriterien.js), stuhl (stuhlZahlen), bezug (bezugBilanz),
 *   klassen (klassenBilanz), mittel (mittelBilanz), musterIds, essen
 *   (essensbezug), nsarTage, warnIds, krampfAnteil, benutzt, nachtwachAn,
 *   versuchMoeglich, versuchLaeuft, mahlzeitenOhneZutaten
 */
function luecken(d) {
  return {
    tagebuch: tagebuchLuecken(d),
    verdaechte: VERDAECHTE.map((v) => {
      const p = v.pruefe(d);
      return {
        id: v.id,
        name: v.name,
        was: v.was,
        untersuchung: v.untersuchung,
        frage: v.frage,
        ...p,
        wort: STAND_WORT[p.stand],
      };
    }).sort((a, b) => {
      const rang = { gestuetzt: 0, moeglich: 1, offen: 2, unwahrscheinlich: 3 };
      return (rang[a.stand] - rang[b.stand]) || (b.dafuer.length - a.dafuer.length);
    }),
  };
}

/* ===== js/schichten.js ===== */
/*
 * Störfaktoren herausrechnen – oder: liegt es wirklich am Kaffee?
 *
 * DAS PROBLEM, DAS DIESE DATEI LÖST
 *
 * Bisher wurde jeder Auslöser für sich verglichen: Mahlzeiten mit Kaffee gegen
 * Mahlzeiten ohne. Kommt dabei ein Unterschied heraus, stand da „auffällig".
 *
 * Nur trinkt niemand Kaffee zufällig verteilt. Kaffee gibt es an
 * Arbeitstagen, und Arbeitstage sind die angespannten. Wenn Anspannung den
 * Bauch verschlechtert, sieht der Kaffee schuldig aus, ohne es zu sein – und
 * jemand streicht ihn, isst fortan einseitiger und hat nichts gewonnen.
 *
 * Der Ausweg ist alt und heißt Schichtung: Man vergleicht nicht mehr alles
 * mit allem, sondern **innerhalb** vergleichbarer Gruppen. Hält der
 * Kaffee-Unterschied auch, wenn man nur die ruhigen Tage ansieht? Und auch,
 * wenn man nur die angespannten ansieht? Dann ist es der Kaffee. Zeigt er
 * sich nur in einer Schicht, war es der Störfaktor.
 *
 * DAS IST NICHT NUR EINE ABSCHWÄCHUNG
 *
 * Die Schichtung kann einen Befund auch *erzeugen*. Wenn jemand an ruhigen
 * Tagen selten Kaffee trinkt und an Stresstagen viel, kann sich der
 * Kaffee-Effekt im Gesamtschnitt fast aufheben und erst innerhalb der
 * Schichten sichtbar werden. Beides ist derselbe Rechenfehler – das
 * Simpson-Paradox – nur in verschiedene Richtungen.
 *
 * WAS DAS KOSTET, UND WARUM DIE SCHWELLEN STEIGEN
 *
 * Jede Schicht halbiert die Fallzahl ungefähr, und drei Schichtmerkmale mal
 * zwanzig Auslöser sind schnell hundert Vergleiche. Bei hundert Vergleichen
 * ist ein „auffälliger" Zufallstreffer nicht unwahrscheinlich, sondern zu
 * erwarten. Deshalb gilt hier strenger als sonst:
 *
 *   * Jede Schicht braucht auf **beiden** Seiten genug Fälle, sonst zählt sie
 *     gar nicht mit.
 *   * Mindestens **zwei** Schichten müssen prüfbar sein. Aus einer einzigen
 *     Schicht lässt sich nichts über Störfaktoren sagen.
 *   * Der Befund muss in **allen** prüfbaren Schichten dieselbe Richtung
 *     zeigen. Einmal dafür und einmal dagegen heißt: es liegt am Störfaktor,
 *     nicht am Auslöser.
 *
 * Und wenn das nicht reicht, kommt kein abgeschwächtes Urteil heraus, sondern
 * „dafür reichen die Daten nicht". Das ist die einzige ehrliche Antwort und
 * die einzige, die niemanden in die Irre führt.
 */

/**
 * Die Schichtmerkmale.
 *
 * Alles Dinge, die den Bauch nachweislich beeinflussen und die gleichzeitig
 * beeinflussen, *was* jemand isst – genau die Kombination, die einen
 * Störfaktor ausmacht. Wetter oder Wochentag stehen nicht hier: Sie ändern
 * zwar das Essen, aber nicht den Bauch.
 */
const SCHICHTEN = [
  {
    id: 'stress',
    name: 'Anspannung',
    // Die Tagesfragen laufen von 0 (ruhig) bis 4 (sehr viel).
    teile: [
      { id: 'ruhig', name: 'an ruhigen Tagen', passt: (v) => v !== null && v <= 1 },
      { id: 'angespannt', name: 'an angespannten Tagen', passt: (v) => v !== null && v >= 3 },
    ],
  },
  {
    id: 'schlaf',
    name: 'Schlaf',
    teile: [
      { id: 'gut', name: 'nach guten Nächten', passt: (v) => v !== null && v <= 1 },
      { id: 'schlecht', name: 'nach schlechten Nächten', passt: (v) => v !== null && v >= 3 },
    ],
  },
  {
    id: 'blutung',
    name: 'Zyklus',
    teile: [
      { id: 'ohne', name: 'außerhalb der Blutung', passt: (v) => !v },
      { id: 'mit', name: 'während der Blutung', passt: (v) => v > 0 },
    ],
  },
];

/*
 * Die mittlere Zone bleibt bewusst außen vor.
 *
 * „Geht so" ist weder ruhig noch angespannt; Mahlzeiten von solchen Tagen in
 * eine der beiden Schichten zu stecken, würde den Vergleich verwässern, den
 * er schärfen soll. Sie fehlen dann in der Rechnung – das kostet Fälle und
 * ist der Preis dafür, dass die beiden Schichten wirklich verschieden sind.
 */

/** Ab wie vielen Mahlzeiten je Seite eine Schicht überhaupt zählt. */
const MINDEST_JE_SCHICHT = 4;

/** So viele Schichten müssen prüfbar sein, damit ein Urteil möglich ist. */
const MINDEST_SCHICHTEN = 2;

const schnitt = (liste) => (liste.length
  ? liste.reduce((s, x) => s + x, 0) / liste.length : 0);

/**
 * Einen einzelnen Auslöser gegen die Störfaktoren halten.
 *
 * @param {object[]} bewertet  [{ merkmale:Set, wert:number, am:string }]
 * @param {string} id          der Auslöser
 * @param {object} tage        der Tagesspeicher
 * @returns {object} das Urteil samt allen Schichten, auch den nicht prüfbaren
 */
function haeltStand(bewertet, id, tage) {
  const schichten = [];

  SCHICHTEN.forEach((s) => {
    const paar = [];
    s.teile.forEach((teil) => {
      const drin = bewertet.filter((b) => {
        const tag = (tage || {})[b.am];
        if (!tag || !tag.notiert) return false;
        const v = tag[s.id];
        return teil.passt(v === undefined ? null : v);
      });
      const mit = drin.filter((b) => b.merkmale.has(id));
      const ohne = drin.filter((b) => !b.merkmale.has(id));
      const pruefbar = mit.length >= MINDEST_JE_SCHICHT && ohne.length >= MINDEST_JE_SCHICHT;
      const schnittMit = schnitt(mit.map((b) => b.wert));
      const schnittOhne = schnitt(ohne.map((b) => b.wert));

      paar.push({
        merkmal: s.id,
        merkmalName: s.name,
        id: `${s.id}:${teil.id}`,
        name: teil.name,
        pruefbar,
        faelle: mit.length,
        gegenFaelle: ohne.length,
        schnittMit,
        schnittOhne,
        differenz: pruefbar ? schnittMit - schnittOhne : 0,
        fehlt: Math.max(0, MINDEST_JE_SCHICHT - Math.min(mit.length, ohne.length)),
      });
    });

    /*
     * Eine Schicht zählt nur, wenn ihre Gegenschicht auch etwas hergibt.
     *
     * Das ist keine Feinheit, sondern der Kern der Sache – und es war im
     * ersten Entwurf falsch. Wer nie eine Blutung einträgt, dessen Mahlzeiten
     * fallen restlos in „außerhalb der Blutung". Diese eine Schicht enthält
     * dann *alles* und wiederholt damit genau den ungeschichteten Vergleich,
     * den sie prüfen soll – samt seiner Verzerrung. Sie stimmte die echten
     * Schichten nieder, und der Scheinbefund kam durch.
     *
     * Schichten gibt es deshalb nur im Paar: „ruhig" ist nur dann eine
     * Auskunft, wenn es auch „angespannt" gibt, mit dem man sie vergleichen
     * kann. Fehlt die Gegenseite, fehlt der Kontrast, und dann ist die Frage
     * nach dem Störfaktor gar nicht gestellt.
     */
    const beideDa = paar.every((x) => x.pruefbar);
    paar.forEach((x) => schichten.push({ ...x, pruefbar: x.pruefbar && beideDa }));
  });

  const pruefbare = schichten.filter((s) => s.pruefbar);

  if (pruefbare.length < MINDEST_SCHICHTEN) {
    return {
      urteil: 'unklar',
      schichten,
      pruefbare: pruefbare.length,
      satz: pruefbare.length === 0
        ? 'Für einen Vergleich unter gleichen Umständen fehlen die Angaben zu '
          + 'Anspannung, Schlaf oder Zyklus – ohne die lässt sich nicht sagen, '
          + 'ob es am Essen liegt oder an den Umständen.'
        : 'Bisher lässt sich das nur unter einem einzigen Umstand vergleichen. '
          + 'Aus einer einzigen Schicht folgt nichts über Störfaktoren.',
    };
  }

  /*
   * Zeigen alle prüfbaren Schichten in dieselbe Richtung? „Dieselbe Richtung"
   * heißt hier: nennenswert, nicht bloß dasselbe Vorzeichen. Ein Unterschied
   * von 0,05 ist kein Beleg dafür, dass etwas hält.
   */
  const SCHWELLE = 0.5;
  const dafuer = pruefbare.filter((s) => s.differenz >= SCHWELLE);
  const dagegen = pruefbare.filter((s) => s.differenz <= -SCHWELLE);
  const neutral = pruefbare.filter((s) => Math.abs(s.differenz) < SCHWELLE);

  if (dafuer.length === pruefbare.length) {
    return {
      urteil: 'haelt',
      schichten,
      pruefbare: pruefbare.length,
      satz: `Der Unterschied bleibt ${pruefbare.map((s) => s.name).join(' und ')} `
        + 'bestehen. Das spricht dafür, dass es am Essen liegt und nicht an den '
        + 'Umständen.',
    };
  }

  if (dafuer.length && (dagegen.length || neutral.length)) {
    const nur = dafuer.map((s) => s.name).join(' und ');
    const nicht = [...dagegen, ...neutral].map((s) => s.name).join(' und ');
    return {
      urteil: 'nur-dann',
      schichten,
      pruefbare: pruefbare.length,
      wo: dafuer.map((s) => s.name),
      satz: `Auffällig ist es ${nur}, ${nicht} dagegen nicht. Das deutet eher `
        + 'auf die Umstände als auf das Essen selbst – oder darauf, dass beides '
        + 'zusammenkommen muss.',
    };
  }

  return {
    urteil: 'verschwindet',
    schichten,
    pruefbare: pruefbare.length,
    satz: 'Unter gleichen Umständen verglichen bleibt kein Unterschied übrig. '
      + 'Der Verdacht kam vermutlich daher, dass dieses Essen und die schlechten '
      + 'Tage zusammenfallen, ohne dass eins das andere macht.',
  };
}

/** Für die Anzeige: kurzes Wort zum Urteil. */
const SCHICHT_WORT = {
  haelt: 'hält stand',
  'nur-dann': 'nur unter Umständen',
  verschwindet: 'verschwindet',
  unklar: 'nicht prüfbar',
};

/* ===== js/zeitprofil.js ===== */
/*
 * Wann kommt es? – das Zeitprofil nach dem Essen
 *
 * WARUM DAS FESTE FENSTER ZU WENIG IST
 *
 * Bisher galt: Beschwerden in den vier Stunden nach einer Mahlzeit zählen zu
 * ihr. Das ist eine brauchbare Faustregel und wirft eine der nützlichsten
 * Auskünfte weg, die in einem Tagebuch steckt – nämlich *wann genau*.
 *
 * Der Bauch braucht Zeit, und zwar je nach Ort verschieden lange:
 *
 *   0–2 Stunden   Der Magen ist noch voll. Was hier weh tut, hat mit Säure,
 *                 Dehnung und Magenentleerung zu tun – Reflux, Gastritis,
 *                 funktionelle Dyspepsie.
 *   2–4 Stunden   Der Speisebrei ist im Dünndarm. Fett und Galle brauchen
 *                 ungefähr so lange.
 *   4–8 Stunden   Jetzt erst erreicht der Rest den Dickdarm. Was Bakterien
 *                 vergären – FODMAP, Laktose, Ballaststoffe – meldet sich
 *                 nicht früher. Es *kann* nicht früher sein.
 *
 * Für die Sprechstunde ist das ein Unterschied ums Ganze: „Nach dem Essen
 * tut es weh" führt zum Säureblocker, „sechs Stunden nach dem Essen tut es
 * weh" führt zur Ernährungsberatung. Beides steht im selben Tagebuch.
 *
 * DIE FALLE, DIE DIESE DATEI VERMEIDET
 *
 * Wer dreimal am Tag isst, dessen Beschwerde vier Stunden nach dem Frühstück
 * ist gleichzeitig eine Stunde nach dem Mittagessen. Zählte man sie beiden
 * Mahlzeiten zu, stünde am Ende jede Beschwerde in jedem Fenster, und das
 * Profil wäre Rauschen mit drei Balken.
 *
 * Deshalb: Jede Beschwerde gehört **der letzten Mahlzeit davor** und keiner
 * anderen. Das hat einen Preis, und er wird hier ausgesprochen statt versteckt:
 * Das späte Fenster einer Mahlzeit lässt sich nur beobachten, wenn in diesen
 * Stunden nichts dazwischengegessen wurde. Für die meisten Mahlzeiten ist es
 * deshalb gar nicht beobachtbar – und eine nicht beobachtbare Stunde ist keine
 * beschwerdefreie Stunde. Sie zählt hier als das, was sie ist: nicht erhoben.
 *
 * Am Abendessen liegt das Fenster meist frei, am Frühstück selten. Wer also
 * wissen will, was der Dickdarm macht, muss länger Tagebuch führen als jemand,
 * der nach dem Magen fragt. Auch das sagt die App lieber, als es durch eine
 * Zahl zu ersetzen, die so aussieht, als wäre sie erhoben worden.
 */


/**
 * Die drei Fenster.
 *
 * Die Grenzen sind gerundet und stimmen für niemanden genau; die
 * Magenentleerung schwankt zwischen Menschen und Mahlzeiten erheblich. Sie
 * sind trotzdem nicht beliebig: Vergärung im Dickdarm *vor* vier Stunden gibt
 * es nicht, und darauf beruht die ganze Auskunft.
 */
const FENSTER = [
  {
    id: 'frueh',
    name: '0–2 Stunden danach',
    kurz: 'früh',
    von: 0,
    bis: 2,
    ort: 'Magen und Speiseröhre',
    deutung: 'So früh kommt Beschwerde aus dem Magen oder der Speiseröhre – '
      + 'Säure, Dehnung, verzögerte Entleerung. Für den Dickdarm ist es zu früh.',
  },
  {
    id: 'mittel',
    name: '2–4 Stunden danach',
    kurz: 'mittel',
    von: 2,
    bis: 4,
    ort: 'Dünndarm und Galle',
    deutung: 'In dieser Zeit arbeitet der Dünndarm an Fett und Galle. Das '
      + 'passt eher zu fettem Essen als zu vergärbaren Kohlenhydraten.',
  },
  {
    id: 'spaet',
    name: '4–8 Stunden danach',
    kurz: 'spät',
    von: 4,
    bis: 8,
    ort: 'Dickdarm',
    deutung: 'So spät ist der Rest im Dickdarm angekommen. Was dort vergärt – '
      + 'FODMAP, Laktose, Ballaststoffe – kann sich gar nicht früher melden.',
  },
];

/** Mindestens so viele beobachtbare Mahlzeiten je Seite und Fenster. */
const MINDEST_JE_FENSTER = 6;

/** Ab wie vielen zugeordneten Beschwerden das allgemeine Profil etwas sagt. */
const MINDEST_BESCHWERDEN = 12;

/*
 * Ein Schwerpunkt muss deutlich sein.
 *
 * Drei Fenster heißen drei Vergleiche, und wer aus drei Zahlen die größte
 * heraussucht, findet immer eine. Sie muss deshalb nicht nur die größte sein,
 * sondern die nächste um einen halben Punkt schlagen.
 */
const SCHWELLE = 1;
const ABSTAND = 0.5;

const mittelwert = (liste) => (liste.length
  ? liste.reduce((s, x) => s + x, 0) / liste.length : 0);

/**
 * Jede Beschwerde der letzten Mahlzeit davor zuordnen.
 *
 * @returns {Map} Mahlzeit-Kennung -> [{ stunden, staerke }]
 */
function zuordnen(eintraege) {
  const essen = eintraege.filter((e) => e.art === 'essen')
    .map((e) => ({ e, t: zeitpunkt(e.am, e.um) }))
    .sort((a, b) => a.t - b.t);
  const zu = new Map();
  essen.forEach((x) => zu.set(x.e.id, []));

  eintraege.filter((e) => e.art === 'beschwerde').forEach((b) => {
    const t = zeitpunkt(b.am, b.um);
    let letzte = null;
    // Rückwärts: die erste Mahlzeit, die vor der Beschwerde liegt, ist die
    // gesuchte. Gleichzeitigkeit zählt nicht – wer beim Essen schon Schmerzen
    // hat, hat sie nicht vom Essen.
    for (let i = essen.length - 1; i >= 0; i--) {
      if (essen[i].t < t) { letzte = essen[i]; break; }
    }
    if (!letzte) return;
    const stunden = stundenDazwischen(letzte.t, t);
    if (stunden > 8) return;
    zu.get(letzte.e.id).push({ stunden, staerke: Number(b.staerke) || 0 });
  });
  return zu;
}

/**
 * Für jede Mahlzeit: was in welchem Fenster kam – und welches Fenster
 * überhaupt beobachtbar war.
 *
 * Beobachtbar heißt zweierlei: Es wurde in dieser Zeit nichts dazwischen
 * gegessen (sonst gehörte die Beschwerde der anderen Mahlzeit), und das
 * Tagebuch lief noch (sonst wäre „nichts eingetragen" als „nichts gewesen"
 * gezählt – der Fehler, den diese App nirgends macht).
 */
function fensterWerte(eintraege) {
  const essen = eintraege.filter((e) => e.art === 'essen')
    .map((e) => ({ e, t: zeitpunkt(e.am, e.um) }))
    .sort((a, b) => a.t - b.t);
  const zu = zuordnen(eintraege);
  const letzterEintrag = eintraege.reduce(
    (m, e) => Math.max(m, zeitpunkt(e.am, e.um)), 0,
  );

  return essen.map((x, i) => {
    const naechste = essen[i + 1] ? stundenDazwischen(x.t, essen[i + 1].t) : Infinity;
    const tagebuchBis = stundenDazwischen(x.t, letzterEintrag);
    const liste = zu.get(x.e.id) || [];
    const werte = {};
    FENSTER.forEach((f) => {
      const beobachtbar = naechste >= f.bis && tagebuchBis >= f.bis;
      const drin = liste.filter((b) => b.stunden > f.von && b.stunden <= f.bis);
      werte[f.id] = {
        beobachtbar,
        wert: drin.reduce((m, b) => Math.max(m, b.staerke), 0),
      };
    });
    return { m: x.e, am: x.e.am, merkmale: new Set(merkmale(x.e)), werte };
  });
}

/**
 * Wann kommen die Beschwerden überhaupt? – ohne Blick auf einzelne Auslöser.
 *
 * Diese Zahl beantwortet die erste Frage der Sprechstunde („kommt das nach dem
 * Essen?") genauer als ein Ja und ist völlig unabhängig davon, ob jemand seine
 * Zutaten sauber einträgt.
 */
function zeitBild(eintraege) {
  const zu = zuordnen(eintraege);
  const alle = [];
  zu.forEach((liste) => liste.forEach((b) => alle.push(b)));
  const gesamt = eintraege.filter((e) => e.art === 'beschwerde').length;

  const teile = FENSTER.map((f) => {
    const drin = alle.filter((b) => b.stunden > f.von && b.stunden <= f.bis);
    return {
      id: f.id,
      name: f.name,
      ort: f.ort,
      anzahl: drin.length,
      anteil: alle.length ? drin.length / alle.length : 0,
      schnitt: mittelwert(drin.map((b) => b.staerke)),
    };
  });

  if (alle.length < MINDEST_BESCHWERDEN) {
    return {
      pruefbar: false,
      teile,
      zugeordnet: alle.length,
      gesamt,
      satz: `Bisher lassen sich ${alle.length} Beschwerden einer Mahlzeit `
        + 'davor zuordnen. Für ein Zeitprofil sind das zu wenige – das heißt '
        + 'nicht, dass es keines gibt.',
    };
  }

  const sortiert = [...teile].sort((a, b) => b.anteil - a.anteil);
  const spitze = sortiert[0];
  const zweite = sortiert[1];
  // Auch hier: die größte von dreien ist noch kein Schwerpunkt. Sie muss die
  // Hälfte der Zuordnungen tragen und die nächste deutlich schlagen.
  const deutlich = spitze.anteil >= 0.45 && (spitze.anteil - zweite.anteil) >= 0.15;
  const fenster = FENSTER.find((f) => f.id === spitze.id);

  return {
    pruefbar: true,
    teile,
    zugeordnet: alle.length,
    gesamt,
    schwerpunkt: deutlich ? spitze.id : null,
    satz: deutlich
      ? `Die meisten Beschwerden kommen ${spitze.name.toLowerCase()} `
        + `(${Math.round(spitze.anteil * 100)} % der zugeordneten). ${fenster.deutung}`
      : 'Die Beschwerden verteilen sich über die Stunden nach dem Essen, ohne '
        + 'erkennbaren Schwerpunkt. Das spricht eher gegen einen einzelnen Ort '
        + 'als Ursache.',
    hinweis: 'Zugeordnet wird immer der letzten Mahlzeit davor. Späte Stunden '
      + 'sind deshalb seltener beobachtbar als frühe – wer alle drei Stunden '
      + 'isst, kann über den Dickdarm wenig erfahren.',
  };
}

/**
 * Und jetzt je Auslöser: wann meldet sich *dieses* Essen?
 *
 * Der Vergleich ist derselbe wie in der Auslöserbilanz – Mahlzeiten mit dem
 * Merkmal gegen die übrigen –, nur getrennt nach Fenster. Ein Auslöser, der
 * sich erst nach sechs Stunden zeigt, ist ein anderer Befund als einer, der
 * nach einer halben Stunde brennt, auch wenn der Vier-Stunden-Schnitt für
 * beide dasselbe sagt.
 */
function zeitProfil(bewertet, id) {
  const teile = FENSTER.map((f) => {
    const mit = bewertet.filter((b) => b.merkmale.has(id) && b.werte[f.id].beobachtbar);
    const ohne = bewertet.filter((b) => !b.merkmale.has(id) && b.werte[f.id].beobachtbar);
    const pruefbar = mit.length >= MINDEST_JE_FENSTER && ohne.length >= MINDEST_JE_FENSTER;
    const schnittMit = mittelwert(mit.map((b) => b.werte[f.id].wert));
    const schnittOhne = mittelwert(ohne.map((b) => b.werte[f.id].wert));
    return {
      id: f.id,
      name: f.name,
      kurz: f.kurz,
      ort: f.ort,
      pruefbar,
      faelle: mit.length,
      gegenFaelle: ohne.length,
      schnittMit,
      schnittOhne,
      differenz: pruefbar ? schnittMit - schnittOhne : 0,
      fehlt: Math.max(0, MINDEST_JE_FENSTER - Math.min(mit.length, ohne.length)),
    };
  });

  const pruefbare = teile.filter((t) => t.pruefbar);
  if (!pruefbare.length) {
    return {
      teile,
      pruefbare: 0,
      schwerpunkt: null,
      satz: 'Wann genau es sich meldet, lässt sich noch nicht sagen: In keinem '
        + 'Zeitfenster sind genug beobachtbare Mahlzeiten beisammen. Beobachtbar '
        + 'ist ein Fenster nur, wenn darin nichts dazwischengegessen wurde.',
    };
  }

  const sortiert = [...pruefbare].sort((a, b) => b.differenz - a.differenz);
  const spitze = sortiert[0];
  const zweite = sortiert[1];
  const deutlich = spitze.differenz >= SCHWELLE
    && (!zweite || (spitze.differenz - zweite.differenz) >= ABSTAND);

  if (!deutlich) {
    return {
      teile,
      pruefbare: pruefbare.length,
      schwerpunkt: null,
      satz: pruefbare.length === 1
        ? `Bisher ist nur das Fenster „${pruefbare[0].name}" besetzt genug; für `
          + 'einen Vergleich der Zeitpunkte fehlt der Rest.'
        : 'Ein deutlicher Zeitpunkt ist nicht zu erkennen – der Unterschied '
          + 'verteilt sich über die Stunden danach.',
    };
  }

  const f = FENSTER.find((x) => x.id === spitze.id);
  return {
    teile,
    pruefbare: pruefbare.length,
    schwerpunkt: spitze.id,
    satz: `Auffällig wird es vor allem ${spitze.name.toLowerCase()}. ${f.deutung}`,
  };
}

/**
 * Was das feste Fenster gar nicht sehen kann.
 *
 * Und das ist der eigentliche Gewinn dieser Datei. Die Auslöserbilanz zählt
 * Beschwerden in den vier Stunden nach dem Essen; ein Auslöser, der sich erst
 * nach sechs Stunden meldet, taucht dort nicht als „unauffällig" auf, sondern
 * überhaupt nicht. Er ist kein schwacher Befund, er ist ein ungestellter.
 *
 * Genau danach wird hier gesucht – und **nur** danach: Zurückgegeben wird ein
 * Auslöser nur, wenn sein Schwerpunkt jenseits des eingestellten Fensters
 * liegt. Das ist keine Feinheit, sondern der Schutz vor der Fischerei: Drei
 * Fenster mal zwanzig Auslöser sind sechzig Vergleiche, und wer in sechzig
 * Vergleichen sucht, findet immer etwas. Ein früher Schwerpunkt wäre der Bilanz
 * ohnehin aufgefallen – ihn hier ein zweites Mal zu melden hieße, dieselbe Zahl
 * zweimal zu zählen und die Trefferchance zu verdoppeln.
 *
 * @param {object[]} fenster  aus fensterWerte()
 * @param {string[]} ids      Auslöser, die die Bilanz *nicht* auffällig fand
 * @param {number} bisher     das eingestellte Fenster in Stunden
 */
function spaeteFunde(fenster, ids, bisher = 4) {
  const raus = [];
  ids.forEach((id) => {
    const p = zeitProfil(fenster, id);
    if (!p.schwerpunkt) return;
    const f = FENSTER.find((x) => x.id === p.schwerpunkt);
    // Erst ab der Stunde, an der die alte Rechnung aufhört zu schauen.
    if (f.von < bisher) return;
    const teil = p.teile.find((x) => x.id === p.schwerpunkt);
    raus.push({ id, profil: p, teil, fensterName: f.name, ort: f.ort });
  });
  return raus.sort((a, b) => b.teil.differenz - a.teil.differenz);
}

/** Für die Anzeige: das Fenster in einem Wort. */
const FENSTER_WORT = Object.fromEntries(
  FENSTER.map((f) => [f.id, f.name]),
);

/* ===== js/wechselwirkung.js ===== */
/*
 * Zyklus mal Auslöser – dieselbe Menge, andere Wirkung
 *
 * WORUM ES GEHT
 *
 * Die Auslöserbilanz fragt: Ging es nach diesem Essen schlechter? Sie fragt
 * nicht, *wann im Monat*. Und das ist bei vielen Menschen der halbe Befund.
 *
 * Die Empfindlichkeit des Bauchs schwankt mit dem Zyklus – nicht als Gefühl,
 * sondern messbar: Vor und während der Periode reagiert der Darm auf dieselbe
 * Dehnung stärker, die Passage ändert sich, Prostaglandine tun das Ihre. Wer
 * drei Wochen lang Zwiebeln verträgt und in der vierten nicht, hat keine
 * Zwiebelunverträglichkeit – und wird trotzdem Zwiebeln streichen, wenn die
 * Rechnung über alle vier Wochen mittelt.
 *
 * Herauskommt dabei nämlich etwas, das doppelt falsch ist: In drei Wochen von
 * vier ist der Auslöser unschuldig, in der vierten ist er es nicht, und der
 * Mittelwert sagt „ein bisschen auffällig" – eine Aussage, die für keinen
 * einzigen Tag stimmt.
 *
 * WAS DIESE DATEI NICHT TUT
 *
 * Sie sagt nicht voraus. Die Phasen sind aus eingetragenen Blutungstagen
 * geschätzt (siehe js/zyklus.js, und dort steht auch, wie grob das ist). Sie
 * taugen zum Zurückschauen und zu nichts sonst.
 *
 * Und sie urteilt nicht über eine einzelne Phase. Verlangt wird, dass
 * mindestens zwei Phasen prüfbar sind – eine Zahl allein ist kein Wechsel,
 * sondern eine Zahl.
 */

/** Mahlzeiten je Seite und Phase, ab denen eine Phase überhaupt zählt. */
const MINDEST_JE_PHASE = 5;

/** So viele Phasen müssen prüfbar sein. */
const MINDEST_PHASEN = 2;

/**
 * Ab welchem Unterschied zwischen den Phasen von einem Wechsel die Rede ist.
 *
 * Anderthalb Stufen, und das ist mit Absicht mehr als die Schwelle der
 * Auslöserbilanz selbst (eine Stufe). Hier werden Unterschiede von
 * Unterschieden verglichen, und die schwanken stärker als die Unterschiede
 * selbst – wer denselben Maßstab anlegte, fände in jedem Tagebuch einen
 * Wechsel.
 */
const SPANNE = 1.5;

/** Und irgendwo muss überhaupt eine Wirkung sein, sonst wechselt nichts. */
const MINDEST_WIRKUNG = 1;

const mittel = (liste) => (liste.length
  ? liste.reduce((s, x) => s + x, 0) / liste.length : 0);

/**
 * Ein Auslöser, aufgeteilt nach Zyklusphase.
 *
 * @param {object[]} bewertet  aus bewerteteMahlzeiten(): { am, merkmale, wert }
 * @param {string} id          der Auslöser
 * @param {object} tage        der Tagesspeicher, für die Phasenschätzung
 */
function phasenWirkung(bewertet, id, tage) {
  const phasen = PHASEN.map((p) => {
    const drin = bewertet.filter((b) => phaseVon(tage, b.am) === p.id);
    const mit = drin.filter((b) => b.merkmale.has(id));
    const ohne = drin.filter((b) => !b.merkmale.has(id));
    const pruefbar = mit.length >= MINDEST_JE_PHASE && ohne.length >= MINDEST_JE_PHASE;
    const schnittMit = mittel(mit.map((b) => b.wert));
    const schnittOhne = mittel(ohne.map((b) => b.wert));
    return {
      phase: p.id,
      name: p.name,
      pruefbar,
      faelle: mit.length,
      gegenFaelle: ohne.length,
      schnittMit,
      schnittOhne,
      differenz: pruefbar ? schnittMit - schnittOhne : 0,
    };
  });

  const pruefbare = phasen.filter((p) => p.pruefbar);

  /*
   * Ohne zwei abgeschlossene Zyklen ist die Phaseneinteilung geraten.
   *
   * Das steht vor der Fallzahlprüfung, weil es der schwerere Einwand ist: Bei
   * einem einzigen beobachteten Zyklus ist die mittlere Länge diese eine
   * Länge, und die Phasengrenzen sind dann keine Schätzung, sondern ein Echo
   * der Daten, an denen sie geprüft werden.
   */
  if (!belastbar(tage)) {
    return {
      urteil: 'unklar',
      phasen,
      pruefbare: 0,
      satz: 'Für einen Vergleich nach Zyklusphase fehlen die Zyklen: Es braucht '
        + 'mindestens zwei vollständig eingetragene, sonst sind die Phasen '
        + 'geraten und nicht geschätzt.',
    };
  }

  if (pruefbare.length < MINDEST_PHASEN) {
    return {
      urteil: 'unklar',
      phasen,
      pruefbare: pruefbare.length,
      satz: 'Bisher ist das nur in einer Phase oder in gar keiner vergleichbar. '
        + 'Aus einer einzelnen Phase folgt nichts über den Zyklus.',
    };
  }

  const sortiert = [...pruefbare].sort((a, b) => b.differenz - a.differenz);
  const staerkste = sortiert[0];
  const schwaechste = sortiert[sortiert.length - 1];
  const spanne = staerkste.differenz - schwaechste.differenz;

  if (spanne >= SPANNE && staerkste.differenz >= MINDEST_WIRKUNG) {
    return {
      urteil: 'wechselt',
      phasen,
      pruefbare: pruefbare.length,
      staerkste,
      schwaechste,
      spanne,
      satz: `In der Phase „${staerkste.name}" fällt das deutlich stärker aus `
        + `(${staerkste.differenz.toFixed(1)} Stufen Unterschied) als in der Phase `
        + `„${schwaechste.name}" (${schwaechste.differenz.toFixed(1)}). Dieselbe `
        + 'Menge, andere Wirkung – das spricht eher für eine wechselnde '
        + 'Empfindlichkeit als für eine Unverträglichkeit.',
    };
  }

  return {
    urteil: 'gleich',
    phasen,
    pruefbare: pruefbare.length,
    staerkste,
    schwaechste,
    spanne,
    satz: 'Über die Zyklusphasen hinweg fällt das ähnlich aus. Der Zyklus '
      + 'erklärt hier also nichts – was gegen ihn spricht und für das Essen.',
  };
}

/**
 * Und dieselbe Frage einmal ohne Essen: Ist eine Phase für sich schon schlimmer?
 *
 * js/zyklus.js liefert dazu die Zahlen, aber bewusst kein Urteil. Hier steht
 * es, mit denselben zwei Bedingungen: zwei vollständige Zyklen, und genug Tage
 * in beiden verglichenen Phasen.
 */
function phasenUrteil(bilanz, tage, mindestTage = 5) {
  const brauchbar = (bilanz || []).filter((p) => p.tage >= mindestTage);
  if (!belastbar(tage) || brauchbar.length < 2) {
    return {
      pruefbar: false,
      satz: 'Ob eine Zyklusphase für sich schlimmer ist, lässt sich noch nicht '
        + 'sagen – dafür fehlen entweder Zyklen oder Tage in den einzelnen Phasen.',
    };
  }
  const sortiert = [...brauchbar].sort((a, b) => b.schnitt - a.schnitt);
  const schlimm = sortiert[0];
  const mild = sortiert[sortiert.length - 1];
  const spanne = schlimm.schnitt - mild.schnitt;
  if (spanne < 1) {
    return {
      pruefbar: true,
      deutlich: false,
      satz: 'Über die Zyklusphasen hinweg sind die Beschwerden ähnlich stark. '
        + 'Ein Zyklusmuster ist hier nicht zu erkennen.',
    };
  }
  return {
    pruefbar: true,
    deutlich: true,
    schlimm,
    mild,
    spanne,
    satz: `Am stärksten ist es in der Phase „${schlimm.name}" `
      + `(${schlimm.schnitt.toFixed(1)} im Mittel über ${schlimm.tage} Tage), `
      + `am schwächsten in der Phase „${mild.name}" (${mild.schnitt.toFixed(1)} `
      + `über ${mild.tage} Tage). Die Phasen sind aus den eingetragenen `
      + 'Blutungstagen geschätzt.',
  };
}

/**
 * Für die Anzeige: alle Auslöser, deren Wirkung mit dem Zyklus wechselt.
 *
 * Nur die – „ändert sich nicht" ist keine Karte wert, sondern höchstens eine
 * Zeile unter dem einzelnen Fund. Was hier steht, ist die Auskunft, die man
 * sonst nirgends bekommt.
 */
function wechselnde(bewertet, ids, tage) {
  const raus = [];
  (ids || []).forEach((id) => {
    const w = phasenWirkung(bewertet, id, tage);
    if (w.urteil === 'wechselt') raus.push({ id, ...w });
  });
  return raus.sort((a, b) => b.spanne - a.spanne);
}

/** Für die Anzeige: kurzes Wort zum Urteil. */
const WECHSEL_WORT = {
  wechselt: 'wechselt mit dem Zyklus',
  gleich: 'über den Zyklus gleich',
  unklar: 'nicht prüfbar',
};

/* ===== js/unterleib.js ===== */
/*
 * Der Unterleib – und warum ein Magentagebuch danach fragt.
 *
 * Endometriose wird im Mittel sieben bis zehn Jahre lang nicht erkannt, und
 * die häufigste Fehldeutung auf diesem Weg ist „Reizdarm". Das ist kein
 * Zufall: Endometrioseherde am Darm oder im Douglasraum machen Blähungen,
 * Krämpfe, Durchfall und Verstopfung – dieselben Beschwerden, die dieses
 * Tagebuch ohnehin zählt, nur mit einer anderen Ursache.
 *
 * Was die beiden auseinanderhält, steht in Daten, die eine Magensprechstunde
 * nicht erhebt:
 *
 *   * **Zyklusbindung.** Reizdarmbeschwerden schwanken auch, aber nicht
 *     verlässlich mit der Blutung. Endometriose tut das.
 *   * **Tiefer Schmerz beim Sex.** Das ist das Merkmal mit dem größten
 *     Gewicht und zugleich das, nach dem am seltensten gefragt wird. Schmerz
 *     am Eingang deutet woanders hin (Beckenboden, Trockenheit, Vaginismus) –
 *     deshalb wird hier getrennt gezählt.
 *   * **Starker Regelschmerz**, der Schmerzmittel oder Fehltage erzwingt.
 *   * **Darmbeschwerden, die zur Blutung hin schlimmer werden**, oft mit
 *     schmerzhaftem Stuhlgang während der Periode.
 *
 * WAS DIESES MODUL NICHT TUT: eine Diagnose stellen. Endometriose wird
 * bildgebend und letztlich durch eine Bauchspiegelung festgestellt, nie durch
 * ein Tagebuch. Was hier herauskommt, ist ein Satz für die Sprechstunde – und
 * der ist trotzdem viel wert, weil er eine Frage auslöst, die sonst über Jahre
 * nicht gestellt wird.
 *
 * UND ES SCHWEIGT LIEBER. Alle vier Merkmale sind nur zu haben, wenn jemand
 * die Fragen dazu eingeschaltet und ein paar Wochen ausgefüllt hat. Fehlen
 * sie, steht hier nicht „unauffällig", sondern „nicht prüfbar" – der
 * Unterschied ist der ganze Punkt. Ein „unauffällig" auf leerer Grundlage
 * hätte genau die Wirkung, die es hier zu vermeiden gilt: dass niemand mehr
 * nachfragt.
 */

/** Ab wie vielen Tagen mit einer Angabe ein Merkmal überhaupt zählt. */
const GENUG_TAGE = 8;

/** Ab wie vielen Gelegenheiten mit Sex die Schmerzfrage etwas hergibt. */
const GENUG_SEX = 4;

/** Ab wie vielen Blutungstagen sich der Regelschmerz beurteilen lässt. */
const GENUG_BLUTUNG = 6;

const zahl = (x) => (Number.isFinite(x) ? x : null);

/**
 * Die vier Merkmale, jedes mit seiner eigenen Prüfbarkeit.
 *
 * @param {object[]} eintraege
 * @param {object} tage       der Tagesspeicher
 * @param {function} tagesWert (eintraege, iso, tage) -> { notiert, wert }
 */
function unterleibsBild(eintraege, tage, tagesWert) {
  const alle = Object.entries(tage || {}).filter(([, t]) => t && t.notiert);

  /* ---------- 1. Schmerz beim Sex ---------- */

  // Gezählt werden nur Tage, an denen es Sex gab – sonst sagt „kein Schmerz"
  // nichts aus. Das ist der Unterschied zwischen „tut nicht weh" und
  // „kam nicht vor".
  const mitSex = alle.filter(([, t]) => zahl(t.sex) > 0);
  const mitAngabe = mitSex.filter(([, t]) => zahl(t.sexschmerz) !== null);
  const schmerzhaft = mitAngabe.filter(([, t]) => zahl(t.sexschmerz) > 0);
  const tief = mitAngabe.filter(([, t]) => zahl(t.sextief) > 0);

  const sexSchmerz = {
    pruefbar: mitAngabe.length >= GENUG_SEX,
    gelegenheiten: mitAngabe.length,
    mitSchmerz: schmerzhaft.length,
    tief: tief.length,
    anteil: mitAngabe.length ? schmerzhaft.length / mitAngabe.length : 0,
    // Der stärkste einzelne Hinweis: tiefer Schmerz, mehrfach.
    tiefWiederholt: tief.length >= 2,
    fehlt: Math.max(0, GENUG_SEX - mitAngabe.length),
  };

  /* ---------- 2. Regelschmerz ---------- */

  const blutungsTage = alle.filter(([, t]) => zahl(t.blutung) > 0);
  const mitRegelAngabe = blutungsTage.filter(([, t]) => zahl(t.regelschmerz) !== null);
  const starkeTage = mitRegelAngabe.filter(([, t]) => zahl(t.regelschmerz) >= 3);

  const regel = {
    pruefbar: mitRegelAngabe.length >= GENUG_BLUTUNG,
    blutungsTage: mitRegelAngabe.length,
    starkeTage: starkeTage.length,
    anteilStark: mitRegelAngabe.length ? starkeTage.length / mitRegelAngabe.length : 0,
    // „Stark" heißt hier: mindestens die Hälfte der Blutungstage deutlich.
    auffaellig: mitRegelAngabe.length >= GENUG_BLUTUNG
      && starkeTage.length / mitRegelAngabe.length >= 0.5,
    fehlt: Math.max(0, GENUG_BLUTUNG - mitRegelAngabe.length),
  };

  /* ---------- 3. Beschwerden zur Blutung hin ---------- */

  /*
   * Verglichen wird der Bauch an Blutungstagen gegen den Bauch an allen
   * übrigen notierten Tagen. Gegen null zu vergleichen wäre sinnlos – fast
   * jeder hat irgendwann Beschwerden; interessant ist der Abstand zum eigenen
   * Alltag.
   */
  const wertVon = ([iso]) => tagesWert(eintraege, iso, tage).wert;
  const beiBlutung = blutungsTage.map(wertVon);
  const sonst = alle.filter(([, t]) => !(zahl(t.blutung) > 0)).map(wertVon);
  const schnitt = (a) => (a.length ? a.reduce((x, y) => x + y, 0) / a.length : 0);

  const zyklisch = {
    pruefbar: beiBlutung.length >= GENUG_TAGE && sonst.length >= GENUG_TAGE,
    blutungsTage: beiBlutung.length,
    andereTage: sonst.length,
    beiBlutung: schnitt(beiBlutung),
    sonst: schnitt(sonst),
    differenz: schnitt(beiBlutung) - schnitt(sonst),
    // Eine ganze Stufe Unterschied, dieselbe Schwelle wie beim Verlauf.
    auffaellig: beiBlutung.length >= GENUG_TAGE && sonst.length >= GENUG_TAGE
      && schnitt(beiBlutung) - schnitt(sonst) >= 1,
    fehlt: Math.max(0, GENUG_TAGE - Math.min(beiBlutung.length, sonst.length)),
  };

  /* ---------- 4. Schmerzhafter Stuhlgang während der Blutung ---------- */

  const blutungsSet = new Set(blutungsTage.map(([iso]) => iso));
  const stuhl = eintraege.filter((e) => e.art === 'stuhl');
  const stuhlBeiBlutung = stuhl.filter((e) => blutungsSet.has(e.am));
  const schmerzhaftBeiBlutung = stuhlBeiBlutung.filter((e) => e.schmerz || e.dringend);

  const stuhlgang = {
    pruefbar: stuhlBeiBlutung.length >= 3,
    waehrendBlutung: stuhlBeiBlutung.length,
    davonSchwer: schmerzhaftBeiBlutung.length,
  };

  /* ---------- Zusammengesetzt ---------- */

  /*
   * Wie viele der Merkmale sprechen dafür – und wie viele ließen sich
   * überhaupt prüfen. Das zweite ist genauso wichtig: „eins von vier" heißt
   * etwas ganz anderes als „eins von vier, drei nicht prüfbar".
   */
  const merkmale = [
    {
      id: 'sextief',
      name: 'Tiefer Schmerz beim Sex',
      gewicht: 2,
      pruefbar: sexSchmerz.pruefbar,
      erfuellt: sexSchmerz.pruefbar && sexSchmerz.tiefWiederholt,
      text: sexSchmerz.pruefbar
        ? `${sexSchmerz.tief} von ${sexSchmerz.gelegenheiten} Malen mit tiefem Schmerz`
        : `noch ${sexSchmerz.fehlt} Angaben nötig`,
    },
    {
      id: 'regelschmerz',
      name: 'Starker Regelschmerz',
      gewicht: 1,
      pruefbar: regel.pruefbar,
      erfuellt: regel.auffaellig,
      text: regel.pruefbar
        ? `an ${regel.starkeTage} von ${regel.blutungsTage} Blutungstagen stark`
        : `noch ${regel.fehlt} Blutungstage mit Angabe nötig`,
    },
    {
      id: 'zyklisch',
      name: 'Bauch schlechter zur Blutung hin',
      gewicht: 1,
      pruefbar: zyklisch.pruefbar,
      erfuellt: zyklisch.auffaellig,
      text: zyklisch.pruefbar
        ? `${zyklisch.beiBlutung.toFixed(1).replace('.', ',')} gegen `
          + `${zyklisch.sonst.toFixed(1).replace('.', ',')} an anderen Tagen`
        : `noch ${zyklisch.fehlt} Tage nötig`,
    },
    {
      id: 'stuhlgang',
      name: 'Stuhlgang während der Blutung schwer',
      gewicht: 1,
      pruefbar: stuhlgang.pruefbar,
      erfuellt: stuhlgang.pruefbar && stuhlgang.davonSchwer >= 2,
      text: stuhlgang.pruefbar
        ? `${stuhlgang.davonSchwer} von ${stuhlgang.waehrendBlutung} Mal`
        : 'zu wenige Einträge während der Blutung',
    },
  ];

  const pruefbare = merkmale.filter((m) => m.pruefbar);
  const erfuellte = merkmale.filter((m) => m.erfuellt);
  const punkte = erfuellte.reduce((s, m) => s + m.gewicht, 0);

  /*
   * Wann ein Satz in den Bericht gehört – und warum die Schwelle nicht
   * niedriger sein darf, als sie beim ersten Entwurf war.
   *
   * Erst hieß die Regel „zwei Punkte genügen". Die Prüfung hat gezeigt, was
   * das bedeutet: Schmerzhafte Perioden und ein Bauch, der zur Blutung hin
   * schlechter wird, sind zusammen bei sehr vielen Menschen der Normalzustand.
   * Eine App, die daraufhin bei jeder Zweiten Endometriose in den Raum stellt,
   * schickt Leute in Sprechstunden, in denen nichts gefunden wird – und beim
   * nächsten Mal, wenn es wirklich etwas wäre, glaubt ihr niemand mehr.
   *
   * Deshalb zwei Wege statt eines Schwellwerts:
   *
   *   * Tiefer Schmerz beim Sex, wiederholt. Das ist das Merkmal mit der
   *     eigenen Aussagekraft und trägt allein.
   *   * Oder ALLE drei übrigen zusammen. Einzeln sind sie alltäglich, zu
   *     dritt sind sie es nicht mehr.
   */
  const ansprechen = (sexSchmerz.pruefbar && sexSchmerz.tiefWiederholt) || punkte >= 3;

  /*
   * Wurden die Fragen, um die es hier geht, überhaupt beantwortet?
   *
   * Ohne sie bleiben nur Blutung und Stuhlgang – und dafür gibt es bereits das
   * Zyklusmuster, das Endometriose ohnehin als Möglichkeit nennt. Ein zweites,
   * fast gleiches Muster daneben wäre keine zusätzliche Auskunft, sondern
   * doppelte Lautstärke bei gleichem Inhalt.
   */
  const neueFragen = sexSchmerz.pruefbar || regel.pruefbar;

  return {
    sexSchmerz,
    regel,
    zyklisch,
    stuhlgang,
    merkmale,
    punkte,
    pruefbare: pruefbare.length,
    erfuellte: erfuellte.length,
    ansprechen,
    neueFragen,
    /*
     * Ob überhaupt jemand die Fragen eingeschaltet hat. Ohne diese
     * Unterscheidung sähe „keine Merkmale" wie Entwarnung aus, obwohl gar
     * nichts erhoben wurde.
     */
    erhoben: pruefbare.length > 0,
  };
}

/**
 * Lohnt es sich, die Fragen überhaupt vorzuschlagen?
 *
 * Nur wenn das Tagebuch schon von sich aus in diese Richtung zeigt: Blutungen
 * eingetragen und der Bauch dabei auffällig schlechter. Dann – und nur dann –
 * ist der Hinweis eine Hilfe und keine Zudringlichkeit.
 */
function fragenVorschlagen(eintraege, tage, tagesWert, tagesfragen) {
  const schon = Array.isArray(tagesfragen) ? tagesfragen : [];
  if (schon.includes('sexschmerz') && schon.includes('regelschmerz')) return null;

  const bild = unterleibsBild(eintraege, tage, tagesWert);
  if (!bild.zyklisch.pruefbar || !bild.zyklisch.auffaellig) return null;

  return {
    differenz: bild.zyklisch.differenz,
    blutungsTage: bild.zyklisch.blutungsTage,
    fehlende: ['sexschmerz', 'sextief', 'regelschmerz'].filter((f) => !schon.includes(f)),
  };
}

/* ===== js/bild.js ===== */
/*
 * Das Bild: so weit Richtung Diagnose, wie ein Tagebuch ehrlich kommt.
 *
 * Diese Datei sagt nicht, was jemand hat. Sie sagt, wonach das aussieht, was
 * er eingetragen hat – und zwar in den Begriffen, die in einer Praxis benutzt
 * werden, damit das Gespräch dort nicht bei null anfängt.
 *
 * Warum nicht weiter? Weil weiter geraten wäre. Gastritis, Magengeschwür,
 * Refluxkrankheit, funktionelle Dyspepsie und ein Reizdarm machen im Tagebuch
 * teils dasselbe Bild. Auseinander hält sie eine Magenspiegelung, ein Test auf
 * Helicobacter, ein Blutbild, ein Atemtest – Dinge, die man nicht eintippen
 * kann. Eine App, die sich trotzdem für eine entscheidet, nimmt der
 * Untersuchung ihre Frage weg und der Nutzerin die Möglichkeit zu merken, dass
 * es etwas anderes ist.
 *
 * Was hier deshalb steht, ist dreierlei:
 *
 *   1. **Warnzeichen.** Der einzige Teil, der wirklich dringt. Wo Blut,
 *      Gewichtsverlust oder eine Schluckstörung im Tagebuch stehen, gehört ein
 *      klarer Satz hin und keine Statistik.
 *   2. **Muster mit Belegen.** „Säuretypisch, in 78 % der Einträge Brennen
 *      oder Sodbrennen, davon 12 von 15 nachts" – eine Beschreibung, die man
 *      nachrechnen und vorlesen kann.
 *   3. **Was dahinterstecken kann und was es unterscheidet.** Also welche
 *      Untersuchung welche Frage beantwortet. Das ist die nützlichste Zeile
 *      des ganzen Programms.
 */



/*
 * ---------------------------------------------------------------------------
 * 1. Warnzeichen
 * ---------------------------------------------------------------------------
 *
 * Sie stehen als eigene Liste im Beschwerdebogen, getrennt von der Frage, wie
 * es sich anfühlt. Ein Warnzeichen ist keine Ausprägung von „Brennen", es ist
 * eine andere Art von Angabe – und es darf nie in einer Statistik verschwinden.
 *
 * `dringlichkeit`:
 *   'sofort'  heute, notfalls über die 112 oder eine Notaufnahme
 *   'zeitnah' in den nächsten Tagen ein Termin, nicht „irgendwann mal"
 */
const WARNZEICHEN = [
  {
    id: 'bluterbrechen',
    name: 'Blut erbrochen oder kaffeesatzartiges Erbrechen',
    dringlichkeit: 'sofort',
    warum: 'Das kann eine Blutung im Magen oder in der Speiseröhre sein.',
  },
  {
    id: 'teerstuhl',
    name: 'Schwarzer, klebriger Stuhl',
    dringlichkeit: 'sofort',
    warum: 'Schwarzer Stuhl kann verdautes Blut sein. (Eisentabletten, Heidelbeeren '
      + 'und Bismut färben ihn ebenfalls dunkel – das gehört dazugesagt, aber '
      + 'geklärt wird das dort und nicht hier.)',
  },
  {
    id: 'ausstrahlung',
    name: 'Schmerz strahlt in Arm, Kiefer oder Rücken aus, mit Luftnot oder kaltem Schweiß',
    dringlichkeit: 'sofort',
    warum: 'Beschwerden in der Magengegend können vom Herzen kommen, besonders '
      + 'bei Frauen. Das ist der eine Fall, in dem Abwarten teuer wird.',
  },
  {
    id: 'blutstuhl',
    name: 'Frisches Blut im Stuhl',
    dringlichkeit: 'zeitnah',
    warum: 'Gehört abgeklärt, auch wenn Hämorrhoiden die häufigste Ursache sind.',
  },
  {
    id: 'schlucken',
    name: 'Schluckstörung, Essen bleibt stecken',
    dringlichkeit: 'zeitnah',
    warum: 'Eine Enge in der Speiseröhre wird nicht von selbst besser.',
  },
  {
    id: 'gewicht',
    name: 'Ungewollter Gewichtsverlust',
    dringlichkeit: 'zeitnah',
    warum: 'Abnehmen, ohne es zu wollen, ist immer eine eigene Frage wert.',
  },
  {
    id: 'erbrechen',
    name: 'Anhaltendes Erbrechen',
    dringlichkeit: 'zeitnah',
    warum: 'Länger als ein, zwei Tage: Es geht dabei auch Flüssigkeit verloren.',
  },
  {
    id: 'nachtschmerz',
    name: 'Schmerz weckt nachts auf',
    dringlichkeit: 'zeitnah',
    warum: 'Beschwerden, die aus dem Schlaf reißen, unterscheiden sich von '
      + 'solchen, die tagsüber kommen und gehen.',
  },
  {
    id: 'blaesse',
    name: 'Auffällige Blässe, Schwäche oder Luftnot bei Anstrengung',
    dringlichkeit: 'zeitnah',
    warum: 'Zeichen, die zu einer Blutarmut passen – ein Blutbild klärt das in '
      + 'einer Viertelstunde.',
  },
  {
    id: 'fieber',
    name: 'Fieber dazu',
    dringlichkeit: 'zeitnah',
    warum: 'Fieber gehört nicht zu einer gereizten Magenschleimhaut.',
  },
];

const WARN_MAP = Object.fromEntries(WARNZEICHEN.map((w) => [w.id, w]));

function warnzeichenVon(id) {
  return WARN_MAP[id] || null;
}

/**
 * Welche Warnzeichen im Tagebuch stehen – mit Datum und Häufigkeit.
 *
 * Ohne Zeitgrenze und ohne Schwelle: Ein einziges Mal Blut erbrochen ist ein
 * einziges Mal zu viel, und ein Eintrag von vor drei Monaten, der nie
 * abgeklärt wurde, ist keine alte Nachricht.
 *
 * Gesucht wird in *allen* Eintragungen, nicht nur in den Beschwerden. Seit es
 * den Stuhlgang als eigene Art gibt, stehen die zwei wichtigsten Warnzeichen
 * überhaupt – schwarzer Stuhl und frisches Blut – genau dort. Sie nur im
 * Beschwerdebogen zu suchen, hieße sie da zu suchen, wo sie nicht sind.
 */
function warnungen(eintraege) {
  const zaehler = new Map();
  eintraege.filter((e) => Array.isArray(e.warnzeichen)).forEach((e) => {
    (e.warnzeichen || []).forEach((id) => {
      const w = WARN_MAP[id];
      if (!w) return;
      const v = zaehler.get(id) || { ...w, anzahl: 0, zuerst: e.am, zuletzt: e.am };
      v.anzahl += 1;
      if (e.am < v.zuerst) v.zuerst = e.am;
      if (e.am > v.zuletzt) v.zuletzt = e.am;
      zaehler.set(id, v);
    });
  });
  // Das Dringende zuerst, sonst nach Häufigkeit.
  const rang = { sofort: 0, zeitnah: 1 };
  return [...zaehler.values()]
    .sort((a, b) => (rang[a.dringlichkeit] - rang[b.dringlichkeit]) || (b.anzahl - a.anzahl));
}

/*
 * ---------------------------------------------------------------------------
 * 2. Die Muster
 * ---------------------------------------------------------------------------
 *
 * Jedes Muster prüft ein paar Bedingungen an den eigenen Daten. Jede erfüllte
 * Bedingung bringt Punkte *und* einen Beleg im Klartext – ein Punktestand ohne
 * Begründung wäre ein Orakel. Angezeigt wird nur, was mindestens zwei Belege
 * hat: Ein einzelner Treffer ist noch kein Bild.
 */

const SAEURE_ARTEN = ['brennen', 'sodbrennen', 'aufstossen'];
const FUELLE_ARTEN = ['druck', 'uebelkeit', 'appetit'];
const DARM_ARTEN = ['blaehung', 'krampf'];

const pz = (x) => `${Math.round(x * 100)} %`;

function musterSaeure(d) {
  const belege = [];
  let punkte = 0;
  const a = artAnteil(d.eintraege, SAEURE_ARTEN);
  if (a.gesamt >= 5 && a.anteil >= 0.5) {
    punkte += 2;
    belege.push(`In ${a.anzahl} von ${a.gesamt} Eintragungen ging es um Brennen, `
      + `Sodbrennen oder Aufstoßen (${pz(a.anteil)}).`);
  }
  const nacht = d.zeiten.find((z) => z.id === 'nacht');
  const abend = d.zeiten.find((z) => z.id === 'abend');
  const spaet = (nacht ? nacht.anzahl : 0) + (abend ? abend.anzahl : 0);
  const gesamtZeiten = d.zeiten.reduce((s, z) => s + z.anzahl, 0);
  if (gesamtZeiten >= 5 && spaet / gesamtZeiten >= 0.4) {
    punkte += 1;
    belege.push(`${spaet} von ${gesamtZeiten} Beschwerden traten abends oder nachts auf.`);
  }
  const spaetEssen = d.bilanz.find((b) => b.id === 'spaet');
  if (spaetEssen && spaetEssen.genug && spaetEssen.differenz >= 1) {
    punkte += 1;
    belege.push('Nach spätem Essen war es im Mittel deutlich schlechter als sonst.');
  }
  return { punkte, belege };
}

function musterFuelle(d) {
  const belege = [];
  let punkte = 0;
  const a = artAnteil(d.eintraege, FUELLE_ARTEN);
  if (a.gesamt >= 5 && a.anteil >= 0.5) {
    punkte += 2;
    belege.push(`In ${a.anzahl} von ${a.gesamt} Eintragungen ging es um Völlegefühl, `
      + `Übelkeit oder fehlenden Appetit (${pz(a.anteil)}).`);
  }
  if (d.essen.bewertbar >= 8 && d.essen.anteilNachDemEssen >= 0.6) {
    punkte += 2;
    belege.push(`${d.essen.nachDemEssen} von ${d.essen.bewertbar} zuordenbaren `
      + `Beschwerden kamen innerhalb von zwei Stunden nach dem Essen.`);
  }
  const gross = d.bilanz.find((b) => b.id === 'gross');
  if (gross && gross.genug && gross.differenz >= 1) {
    punkte += 1;
    belege.push('Nach großen Portionen war es im Mittel schlechter als nach kleinen.');
  }
  return { punkte, belege };
}

function musterNuechtern(d) {
  const belege = [];
  let punkte = 0;
  if (d.essen.bewertbar >= 8 && d.essen.anteilNuechtern >= 0.5) {
    // Höher gewichtet als die anderen Muster, und das mit Absicht: „Brennen"
    // haben fast alle, aber *wann* es kommt, ist die spezifische Angabe. Sie
    // trennt den Nüchternschmerz vom Völlegefühl nach dem Essen – und das sind
    // zwei verschiedene Sprechstunden.
    punkte += 4;
    belege.push(`${d.essen.nuechtern} von ${d.essen.bewertbar} zuordenbaren `
      + `Beschwerden kamen erst vier Stunden oder länger nach der letzten Mahlzeit.`);
    // Die Gegenprobe gehört dazu: Dass es *nicht* nach dem Essen kommt, ist
    // hier der halbe Befund, und ohne ihn stünde die Aussage auf einem Bein.
    punkte += 1;
    belege.push(`Nur ${d.essen.nachDemEssen} davon kamen innerhalb von zwei `
      + `Stunden nach einer Mahlzeit.`);
  }
  const nacht = d.zeiten.find((z) => z.id === 'nacht');
  if (nacht && nacht.anzahl >= 3) {
    punkte += 1;
    belege.push(`${nacht.anzahl}-mal traten Beschwerden nachts auf.`);
  }
  return { punkte, belege };
}

function musterDarm(d) {
  const belege = [];
  let punkte = 0;
  const a = artAnteil(d.eintraege, DARM_ARTEN);
  if (a.gesamt >= 5 && a.anteil >= 0.4) {
    punkte += 2;
    belege.push(`In ${a.anzahl} von ${a.gesamt} Eintragungen ging es um Blähungen `
      + `oder Krämpfe (${pz(a.anteil)}).`);
  }
  ['huelsen', 'milch', 'rohkost', 'vollkorn'].forEach((id) => {
    const b = d.bilanz.find((x) => x.id === id);
    if (b && b.genug && b.differenz >= 1) {
      punkte += 1;
      belege.push(`Auffällig nach Mahlzeiten mit ${d.name(id)} `
        + `(${b.faelle} Mahlzeiten damit, ${b.gegenFaelle} ohne).`);
    }
  });
  return { punkte, belege };
}

function musterNsar(d) {
  const belege = [];
  let punkte = 0;
  if (d.nsarTage >= 3) {
    punkte += 3;
    belege.push(`An ${d.nsarTage} Tagen wurde ein entzündungshemmendes `
      + `Schmerzmittel eingetragen (Ibuprofen, Diclofenac, ASS oder ähnlich).`);
    if (d.nsarSchnitt > d.schnittGesamt + 0.5) {
      punkte += 1;
      belege.push(`An diesen Tagen lag die Beschwerdestärke bei `
        + `${d.nsarSchnitt.toFixed(1).replace('.', ',')} statt `
        + `${d.schnittGesamt.toFixed(1).replace('.', ',')}.`);
    }
  }
  return { punkte, belege };
}

function musterStress(d) {
  const belege = [];
  let punkte = 0;
  [['stress', 'Anspannung'], ['schlaf', 'schlechtem Schlaf'], ['stimmung', 'gedrückter Stimmung']]
    .forEach(([id, wort]) => {
      const f = d.faktoren[id];
      if (f && f.genug && f.differenz >= 1) {
        punkte += 2;
        belege.push(`An Tagen mit ${wort} lag die Beschwerdestärke bei `
          + `${f.hoch.schnitt.toFixed(1).replace('.', ',')} statt `
          + `${f.niedrig.schnitt.toFixed(1).replace('.', ',')} `
          + `(${f.hoch.tage} gegen ${f.niedrig.tage} Tage).`);
      }
    });
  return { punkte, belege };
}

function musterZyklus(d) {
  const belege = [];
  let punkte = 0;
  if (!d.zyklusBelastbar || d.phasen.length < 2) return { punkte, belege };
  const sortiert = [...d.phasen].sort((a, b) => b.schnitt - a.schnitt);
  const hoch = sortiert[0];
  const tief = sortiert[sortiert.length - 1];
  if (hoch.schnitt - tief.schnitt >= 1.5 && hoch.tage >= 4 && tief.tage >= 4) {
    punkte += 3;
    belege.push(`In der Phase „${hoch.name}" lag die Beschwerdestärke bei `
      + `${hoch.schnitt.toFixed(1).replace('.', ',')} (${hoch.tage} Tage), `
      + `in der Phase „${tief.name}" bei ${tief.schnitt.toFixed(1).replace('.', ',')} `
      + `(${tief.tage} Tage).`);
  }
  return { punkte, belege };
}

/*
 * Das Muster, wegen dem dieses Modul überhaupt nach dem Unterleib fragt.
 *
 * Endometriose wird im Mittel sieben bis zehn Jahre lang nicht erkannt, und
 * die häufigste Fehldeutung auf diesem Weg heißt „Reizdarm" – dieselben
 * Blähungen, Krämpfe und Stuhlveränderungen, nur mit anderer Ursache. Was die
 * beiden trennt, steht in Daten, die eine Magensprechstunde nicht erhebt.
 *
 * Deshalb wiegt der tiefe Schmerz beim Sex hier doppelt: Er ist das Merkmal
 * mit der größten Aussagekraft und zugleich das, nach dem am seltensten
 * gefragt wird.
 */
function musterUnterleib(d) {
  const belege = [];
  let punkte = 0;
  const u = d.unterleib;
  // Ohne die eigens dafür eingeschalteten Fragen gibt es hier nichts zu sagen,
  // was das Zyklusmuster nicht schon sagt.
  if (!u || !u.neueFragen || !u.ansprechen) return { punkte, belege };

  u.merkmale.filter((m) => m.erfuellt).forEach((m) => {
    punkte += m.gewicht;
    belege.push(`${m.name}: ${m.text}.`);
  });

  const offen = u.merkmale.filter((m) => !m.pruefbar);
  if (offen.length) {
    belege.push(`Nicht prüfbar: ${offen.map((m) => m.name.toLowerCase()).join(', ')} `
      + `– das kann dafür sprechen oder dagegen, es ist schlicht offen.`);
  }
  return { punkte, belege };
}

/**
 * Das ganze Bild.
 *
 * @param {{eintraege, tage, fenster, mindestFaelle, bilanz, nsarNamen}} d
 *   `bilanz` ist das Ergebnis von ausloeserBilanz(), `nsarNamen` die Prüfung,
 *   ob ein eingetragenes Mittel ein NSAR ist – beides kommt von außen herein,
 *   damit diese Datei nichts doppelt rechnet und nichts über die Anzeige weiß.
 */
function bildLesen(d) {
  const eintraege = d.eintraege || [];
  const tage = d.tage || {};

  const tageMitBeschwerden = [...new Set(eintraege
    .filter((e) => e.art === 'beschwerde').map((e) => e.am))];
  const alleNotiert = [...new Set([...eintraege.map((e) => e.am), ...Object.keys(tage)])]
    .filter((iso) => tagesWert(eintraege, iso, tage).notiert);
  const schnittGesamt = alleNotiert.length
    ? alleNotiert.reduce((s, iso) => s + tagesWert(eintraege, iso, tage).wert, 0) / alleNotiert.length
    : 0;

  const nsarTageListe = [...new Set(eintraege
    .filter((e) => e.art === 'medikament' && d.istNsar(e.mittel))
    .map((e) => e.am))];
  const nsarSchnitt = nsarTageListe.length
    ? nsarTageListe.reduce((s, iso) => s + tagesWert(eintraege, iso, tage).wert, 0) / nsarTageListe.length
    : 0;

  const daten = {
    eintraege,
    tage,
    bilanz: d.bilanz || [],
    name: d.name || ((id) => id),
    zeiten: nachTageszeit(eintraege),
    essen: essensbezug(eintraege),
    faktoren: Object.fromEntries(['stress', 'schlaf', 'stimmung']
      .map((id) => [id, faktorBilanz(eintraege, tage, id, tagesWert)])),
    phasen: phasenBilanz(eintraege, tage, tagesWert),
    zyklusBelastbar: belastbar(tage),
    nsarTage: nsarTageListe.length,
    nsarSchnitt,
    schnittGesamt,
    unterleib: unterleibsBild(eintraege, tage, tagesWert),
  };

  const muster = MUSTER
    .map((m) => ({ ...m, ...m.pruefe(daten) }))
    // Zwei Belege sind die Untergrenze. Ein einzelner Treffer ist ein Zufall,
    // und ein Zufall, der als „Bild" ausgegeben wird, führt jemanden in die
    // falsche Sprechstunde.
    .filter((m) => m.belege.length >= 2)
    .sort((a, b) => b.punkte - a.punkte);

  return {
    warnungen: warnungen(eintraege),
    muster,
    // Woran das alles hängt – steht in der Anzeige daneben, damit sichtbar ist,
    // wie dünn oder dick die Grundlage ist.
    basis: {
      beschwerden: eintraege.filter((e) => e.art === 'beschwerde').length,
      tageMitBeschwerden: tageMitBeschwerden.length,
      notierteTage: alleNotiert.length,
      zuordenbar: daten.essen.bewertbar,
    },
    fragen: [...new Set(muster.flatMap((m) => m.fragen))].slice(0, 6),
  };
}

/** Reicht die Grundlage, damit die Einordnung überhaupt etwas bedeutet? */
function genugFuerBild(basis) {
  return basis.notierteTage >= 10 && basis.beschwerden >= 5;
}

/* ===== js/rat.js ===== */
/*
 * Vorschläge für heute – hergeleitet, nicht ausgedacht.
 *
 * Jeder Vorschlag trägt ein `warum`, und das ist keine Höflichkeit: Ein Rat
 * ohne Begründung ist ein Befehl, und Befehle über das eigene Essen befolgt man
 * entweder blind oder gar nicht. Beides ist schlecht. Steht daneben „weil es
 * nach deinen letzten 14 Mahlzeiten mit Kaffee im Mittel schlechter war",
 * kann man widersprechen – und genau das soll möglich sein.
 *
 * Zwei Quellen, sauber getrennt und in der Anzeige unterscheidbar:
 *
 *   'eigen'      Kommt aus ihren eigenen Eintragungen. Belastbar, soweit die
 *                Fallzahl reicht, und die steht dabei.
 *   'allgemein'  Kommt aus dem, was bei Magenbeschwerden üblicherweise
 *                empfohlen wird. Gilt für einen Durchschnitt, den es nicht
 *                gibt – deshalb immer nachrangig hinter dem eigenen Verlauf.
 *
 * WAS HIER NICHT VORKOMMT: welches Medikament sie nehmen soll. Diese Wahl
 * hängt an Diagnose, anderen Medikamenten, Nieren, Leber, Schwangerschaft –
 * nichts davon weiß diese App, und keines davon kann sie erfragen, ohne so zu
 * tun, als wüsste sie es dann. Was stattdessen kommt: was sie selbst
 * eingenommen hat, wann zuletzt, und die Frage dazu für den nächsten Termin.
 */



/**
 * Was bei gereiztem Magen üblicherweise gut vertragen wird.
 *
 * Bewusst kurz und bewusst langweilig. Das ist keine Diät und keine
 * Empfehlung auf Dauer – wer wochenlang nur das isst, isst zu einseitig.
 * Gedacht für die zwei, drei Tage, an denen ohnehin nichts anderes geht.
 */
const SCHONKOST = [
  'Haferbrei mit Wasser', 'Kartoffeln, gestampft', 'gedünstete Karotte oder Zucchini',
  'Reis', 'Banane', 'mageres Geflügel oder Fisch', 'Zwieback',
  'Kamillen- oder Fencheltee', 'stilles Wasser',
];

const rat = (id, bereich, titel, text, warum, quelle) => ({
  id, bereich, titel, text, warum, quelle,
});

/**
 * @param {object} d
 *   eintraege, tage, heute (ISO), bilanz (aus ausloeserBilanz),
 *   faktoren ({stress, schlaf, stimmung} aus faktorBilanz),
 *   phasen (aus phasenBilanz), eigene (eigene Auslöser),
 *   letzteMahlzeitStunden (Zahl oder null), mittel (zuletzt eingenommene)
 */
function raete(d) {
  const raus = [];
  const heuteWert = tagesWert(d.eintraege, d.heute, d.tage).wert;
  const heuteTag = d.tage[d.heute] || {};
  const akut = heuteWert >= 6;
  const leicht = heuteWert > 0 && heuteWert < 6;

  /* ---------- Essen ---------- */

  // Was ihr eigener Verlauf hergibt, steht vor allem Allgemeinen.
  const auffaellig = (d.bilanz || [])
    .filter((b) => b.genug && ['auffaellig', 'moeglich'].includes(einstufung(b)))
    .filter((b) => !['gross', 'spaet'].includes(b.id))
    .slice(0, 3);

  if (auffaellig.length) {
    const namen = auffaellig.map((b) => ausloeserName(b.id, d.eigene)).join(', ');
    raus.push(rat('essen-eigen', 'essen',
      `Heute eher ohne ${namen}`,
      'Nicht für immer streichen – nur an Tagen wie diesem einmal weglassen und '
      + 'schauen, ob es einen Unterschied macht. Ein Auslöser, der sich in zwei '
      + 'Wochen ohne ihn nicht bestätigt, war keiner.',
      auffaellig.map((b) => `${ausloeserName(b.id, d.eigene)}: danach im Mittel `
        + `${b.schnittMit.toFixed(1).replace('.', ',')} statt `
        + `${b.schnittOhne.toFixed(1).replace('.', ',')} `
        + `(${b.faelle} Mahlzeiten damit, ${b.gegenFaelle} ohne)`).join(' · '),
      'eigen'));
  }

  if (akut) {
    raus.push(rat('essen-schon', 'essen',
      'Heute klein und mild',
      `Mehrere kleine Portionen statt zwei großen, und dabei bleiben bei: `
      + `${SCHONKOST.slice(0, 6).join(', ')}.`,
      `Der heutige Wert liegt bei ${heuteWert} von 10.`,
      'allgemein'));
  }

  const spaet = (d.bilanz || []).find((b) => b.id === 'spaet');
  if (spaet && spaet.genug && spaet.differenz >= 1) {
    raus.push(rat('essen-spaet', 'essen',
      'Die letzte Mahlzeit früher legen',
      'Zwischen dem letzten Essen und dem Hinlegen etwa drei Stunden – im Liegen '
      + 'hat der Magen keine Schwerkraft mehr auf seiner Seite.',
      `Nach Mahlzeiten nach 20 Uhr lag der Wert bei `
      + `${spaet.schnittMit.toFixed(1).replace('.', ',')} statt `
      + `${spaet.schnittOhne.toFixed(1).replace('.', ',')} (${spaet.faelle} Fälle).`,
      'eigen'));
  }

  const gross = (d.bilanz || []).find((b) => b.id === 'gross');
  if (gross && gross.genug && gross.differenz >= 1) {
    raus.push(rat('essen-portion', 'essen',
      'Lieber öfter und kleiner',
      'Fünf kleine Mahlzeiten belasten weniger als drei große – der Magen muss '
      + 'dann nie viel auf einmal bewegen.',
      `Nach großen Portionen lag der Wert bei `
      + `${gross.schnittMit.toFixed(1).replace('.', ',')} statt `
      + `${gross.schnittOhne.toFixed(1).replace('.', ',')} (${gross.faelle} Fälle).`,
      'eigen'));
  }

  /* ---------- Entspannung ---------- */

  const stress = d.faktoren && d.faktoren.stress;
  const heuteAngespannt = Number(heuteTag.stress) >= 3;
  const schlechtGeschlafen = Number(heuteTag.schlaf) >= 3;

  if (stress && stress.genug && stress.differenz >= 1) {
    raus.push(rat('ruhe-eigen', 'ruhe',
      heuteAngespannt ? 'Heute wäre eine Atemrunde dran' : 'Anspannung ist bei dir ein Faktor',
      'Bei dir hängen Anspannung und Beschwerden messbar zusammen. Langes '
      + 'Ausatmen schaltet auf den Teil des Nervensystems um, unter dem der Darm '
      + 'arbeitet – unter „Ruhe" liegt 4–7–8, gut zwei Minuten.',
      `An angespannten Tagen ${stress.hoch.schnitt.toFixed(1).replace('.', ',')} `
      + `statt ${stress.niedrig.schnitt.toFixed(1).replace('.', ',')} `
      + `(${stress.hoch.tage} gegen ${stress.niedrig.tage} Tage).`,
      'eigen'));
  } else if (heuteAngespannt || akut) {
    raus.push(rat('ruhe-heute', 'ruhe',
      'Zwei Minuten Atmen',
      'Unter „Ruhe": 4–7–8 zum Runterkommen, Gleichmaß fürs Sitzen zwischendurch. '
      + 'Mit Ton, damit die Augen zubleiben können.',
      heuteAngespannt ? 'Du hast heute viel Anspannung eingetragen.'
        : `Der heutige Wert liegt bei ${heuteWert} von 10.`,
      'allgemein'));
  }

  if (schlechtGeschlafen) {
    raus.push(rat('ruhe-schlaf', 'ruhe',
      'Heute Abend 4–7–8 vor dem Schlafen',
      'Die Übung ist ursprünglich fürs Einschlafen gedacht. Vier Runden im Bett, '
      + 'Licht schon aus.',
      'Du hast für heute schlechten Schlaf eingetragen.',
      'allgemein'));
  }

  /* ---------- Sport ---------- */

  raus.push(sportRat(d, { heuteWert, akut, leicht, heuteTag, heuteAngespannt }));

  /* ---------- Medikamente: kein Rat, sondern der Stand ---------- */

  if (d.mittel && d.mittel.length) {
    raus.push(rat('mittel', 'mittel',
      'Was du nimmst',
      d.mittel.map((m) => `${m.name} – zuletzt ${m.zuletzt}`).join(' · ')
      + '. Was die Mittel bewirken, steht unter „Mehr".',
      'Diese App schlägt bewusst kein Medikament vor: Das hängt an Diagnose, '
      + 'anderen Mitteln und Vorerkrankungen, und nichts davon weiß sie. Nimm '
      + 'die Liste mit zum Termin.',
      'allgemein'));
  }

  return raus.filter(Boolean);
}

/**
 * Intensiv oder moderat?
 *
 * Bewegung hilft bei fast allem hier – aber nicht jede Bewegung zu jeder
 * Stunde. Zwei Regeln sind unstrittig genug, um sie hinzuschreiben: nicht
 * intensiv direkt nach dem Essen (im Liegen und Springen kommt hoch, was
 * unten bleiben soll), und nicht intensiv, während es akut weh tut. Alles
 * andere kommt aus ihrem eigenen Verlauf.
 */
function sportRat(d, k) {
  const seitEssen = d.letzteMahlzeitStunden;
  const frischGegessen = seitEssen !== null && seitEssen < 2;
  const phase = phaseVon(d.tage, d.heute);
  const phasenSchlecht = phase && (d.phasen || [])
    .some((p) => p.phase === phase && p.schnitt >= 4 && p.tage >= 4);

  if (k.akut) {
    return rat('sport', 'sport', 'Heute nur spazieren',
      'Bei einem Wert wie heute bringt intensives Training nichts und kann die '
      + 'Beschwerden verstärken. Zwanzig Minuten gehen hilft der Verdauung '
      + 'trotzdem.',
      `Der heutige Wert liegt bei ${k.heuteWert} von 10.`, 'allgemein');
  }
  if (frischGegessen) {
    return rat('sport', 'sport', 'Erst in zwei Stunden intensiv',
      'Jetzt passt ein Spaziergang. Intensives Training kurz nach dem Essen '
      + 'drückt auf den vollen Magen – danach spricht nichts dagegen.',
      `Die letzte Mahlzeit ist ${Math.round(seitEssen * 10) / 10} Stunden her.`,
      'allgemein');
  }
  if (phasenSchlecht) {
    return rat('sport', 'sport', 'Heute eher moderat',
      'Ausdauer in ruhigem Tempo, 30 bis 45 Minuten. In dieser Zyklusphase war '
      + 'es bei dir bisher schwerer – das heißt nicht „gar nichts", sondern '
      + '„nicht auf Zeit".',
      `In der Phase „${phasenName(phase)}" lagen deine Werte höher als sonst.`,
      'eigen');
  }
  if (k.heuteAngespannt) {
    return rat('sport', 'sport', 'Moderate Ausdauer wäre heute richtig',
      'Laufen, Rad, zügiges Gehen in einem Tempo, bei dem Reden noch geht – das '
      + 'baut Anspannung ab, ohne neuen Stress zu machen. Intensive Intervalle '
      + 'tun an einem angespannten Tag das Gegenteil.',
      'Du hast heute viel Anspannung eingetragen.', 'allgemein');
  }
  if (k.leicht) {
    return rat('sport', 'sport', 'Moderat spricht nichts dagegen',
      'Bei leichten Beschwerden ist Bewegung eher hilfreich als schädlich. '
      + 'Intensiv würde ich heute noch nicht ansetzen.',
      `Der heutige Wert liegt bei ${k.heuteWert} von 10.`, 'allgemein');
  }
  return rat('sport', 'sport', 'Heute geht auch intensiv',
    'Beschwerdefrei und ausgeruht: Wenn du intensiv trainieren willst, ist heute '
    + 'der Tag dafür. Danach mindestens eine Stunde, bevor du dich hinlegst.',
    k.heuteWert === 0 ? 'Heute ist bisher nichts an Beschwerden eingetragen.'
      : 'Keine Beschwerden und keine hohe Anspannung für heute eingetragen.',
    'allgemein');
}
