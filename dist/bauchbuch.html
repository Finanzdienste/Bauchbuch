/** Den Stand von vor dem letzten Einlesen zurückholen. */

/** Zwei Listen vereinigen; bei gleicher Kennung bleibt der erste Teil. */

  const schon = new Set(hier.map(kennung));
  return [...hier, ...dazu.filter((x) => !schon.has(kennung(x)))];

 * Zurück kommt { anzahl, vorher, zusammengefuehrt }: wie viele Einträge

  zustand = leer ? dazu : zusammenfuehren(zustand, dazu);
  merke();
  melde();
  return { anzahl: zustand.eintraege.length, vorher, zusammengefuehrt: !leer };

/* ===== js/zufall.js ===== */
/*
 * Der Zufallsspielraum – wie groß ein Unterschied allein durch Zufall ausfällt
 *
 * DAS PROBLEM, DAS MIT JEDER NEUEN AUSWERTUNG GRÖSSER WURDE
 *
 * Die App vergleicht inzwischen viel: zwei Dutzend Auslöser, dazu Klassen,
 * dazu drei Zeitfenster, dazu Schichten und Zyklusphasen. Jeder einzelne
 * Vergleich ist sauber gerechnet. Nur wächst mit ihrer Zahl etwas, das kein
 * einzelner Vergleich sehen kann: Bei fünfzig Vergleichen ist ein „auffälliger"
 * Unterschied kein Ausreißer mehr, sondern die Regel. Man findet immer etwas –
 * auch in einem Tagebuch, in dem nichts drinsteckt.
 *
 * Und ein Zufallstreffer ist hier nicht folgenlos. Er führt dazu, dass jemand
 * ein Lebensmittel streicht, das ihm nichts tut; dass er einseitiger isst;
 * dass er der App beim nächsten, echten Fund weniger glaubt.
 *
 * WAS EINE MITTLERE DIFFERENZ NICHT SAGT
 *
 * „Nach Kaffee war es im Mittel 2 Stufen schlechter" klingt nach einer
 * Aussage. Sie ist aber nur so viel wert, wie die Werte darunter beieinander
 * liegen. Zwanzig Mahlzeiten, deren Werte zwischen 0 und 10 springen, bringen
 * zwei Stufen Unterschied mühelos aus reinem Zufall hervor. Zwanzig
 * Mahlzeiten, die alle zwischen 3 und 5 liegen, tun das nicht.
 *
 * Genau das rechnet diese Datei: Wie groß darf ein Unterschied sein, damit man
 * ihn noch dem Zufall zuschreiben würde? Und weil die Zahl der Vergleiche
 * mitzählt, geht sie mit ein – wer fünfzigmal fragt, braucht eine deutlichere
 * Antwort als wer dreimal fragt.
 *
 * WAS DAS NICHT IST
 *
 * Kein Signifikanztest, und es steht nirgends ein p-Wert. Das hier ist ein
 * Tagebuch eines einzigen Menschen, ohne Randomisierung und ohne Verblindung;
 * ein p-Wert würde eine Strenge vortäuschen, die die Daten nicht hergeben. Was
 * hier steht, ist eine Faustregel in der Währung der App selbst: in Stufen.
 */

/**
 * Wie streng, bei wie vielen Vergleichen?
 *
 * Der Gedanke ist der von Bonferroni, nur ohne dessen Formel: Je mehr Fragen
 * gestellt werden, desto deutlicher muss die Antwort ausfallen. Drei Stufen
 * statt einer feinen Kurve, weil die Kurve eine Genauigkeit vorspiegelte, die
 * hier niemand hat.
 */
function strenge(vergleiche) {
  if (vergleiche <= 8) return 2;
  if (vergleiche <= 25) return 2.5;
  return 3;
}

const summe = (l) => l.reduce((s, x) => s + x, 0);

/**
 * Der Spielraum des Zufalls für einen Vergleich.
 *
 * @param {number[]} mit        die Werte der einen Seite
 * @param {number[]} ohne       die der anderen
 * @param {number} vergleiche   wie viele Vergleiche insgesamt angestellt werden
 * @returns {{streuung:number, se:number, spielraum:number}}
 *   `spielraum` ist der Unterschied, unter dem nichts behauptet wird.
 */
function zufallsSpielraum(mit, ohne, vergleiche = 1) {
  const n1 = mit.length;
  const n2 = ohne.length;
  if (n1 < 2 || n2 < 2) return { streuung: 0, se: 0, spielraum: Infinity };

  const m1 = summe(mit) / n1;
  const m2 = summe(ohne) / n2;
  /*
   * Gemeinsame Streuung beider Seiten.
   *
   * Gemeinsam und nicht je Seite: Die Frage ist, wie stark die Werte dieses
   * Menschen überhaupt schwanken – und die Antwort darauf ändert sich nicht
   * dadurch, in welche Gruppe eine Mahlzeit fällt.
   */
  const quadrate = summe(mit.map((x) => (x - m1) ** 2)) + summe(ohne.map((x) => (x - m2) ** 2));
  const varianz = quadrate / (n1 + n2 - 2);
  const streuung = Math.sqrt(varianz);
  const se = Math.sqrt(varianz * (1 / n1 + 1 / n2));

  return { streuung, se, spielraum: strenge(vergleiche) * se };
}

/**
 * Der Spielraum für einen Unterschied *zwischen zwei Unterschieden*.
 *
 * Das ist die Rechnung, die in der App am leichtesten danebengeht, und sie ist
 * mit Abstand die anfälligste. „Wirkt Kaffee in der zweiten Zyklushälfte
 * anders als in der ersten?" vergleicht nicht zwei Mittelwerte, sondern zwei
 * Differenzen – und eine Differenz von Differenzen schwankt um den Faktor
 * Wurzel zwei stärker als jede einzelne davon, bei obendrein kleineren
 * Gruppen.
 *
 * Ohne diese Schranke fand die Zyklusrechnung in einem rein zufälligen
 * Tagebuch neun „wechselnde" Auslöser. Neun von zwanzig, aus nichts.
 */
function abstandSpielraum(seA, seB, vergleiche = 1, gruppen = 2) {
  if (!Number.isFinite(seA) || !Number.isFinite(seB)) return Infinity;
  return strenge(vergleiche) * gesucht(gruppen) * Math.sqrt(seA ** 2 + seB ** 2);
}

/**
 * Aufschlag dafür, dass aus mehreren Gruppen die größte und die kleinste
 * herausgesucht wurden.
 *
 * Wer aus vier Zyklusphasen die stärkste und die schwächste nimmt, hat schon
 * gesucht, bevor er verglichen hat – und der Abstand zwischen dem größten und
 * dem kleinsten von vier Zufallswerten ist im Mittel deutlich größer als der
 * zwischen zwei beliebigen. Ohne diesen Aufschlag ist die Schranke für vier
 * Gruppen effektiv niedriger als für zwei, obwohl sie höher sein müsste.
 */
function gesucht(gruppen) {
  if (gruppen <= 2) return 1;
  if (gruppen === 3) return 1.25;
  return 1.4;
}

/**
 * Ein Satz dazu, in Worten und ohne Statistikvokabular.
 *
 * Er steht in der App neben den Funden, weil die Zahl sonst wie eine weitere
 * Schwelle aussähe, die sich jemand ausgedacht hat.
 */
function spielraumSatz(spielraum, vergleiche) {
  if (!Number.isFinite(spielraum)) return '';
  return `Bei ${vergleiche} verglichenen Merkmalen kommt ein Unterschied von `
    + `etwa ${spielraum.toFixed(1)} Stufen auch dann vor, wenn gar nichts `
    + 'dahintersteckt – wer oft genug fragt, findet immer etwas. Erst darüber '
    + 'steht hier ein Urteil.';
}

/* ===== js/auswertung.js ===== */
/*
 * Die Rechenschicht: aus Eintragungen Muster machen.
 *
 * Reine Funktionen, keine Anzeige, kein Speicherzugriff – alles kommt als
 * Argument herein. Das ist nicht Ordnungsliebe: Diese Datei ist der einzige
 * Ort, an dem die App etwas *behauptet*, und Behauptungen über den eigenen
 * Körper muss man einzeln nachrechnen können. Genau das tut tests/rechnen.mjs.
 *
 * Die Grundfrage lautet immer gleich: Geht es nach Mahlzeiten mit einem
 * bestimmten Merkmal schlechter als nach Mahlzeiten ohne? Verglichen wird
 * also nicht gegen Null, sondern gegen den eigenen Alltag. Ohne diesen
 * Vergleich fände man bei jedem Menschen mit täglichen Beschwerden jedes
 * Lebensmittel „auffällig", das er täglich isst.
 *
 * Drei Regeln, die verhindern, dass daraus Kaffeesatzleserei wird:
 *
 *   1. Mindestens `mindestFaelle` Mahlzeiten *mit* dem Merkmal und ebenso
 *      viele *ohne*. Aus drei Fällen wird hier keine Aussage.
 *   2. Die Fallzahl steht immer daneben, auch wenn sie unbequem ist.
 *   3. Es heißt „auffällig", nicht „verursacht". Was hier herauskommt, ist
 *      ein Anhaltspunkt fürs Gespräch beim Arzt, keine Diagnose.
 */



/** Späte Mahlzeit ab dieser Stunde – siehe UMSTAENDE in js/daten.js. */
const SPAET_AB = 20;

/**
 * Die Zutaten einer Mahlzeit als [{ id, rolle }].
 *
 * Seit die Rolle dazugehört, stehen sie unter `zutaten`. Vorher war es eine
 * bloße Liste von IDs unter `tags`. Der Speicher rechnet alte Stände beim
 * Laden um (siehe mahlzeitFrisch in js/store.js) – die Zeile hier ist der
 * zweite Riegel, für alles, was an dieser Umrechnung vorbeikommt: eine
 * Sicherung aus einer älteren Fassung, ein von Hand gesetzter Zustand, ein
 * Test, der die Rechenschicht direkt aufruft.
 */
function zutatenVon(eintrag) {
  if (Array.isArray(eintrag.zutaten)) {
    return eintrag.zutaten
      .filter((z) => z && typeof z.id === 'string')
      .map((z) => ({ id: z.id, rolle: z.rolle || ROLLE_VORGABE }));
  }
  if (Array.isArray(eintrag.tags)) {
    return eintrag.tags.map((id) => ({ id, rolle: ROLLE_VORGABE }));
  }
  return [];
}

/**
 * Alle Merkmale einer Mahlzeit: die Zutaten plus die beiden Umstände, die
 * sich aus Portion und Uhrzeit von selbst ergeben.
 *
 * Die Rolle spielt hier bewusst *keine* Rolle: Für die Frage „war es drin?"
 * zählt jede Zutat gleich. Was die Rolle unterscheidet, steht getrennt in
 * rollenBilanz() – und zwar mit Fallzahlen, statt still eine Gewichtung in
 * die Hauptzahl zu rechnen, die niemand nachvollziehen könnte.
 */
function merkmale(eintrag) {
  if (eintrag.art !== 'essen') return [];
  const raus = zutatenVon(eintrag).map((z) => z.id);
  if (eintrag.portion === 'gross') raus.push('gross');
  const std = Number(String(eintrag.um || '').split(':')[0]);
  if (Number.isFinite(std) && std >= SPAET_AB) raus.push('spaet');
  return [...new Set(raus)];
}

/**
 * Die Beschwerden, die einer Mahlzeit im Zeitfenster folgen.
 *
 * `> 0` und nicht `>= 0`: Eine Beschwerde, die zur selben Minute eingetragen
 * ist wie die Mahlzeit, war schon da. Sie der Mahlzeit zuzurechnen hieße, die
 * Ursache nach der Wirkung zu suchen.
 */
function folgende(eintraege, mahlzeit, fensterStunden) {
  const t0 = zeitpunkt(mahlzeit.am, mahlzeit.um);
  return eintraege.filter((e) => {
    if (e.art !== 'beschwerde') return false;
    const abstand = stundenDazwischen(t0, zeitpunkt(e.am, e.um));
    return abstand > 0 && abstand <= fensterStunden;
  });
}

/** Die stärkste Beschwerde im Fenster, oder 0, wenn keine kam. */
function wertNach(eintraege, mahlzeit, fensterStunden) {
  const nach = folgende(eintraege, mahlzeit, fensterStunden);
  return nach.reduce((m, e) => Math.max(m, Number(e.staerke) || 0), 0);
}

/**
 * Die Bilanz je Auslöser.
 *
 * Ein Auslöser taucht nur auf, wenn er überhaupt vorkommt. Ob genug Fälle
 * beisammen sind, sagt `genug` – die Zeile wird trotzdem geliefert, denn „noch
 * 2 Mahlzeiten, dann kann ich etwas dazu sagen" ist eine nützliche Auskunft.
 *
 * @param {object[]} eintraege  alle Eintragungen
 * @param {{fenster: number, mindestFaelle: number, eigene: object[]}} opt
 */
/**
 * Jede Mahlzeit mit ihren Merkmalen und dem, was danach kam.
 *
 * Einmal gerechnet und dann herumgereicht: Bei einem Jahr Tagebuch und zwei
 * Dutzend Auslösern wäre das je Auslöser neu das Quadrat der Arbeit. Seit die
 * Schichtung dazugekommen ist, braucht auch js/schichten.js genau diese Liste
 * – deshalb steht sie hier für sich und nicht mehr eingebacken in die Bilanz.
 *
 * `am` liegt bewusst obenauf: Die Schichtung schlägt damit den Tag nach, an
 * dem die Mahlzeit war, ohne den ganzen Eintrag auseinandernehmen zu müssen.
 */
function bewerteteMahlzeiten(eintraege, fenster = 4) {
  return eintraege.filter((e) => e.art === 'essen').map((m) => ({
    m,
    am: m.am,
    merkmale: new Set(merkmale(m)),
    wert: wertNach(eintraege, m, fenster),
  }));
}

function ausloeserBilanz(eintraege, opt = {}) {
  const fenster = opt.fenster || 4;
  const mindest = opt.mindestFaelle || 5;
  const bewertet = bewerteteMahlzeiten(eintraege, fenster);
  if (!bewertet.length) return [];

  const bekannt = new Set(ALLE_AUSLOESER.map((a) => a.id));
  (opt.eigene || []).forEach((a) => bekannt.add(a.id));
  // Auch Auslöser zählen, die nur in alten Eintragungen stehen – etwa ein
  // eigener, den jemand später aus der Auswahl entfernt hat.
  bewertet.forEach((b) => b.merkmale.forEach((id) => bekannt.add(id)));

  const zeilen = [];
  bekannt.forEach((id) => {
    const mit = bewertet.filter((b) => b.merkmale.has(id));
    if (!mit.length) return;
    const ohne = bewertet.filter((b) => !b.merkmale.has(id));
    const schnitt = (liste) => (liste.length
      ? liste.reduce((s, b) => s + b.wert, 0) / liste.length : 0);
    const quote = (liste) => (liste.length
      ? liste.filter((b) => b.wert > 0).length / liste.length : 0);
    const schnittMit = schnitt(mit);
    const schnittOhne = schnitt(ohne);
    zeilen.push({
      id,
      faelle: mit.length,
      gegenFaelle: ohne.length,
      schnittMit,
      schnittOhne,
      differenz: schnittMit - schnittOhne,
      quoteMit: quote(mit),
      quoteOhne: quote(ohne),
      genug: mit.length >= mindest && ohne.length >= mindest,
      fehlt: Math.max(0, mindest - mit.length),
      zuletzt: mit[mit.length - 1].m.am,
      werte: { mit: mit.map((b) => b.wert), ohne: ohne.map((b) => b.wert) },
    });
  });

  /*
   * Und jetzt erst der Zufallsspielraum – denn erst hier steht fest, wie viele
   * Vergleiche überhaupt angestellt wurden.
   *
   * Das ist der Punkt, an dem die Zahl der Fragen in die Antwort eingeht: Wer
   * fünfzig Merkmale prüft, findet auch in einem Tagebuch, in dem nichts
   * drinsteckt, ein paar auffällige. Die Schwelle wächst deshalb mit der Zahl
   * der Vergleiche und mit der Streuung der Werte.
   */
  const vergleiche = zeilen.filter((z) => z.genug).length;
  zeilen.forEach((z) => {
    const r = zufallsSpielraum(z.werte.mit, z.werte.ohne, vergleiche);
    z.streuung = r.streuung;
    z.spielraum = r.spielraum;
    z.vergleiche = vergleiche;
    delete z.werte;
  });

  // Auffälligstes zuerst; bei gleicher Differenz die größere Fallzahl, weil
  // sie mehr wert ist.
  return zeilen.sort((a, b) => (b.differenz - a.differenz) || (b.faelle - a.faelle));
}

/**
 * Dieselbe Bilanz, aber nach Klassen statt nach einzelnen Zutaten.
 *
 * Der Grund ist die Fallzahl. „Zwiebel" kommt in einem halben Jahr vielleicht
 * zwölfmal vor – daraus wird nie eine belastbare Zahl, und die nächste Frage
 * („und Knoblauch? und Weizen?") fängt wieder bei null an. Die Klasse fasst
 * zusammen, was denselben Weg nimmt: Über alle FODMAP-reichen Mahlzeiten
 * kommen statt zwölf Fällen achtzig zusammen.
 *
 * Deshalb ist die Schwelle hier nicht dieselbe. Bei mehr Fällen fällt ein
 * kleinerer Unterschied auf, und ein halber Punkt über achtzig Mahlzeiten sagt
 * mehr als ein ganzer über zwölf. Gefordert werden trotzdem Fälle auf beiden
 * Seiten – wer *jede* Mahlzeit mit FODMAP isst, hat keine Vergleichsgruppe und
 * bekommt hier keine Zeile.
 *
 * Eine Zutat zählt für jede ihrer Klassen. Kaffee steht damit gleichzeitig bei
 * Koffein, Säure und Schließmuskel, und das ist richtig so: Er wirkt auf allen
 * drei Wegen, und welcher davon der entscheidende ist, sagt keine Statistik,
 * sondern der Auslassversuch.
 */
function klassenBilanz(eintraege, opt = {}) {
  const fenster = opt.fenster || 4;
  // Klassen brauchen mehr Fälle, weil sie mehr hergeben – und weil eine Klasse,
  // die in fast jeder Mahlzeit steckt, sonst mit acht Gegenfällen „auffällig"
  // hieße.
  const mindest = opt.mindestFaelle || 8;
  const mahlzeiten = eintraege.filter((e) => e.art === 'essen');
  if (!mahlzeiten.length) return [];

  const bewertet = mahlzeiten.map((m) => ({
    klassen: new Set(zutatenVon(m).flatMap((z) => klassenVon(z.id))),
    wert: wertNach(eintraege, m, fenster),
  }));

  const zeilen = [];
  KLASSEN.forEach((k) => {
    const mit = bewertet.filter((b) => b.klassen.has(k.id));
    if (!mit.length) return;
    const ohne = bewertet.filter((b) => !b.klassen.has(k.id));
    const schnitt = (liste) => (liste.length
      ? liste.reduce((s, b) => s + b.wert, 0) / liste.length : 0);
    const quote = (liste) => (liste.length
      ? liste.filter((b) => b.wert > 0).length / liste.length : 0);
    const schnittMit = schnitt(mit);
    const schnittOhne = schnitt(ohne);
    zeilen.push({
      id: k.id,
      name: k.name,
      kurz: k.kurz,
      was: k.was,
      faelle: mit.length,
      gegenFaelle: ohne.length,
      schnittMit,
      schnittOhne,
      differenz: schnittMit - schnittOhne,
      quoteMit: quote(mit),
      quoteOhne: quote(ohne),
      genug: mit.length >= mindest && ohne.length >= mindest,
      fehlt: Math.max(0, mindest - mit.length),
      fehltGegen: Math.max(0, mindest - ohne.length),
      werte: { mit: mit.map((b) => b.wert), ohne: ohne.map((b) => b.wert) },
    });
  });

  // Auch hier zählt die Zahl der Vergleiche mit – siehe ausloeserBilanz.
  const vergleiche = zeilen.filter((z) => z.genug).length;
  zeilen.forEach((z) => {
    const r = zufallsSpielraum(z.werte.mit, z.werte.ohne, vergleiche);
    z.streuung = r.streuung;
    z.spielraum = r.spielraum;
    z.vergleiche = vergleiche;
    delete z.werte;
  });

  return zeilen.sort((a, b) => (b.differenz - a.differenz) || (b.faelle - a.faelle));
}

/**
 * Welche Zutaten eine Klasse in *diesem* Tagebuch trägt.
 *
 * Ohne diese Aufschlüsselung wäre „FODMAP ist auffällig" eine Sackgasse: Man
 * kann FODMAP nicht weglassen, man kann Zwiebeln weglassen. Zurück kommt, was
 * tatsächlich gegessen wurde, das Häufigste zuerst.
 */
function klasseZutaten(eintraege, klasseId) {
  const zaehler = new Map();
  eintraege.filter((e) => e.art === 'essen').forEach((e) => {
    zutatenVon(e).forEach((z) => {
      if (klassenVon(z.id).includes(klasseId)) {
        zaehler.set(z.id, (zaehler.get(z.id) || 0) + 1);
      }
    });
  });
  return [...zaehler.entries()].map(([id, anzahl]) => ({ id, anzahl }))
    .sort((a, b) => b.anzahl - a.anzahl);
}

/**
 * Wie ein Ergebnis zu lesen ist. Eine halbe Stufe Unterschied ist Rauschen,
 * und es als Fund darzustellen wäre die eine Art, mit der so eine App
 * tatsächlich schaden kann: Wer daraufhin ein Lebensmittel streicht, isst
 * einseitiger, ohne dass es ihm besser geht.
 */
function einstufung(zeile) {
  if (!zeile.genug) return 'zuwenig';
  /*
   * Zwei Bedingungen, und beide muessen erfuellt sein.
   *
   * Die erste ist die alte: Der Unterschied muss gross genug sein, um jemanden
   * ueberhaupt zu interessieren – eine halbe Stufe merkt niemand. Die zweite
   * ist neu: Er muss groesser sein als das, was bei dieser Streuung und dieser
   * Zahl von Vergleichen ohnehin herauskommt. Ohne sie fand die App in jedem
   * ausreichend langen Tagebuch etwas, auch in einem, in dem nichts steckt.
   */
  const zufall = Number.isFinite(zeile.spielraum) ? zeile.spielraum : 0;
  if (Math.abs(zeile.differenz) < zufall) return 'neutral';
  if (zeile.differenz >= 2) return 'auffaellig';
  if (zeile.differenz >= 1) return 'moeglich';
  if (zeile.differenz <= -1) return 'unauffaellig';
  return 'neutral';
}

/**
 * Dieselbe Einordnung für Klassen – mit niedrigeren Schwellen.
 *
 * Nicht aus Großzügigkeit: Eine Klasse steckt in vielen Mahlzeiten, oft auch in
 * kleinen Mengen, und das verdünnt den Unterschied. Ein halber Punkt über
 * achtzig Mahlzeiten ist ein stabileres Ergebnis als zwei Punkte über zwölf.
 */
function klassenEinstufung(zeile) {
  if (!zeile.genug) return 'zuwenig';
  const zufall = Number.isFinite(zeile.spielraum) ? zeile.spielraum : 0;
  if (Math.abs(zeile.differenz) < zufall) return 'neutral';
  if (zeile.differenz >= 1) return 'auffaellig';
  if (zeile.differenz >= 0.5) return 'moeglich';
  if (zeile.differenz <= -0.5) return 'unauffaellig';
  return 'neutral';
}

const EINSTUFUNG_WORT = {
  auffaellig: 'auffällig',
  moeglich: 'möglicherweise',
  neutral: 'kein Unterschied',
  unauffaellig: 'eher unauffällig',
  zuwenig: 'zu wenige Fälle',
};

/**
 * Ein auffälliger Auslöser, aufgeschlüsselt nach der Rolle, in der er vorkam.
 *
 * Das ist die Auskunft, für die es die Rollen gibt: „Zwiebel" ist keine
 * Antwort, wenn sie achtmal die Suppe war und viermal drei Ringe obendrauf.
 * Zurück kommt jede Rolle, die überhaupt vorkam, mit ihrer Fallzahl – ohne
 * Schwelle und ohne Urteil, denn eine Aufschlüsselung hat naturgemäß kleinere
 * Zahlen als das Ganze, und wer sie liest, soll das sehen.
 */
function rollenBilanz(eintraege, id, fensterStunden) {
  const treffer = eintraege.filter((e) => e.art === 'essen'
    && zutatenVon(e).some((z) => z.id === id));
  const raus = [];
  ROLLEN.forEach((r) => {
    const mit = treffer.filter((e) => zutatenVon(e)
      .some((z) => z.id === id && z.rolle === r.id));
    if (!mit.length) return;
    const summe = mit.reduce((sum, e) => sum + wertNach(eintraege, e, fensterStunden), 0);
    raus.push({ rolle: r.id, faelle: mit.length, schnitt: summe / mit.length });
  });
  return raus.sort((a, b) => b.schnitt - a.schnitt);
}

/* ---------- Die übrigen Faktoren ---------- */

/**
 * Wie viele Stunden vor einer Beschwerde zuletzt gegessen wurde.
 *
 * `null`, wenn an dem Tag und dem davor gar nichts eingetragen ist – dann ist
 * die Angabe nicht „lange her", sondern unbekannt, und das sind zwei
 * verschiedene Dinge.
 */
function stundenSeitEssen(eintraege, beschwerde) {
  const t = zeitpunkt(beschwerde.am, beschwerde.um);
  let letzte = null;
  eintraege.filter((e) => e.art === 'essen').forEach((e) => {
    const te = zeitpunkt(e.am, e.um);
    if (te < t && (letzte === null || te > letzte)) letzte = te;
  });
  if (letzte === null) return null;
  const std = stundenDazwischen(letzte, t);
  return std <= 24 ? std : null;
}

/**
 * Kommen die Beschwerden nach dem Essen oder nüchtern?
 *
 * Das ist die erste Frage, die im Sprechzimmer gestellt wird, und die
 * schwerste aus dem Kopf zu beantworten. Aus dem Tagebuch fällt sie ab.
 */
function essensbezug(eintraege, nahStunden = 2, fernStunden = 4) {
  const beschwerden = eintraege.filter((e) => e.art === 'beschwerde');
  let nah = 0;
  let fern = 0;
  let unbekannt = 0;
  beschwerden.forEach((b) => {
    const std = stundenSeitEssen(eintraege, b);
    if (std === null) unbekannt += 1;
    else if (std <= nahStunden) nah += 1;
    else if (std >= fernStunden) fern += 1;
  });
  const bewertbar = nah + fern;
  return {
    gesamt: beschwerden.length,
    nachDemEssen: nah,
    nuechtern: fern,
    unbekannt,
    anteilNachDemEssen: bewertbar ? nah / bewertbar : 0,
    anteilNuechtern: bewertbar ? fern / bewertbar : 0,
    bewertbar,
  };
}

/**
 * Ein Tagesfaktor gegen die Beschwerdestärke: Tage mit viel gegen Tage mit
 * wenig davon.
 *
 * Dieselbe Logik wie bei den Auslösern und aus demselben Grund: Verglichen
 * wird gegen den eigenen Alltag, nicht gegen null. Wer an jedem zweiten Tag
 * angespannt ist, hätte sonst „Anspannung" als Dauerbefund.
 */
function faktorBilanz(eintraege, tage, frageId, tagesWertFn) {
  const hoch = [];
  const niedrig = [];
  Object.keys(tage || {}).forEach((iso) => {
    const wert = tage[iso] ? tage[iso][frageId] : null;
    if (wert === null || wert === undefined) return;
    const t = tagesWertFn(eintraege, iso, tage);
    if (!t.notiert) return;
    if (Number(wert) >= 3) hoch.push(t.wert);
    else if (Number(wert) <= 1) niedrig.push(t.wert);
  });
  const schnitt = (a) => (a.length ? a.reduce((x, y) => x + y, 0) / a.length : 0);
  return {
    id: frageId,
    hoch: { tage: hoch.length, schnitt: schnitt(hoch) },
    niedrig: { tage: niedrig.length, schnitt: schnitt(niedrig) },
    differenz: schnitt(hoch) - schnitt(niedrig),
    genug: hoch.length >= 4 && niedrig.length >= 4,
  };
}

/** Wie oft eine Beschwerdeart unter allen Beschwerden vorkommt, als Anteil. */
function artAnteil(eintraege, arten) {
  const alle = eintraege.filter((e) => e.art === 'beschwerde');
  if (!alle.length) return { anteil: 0, anzahl: 0, gesamt: 0 };
  const treffer = alle.filter((e) => (e.arten || []).some((a) => arten.includes(a)));
  return { anteil: treffer.length / alle.length, anzahl: treffer.length, gesamt: alle.length };
}

/* ---------- Was oft vorkommt ---------- */

/**
 * Die Zutaten nach Häufigkeit, die meistbenutzte zuerst.
 *
 * Die Auswahlliste beim Eintragen ist sechzehn Marken lang plus eigene. Wer
 * jeden Tag Kaffee einträgt, soll ihn nicht jeden Tag suchen – und eine
 * Eingabe, die drei Sekunden dauert statt fünfzehn, wird auch an einem
 * schlechten Tag noch gemacht. Genau daran hängt, ob das Tagebuch Lücken hat.
 */
function haeufigeZutaten(eintraege) {
  const zaehler = new Map();
  eintraege.filter((e) => e.art === 'essen').forEach((e) => {
    zutatenVon(e).forEach((z) => zaehler.set(z.id, (zaehler.get(z.id) || 0) + 1));
  });
  return zaehler;
}

/**
 * Frühere Mahlzeiten als *vollständige* Vorlage: Text, Zutaten samt Rollen,
 * Portion.
 *
 * Vorher gab es hier nur den Text, und der Vorschlag füllte allein das
 * Textfeld – Zutaten, Rollen und Portion musste man danach von Hand nachbauen.
 * Das ist der Unterschied zwischen drei Sekunden und fünfzehn, und er
 * entscheidet mehr als jede Rechnung in dieser Datei: Das größte Risiko für
 * ein Tagebuch ist nicht ein Fehler in der Auswertung, sondern dass nach drei
 * Wochen niemand mehr etwas einträgt.
 *
 * Zusammengefasst wird über den kleingeschriebenen Text ohne Randleerzeichen –
 * sonst stünde „haferbrei" neben „Haferbrei" und beide wären halb so häufig.
 * Die Vorlage kommt vom **jüngsten** Vorkommen: Wer seinen Haferbrei zuletzt
 * ohne Milch gegessen hat, will ihn vermutlich wieder so.
 *
 * Auch einmalige Mahlzeiten kommen mit. „Nochmal wie gestern" ist ein
 * genauso guter Grund wie „das esse ich immer".
 */
function haeufigeMahlzeiten(eintraege, anzahl = 6) {
  const zaehler = new Map();
  eintraege.filter((e) => e.art === 'essen').forEach((e) => {
    const roh = String(e.was || '').trim();
    if (!roh) return;
    const schluessel = roh.toLowerCase();
    const v = zaehler.get(schluessel) || { anzahl: 0 };
    v.text = roh;
    v.zutaten = zutatenVon(e);
    v.portion = e.portion || 'normal';
    v.zuletzt = e.am;
    v.anzahl += 1;
    zaehler.set(schluessel, v);
  });
  return [...zaehler.values()]
    .sort((a, b) => (b.anzahl - a.anzahl) || (a.zuletzt < b.zuletzt ? 1 : -1))
    .slice(0, anzahl);
}

/* ---------- Verlauf ---------- */

/**
 * Der Tageswert: die stärkste Beschwerde des Tages.
 *
 * `notiert` unterscheidet den beschwerdefreien Tag vom Tag ohne Eintrag. Für
 * die Auswertung ist das der wichtigste Unterschied überhaupt – aus einer
 * Lücke im Tagebuch einen guten Tag zu machen, verschiebt jede Statistik nach
 * unten, und zwar genau in den Wochen, in denen es jemandem zu schlecht ging,
 * um etwas einzutragen.
 */
function tagesWert(eintraege, iso, tage = {}) {
  const amTag = eintraege.filter((e) => e.am === iso);
  const beschwerden = amTag.filter((e) => e.art === 'beschwerde');
  /*
   * Notiert heißt: zum Bauch ist etwas eingetragen – eine Beschwerde, eine
   * Mahlzeit, ein Stuhlgang, ein Mittel, eine Notiz oder eine Tagesfrage. Ein
   * Tag, an dem nur ein Kopfschmerz steht, ist für den Bauch eine Lücke und
   * kein beschwerdefreier Tag. Sonst drückte jede Migräne, bei der jemand nur
   * „Kopf 8" einträgt und sonst nichts, den Bauchwert genau an den schlechten
   * Tagen auf null – gegen die eigene Regel, dass eine Lücke kein guter Tag ist.
   */
  const notiert = amTag.some((e) => e.art !== 'kopf') || !!tage[iso];
  const max = beschwerden.reduce((m, e) => Math.max(m, Number(e.staerke) || 0), 0);
  const summe = beschwerden.reduce((s, e) => s + (Number(e.staerke) || 0), 0);
  return {
    am: iso,
    notiert,
    wert: max,
    schnitt: beschwerden.length ? summe / beschwerden.length : 0,
    anzahl: beschwerden.length,
    mahlzeiten: amTag.filter((e) => e.art === 'essen').length,
    medikamente: amTag.filter((e) => e.art === 'medikament').length,
    // Der Kopf steht daneben, nicht darin: `wert` bleibt der Bauch. Wer hier
    // den Kopf in `wert` mischte, machte aus jeder Migräne einen Magentag.
    kopf: amTag.filter((e) => e.art === 'kopf')
      .reduce((m, e) => Math.max(m, Number(e.staerke) || 0), 0),
  };
}

/** Eine Reihe von Tageswerten, lückenlos von `von` bis `bis`. */
function verlaufReihe(eintraege, von, bis, tage = {}) {
  const raus = [];
  const n = tageDazwischen(von, bis);
  for (let i = 0; i <= n; i++) raus.push(tagesWert(eintraege, plusTage(von, i), tage));
  return raus;
}

/**
 * Beschwerden nach Tageszeit. Beantwortet die Frage, die im Sprechzimmer
 * immer kommt: nüchtern oder nach dem Essen, tagsüber oder nachts.
 */
function nachTageszeit(eintraege) {
  const faecher = Object.keys(TAGESZEIT_NAME);
  const eimer = Object.fromEntries(faecher.map((k) => [k, { anzahl: 0, summe: 0 }]));
  eintraege.filter((e) => e.art === 'beschwerde').forEach((e) => {
    const f = eimer[tageszeit(e.um)];
    f.anzahl += 1;
    f.summe += Number(e.staerke) || 0;
  });
  return faecher.map((k) => ({
    id: k,
    name: TAGESZEIT_NAME[k],
    anzahl: eimer[k].anzahl,
    schnitt: eimer[k].anzahl ? eimer[k].summe / eimer[k].anzahl : 0,
  })).filter((f) => f.anzahl > 0).sort((a, b) => b.anzahl - a.anzahl);
}

/** Wie oft welche Beschwerdeart angekreuzt wurde. */
function nachArt(eintraege) {
  const zaehler = new Map();
  eintraege.filter((e) => e.art === 'beschwerde').forEach((e) => {
    (e.arten || []).forEach((a) => zaehler.set(a, (zaehler.get(a) || 0) + 1));
  });
  return [...zaehler.entries()].map(([id, anzahl]) => ({ id, anzahl }))
    .sort((a, b) => b.anzahl - a.anzahl);
}

/**
 * Die laufende Serie beschwerdefreier Tage, rückwärts ab `bis`.
 *
 * Ein Tag ohne Eintragung beendet die Serie nicht, aber er zählt auch nicht
 * mit – sonst wäre die längste Serie die längste Pause vom Tagebuch.
 */
function serieOhne(eintraege, tage, bis) {
  let iso = bis;
  let zaehler = 0;
  for (let i = 0; i < 400; i++) {
    const t = tagesWert(eintraege, iso, tage);
    if (t.notiert) {
      if (t.wert > 0) break;
      zaehler += 1;
    }
    iso = plusTage(iso, -1);
  }
  return zaehler;
}

/* ---------- Wird es besser oder schlechter? ---------- */

/**
 * Die letzten Wochen gegen die Wochen davor.
 *
 * Die Frage, die jeder stellt, der ein Tagebuch führt, und die bisher nirgends
 * beantwortet war: Alles andere in dieser Datei mittelt über den ganzen
 * Zeitraum und kann deshalb nicht sagen, ob es *gerade* besser wird.
 *
 * Zwei Entscheidungen tragen die Rechnung, und beide gehen gegen ein zu
 * freundliches Ergebnis:
 *
 *   1. **Verglichen werden notierte Tage, nicht Kalendertage.** Wer in einer
 *      schlechten Woche seltener einträgt, hätte sonst rechnerisch eine gute
 *      Woche – der häufigste Weg, wie ein Tagebuch sich selbst belügt. Der
 *      jüngere Abschnitt sammelt die letzten `fenster` *notierten* Tage, der
 *      ältere die `fenster` davor.
 *   2. **Beide Abschnitte müssen voll sein.** Ein Vergleich von zwölf gegen
 *      drei Tage ist keiner. Fehlt es, kommt `pruefbar: false` zurück und die
 *      Anzeige sagt, wie viele Tage noch fehlen.
 *
 * Und die Schwelle ist bewusst hoch: eine ganze Stufe auf der Zehnerskala.
 * Beschwerden schwanken von selbst, und aus jeder Schwankung eine Richtung zu
 * machen wäre ein Orakel, das mal Mut macht und mal grundlos Angst.
 */
/*
 * `ab` begrenzt, wie weit zurückgeschaut werden darf.
 *
 * Auf dem Bildschirm bleibt es leer – dort ist die Richtung eine Aussage über
 * das Tagebuch, nicht über einen Ausschnitt. Im Bericht steht dagegen ein
 * Zeitraum im Kopf, und eine Zahl, die still von davor mitrechnet, wäre dort
 * schlicht falsch beschriftet.
 */
function trend(eintraege, tage, bis, fenster = 14, ab = null) {
  // Rückwärts durch den Kalender, bis beide Fächer voll sind – oder bis ein
  // Jahr durch ist. Ohne diese Grenze liefe die Schleife bei einem leeren
  // Tagebuch bis ans Ende der Zeit.
  const werte = [];
  let iso = bis;
  for (let i = 0; i < 400 && werte.length < fenster * 2; i++) {
    if (ab && iso < ab) break;
    const t = tagesWert(eintraege, iso, tage);
    if (t.notiert) werte.push(t.wert);
    iso = plusTage(iso, -1);
  }

  const schnitt = (a) => (a.length ? a.reduce((x, y) => x + y, 0) / a.length : 0);
  const jung = werte.slice(0, fenster);
  const alt = werte.slice(fenster, fenster * 2);
  const pruefbar = jung.length >= fenster && alt.length >= fenster;
  const differenz = schnitt(alt) - schnitt(jung);

  let richtung = 'gleich';
  if (pruefbar && differenz >= 1) richtung = 'besser';
  else if (pruefbar && differenz <= -1) richtung = 'schlechter';

  return {
    fenster,
    pruefbar,
    // Wie viele notierte Tage noch fehlen, damit sich überhaupt vergleichen lässt.
    fehlt: Math.max(0, fenster * 2 - werte.length),
    jetzt: { tage: jung.length, schnitt: schnitt(jung), frei: jung.filter((w) => w === 0).length },
    davor: { tage: alt.length, schnitt: schnitt(alt), frei: alt.filter((w) => w === 0).length },
    differenz,
    richtung,
  };
}

const TREND_WORT = {
  besser: 'es wird besser',
  schlechter: 'es wird schlechter',
  gleich: 'kein deutlicher Unterschied',
};

/** Die großen Zahlen für die Übersicht und den Bericht. */
function gesamtZahlen(eintraege, tage, von, bis) {
  const reihe = verlaufReihe(eintraege, von, bis, tage);
  const notiert = reihe.filter((t) => t.notiert);
  const mit = notiert.filter((t) => t.wert > 0);
  return {
    tage: reihe.length,
    notierteTage: notiert.length,
    tageMitBeschwerden: mit.length,
    anteil: notiert.length ? mit.length / notiert.length : 0,
    schnitt: notiert.length ? notiert.reduce((s, t) => s + t.wert, 0) / notiert.length : 0,
    hoechster: notiert.reduce((m, t) => Math.max(m, t.wert), 0),
    mahlzeiten: reihe.reduce((s, t) => s + t.mahlzeiten, 0),
    medikamente: reihe.reduce((s, t) => s + t.medikamente, 0),
  };
}

/* ===== js/stuhl.js ===== */
/*
 * Der Stuhlgang: die Angabe, ohne die der halbe Bauch unsichtbar bleibt.
 *
 * Dieses Tagebuch hat lange nur nach oben geschaut – Brennen, Druck, Übelkeit.
 * Das reicht für die Magenfragen und für die Darmfragen überhaupt nicht: Ein
 * Reizdarmsyndrom wird an drei Dingen festgemacht, und zwei davon sind
 * Häufigkeit und Form des Stuhlgangs. Ohne sie lässt sich ein Reizdarm von
 * einer funktionellen Dyspepsie im Tagebuch grundsätzlich nicht trennen, und
 * der Typ – Verstopfung, Durchfall, gemischt – entscheidet in der Praxis über
 * die Behandlung.
 *
 * Gerechnet wird hier nur, gefragt wird woanders. Wie überall in dieser
 * Schicht: reine Funktionen, alles kommt als Argument herein.
 *
 * Zur Einordnung der Zahlen: Die Anteile unten sind über *alle* eingetragenen
 * Stuhlgänge gerechnet, nicht über Tage. Die Rom-Kriterien rechnen ähnlich,
 * aber nicht identisch – dort geht es um Tage mit mindestens einem auffälligen
 * Stuhlgang. Der Unterschied ist klein und die Zahl hier nachvollziehbar;
 * beides steht in der Anzeige dabei.
 */

/** Alle Stuhl-Eintragungen mit gültiger Bristol-Form. */
function stuhlgaenge(eintraege) {
  return (eintraege || []).filter((e) => e.art === 'stuhl' && bristolVon(e.form));
}

/**
 * Wie die Formen verteilt sind.
 *
 * `hart` sind Bristol 1–2 (zu lange gelegen), `weich` 6–7 (zu kurz), der Rest
 * gilt als unauffällig. Das ist die Einteilung, mit der auch in der
 * Sprechstunde gearbeitet wird.
 */
function formBilanz(eintraege) {
  const alle = stuhlgaenge(eintraege);
  const zaehl = { hart: 0, normal: 0, weich: 0 };
  alle.forEach((e) => { zaehl[bristolVon(e.form).gruppe] += 1; });
  const teil = (n) => (alle.length ? n / alle.length : 0);
  return {
    gesamt: alle.length,
    ...zaehl,
    anteilHart: teil(zaehl.hart),
    anteilWeich: teil(zaehl.weich),
    anteilNormal: teil(zaehl.normal),
  };
}

/**
 * Der Reizdarm-Typ nach der Verteilung der Stuhlform.
 *
 * Die Schwelle von einem Viertel steht so in den Rom-Kriterien: Über einem
 * Viertel harter Stühle und unter einem Viertel weicher heißt „Verstopfungstyp"
 * und umgekehrt; beides über einem Viertel heißt „gemischt".
 *
 * Wichtig und deshalb im Rückgabewert: Das hier ist eine *Beschreibung der
 * Stuhlform*, keine Diagnose. Der Typ sagt nur, wie es aussähe, *wenn* ein
 * Reizdarm vorläge – ob einer vorliegt, entscheidet er nicht. Unter 15
 * eingetragenen Stuhlgängen kommt gar nichts zurück; darunter kippt der Anteil
 * mit jedem einzelnen Eintrag.
 */
const TYP_NAME = {
  verstopfung: 'Verstopfungstyp (IBS-C)',
  durchfall: 'Durchfalltyp (IBS-D)',
  gemischt: 'Gemischter Typ (IBS-M)',
  unbestimmt: 'Nicht zuzuordnen (IBS-U)',
};

function stuhlTyp(eintraege, mindest = 15) {
  const b = formBilanz(eintraege);
  if (b.gesamt < mindest) {
    return { typ: null, fehlt: mindest - b.gesamt, bilanz: b };
  }
  const vielHart = b.anteilHart > 0.25;
  const vielWeich = b.anteilWeich > 0.25;
  let typ = 'unbestimmt';
  if (vielHart && vielWeich) typ = 'gemischt';
  else if (vielHart) typ = 'verstopfung';
  else if (vielWeich) typ = 'durchfall';
  return { typ, name: TYP_NAME[typ], fehlt: 0, bilanz: b };
}

/** Wie viele Stuhlgänge an einem Tag eingetragen sind. */
function anzahlAm(eintraege, iso) {
  return stuhlgaenge(eintraege).filter((e) => e.am === iso).length;
}

/**
 * Bauchschmerz-Tage gegen die übrigen – bei Häufigkeit und bei Form.
 *
 * Das sind zwei der drei Rom-Merkmale für ein Reizdarmsyndrom. Dort werden sie
 * *gefragt* („ändert sich dabei die Häufigkeit?"), hier werden sie gerechnet.
 * Das ist nicht dasselbe, und es steht in der Anzeige dabei: Wer sich nicht
 * erinnert, antwortet auf die Frage schlechter als das Tagebuch – wer an
 * schlechten Tagen seltener einträgt, besser.
 *
 * Verglichen wird nur über Tage, an denen überhaupt etwas notiert wurde. Eine
 * Lücke im Tagebuch ist kein schmerzfreier Tag.
 */
function schmerzVergleich(eintraege, tage, schmerzArten = ['krampf']) {
  const alle = eintraege || [];
  // Ohne die Kopf-Einträge: Ein Tag mit nur einem Kopfschmerz ist für den
  // Bauch eine Lücke, kein Tag ohne Bauchschmerz (siehe tagesWert).
  const notierte = [...new Set([
    ...alle.filter((e) => e.art !== 'kopf').map((e) => e.am), ...Object.keys(tage || {}),
  ])].sort();
  const mitSchmerz = new Set(alle
    .filter((e) => e.art === 'beschwerde' && (e.arten || []).some((a) => schmerzArten.includes(a)))
    .map((e) => e.am));

  const gruppe = (wollen) => {
    const isos = notierte.filter((iso) => mitSchmerz.has(iso) === wollen);
    const stuhl = stuhlgaenge(alle).filter((e) => isos.includes(e.am));
    const auffaellig = stuhl.filter((e) => bristolVon(e.form).gruppe !== 'normal');
    return {
      tage: isos.length,
      stuhlgaenge: stuhl.length,
      proTag: isos.length ? stuhl.length / isos.length : 0,
      auffaellig: auffaellig.length,
      anteilAuffaellig: stuhl.length ? auffaellig.length / stuhl.length : 0,
    };
  };

  const mit = gruppe(true);
  const ohne = gruppe(false);
  return {
    mit,
    ohne,
    // Genug heißt hier: auf beiden Seiten fünf Tage und fünf Stuhlgänge. Eine
    // Formverteilung aus zwei Einträgen ist keine Verteilung.
    genugTage: mit.tage >= 5 && ohne.tage >= 5,
    genugStuhl: mit.stuhlgaenge >= 5 && ohne.stuhlgaenge >= 5,
    haeufigkeitAnders: Math.abs(mit.proTag - ohne.proTag) >= 0.5,
    formAnders: Math.abs(mit.anteilAuffaellig - ohne.anteilAuffaellig) >= 0.2,
  };
}

/**
 * Wie oft eine Beschwerde sich mit dem Stuhlgang geändert hat.
 *
 * Das dritte Rom-Merkmal, und das einzige, das sich nicht rechnen lässt:
 * Dass an einem Tag Schmerz und Stuhlgang beide vorkamen, sagt nichts darüber,
 * ob das eine das andere verändert hat. Also wird gefragt (STUHLBEZUG in
 * js/daten.js) und hier nur ausgezählt. Unbeantwortete Beschwerden zählen
 * nirgends mit – weder dafür noch dagegen.
 */
function bezugBilanz(eintraege) {
  const beantwortet = (eintraege || []).filter((e) => e.art === 'beschwerde'
    && e.stuhlbezug && e.stuhlbezug !== 'keiner');
  const geaendert = beantwortet.filter((e) => e.stuhlbezug === 'besser' || e.stuhlbezug === 'schlechter');
  return {
    beantwortet: beantwortet.length,
    geaendert: geaendert.length,
    besser: beantwortet.filter((e) => e.stuhlbezug === 'besser').length,
    schlechter: beantwortet.filter((e) => e.stuhlbezug === 'schlechter').length,
    anteil: beantwortet.length ? geaendert.length / beantwortet.length : 0,
    genug: beantwortet.length >= 4,
  };
}

/** Die Zahlen für die Übersicht: wie oft, wie oft auffällig, wie oft dringend. */
function stuhlZahlen(eintraege, tage) {
  const alle = stuhlgaenge(eintraege);
  const notierte = [...new Set([
    ...(eintraege || []).filter((e) => e.art !== 'kopf').map((e) => e.am),
    ...Object.keys(tage || {}),
  ])];
  const b = formBilanz(eintraege);
  return {
    gesamt: alle.length,
    proTag: notierte.length ? alle.length / notierte.length : 0,
    dringend: alle.filter((e) => e.dringend).length,
    unvollstaendig: alle.filter((e) => e.unvollstaendig).length,
    ...b,
  };
}

/* ===== js/kriterien.js ===== */
/*
 * Die Kriterien: dieselben Regeln, nach denen in der Sprechstunde eingeordnet
 * wird – auf die eigenen Eintragungen angewandt.
 *
 * Bis hierher hat diese App beschrieben („säuretypisches Bild"). Diese Datei
 * geht einen Schritt weiter und rechnet zwei anerkannte Regelwerke nach:
 *
 *   * **Rom IV** für das Reizdarmsyndrom und die funktionelle Dyspepsie. Das
 *     sind die Kriterien, mit denen diese beiden Diagnosen tatsächlich gestellt
 *     werden – sie bestehen aus nichts als Beschwerden und Zeiträumen, also
 *     genau aus dem, was in einem Tagebuch steht.
 *   * **GerdQ** für die Refluxkrankheit. Sechs Fragen, eine veröffentlichte
 *     Schwelle, und in Studien ungefähr so treffsicher wie die Einschätzung
 *     einer Hausärztin.
 *
 * DREI DINGE, DIE DAZUGEHÖREN, UND ZWAR JEDES MAL:
 *
 * 1. **Erfüllte Kriterien sind keine Diagnose.** Beide Regelwerke setzen
 *    ausdrücklich voraus, dass nichts Organisches dahintersteckt – und das
 *    weiß nur eine Untersuchung. „Erfüllt die Kriterien" heißt: Wenn Spiegelung
 *    und Blutbild unauffällig sind, passt der Name. Nicht mehr, und das ist
 *    schon viel.
 *
 * 2. **Ein Tagebuch untererfasst.** Der GerdQ wird sonst gefragt („an wie
 *    vielen Tagen hatten Sie …?"); hier wird gezählt. Wer einen Tag nicht
 *    einträgt, hat an diesem Tag laut Tagebuch nichts gehabt. Jede Punktzahl
 *    hier ist deshalb eher zu niedrig als zu hoch – sie ist eine Untergrenze.
 *
 * 3. **Ohne genug Zeitraum kein Ergebnis.** Rom IV verlangt drei Monate
 *    Beschwerden und einen Beginn vor mindestens einem halben Jahr. Was diese
 *    Datei nicht prüfen kann, behauptet sie nicht: Dann steht `pruefbar: false`
 *    und daneben, was noch fehlt.
 */


/*
 * Ab welcher Stärke eine Beschwerde als „belastend" gilt.
 *
 * Die Rom-Kriterien sagen „bothersome" – belastend genug, um davon zu
 * erzählen. Auf der Skala dieser App ist das die 4, das Wort dazu heißt
 * „merklich". Eine 2 („sehr leicht") mitzuzählen würde die Kriterien bei fast
 * jedem erfüllen und sie damit wertlos machen.
 */
const BELASTEND = 4;

/** Rom IV rechnet in den letzten drei Monaten. */
const FENSTER_TAGE = 90;

/** Und verlangt einen Beginn vor mindestens einem halben Jahr. */
const BEGINN_MONATE = 6;

/** GerdQ fragt nach den letzten sieben Tagen. */
const GERDQ_TAGE = 7;

const inFenster = (iso, von, bis) => iso >= von && iso <= bis;

/** Tage im Zeitraum, an denen überhaupt etwas notiert wurde. */
function notierteTage(eintraege, tage, von, bis) {
  const isos = new Set();
  // Ein Tag mit nur einem Kopfschmerz ist für den Bauch kein notierter Tag
  // (siehe tagesWert in auswertung.js) – sonst stünde er hier als Tag ohne
  // Bauchschmerz im Nenner und verwässerte Rom und GerdQ.
  (eintraege || []).forEach((e) => {
    if (e.art !== 'kopf' && inFenster(e.am, von, bis)) isos.add(e.am);
  });
  Object.keys(tage || {}).forEach((iso) => { if (inFenster(iso, von, bis)) isos.add(iso); });
  return [...isos].sort();
}

/** Tage, an denen eine dieser Beschwerdearten mindestens `ab` stark war. */
function tageMit(eintraege, arten, von, bis, ab = BELASTEND) {
  const isos = new Set();
  (eintraege || []).forEach((e) => {
    if (e.art !== 'beschwerde' || !inFenster(e.am, von, bis)) return;
    if ((Number(e.staerke) || 0) < ab) return;
    if ((e.arten || []).some((a) => arten.includes(a))) isos.add(e.am);
  });
  return [...isos].sort();
}

/**
 * Wie viele Tage je Woche – gerechnet über die *notierten* Tage, nicht über den
 * Kalender.
 *
 * Der Unterschied ist der ganze Punkt: Wer in drei Monaten an dreißig Tagen
 * schreibt und an zehn davon Schmerz hat, hat nicht „0,8 Tage die Woche",
 * sondern ein Drittel seiner erfassten Tage. Auf den Kalender hochgerechnet
 * wäre die Zahl erfunden; über die notierten Tage ist sie ehrlich und steht
 * mit ihrer Grundlage daneben.
 */
function proWoche(trefferTage, notierte) {
  if (!notierte) return 0;
  return (trefferTage / notierte) * 7;
}

/**
 * Wie lange die Beschwerden schon bestehen.
 *
 * `seit` ist 'YYYY-MM' aus den Einstellungen – die eine Angabe, die aus dem
 * Tagebuch nicht hervorgeht, weil es an dem Tag beginnt, an dem jemand anfängt
 * zu schreiben. Ohne sie bleibt die Zeitbedingung offen statt erfüllt.
 */
function dauerStand(seit, heute) {
  if (!seit || !/^\d{4}-\d{2}$/.test(seit)) {
    return { seit: null, monate: null, erfuellt: null };
  }
  const [jy, jm] = seit.split('-').map(Number);
  const [hy, hm] = heute.split('-').map(Number);
  const monate = (hy - jy) * 12 + (hm - jm);
  return { seit, monate, erfuellt: monate >= BEGINN_MONATE };
}

/* ---------------------------------------------------------------------------
 * Rom IV: Reizdarmsyndrom
 * ---------------------------------------------------------------------------
 *
 * Wiederkehrender Bauchschmerz, im Mittel an mindestens einem Tag pro Woche in
 * den letzten drei Monaten, verbunden mit mindestens zwei von drei Merkmalen:
 * Zusammenhang mit dem Stuhlgang, Änderung der Häufigkeit, Änderung der Form.
 *
 * Alle drei Merkmale werden hier aus dem Tagebuch gerechnet statt gefragt –
 * beim ersten aus der ausdrücklichen Angabe im Beschwerdebogen, bei den beiden
 * anderen aus dem Vergleich von Schmerztagen mit den übrigen. Das ist nicht
 * dasselbe wie die Frage, und es steht überall dabei.
 */
function reizdarm(d) {
  const schmerzTage = tageMit(d.eintraege, ['krampf'], d.von, d.bis);
  const proW = proWoche(schmerzTage.length, d.notierte.length);
  const v = schmerzVergleich(d.eintraege, d.tage, ['krampf']);
  const bez = bezugBilanz(d.eintraege);
  const typ = stuhlTyp(d.eintraege);

  const merkmale = [
    {
      id: 'stuhlgang',
      name: 'Hängt mit dem Stuhlgang zusammen',
      erfuellt: bez.genug && bez.anteil >= 0.5,
      pruefbar: bez.genug,
      text: bez.genug
        ? `Bei ${bez.geaendert} von ${bez.beantwortet} Beschwerden mit Angabe war es `
          + `nach dem Stuhlgang anders (${bez.besser}× besser, ${bez.schlechter}× schlechter).`
        : `Erst ${bez.beantwortet} von 4 Beschwerden mit Angabe dazu. Die Frage steht `
          + 'im Beschwerdebogen unten.',
    },
    {
      id: 'haeufigkeit',
      name: 'Die Häufigkeit ändert sich dabei',
      erfuellt: v.genugTage && v.haeufigkeitAnders,
      pruefbar: v.genugTage,
      text: v.genugTage
        ? `An Schmerztagen ${v.mit.proTag.toFixed(1).replace('.', ',')} Stuhlgänge am Tag `
          + `(${v.mit.tage} Tage), sonst ${v.ohne.proTag.toFixed(1).replace('.', ',')} `
          + `(${v.ohne.tage} Tage).`
        : `Dafür braucht es je 5 Tage mit und ohne Bauchschmerz – bisher `
          + `${v.mit.tage} und ${v.ohne.tage}.`,
    },
    {
      id: 'form',
      name: 'Die Form ändert sich dabei',
      erfuellt: v.genugStuhl && v.formAnders,
      pruefbar: v.genugStuhl,
      text: v.genugStuhl
        ? `An Schmerztagen waren ${Math.round(v.mit.anteilAuffaellig * 100)} % der `
          + `Stuhlgänge auffällig geformt (${v.mit.stuhlgaenge} Stück), sonst `
          + `${Math.round(v.ohne.anteilAuffaellig * 100)} % (${v.ohne.stuhlgaenge} Stück).`
        : `Dafür braucht es je 5 Stuhlgänge an Tagen mit und ohne Bauchschmerz – `
          + `bisher ${v.mit.stuhlgaenge} und ${v.ohne.stuhlgaenge}.`,
    },
  ];

  const erfuellteMerkmale = merkmale.filter((m) => m.erfuellt).length;
  const schmerzErfuellt = proW >= 1;
  // Prüfbar heißt: genug notierte Tage für eine Aussage über Wochen, und
  // mindestens zwei der drei Merkmale überhaupt beurteilbar. Sonst hinge das
  // Ergebnis daran, was *nicht* eingetragen wurde.
  const pruefbar = d.notierte.length >= 30
    && merkmale.filter((m) => m.pruefbar).length >= 2;

  return {
    pruefbar,
    erfuellt: pruefbar && schmerzErfuellt && erfuellteMerkmale >= 2,
    schmerzTage: schmerzTage.length,
    proWoche: proW,
    schmerzErfuellt,
    merkmale,
    erfuellteMerkmale,
    typ,
  };
}

/* ---------------------------------------------------------------------------
 * Rom IV: Funktionelle Dyspepsie
 * ---------------------------------------------------------------------------
 *
 * Mindestens eines von vier belastenden Beschwerdebildern in den letzten drei
 * Monaten. Unterteilt in zwei Formen, die verschieden behandelt werden:
 *
 *   PDS  Völlegefühl nach dem Essen oder frühes Sattsein, an mindestens
 *        drei Tagen pro Woche.
 *   EPS  Schmerz oder Brennen im Oberbauch, an mindestens einem Tag pro Woche.
 *
 * Beides zugleich kommt vor und ist kein Widerspruch.
 */
function dyspepsie(d) {
  const pdsTage = tageMit(d.eintraege, ['druck', 'saettigung'], d.von, d.bis);
  const epsTage = tageMit(d.eintraege, ['oberbauch', 'brennen'], d.von, d.bis);
  const pdsW = proWoche(pdsTage.length, d.notierte.length);
  const epsW = proWoche(epsTage.length, d.notierte.length);
  const pruefbar = d.notierte.length >= 30;

  return {
    pruefbar,
    pds: {
      tage: pdsTage.length,
      proWoche: pdsW,
      erfuellt: pruefbar && pdsW >= 3,
      name: 'Postprandiales Distress-Syndrom (PDS)',
      satz: 'Völlegefühl nach dem Essen und frühes Sattsein stehen im Vordergrund.',
    },
    eps: {
      tage: epsTage.length,
      proWoche: epsW,
      erfuellt: pruefbar && epsW >= 1,
      name: 'Epigastrisches Schmerzsyndrom (EPS)',
      satz: 'Schmerz oder Brennen im Oberbauch stehen im Vordergrund, unabhängig '
        + 'vom Essen.',
    },
    erfuellt: pruefbar && (pdsW >= 3 || epsW >= 1),
  };
}

/* ---------------------------------------------------------------------------
 * GerdQ
 * ---------------------------------------------------------------------------
 *
 * Sechs Fragen nach den letzten sieben Tagen, jede 0 bis 3 Punkte, zusammen 0
 * bis 18. Ab 8 Punkten gilt eine Refluxkrankheit als wahrscheinlich.
 *
 * Zwei der sechs zählen *umgekehrt*: Oberbauchschmerz und Übelkeit sprechen
 * eher gegen Reflux und für etwas anderes im Magen. Das ist keine Marotte des
 * Fragebogens, sondern sein eigentlicher Trick – er misst nicht, wie schlecht
 * es jemandem geht, sondern wie typisch das Muster ist.
 */
const GERDQ_POSTEN = [
  { id: 'sodbrennen', frage: 'Brennen hinter dem Brustbein', arten: ['sodbrennen', 'brennen'], richtung: 1 },
  { id: 'aufstossen', frage: 'Aufstoßen, Rückfluss in den Mund', arten: ['aufstossen'], richtung: 1 },
  { id: 'oberbauch', frage: 'Schmerz in der Magengrube', arten: ['oberbauch'], richtung: -1 },
  { id: 'uebelkeit', frage: 'Übelkeit', arten: ['uebelkeit'], richtung: -1 },
];

/** 0 Tage → 0, 1 Tag → 1, 2–3 Tage → 2, 4–7 Tage → 3. */
function gerdqPunkt(tage) {
  if (tage <= 0) return 0;
  if (tage === 1) return 1;
  if (tage <= 3) return 2;
  return 3;
}

function gerdq(d) {
  const von = plusTage(d.bis, -(GERDQ_TAGE - 1));
  const erfasst = notierteTage(d.eintraege, d.tage, von, d.bis).length;

  const posten = GERDQ_POSTEN.map((p) => {
    // Ohne Stärkeschwelle: Der GerdQ fragt, ob es da war, nicht wie schlimm.
    const tage = tageMit(d.eintraege, p.arten, von, d.bis, 1).length;
    const roh = gerdqPunkt(tage);
    return {
      ...p,
      tage,
      punkte: p.richtung === 1 ? roh : 3 - roh,
      umgekehrt: p.richtung === -1,
    };
  });

  // Nächte, in denen die Beschwerden geweckt haben – aus der Tagesfrage.
  const naechte = Object.keys(d.tage || {})
    .filter((iso) => inFenster(iso, von, d.bis) && Number(d.tage[iso].nachtwach) >= 1).length;
  posten.push({
    id: 'nachtwach',
    frage: 'Nachts davon wach geworden',
    tage: naechte,
    punkte: gerdqPunkt(naechte),
    umgekehrt: false,
  });

  // Tage mit einem säurewirksamen Mittel. Der Fragebogen zielt auf die frei
  // gekaufte Tablette gegen die Beschwerden – eine dauerhaft verordnete zählt
  // dort genauso, und unterscheiden kann das Tagebuch beides nicht.
  const mittelTage = [...new Set((d.eintraege || [])
    .filter((e) => e.art === 'medikament' && inFenster(e.am, von, d.bis)
      && d.istSaeuremittel(e.mittel))
    .map((e) => e.am))].length;
  posten.push({
    id: 'mittel',
    frage: 'Ein Mittel gegen die Beschwerden genommen',
    tage: mittelTage,
    punkte: gerdqPunkt(mittelTage),
    umgekehrt: false,
  });

  const punkte = posten.reduce((s, p) => s + p.punkte, 0);
  return {
    punkte,
    max: 18,
    schwelle: 8,
    wahrscheinlich: punkte >= 8,
    posten,
    erfasst,
    von,
    bis: d.bis,
    // Unter vier erfassten Tagen der letzten sieben ist die Zahl nicht mehr
    // eine Untergrenze, sondern Zufall.
    belastbar: erfasst >= 4,
  };
}

/* ------------------------------------------------------------------------- */

/**
 * Alle Kriterien auf einmal.
 *
 * @param {object} d
 *   eintraege, tage, heute (ISO), beschwerdenSeit ('YYYY-MM' oder null),
 *   istSaeuremittel(name) – Prüfung, ob ein Mittel auf die Säure wirkt; kommt
 *   von außen herein, damit diese Datei nichts über die Mittelliste weiß.
 */
function kriterien(d) {
  const bis = d.heute;
  const von = plusTage(bis, -(FENSTER_TAGE - 1));
  const notierte = notierteTage(d.eintraege, d.tage, von, bis);
  const basis = {
    eintraege: d.eintraege || [],
    tage: d.tage || {},
    istSaeuremittel: d.istSaeuremittel || (() => false),
    von,
    bis,
    notierte,
  };

  const erste = (d.eintraege || []).length ? d.eintraege[0].am : null;
  return {
    zeitraum: {
      von,
      bis,
      tage: FENSTER_TAGE,
      notierteTage: notierte.length,
      // Wie lange überhaupt geschrieben wird. Nicht dasselbe wie die Dauer der
      // Beschwerden, und der Unterschied ist genau das, was `dauer` festhält.
      tagebuchTage: erste ? tageDazwischen(erste, bis) + 1 : 0,
    },
    dauer: dauerStand(d.beschwerdenSeit, bis),
    reizdarm: reizdarm(basis),
    dyspepsie: dyspepsie(basis),
    gerdq: gerdq(basis),
  };
}

/**
 * Lohnt es sich überhaupt, die Kriterien anzuzeigen?
 *
 * Unter zwei Wochen Tagebuch steht dort nur, was alles noch nicht geht. Das ist
 * richtig, aber es entmutigt genau die, die gerade angefangen haben.
 */
function genugFuerKriterien(k) {
  return k.zeitraum.notierteTage >= 14;
}

/* ===== js/versuch.js ===== */
/*
 * Der Auslassversuch: aus einem Zusammenhang einen Beleg machen.
 *
 * Alles andere in dieser App zählt, was ohnehin passiert. Das hat eine harte
 * Grenze: Wer an schlechten Tagen anders isst, findet sein Essen auffällig,
 * ohne dass es etwas damit zu tun hätte. Aus Beobachtung wird kein Beweis,
 * egal wie viele Monate man beobachtet.
 *
 * Ein Versuch dreht das um. Man lässt etwas weg und schaut, ob es besser wird –
 * und dann, und darauf kommt es an, isst man es *bewusst wieder*. Erst diese
 * zweite Hälfte macht den Unterschied: Nach zwei Wochen ohne irgendwas geht es
 * fast jedem besser, weil der Sommer kommt, der Stress nachlässt oder man
 * einfach aufmerksamer isst. Kommen die Beschwerden mit der Wiedereinführung
 * zurück, ist das schwer anders zu erklären. Genau so wird in der
 * Ernährungsmedizin gearbeitet.
 *
 * WAS DIESER VERSUCH NICHT IST: keine Verblindung, keine Kontrollgruppe, ein
 * einziger Mensch. Wer weiß, dass er heute die Milch weglässt, erwartet auch,
 * dass es besser wird. Das Ergebnis ist ein starker Hinweis und kein Nachweis –
 * und es steht in jeder Ausgabe dabei.
 *
 * Reine Rechnung. Was gestartet und abgebrochen wird, steht in js/store.js.
 */



/** So lange wird nach der Wiedereinführung noch beobachtet. */
const PROVOKATION_TAGE = 3;

/** Kürzer als eine Woche ist kein Versuch, länger als vier hält niemand durch. */
const DAUER_VORSCHLAEGE = [7, 14, 21];

/**
 * Enthält diese Mahlzeit das, was weggelassen werden soll?
 *
 * Bei einem einzelnen Auslöser ist das eine Frage an die Zutatenliste, bei
 * einer Klasse eine an alle Zutaten und ihre Klassen. Die Umstände – große
 * Portion, spät gegessen – zählen mit, denn auch die kann man weglassen.
 */
function betrifft(eintrag, art, ziel) {
  if (eintrag.art !== 'essen') return false;
  if (art === 'klasse') {
    return zutatenVon(eintrag).some((z) => klassenVon(z.id).includes(ziel));
  }
  return merkmale(eintrag).includes(ziel);
}

/**
 * In welcher Phase der Versuch gerade steckt.
 *
 *   'auslass'      Die Tage ohne. Läuft.
 *   'reif'         Die Auslasszeit ist um – jetzt kommt die Wiedereinführung.
 *   'provokation'  Wieder gegessen, es wird noch beobachtet.
 *   'fertig'       Vorbei, das Ergebnis steht.
 *   'abgebrochen'  Von Hand beendet.
 */
function phase(v, heute) {
  if (!v) return null;
  if (v.beendet) return 'abgebrochen';
  if (v.provokation) {
    return tageDazwischen(v.provokation, heute) >= PROVOKATION_TAGE ? 'fertig' : 'provokation';
  }
  return tageDazwischen(v.start, heute) >= v.tage ? 'reif' : 'auslass';
}

/** Der wievielte Tag von wie vielen – für die Zeile auf dem Tagesreiter. */
function versuchStand(v, heute) {
  if (!v) return null;
  const p = phase(v, heute);
  const tag = Math.min(v.tage, tageDazwischen(v.start, heute) + 1);
  return {
    phase: p,
    tag: Math.max(1, tag),
    von: v.tage,
    // Wie viele Tage noch – nach der Provokation zählt das Beobachtungsfenster.
    rest: p === 'auslass' ? Math.max(0, v.tage - tag)
      : (p === 'provokation'
        ? Math.max(0, PROVOKATION_TAGE - tageDazwischen(v.provokation, heute)) : 0),
  };
}

/** Der Durchschnitt der Tageswerte in einem Zeitraum, über notierte Tage. */
function abschnitt(eintraege, tage, von, bis) {
  const werte = [];
  const n = Math.max(0, tageDazwischen(von, bis));
  for (let i = 0; i <= n; i++) {
    const t = tagesWert(eintraege, plusTage(von, i), tage);
    if (t.notiert) werte.push(t.wert);
  }
  return {
    von,
    bis,
    tage: n + 1,
    notierte: werte.length,
    schnitt: werte.length ? werte.reduce((a, b) => a + b, 0) / werte.length : 0,
    frei: werte.filter((w) => w === 0).length,
  };
}

/**
 * Wie sauber der Versuch gelaufen ist.
 *
 * Das Tagebuch weiß es besser als die Erinnerung: Wenn in der Auslasszeit an
 * vier Tagen Milch eingetragen ist, war es keine Auslasszeit – und das gehört
 * ins Ergebnis, nicht unter den Tisch. Ein unsauberer Versuch ist kein
 * Misserfolg, er ist nur keine Antwort.
 */
function treue(eintraege, v, von, bis) {
  const mahlzeiten = eintraege.filter((e) => e.art === 'essen' && e.am >= von && e.am <= bis);
  const verstoesse = mahlzeiten.filter((e) => betrifft(e, v.art, v.ziel));
  const tage = [...new Set(verstoesse.map((e) => e.am))];
  return {
    mahlzeiten: mahlzeiten.length,
    verstoesse: verstoesse.length,
    tage: tage.length,
    // Zwei Ausrutscher in vierzehn Tagen sind menschlich; ab da wird die
    // Aussage dünn.
    sauber: tage.length <= 2,
  };
}

const VERSUCH_URTEIL = {
  dafuer: 'spricht dafür',
  unklar: 'unklar',
  dagegen: 'spricht dagegen',
  offen: 'noch offen',
  unsauber: 'nicht auswertbar',
  zuwenig: 'zu wenige Tage',
};

/**
 * Das Ergebnis.
 *
 * Drei Zahlen tragen es: der eigene Durchschnitt *vor* dem Versuch, der
 * *während* der Auslasszeit und der *nach* der Wiedereinführung. Verglichen
 * wird gegen den eigenen Ausgangswert und nicht gegen null – dieselbe Regel wie
 * überall in dieser App, und aus demselben Grund.
 *
 * Eine ganze Stufe auf der Zehnerskala ist die Schwelle. Darunter ist es
 * Rauschen, und Rauschen als Ergebnis auszugeben wäre die eine Art, mit der so
 * ein Versuch schadet: Wer daraufhin ein Lebensmittel für immer streicht, isst
 * einseitiger, ohne dass es ihm besser geht.
 */
function ergebnis(v, eintraege, tage, heute) {
  if (!v) return null;
  const p = phase(v, heute);
  const eintr = eintraege || [];

  const auslassBis = plusTage(v.start, v.tage - 1);
  const vorher = abschnitt(eintr, tage, plusTage(v.start, -v.tage), plusTage(v.start, -1));
  const auslass = abschnitt(eintr, tage,
    v.start, p === 'auslass' ? heute : auslassBis);
  const nachher = v.provokation
    ? abschnitt(eintr, tage, v.provokation,
      plusTage(v.provokation, PROVOKATION_TAGE - 1))
    : null;
  const t = treue(eintr, v, v.start, p === 'auslass' ? heute : auslassBis);

  const besserung = vorher.schnitt - auslass.schnitt;
  const rueckkehr = nachher ? nachher.schnitt - auslass.schnitt : null;

  let urteil = 'offen';
  let satz = '';
  if (vorher.notierte < 5 || auslass.notierte < 5) {
    urteil = 'zuwenig';
    satz = `Für einen Vergleich braucht es auf beiden Seiten mindestens fünf notierte `
      + `Tage – bisher ${vorher.notierte} davor und ${auslass.notierte} währenddessen. `
      + `Eine Lücke im Tagebuch ist kein beschwerdefreier Tag.`;
  } else if (!t.sauber) {
    urteil = 'unsauber';
    satz = `An ${t.tage} Tagen der Auslasszeit steht es doch im Tagebuch. Das ist `
      + `kein Vorwurf, aber es ist keine Antwort: Was in der Auslasszeit vorkam, `
      + `kann man nicht als weggelassen rechnen.`;
  } else if (p === 'auslass' || p === 'reif') {
    urteil = 'offen';
    satz = besserung >= 1
      ? `Bisher ${besserung.toFixed(1).replace('.', ',')} Stufen besser als davor. `
        + `Das allein beweist nichts – nach zwei Wochen ohne irgendetwas geht es `
        + `den meisten besser. Die Antwort bringt erst die Wiedereinführung.`
      : `Bisher kein deutlicher Unterschied zu den ${vorher.notierte} Tagen davor. `
        + `Der Versuch läuft weiter.`;
  } else if (nachher && nachher.notierte < 2) {
    urteil = 'offen';
    satz = 'Nach der Wiedereinführung ist noch zu wenig eingetragen. Zwei, drei Tage '
      + 'notieren, dann steht das Ergebnis hier.';
  } else if (besserung >= 1 && rueckkehr >= 1) {
    urteil = 'dafuer';
    satz = `Ohne war es ${besserung.toFixed(1).replace('.', ',')} Stufen besser, und `
      + `mit der Wiedereinführung kam es um ${rueckkehr.toFixed(1).replace('.', ',')} `
      + `Stufen zurück. Beides zusammen ist schwer anders zu erklären – das ist der `
      + `stärkste Hinweis, den ein Tagebuch hergibt.`;
  } else if (besserung >= 1) {
    urteil = 'unklar';
    satz = `Ohne war es ${besserung.toFixed(1).replace('.', ',')} Stufen besser, aber `
      + `mit der Wiedereinführung kam es nicht zurück. Das kann Zufall sein, `
      + `Gewöhnung, oder es lag an etwas anderem, das sich gleichzeitig geändert `
      + `hat. Ein zweiter Durchgang würde es klären.`;
  } else {
    urteil = 'dagegen';
    satz = `Ohne war es nicht besser (${vorher.schnitt.toFixed(1).replace('.', ',')} `
      + `davor, ${auslass.schnitt.toFixed(1).replace('.', ',')} während). Das ist ein `
      + `gutes Ergebnis: Es ist eine Sache weniger, auf die du verzichten musst.`;
  }

  return {
    phase: p,
    urteil,
    wort: VERSUCH_URTEIL[urteil],
    satz,
    vorher,
    auslass,
    nachher,
    besserung,
    rueckkehr,
    treue: t,
  };
}

/**
 * Was sich als nächstes zu prüfen lohnt.
 *
 * Vorgeschlagen wird, was in der Bilanz auffällt und oft genug vorkommt, um es
 * überhaupt weglassen zu können – Klassen vor einzelnen Zutaten, weil sich
 * hinter „Zwiebel" fast immer die ganze Klasse verbirgt und man beim Weglassen
 * einer einzelnen Zutat die übrigen weiter isst.
 */
function vorschlaege(nachKlassen, nachAusloesern, anzahl = 4) {
  const raus = [];
  (nachKlassen || []).filter((b) => b.genug && b.differenz >= 0.8)
    .slice(0, 2).forEach((b) => raus.push({ art: 'klasse', ziel: b.id, differenz: b.differenz, faelle: b.faelle }));
  (nachAusloesern || []).filter((b) => b.genug && b.differenz >= 1
    && !['gross', 'spaet'].includes(b.id))
    .slice(0, 3).forEach((b) => raus.push({ art: 'ausloeser', ziel: b.id, differenz: b.differenz, faelle: b.faelle }));
  return raus.sort((a, b) => b.differenz - a.differenz).slice(0, anzahl);
}

/* ===== js/ansprechen.js ===== */
/*
 * Ob ein Mittel etwas bewirkt – und was es heißt, wenn nicht.
 *
 * Diese App schlägt kein Medikament vor; das steht in js/rat.js und bleibt so.
 * Hier geht es um etwas anderes: Sie *nimmt* schon etwas, sie trägt es ein, und
 * niemand rechnet nach, ob es wirkt. Genau diese Rechnung ist in der
 * Sprechstunde eine eigene Auskunft.
 *
 * Denn ausbleibendes Ansprechen ist selbst ein Befund. Ein Säureblocker, der
 * nach vier bis acht Wochen nichts geändert hat, spricht gegen die Säure als
 * Ursache – und damit für eine funktionelle Störung oder für etwas, das noch
 * nicht gefunden wurde. Das ist eine der wenigen Stellen, an denen ein
 * Tagebuch eine Untersuchung ersetzen kann: Der „PPI-Versuch" ist genau das,
 * ein Versuch mit Beobachtung, und beobachtet wird hier ohnehin.
 *
 * WAS HIER TROTZDEM NICHT PASSIERT: kein „nimm mehr", kein „setz es ab", kein
 * „wechsle das Präparat". Ein Säureblocker wird nach längerer Einnahme nicht
 * von einem Tag auf den anderen weggelassen – der Magen antwortet dann mit mehr
 * Säure als vorher. Was hier steht, ist die Zahl und die Frage dazu.
 *
 * Reine Rechnung, alles kommt als Argument herein.
 */


/** Ab so vielen Einnahmetagen lohnt der Vergleich überhaupt. */
const MINDEST_TAGE = 8;

/** Ab so vielen Wochen ist ein Säureblocker-Versuch ausgereizt. */
const PPI_WOCHEN = 4;

/** Gruppen, bei denen ausbleibendes Ansprechen eine eigene Aussage ist. */
const SAEURE_GRUPPEN = ['ppi', 'h2'];

function schnittUeber(eintraege, tage, von, bis) {
  const werte = [];
  const n = Math.max(0, tageDazwischen(von, bis));
  for (let i = 0; i <= n; i++) {
    const t = tagesWert(eintraege, plusTage(von, i), tage);
    if (t.notiert) werte.push(t.wert);
  }
  return {
    notierte: werte.length,
    schnitt: werte.length ? werte.reduce((a, b) => a + b, 0) / werte.length : 0,
    frei: werte.filter((w) => w === 0).length,
  };
}

/**
 * Ein Mittel gegen die Zeit davor.
 *
 * Der Vergleichszeitraum ist genauso lang wie die Einnahmezeit und liegt
 * unmittelbar davor. Das ist die ehrlichste Zuordnung, die aus einem Tagebuch
 * herauszuholen ist – und sie hat eine bekannte Schwäche, die dabeisteht: Man
 * fängt ein Mittel meistens an, *weil* es gerade besonders schlecht ist.
 * Danach wird es oft von selbst wieder besser, Mittel hin oder her. Deshalb
 * sagt eine Besserung hier weniger als ein Ausbleiben.
 */
function mittelBilanz(eintraege, tage, opt = {}) {
  const gruppeVon = opt.gruppeVon || (() => null);
  const heute = opt.heute;
  const alle = eintraege || [];

  const nachName = new Map();
  alle.filter((e) => e.art === 'medikament').forEach((e) => {
    const name = String(e.mittel || '').trim();
    if (!name) return;
    // Groß- und Kleinschreibung zusammenfassen, sonst stehen „Pantoprazol" und
    // „pantoprazol" als zwei Mittel da, jedes mit der halben Fallzahl.
    const schluessel = name.toLowerCase();
    const v = nachName.get(schluessel) || { name, tage: new Set() };
    v.name = name;
    v.tage.add(e.am);
    nachName.set(schluessel, v);
  });

  const raus = [];
  nachName.forEach((v) => {
    const tageListe = [...v.tage].sort();
    const von = tageListe[0];
    const bis = tageListe[tageListe.length - 1];
    const gruppe = gruppeVon(v.name);
    const spanne = tageDazwischen(von, bis) + 1;
    const laeuft = heute ? tageDazwischen(bis, heute) <= 3 : false;

    if (tageListe.length < MINDEST_TAGE) {
      raus.push({
        name: v.name,
        gruppe,
        einnahmeTage: tageListe.length,
        genug: false,
        fehlt: MINDEST_TAGE - tageListe.length,
        seit: von,
        zuletzt: bis,
        laeuft,
      });
      return;
    }

    // Der Zeitraum der Einnahme, nicht nur die Tage mit Eintrag: Wer ein Mittel
    // täglich nimmt, trägt es nicht täglich ein.
    const unter = schnittUeber(alle, tage, von, bis);
    const davor = schnittUeber(alle, tage, plusTage(von, -spanne), plusTage(von, -1));
    const differenz = davor.schnitt - unter.schnitt;
    const vergleichbar = davor.notierte >= 5 && unter.notierte >= 5;
    const wochen = spanne / 7;

    let urteil = 'offen';
    if (!vergleichbar) urteil = 'zuwenig';
    else if (differenz >= 1) urteil = 'besser';
    else if (differenz <= -1) urteil = 'schlechter';
    else urteil = 'unveraendert';

    raus.push({
      name: v.name,
      gruppe,
      einnahmeTage: tageListe.length,
      genug: true,
      seit: von,
      zuletzt: bis,
      spanne,
      wochen,
      laeuft,
      davor,
      unter,
      differenz,
      vergleichbar,
      urteil,
      // Der Fall, für den es diese Datei gibt: ein Säureblocker, lange genug
      // genommen, ohne dass sich etwas geändert hat.
      saeureVersuchAusgereizt: SAEURE_GRUPPEN.includes(gruppe)
        && wochen >= PPI_WOCHEN && vergleichbar && differenz < 1,
    });
  });

  return raus.sort((a, b) => (b.einnahmeTage - a.einnahmeTage));
}

const ANSPRECHEN_URTEIL = {
  besser: 'darunter besser',
  schlechter: 'darunter schlechter',
  unveraendert: 'kein Unterschied',
  zuwenig: 'zu wenige notierte Tage',
  offen: 'noch offen',
};

/**
 * Der Satz, der in die Sprechstunde gehört.
 *
 * Für jedes Mittel mit genug Tagen einer – und für den ausgereizten
 * Säureblocker der eine, der etwas verändert: Er beendet eine Frage, statt eine
 * neue aufzumachen.
 */
function befund(m) {
  if (!m.genug) {
    return `Noch ${m.fehlt} Einnahmetage, dann lässt sich vergleichen.`;
  }
  if (!m.vergleichbar) {
    return 'Vor der Einnahme sind zu wenige Tage notiert, um zu vergleichen.';
  }
  const zahlen = `${m.davor.schnitt.toFixed(1).replace('.', ',')} davor gegen `
    + `${m.unter.schnitt.toFixed(1).replace('.', ',')} darunter `
    + `(${m.davor.notierte} gegen ${m.unter.notierte} notierte Tage).`;

  if (m.saeureVersuchAusgereizt) {
    return `Seit ${Math.round(m.wochen)} Wochen im Gebrauch, ohne dass sich die `
      + `Beschwerdestärke geändert hätte: ${zahlen} Das ist selbst ein Befund. `
      + `Wenn Säure die Ursache wäre, wäre nach vier bis acht Wochen etwas zu `
      + `sehen. Frage für den Termin: Was heißt es, dass es darunter nicht besser `
      + `geworden ist – und wie geht es weiter? Nicht von selbst absetzen: Nach `
      + `längerer Einnahme antwortet der Magen kurzzeitig mit mehr Säure als vorher.`;
  }
  if (m.urteil === 'besser') {
    return `Darunter ${m.differenz.toFixed(1).replace('.', ',')} Stufen besser: ${zahlen} `
      + `Vorsicht bei der Deutung: Ein Mittel fängt man meist an, wenn es gerade `
      + `besonders schlecht ist – danach wird es oft von selbst wieder besser.`;
  }
  if (m.urteil === 'schlechter') {
    return `Darunter schlechter als davor: ${zahlen} Das heißt nicht, dass das `
      + `Mittel schadet – eher, dass es angefangen wurde, als es schlechter wurde. `
      + `Wenn es dabei bleibt, gehört es angesprochen.`;
  }
  return `Kein Unterschied zur Zeit davor: ${zahlen} Ob das gegen das Mittel `
    + `spricht, hängt daran, wie lange es schon läuft – ${Math.round(m.wochen)} `
    + `${m.wochen < 2 ? 'Woche' : 'Wochen'} bisher.`;
}

/* ===== js/luecken.js ===== */
/*
 * Was noch fehlt – und was nur eine Untersuchung beantworten kann.
 *
 * Bis hierher sagt die App, was sie sieht. Diese Datei sagt, was sie *nicht*
 * sieht, und das ist bei einem Tagebuch die nützlichere Hälfte. Zwei Sorten
 * Lücken, sauber getrennt, weil sie verschiedene Schlüsse verlangen:
 *
 *   1. **Lücken im Tagebuch.** Fragen, die offen sind, weil etwas nicht
 *      eingetragen wurde. Die kann sie selbst schließen, und hier steht, womit
 *      und wie viel es noch braucht. Das ist der Unterschied zwischen einer App,
 *      die mitschreibt, und einer, die weiterfragt.
 *
 *   2. **Lücken, die keine App schließt.** Helicobacter, Gewebe, Blutwerte,
 *      Atemtest. Dort steht nicht „unbekannt", sondern welche Untersuchung die
 *      Frage beantwortet – die eine Zeile, für die sich der ganze Aufwand
 *      lohnt, weil man sie beim Termin vorlesen kann.
 *
 * Kein Ranking von Diagnosen nach Wahrscheinlichkeit. Was hier je Verdacht
 * steht, ist: was dafür spricht, was dagegen, und was es entscheidet. Die
 * Entscheidung selbst fällt woanders.
 */

/** Wie weit ein Verdacht aus dem Tagebuch heraus gestützt ist. */
const STAND_WORT = {
  gestuetzt: 'passt zum Verlauf',
  moeglich: 'kommt in Frage',
  unwahrscheinlich: 'spricht eher dagegen',
  offen: 'nicht beurteilbar',
};

/* ---------------------------------------------------------------------------
 * 1. Was sie selbst schließen kann
 * ---------------------------------------------------------------------------
 *
 * Sortiert nach Gewicht: Was die meisten Fragen auf einmal aufmacht, steht
 * oben. Eine Liste mit fünfzehn Punkten liest niemand – die Anzeige nimmt die
 * ersten paar.
 */
function tagebuchLuecken(d) {
  const raus = [];
  const k = d.kriterien;
  const s = d.stuhl;
  const nimm = (id, gewicht, titel, text) => raus.push({ id, gewicht, titel, text });

  if (s.gesamt === 0) {
    nimm('stuhl', 10, 'Stuhlgang eintragen',
      'Die größte Lücke. Ohne Häufigkeit und Form lässt sich ein Reizdarm '
      + 'im Tagebuch überhaupt nicht prüfen, und der Typ – Verstopfung, '
      + 'Durchfall, gemischt – entscheidet in der Praxis über die Behandlung. '
      + 'Zwei Tipper am Tag, mit Bildchen statt Text.');
  } else if (s.gesamt < 15) {
    nimm('stuhl', 8, 'Weiter Stuhlgang eintragen',
      `${s.gesamt} von 15 Eintragungen. Ab fünfzehn lässt sich der Typ `
      + 'bestimmen; darunter kippt der Anteil mit jedem einzelnen Eintrag.');
  }

  if (!k.dauer.seit) {
    nimm('seit', 9, 'Seit wann hast du das?',
      'Die eine Angabe, die aus dem Tagebuch grundsätzlich nicht hervorgeht – '
      + 'es beginnt an dem Tag, an dem du anfängst zu schreiben. Die '
      + 'Rom-Kriterien verlangen einen Beginn vor mindestens einem halben '
      + 'Jahr. Steht unter „Mehr", dauert fünf Sekunden.');
  }

  const bez = d.bezug;
  if (bez && !bez.genug) {
    nimm('stuhlbezug', 7, 'Die Frage nach dem Stuhlgang beantworten',
      `Unten im Beschwerdebogen: „Danach besser, schlechter, unverändert?" `
      + `Bisher ${bez.beantwortet} von 4 Malen beantwortet. Das ist eines der `
      + 'drei Merkmale, an denen ein Reizdarmsyndrom festgemacht wird, und das '
      + 'einzige, das sich nicht aus Zahlen ableiten lässt.');
  }

  if (!d.benutzt.oberbauch || !d.benutzt.saettigung) {
    nimm('arten', 6, 'Zwei neue Beschwerdezeilen benutzen',
      'Im Beschwerdebogen stehen jetzt „Schmerz im Oberbauch" und „Früh satt". '
      + 'Sie klingen wie „Brennen" und „kein Appetit" und sind etwas anderes: '
      + 'An ihnen hängt, ob sich das Bild eher als Schmerz- oder als '
      + 'Völlegefühl-Typ einordnen lässt – zwei Formen, die verschieden '
      + 'behandelt werden.');
  }

  if (k.zeitraum.notierteTage < 30) {
    nimm('tage', 8, 'Regelmäßiger eintragen',
      `In den letzten drei Monaten sind ${k.zeitraum.notierteTage} Tage notiert. `
      + 'Ab dreißig lassen sich die Rom-Kriterien rechnen. Wichtig ist nicht die '
      + 'Menge je Tag, sondern dass kein Tag fehlt – eine Lücke ist kein guter '
      + 'Tag, und Lücken häufen sich genau in den schlechten Wochen.');
  } else if (k.zeitraum.tagebuchTage < 90) {
    nimm('tage', 4, 'Weiterschreiben',
      `Das Tagebuch läuft seit ${k.zeitraum.tagebuchTage} Tagen. Die `
      + 'Rom-Kriterien schauen auf drei Monate – bis dahin ist jede Aussage '
      + 'dazu vorläufig.');
  }

  if (!k.gerdq.belastbar) {
    nimm('gerdq', 5, 'Die letzte Woche vollständig eintragen',
      `Der GerdQ schaut auf sieben Tage; erfasst sind davon ${k.gerdq.erfasst}. `
      + 'Was nicht eingetragen ist, zählt als „nicht gehabt" – die Punktzahl ist '
      + 'dann zu niedrig statt falsch, aber eben auch nicht zu gebrauchen.');
  }

  if (!d.nachtwachAn) {
    nimm('nachtwach', 4, 'Die Frage „Nachts davon wach" anschalten',
      'Sie steht unter „Mehr" bei den Tagesfragen. Im GerdQ ist sie eine eigene '
      + 'Frage, und in der Sprechstunde eine der ersten – Beschwerden, die aus '
      + 'dem Schlaf reißen, sind etwas anderes als solche am Tag.');
  }

  if (d.versuchMoeglich && !d.versuchLaeuft) {
    nimm('versuch', 7, 'Einen Auslassversuch machen',
      'In deiner Bilanz steht etwas Auffälliges. Zählen allein macht daraus nie '
      + 'einen Beleg – wer an schlechten Tagen anders isst, findet sein Essen '
      + 'auffällig, ohne dass es damit zu tun hat. Zwei Wochen weglassen, dann '
      + 'bewusst wieder essen: Das ist der einzige Weg von „fällt zusammen" zu '
      + '„liegt daran". Steht unter „Muster".');
  }

  const ohneZutaten = d.mahlzeitenOhneZutaten;
  if (ohneZutaten >= 5) {
    nimm('zutaten', 3, 'Bei Mahlzeiten ankreuzen, was drin war',
      `${ohneZutaten} Mahlzeiten stehen ohne angekreuzte Zutat da. Sie zählen `
      + 'für den Verlauf, aber für keine einzige Auslöserfrage.');
  }

  return raus.sort((a, b) => b.gewicht - a.gewicht);
}

/* ---------------------------------------------------------------------------
 * 2. Was keine App schließt
 * ---------------------------------------------------------------------------
 *
 * Je Verdacht: was im Tagebuch dafür spricht, was dagegen, was offen bleibt –
 * und die Untersuchung, die es entscheidet. Die letzte Zeile ist die, für die
 * es diese Liste gibt.
 */
const VERDAECHTE = [
  {
    id: 'hpylori',
    name: 'Helicobacter pylori',
    was: 'Ein Bakterium in der Magenschleimhaut. Häufigste Ursache von Gastritis '
      + 'und Magengeschwür – und die einzige Möglichkeit auf dieser Liste, die '
      + 'sich in zwei Wochen behandeln und danach abhaken lässt.',
    untersuchung: 'Atemtest, Stuhltest oder Gewebeprobe bei der Spiegelung. '
      + 'Wichtig: Säureblocker zwei Wochen vorher absetzen (nach Absprache), '
      + 'sonst wird der Test falsch negativ.',
    frage: 'Wäre ein Test auf Helicobacter pylori sinnvoll?',
    pruefe: (d) => {
      const dafuer = [];
      const m = d.musterIds;
      if (m.includes('nuechtern')) dafuer.push('Der Nüchternschmerz ist das klassische Muster dafür.');
      if (m.includes('saeure')) dafuer.push('Das säuretypische Bild passt dazu.');
      return {
        stand: 'offen',
        dafuer,
        dagegen: [],
        offen: 'Aus einem Tagebuch grundsätzlich nicht zu sehen. Ein Bakterium '
          + 'macht kein eigenes Muster – es macht die Entzündung, die dann alles '
          + 'andere macht.',
      };
    },
  },
  {
    id: 'ulkus',
    name: 'Magen- oder Zwölffingerdarmgeschwür',
    was: 'Ein Defekt in der Schleimhaut. Tut typischerweise nüchtern weh und wird '
      + 'nach dem Essen kurz besser.',
    untersuchung: 'Magenspiegelung. Sie ist auch die einzige, die eine Blutung '
      + 'gleich mitbehandeln kann.',
    frage: 'Der Schmerz kommt nüchtern und bessert sich nach dem Essen – ist eine '
      + 'Magenspiegelung angezeigt?',
    pruefe: (d) => {
      const dafuer = [];
      const dagegen = [];
      if (d.musterIds.includes('nuechtern')) {
        dafuer.push(`${d.essen.nuechtern} von ${d.essen.bewertbar} zuordenbaren `
          + 'Beschwerden kamen erst vier Stunden oder länger nach dem Essen.');
      }
      if (d.nsarTage >= 3) dafuer.push(`An ${d.nsarTage} Tagen ein entzündungshemmendes Schmerzmittel.`);
      // An der Engstelle eines Zwerchfellbruchs können kleine Schleimhautdefekte
      // entstehen – bei großen Brüchen häufiger –, und ein NSAR macht das
      // wahrscheinlicher.
      const bruchMitNsar = (d.befundIds || []).includes('hiatushernie') && d.nsarTage >= 1;
      if (bruchMitNsar) {
        dafuer.push('Zwerchfellbruch und entzündungshemmendes Schmerzmittel zusammen: '
          + 'An der Engstelle des Bruchs können kleine Schleimhautdefekte entstehen '
          + '(bei großen Brüchen häufiger), und ein solches Mittel macht das '
          + 'wahrscheinlicher.');
      }
      if (d.essen.bewertbar >= 8 && d.essen.anteilNachDemEssen >= 0.6) {
        dagegen.push('Die Beschwerden kommen überwiegend kurz *nach* dem Essen, '
          + 'nicht nüchtern.');
      }
      // Die Frage so, wie sie sich vorlesen lässt: Ohne Nüchternmuster darf
      // sie keines behaupten.
