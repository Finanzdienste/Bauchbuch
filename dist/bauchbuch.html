<style>
/*
 * Ein Blatt für alles. Keine Voreinstellung von außen, kein Baukasten.
 *
 * Dunkel als Grundton, und das hat hier einen Grund über den Geschmack hinaus:
 * Ein Magentagebuch wird oft nachts aufgemacht, wenn jemand davon wach
 * geworden ist. Ein weißes Bild ist in diesem Moment eine Zumutung.
 *
 * Die Farben liegen als Variablen auf :root, die Farbwahl ändert nur die
 * Akzente – Hintergrund, Linien und die Ampel von grün bis rot bleiben, damit
 * ein Verlauf in jeder Einstellung gleich zu lesen ist.
 */

:root {
  /* Der Grund bleibt dunkel und wird nur warm getönt statt neutral grau: Ein
     rosa Akzent auf blaustichigem Grau wird schmutzig, auf einem Grund mit
     einem Hauch Rot bleibt er rosa. */
  --bg: #141013;
  --bg-elev: #1c171b;
  --bg-elev-2: #251f24;
  --line: #362c33;
  --text: #efe9ec;
  --muted: #a5959e;
  --accent: #ff7fb0;
  --accent-weich: #ff7fb022;
  /* Die Ampel des Verlaufs. Vier Stufen, und sie bleiben in jeder Farbwahl
     gleich: Ein Kalender, dessen Farben mit dem Design wandern, ist nach dem
     dritten Umstellen nicht mehr zu lesen.

     --leicht ist bewusst kein Grün und auch nicht die Akzentfarbe. Vorher war
     es die – und weil der Grundton dieser App salbeigrün ist, sahen ein
     beschwerdefreier Tag und ein Tag mit Stärke 2 im Monatsraster fast gleich
     aus. Genau diese beiden auseinanderzuhalten ist der Zweck des Rasters. */
  --ok: #58c48c;
  --leicht: #c2bd57;
  --warn: #dda03f;
  --bad: #e07268;
  /* Damit der Browser auch seine eigenen Bedienelemente dunkel zeichnet –
     ohne das stehen die Datums- und Uhrzeitfelder als weiße Kästen im
     dunklen Blatt. */
  color-scheme: dark;
  --radius: 14px;
  --tabbar-h: 60px;
  --safe-b: env(safe-area-inset-bottom, 0px);
}

:root[data-theme="flieder"] { --accent: #c79bec; --accent-weich: #c79bec22; }
:root[data-theme="koralle"] { --accent: #ff8f7a; --accent-weich: #ff8f7a22; }
:root[data-theme="salbei"]  { --accent: #6dbf9a; --accent-weich: #6dbf9a22; }

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  /* Kein Ziehen-zum-Neuladen: Am oberen Rand nach unten zu wischen lud sonst
     die Seite neu und warf aus dem Bogen, den man gerade ausfüllt. */
  overscroll-behavior-y: contain;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 16px;
  line-height: 1.45;
  -webkit-text-size-adjust: 100%;
}

body.bogen-auf { overflow: hidden; }

button { font: inherit; color: inherit; }
h2, h3 { margin: 0 0 8px; }
h2 { font-size: 19px; }
h3 { font-size: 16px; }
p { margin: 0 0 8px; }

/* ---------- Kopf ---------- */
.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
  padding-top: env(safe-area-inset-top, 0px);
}
.topbar-in {
  max-width: 680px;
  margin: 0 auto;
  padding: 10px 14px;
  display: flex;
  align-items: baseline;
  gap: 10px;
  flex-wrap: wrap;
}
.brand { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: .3px; }
.brand::before {
  content: "";
  display: inline-block;
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--accent);
  margin-right: 8px;
  vertical-align: middle;
}
.brand-sub { margin: 0; font-size: 12px; color: var(--muted); }

/* ---------- Rumpf ---------- */
.view {
  max-width: 680px;
  margin: 0 auto;
  padding: 14px 14px calc(var(--tabbar-h) + var(--safe-b) + 22px);
}
.view:focus { outline: none; }

.karte {
  background: var(--bg-elev);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 14px;
  margin-bottom: 12px;
}
.karte.warn { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, var(--bg-elev)); }
.karte.hinweis { background: none; }

.klein { font-size: 13px; color: var(--muted); }
.klein.warnend { color: var(--warn); }
.leer {
  color: var(--muted);
  text-align: center;
  padding: 26px 10px;
  border: 1px dashed var(--line);
  border-radius: var(--radius);
  margin-bottom: 12px;
}
.feld-name { font-size: 13px; color: var(--muted); margin: 12px 0 6px; }
.reihe { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.reihe-zeit { margin-bottom: 4px; }

/* ---------- Knöpfe ---------- */
.btn {
  background: var(--bg-elev-2);
  border: 1px solid var(--line);
  border-radius: 11px;
  padding: 10px 14px;
  cursor: pointer;
  min-height: 44px;
}
.btn:disabled { opacity: .35; cursor: default; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: #1a1014; font-weight: 600; }
.btn-ghost { background: none; }
.btn-danger { background: none; border-color: var(--bad); color: var(--bad); }
.btn-block { display: block; width: 100%; }
.btn-rund { width: 44px; padding: 0; border-radius: 50%; font-size: 20px; line-height: 1; }

.feld {
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 11px;
  padding: 10px 12px;
  color: var(--text);
  min-height: 44px;
  font: inherit;
}
.feld-breit { display: block; width: 100%; }
.feld:focus-visible, .btn:focus-visible, .marke:focus-visible, .stufe:focus-visible,
.tab:focus-visible, .feld-name:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- Tagkopf ---------- */
.tagkopf { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.tagkopf-mitte { flex: 1; text-align: center; }
.tagkopf-mitte h2 { margin: 0; }
.tag-datum {
  background: none; border: none; color: var(--muted);
  font: inherit; font-size: 13px; padding: 0;
}

.tagbilanz { text-align: center; }
.gross { font-size: 26px; font-weight: 700; }
.gross.gut { color: var(--ok); }
.gross.mittel { color: var(--warn); }
.gross.schlecht { color: var(--bad); }

/* ---------- Anlegen ---------- */
/* Fünf Knöpfe nebeneinander wären auf einem schmalen Handy je 68 Pixel breit
 * und die Beschriftung dreizeilig. Zwei Reihen zu drei und zwei sind ruhiger,
 * und die beiden, die täglich gebraucht werden, stehen oben links. */
.anlegen { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
.anlegen-btn {
  background: var(--bg-elev);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 12px 4px 10px;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  font-size: 12px; cursor: pointer; min-height: 74px;
}
.anlegen-btn:active { background: var(--bg-elev-2); }
.anlegen-i { font-size: 21px; line-height: 1; }
.a-essen { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.a-beschwerde { border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); }
.a-stuhl { border-color: color-mix(in srgb, var(--warn) 40%, var(--line)); }
.a-kopf { border-color: color-mix(in srgb, var(--leicht) 50%, var(--line)); }

/* ---------- Bristol-Skala ---------- */
/* Sieben Zeilen mit Zahl, Zeichnung und Namen. Untereinander statt als Raster:
 * Die Skala ist eine Reihenfolge von hart nach flüssig, und die soll man
 * sehen – als Kacheln wäre sie eine Auswahl unter Gleichen. */
.bristol { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
.bristol-btn {
  display: grid; grid-template-columns: 26px 46px 1fr; align-items: center; gap: 10px;
  background: var(--bg-elev); border: 1px solid var(--line);
  border-left-width: 3px; border-radius: var(--radius);
  padding: 9px 10px; text-align: left; cursor: pointer; color: inherit;
}
.bristol-btn.g-hart { border-left-color: color-mix(in srgb, var(--warn) 60%, var(--line)); }
.bristol-btn.g-normal { border-left-color: color-mix(in srgb, var(--ok) 60%, var(--line)); }
.bristol-btn.g-weich { border-left-color: color-mix(in srgb, var(--warn) 60%, var(--line)); }
.bristol-btn.an { background: var(--accent-weich); border-color: var(--accent); }
.bristol-n { font-size: 17px; font-weight: 600; text-align: center; }
.bristol-bild { font-size: 15px; letter-spacing: 1px; color: var(--muted); text-align: center; }
.bristol-name { font-size: 13px; }

/* ---------- Der Strang des Tages ---------- */
.strang { list-style: none; margin: 0 0 14px; padding: 0; }
.strang-zeile {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 10px;
  border: 1px solid var(--line);
  border-left-width: 3px;
  border-radius: 11px;
  margin-bottom: 6px;
  background: var(--bg-elev);
}
.z-essen { border-left-color: var(--accent); }
.z-beschwerde { border-left-color: var(--bad); }
.z-medikament { border-left-color: var(--warn); }
.z-kopf { border-left-color: var(--leicht); }
.z-notiz { border-left-color: var(--muted); }
.strang-uhr { font-variant-numeric: tabular-nums; font-size: 13px; color: var(--muted); min-width: 40px; }
.strang-punkt { font-size: 15px; }
.strang-text {
  flex: 1; text-align: left; background: none; border: none; padding: 4px 0;
  cursor: pointer; font: inherit; min-height: 36px;
}
.strang-text b { font-weight: 600; display: block; font-size: 15px; }
.zeile-tags { display: block; font-size: 12px; color: var(--muted); }
.strang-weg {
  background: none; border: none; color: var(--muted);
  font-size: 22px; line-height: 1; cursor: pointer;
  width: 36px; height: 36px; border-radius: 50%;
}
.strang-weg:active { background: var(--bg-elev-2); }

/* ---------- Marken, Skala, Wahl ---------- */
.marken { display: flex; flex-wrap: wrap; gap: 6px; }
.marke {
  background: var(--bg-elev-2);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 8px 12px;
  font-size: 14px;
  cursor: pointer;
  min-height: 40px;
}
.marke.an { background: var(--accent-weich); border-color: var(--accent); color: var(--text); }
.marke-i { margin-right: 5px; }

.skala { display: grid; grid-template-columns: repeat(11, 1fr); gap: 4px; }
.stufe {
  border: 1px solid var(--line);
  background: var(--bg-elev-2);
  border-radius: 9px;
  padding: 0;
  height: 42px;
  font-size: 13px;
  cursor: pointer;
}
.stufe.an { color: #1a1014; font-weight: 700; }
.stufe.s-null.an { background: var(--ok); border-color: var(--ok); }
.stufe.s-tief.an { background: var(--accent); border-color: var(--accent); }
.stufe.s-mittel.an { background: var(--warn); border-color: var(--warn); }
.stufe.s-hoch.an { background: var(--bad); border-color: var(--bad); }
.skala-wort { font-size: 13px; color: var(--muted); text-align: center; margin: 6px 0 0; }

.vier { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
.vier-btn {
  background: var(--bg-elev-2); border: 1px solid var(--line);
  border-radius: 9px; padding: 9px 2px; font-size: 12px; cursor: pointer; min-height: 42px;
}
.vier-btn.an { background: var(--accent-weich); border-color: var(--accent); }

.wahl { display: flex; gap: 6px; flex-wrap: wrap; }
/* Lange Antworten untereinander („Ausgefallen – hinlegen müssen, …"): als
   Reihe würden sie dreizeilig umbrechen und wären nicht mehr zu treffen. */
.wahl-spalte { flex-direction: column; align-items: stretch; }
.wahl-spalte .wahl-btn { text-align: left; border-radius: var(--radius); }
.wahl-btn {
  background: var(--bg-elev-2); border: 1px solid var(--line);
  border-radius: 999px; padding: 8px 14px; cursor: pointer; font-size: 14px; min-height: 40px;
}
.wahl-btn.an { background: var(--accent-weich); border-color: var(--accent); }

/* ---------- Zutaten mit ihrer Rolle ---------- */
.marken-eng { margin-top: 6px; }
.marken-eng .marke { font-size: 13px; padding: 6px 10px; min-height: 34px; color: var(--muted); }
.marke-zahl { color: var(--accent); font-size: 11px; margin-left: 3px; }
/* Die Karte, die um etwas bittet – auffälliger als eine gewöhnliche,
   aber nicht so laut wie eine Warnung. */
.karte-merk { border-color: var(--accent); background: var(--accent-weich); }
.zutaten { display: flex; flex-direction: column; gap: 6px; }
.zutat {
  display: flex; align-items: center; gap: 8px;
  background: var(--bg-elev-2);
  border: 1px solid var(--line);
  border-radius: 11px;
  padding: 6px 8px 6px 12px;
}
.zutat-name { flex: 1; font-size: 14px; min-width: 0; overflow-wrap: anywhere; }
/* Das Menü darf schmal sein, aber nicht schmaler als sein längster Eintrag –
   sonst steht dort "Würze oder Sa…" und die Angabe ist geraten. */
.zutat-rolle { flex: none; min-height: 38px; padding: 6px 8px; font-size: 13px; }

.rollen { list-style: none; margin: 8px 0 0; padding: 8px 0 0; border-top: 1px solid var(--line); }
.rollen li {
  display: flex; justify-content: space-between; gap: 8px;
  font-size: 13px; padding: 3px 0;
}
.rollen li > .klein { white-space: nowrap; }

/* ---------- Kacheln und Tafel ---------- */
.kacheln { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 12px; }
.kachel {
  background: var(--bg-elev); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 12px; text-align: center;
}
.kachel b { display: block; font-size: 22px; }
.kachel span { font-size: 12px; color: var(--muted); }

.tafel { margin: 0; }
.tafel-titel { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
.tafel svg { width: 100%; height: 120px; display: block; }
.tafel-fuss {
  display: flex; justify-content: space-between;
  font-size: 12px; color: var(--muted); margin-top: 6px;
}

.vgl { margin: 8px 0; }
.vgl-zeile { display: flex; align-items: center; gap: 8px; font-size: 13px; margin-bottom: 4px; }
.vgl-mark { color: var(--muted); min-width: 52px; }
.vgl-spur { flex: 1; height: 9px; background: var(--bg-elev-2); border-radius: 999px; overflow: hidden; }
.vgl-spur i { display: block; height: 100%; border-radius: 999px; }
.vgl-zeile b { font-variant-numeric: tabular-nums; min-width: 30px; text-align: right; }

/* ---------- Monatsraster ---------- */
.monatkopf { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.monatkopf h3 { flex: 1; text-align: center; margin: 0; }
.wochekopf, .raster { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.wochekopf { font-size: 11px; color: var(--muted); text-align: center; margin-bottom: 4px; }
/* Die Tagesfelder heißen .rfeld und nicht .feld: Diesen Namen trägt schon das
   Eingabefeld, und ein 44 Pixel hoher Kalendertag wäre ein Kalender, der nicht
   auf den Bildschirm passt. */
.rfeld {
  aspect-ratio: 1;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: var(--bg-elev-2);
  font-size: 12px;
  color: var(--muted);
  cursor: pointer;
  padding: 0;
}
.rfeld.fremd { opacity: .32; }
.rfeld.heute { outline: 2px solid var(--accent); outline-offset: -2px; }
.f-gut { background: color-mix(in srgb, var(--ok) 55%, var(--bg-elev-2)); color: var(--text); }
/* Nur Kopfschmerz, zum Bauch nichts: ein Rahmen statt einer Füllung – keine
   Bauchfarbe, aber auch nicht „leer". */
.f-kopf { background: var(--bg-elev-2); box-shadow: inset 0 0 0 2px var(--leicht); color: var(--text); }
.f-leicht { background: color-mix(in srgb, var(--leicht) 50%, var(--bg-elev-2)); color: var(--text); }
.f-mittel { background: color-mix(in srgb, var(--warn) 55%, var(--bg-elev-2)); color: var(--text); }
.f-schlecht { background: color-mix(in srgb, var(--bad) 60%, var(--bg-elev-2)); color: var(--text); }

.legende { display: flex; flex-wrap: wrap; gap: 10px; font-size: 11px; color: var(--muted); margin-top: 10px; }
.legende span { display: flex; align-items: center; gap: 4px; }
.legende i { width: 12px; height: 12px; border-radius: 4px; border: 1px solid var(--line); display: inline-block; }

/* ---------- Funde ---------- */
.funde { list-style: none; margin: 0 0 12px; padding: 0; }
.fund {
  background: var(--bg-elev); border: 1px solid var(--line);
  border-left-width: 3px; border-radius: var(--radius);
  padding: 12px; margin-bottom: 8px;
}
.fund.f-auffaellig { border-left-color: var(--bad); }
.fund.f-moeglich { border-left-color: var(--warn); }
.fund.f-neutral { border-left-color: var(--line); }
.fund.f-unauffaellig { border-left-color: var(--ok); }
.fund-kopf { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.fund-urteil { font-size: 12px; color: var(--muted); }

/* ---------- Richtung, Schnelleintrag, geprüfte Versuche, Schloss ---------- */

/* Der Trendkarte reicht ein Streifen an der Kante. Eine ganz rot eingefärbte
   Karte über „es wird schlechter" ist eine Wertung, wo eine Beobachtung
   steht – und sie stünde jeden Tag da. */
.trend { border-left-width: 3px; }
.trend.t-besser { border-left-color: var(--ok); }
.trend.t-schlechter { border-left-color: var(--warn); }
.trend.t-gleich { border-left-color: var(--line); }

.schnell { margin: 12px 0 4px; }
/* Die häufigen Mahlzeiten sollen wie ein Vorschlag aussehen, nicht wie die
   fünf großen Knöpfe darunter: derselbe Platz, weniger Gewicht. */
.marke-schnell { max-width: 100%; text-align: left; }

.geprueft { border-left: 3px solid var(--line); padding-left: 10px; }
.geprueft.g-dafuer { border-left-color: var(--bad); }
.geprueft.g-dagegen { border-left-color: var(--ok); }
.geprueft.g-unklar, .geprueft.g-offen { border-left-color: var(--warn); }
.geprueft.g-unsauber, .geprueft.g-zuwenig { border-left-color: var(--line); }

/* Der Störfaktorentest unter einem Fund. Zugeklappt, weil er die Begründung
   ist und nicht die Auskunft – wer sie will, tippt drauf. */
.stand { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 8px; }
.stand summary {
  cursor: pointer; font-size: 13px; color: var(--muted);
  min-height: 32px; display: flex; align-items: center;
}
.stand summary b { color: var(--text); margin-left: 4px; }
.stand.s-haelt summary b { color: var(--bad); }
.stand.s-verschwindet summary b { color: var(--ok); }
.stand.s-nur-dann summary b { color: var(--warn); }
.stand.s-zeit summary b { color: var(--accent); }
/* Die Mengenfrage. „Kommt auf die Menge an" ist die Auskunft, die eine
   Streichliste verhindert – die darf hervorstechen. */
.stand.d-schwelle summary b { color: var(--ok); }
.stand.d-auch-wenig summary b { color: var(--bad); }
.stand.d-unauffaellig summary b { color: var(--ok); }
/* Die Zeile im Zeitprofil trägt drei Angaben; auf einem schmalen Gerät darf sie
   umbrechen, sonst schiebt sie die Namensspalte aus dem Bild. */
.karte-zeit .wartend li > .klein { white-space: normal; text-align: right; }
/* Die Kopfkarte hat Werte mit mehreren Wörtern („pochend (12×), mit Übelkeit
 * (3×)") – die dürfen umbrechen, sonst laufen sie in die Bezeichnung. */
.karte-kopf .wartend li > span:first-child { flex: 0 0 44%; }
.karte-kopf .wartend li > .klein { flex: 1 1 auto; min-width: 0; white-space: normal; text-align: right; }
.schichten { list-style: none; margin: 8px 0; padding: 0; }
.schichten li {
  display: flex; justify-content: space-between; gap: 8px;
  padding: 5px 0; border-bottom: 1px solid var(--line); font-size: 13px;
}
.schichten li:last-child { border-bottom: none; }

.schloss { margin-top: 10px; }
.schloss .reihe { margin-top: 10px; }

.wartend { list-style: none; margin: 0; padding: 0; }
.wartend li {
  display: flex; justify-content: space-between; align-items: center; gap: 8px;
  padding: 7px 0; border-bottom: 1px solid var(--line);
}
.wartend li:last-child { border-bottom: none; }
/* Die rechte Spalte ist eine Zählung ("2 Mal", "3 von 5") und gehört in eine
   Zeile: umgebrochen liest sie sich als zwei Angaben. */
.wartend li > .klein { white-space: nowrap; flex: none; }
/* Im Fortschrittsblock ist die rechte Spalte keine Zählung, sondern ein Satz
   („0 Mahlzeiten eingetragen; je Merkmal braucht es 5 damit und 5 ohne"). In
   einer Zeile schob er die linke Spalte auf ein Wort je Zeile und lief über
   den Kartenrand. Beide Spalten teilen sich die Breite, der Satz bricht um. */
.fortschritt li > span:first-child { flex: 1 1 50%; }
.fortschritt li > .klein { white-space: normal; flex: 0 1 50%; text-align: right; }
.wartend li > span:first-child { min-width: 0; }

.bericht {
  width: 100%; background: var(--bg); color: var(--text);
  border: 1px solid var(--line); border-radius: 11px; padding: 10px;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 12px; line-height: 1.4; margin-bottom: 8px;
}

/* ---------- Rat für heute ---------- */
.rat > h3 { margin-bottom: 10px; }
.raete { list-style: none; margin: 0; padding: 0; }
.raete > li {
  border-left: 3px solid var(--accent);
  padding: 2px 0 2px 12px;
  margin-bottom: 14px;
}
.raete > li:last-child { margin-bottom: 6px; }
.rat-sport { border-left-color: var(--ok); }
.rat-ruhe { border-left-color: var(--leicht); }
.rat-mittel { border-left-color: var(--warn); }
.rat-kopf { display: flex; align-items: baseline; gap: 7px; flex-wrap: wrap; }
.rat-kopf b { font-size: 15px; }
.rat-i { font-size: 15px; }
.raete p { font-size: 14px; margin: 4px 0 0; }
/* Woher ein Rat kommt, steht an ihm dran und nicht im Kleingedruckten:
   „aus deinem Verlauf" wiegt schwerer als „allgemein", und das muss man
   sehen, ohne es nachzulesen. */
.rat-quelle {
  font-size: 11px; padding: 2px 7px; border-radius: 999px;
  border: 1px solid var(--line); color: var(--muted);
}
.rat-quelle.q-eigen { border-color: var(--accent); color: var(--accent); }

.zyklus-zeile {
  text-align: center;
  margin: -4px 0 12px;
}

/* ---------- Was Sache ist ----------
   Steht ganz oben und muss sich vom Rest abheben, ohne zu schreien: etwas
   größer, etwas mehr Luft zwischen den Sätzen. Jeder Satz ein Absatz – wer
   drei Sätze zu einem Block zusammenzieht, hat sie wieder unlesbar gemacht. */
.karte-lage { border-left: 3px solid var(--accent); }
.lage-satz { font-size: 15px; line-height: 1.5; margin: 0 0 10px; }
.lage-satz:last-of-type { margin-bottom: 12px; }
/* Ein Warnsatz bleibt auch hier ein Warnsatz. */
.lage-satz.l-warnung { color: var(--bad); font-weight: 600; }
.lage-satz.l-luecke { color: var(--muted); }

/* ---------- Warnzeichen und Einordnung ---------- */
.karte-warn { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 14%, var(--bg-elev)); }
.karte-warn h3 { color: var(--bad); }
.warnliste { list-style: none; margin: 0 0 8px; padding: 0; }
.warnliste li {
  padding: 8px 0 8px 12px;
  border-left: 3px solid var(--warn);
  margin-bottom: 8px;
}
.warnliste .w-sofort { border-left-color: var(--bad); }
.warnliste b { display: block; font-size: 15px; }

.warnbogen { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 10px; }
.warnbogen > summary { cursor: pointer; font-size: 14px; color: var(--muted); }
.warnbogen .marke { font-size: 13px; text-align: left; }

.muster-liste { list-style: none; margin: 12px 0 8px; padding: 0; }
.muster {
  border: 1px solid var(--line);
  border-radius: 11px;
  padding: 12px;
  margin-bottom: 8px;
  background: var(--bg-elev-2);
}
.muster.erst { border-color: var(--accent); }
.muster-kopf { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.muster p { font-size: 14px; }
.belege, .ursachen, .fragen { margin: 0; padding-left: 18px; font-size: 13px; }
.belege li, .fragen li { margin-bottom: 5px; color: var(--muted); }
.ursachen { list-style: none; padding-left: 0; }
.ursachen li { margin-bottom: 8px; }
.ursachen b { font-size: 14px; }

/* ---------- Kriterien ---------- */
/* Der Haken links ist die ganze Auskunft: erfüllt, nicht erfüllt, oder gar
 * nicht prüfbar. Drei Zustände und nicht zwei – „nicht prüfbar" als „nein"
 * darzustellen wäre die häufigste Art, mit Kriterien zu lügen. */
.krit-liste { list-style: none; margin: 12px 0 8px; padding: 0; }
.krit {
  border: 1px solid var(--line); border-radius: 11px;
  padding: 12px; margin-bottom: 10px; background: var(--bg-elev-2);
}
.krit.erfuellt { border-color: var(--accent); }
.krit-kopf { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 8px; }
.kritliste { list-style: none; margin: 0 0 8px; padding: 0; }
.kritliste li { display: flex; gap: 9px; align-items: flex-start; margin-bottom: 7px; font-size: 13px; }
.kritliste-eng li { margin-bottom: 4px; }
.kritliste b { font-size: 13px; }
.kritliste i { color: var(--muted); font-style: normal; font-size: 12px; }
.haken {
  flex: none; width: 21px; height: 21px; border-radius: 50%;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 600; border: 1px solid var(--line);
}
.haken.ja { background: color-mix(in srgb, var(--accent) 35%, transparent); border-color: var(--accent); }
.haken.nein { color: var(--muted); }
.haken.offen { color: var(--muted); border-style: dashed; }

/* ---------- Auslassversuch ---------- */
.versuch-zeile { border-left: 3px solid var(--accent); }
.versuch { border-left: 3px solid var(--line); }
.versuch.v-dafuer { border-left-color: var(--bad); }
.versuch.v-dagegen { border-left-color: var(--ok); }
.versuch.v-unsauber, .versuch.v-zuwenig { border-left-color: var(--warn); }
.versuch-zahlen {
  list-style: none; margin: 10px 0; padding: 0;
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center;
}
.versuch-zahlen li {
  background: var(--bg-elev-2); border-radius: var(--radius); padding: 8px 4px;
  display: flex; flex-direction: column; gap: 2px;
}
.versuch-zahlen b { font-size: 20px; }
.versuch-zahlen > li > span:first-child { font-size: 12px; color: var(--muted); }
/*
 * Dieselbe Liste, drei Verwendungen – aber drei Klassen.
 *
 * Auslassversuch, Stufenplan und Provokationstest bieten alle eine Auswahl in
 * derselben Form an. Sie sich eine Klasse teilen zu lassen, war schon einmal
 * falsch: Ein Test, der „die erste .versuch-wahl" ansprach, prüfte plötzlich
 * die Liste einer anderen Karte. Gleiches Aussehen ist kein Grund für gleiche
 * Benennung, sobald man die Dinge auseinanderhalten muss.
 */
.versuch-wahl, .plan-wahl, .prov-wahl { list-style: none; margin: 10px 0; padding: 0; }
.versuch-wahl li, .plan-wahl li, .prov-wahl li {
  border-top: 1px solid var(--line); padding: 10px 0;
  display: flex; flex-direction: column; gap: 8px;
}
.versuch-wahl li:first-child,
.plan-wahl li:first-child,
.prov-wahl li:first-child { border-top: none; }

/* ---------- Was noch fehlt ---------- */
.luecken { margin: 10px 0 0; padding-left: 20px; }
.luecken li { margin-bottom: 10px; font-size: 14px; }
.verdaechte { list-style: none; margin: 12px 0 8px; padding: 0; }
.verdacht {
  border: 1px solid var(--line); border-left-width: 3px; border-radius: 11px;
  padding: 12px; margin-bottom: 10px; background: var(--bg-elev-2);
}
.verdacht.s-gestuetzt { border-left-color: var(--bad); }
.verdacht.s-moeglich { border-left-color: var(--warn); }
.verdacht.s-offen { border-left-color: var(--line); }
.verdacht.s-unwahrscheinlich { border-left-color: var(--ok); }
/* Der Satz zum Vorlesen. Er sieht anders aus als alles andere, weil er
 * etwas anderes ist: keine Auskunft, sondern eine fertige Frage. */
.frage-zeile {
  margin: 10px 0 0; padding: 9px 11px;
  background: var(--bg-elev); border-radius: var(--radius);
  font-size: 14px; font-style: italic;
}
.verdachtbogen > summary { cursor: pointer; list-style-position: inside; }
.verdachtbogen > summary > h3 { display: inline; }

/*
 * Angebote und Lesehilfen – zugeklappt, aber mit einem Satz Inhalt davor.
 *
 * Eine Klappe, die nur ihre Überschrift zeigt, ist eine Wundertüte: Man tippt
 * darauf, um herauszufinden, ob sich das Tippen lohnt. Deshalb steht in der
 * Zusammenfassung immer eine Zeile, die die Frage schon beantwortet.
 */
.angebotbogen > summary { cursor: pointer; list-style-position: inside; }
.angebotbogen > summary > h3 { display: inline; }
.angebotbogen > summary > .klein { display: block; margin-top: 4px; }
.angebotbogen[open] > summary { margin-bottom: 10px; }

/* ---------- Atemübung ---------- */
.atem {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 10px;
  padding: 18px 0 22px;
}
.atem-kreis {
  width: 190px; height: 190px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  background: radial-gradient(circle at 50% 40%,
    color-mix(in srgb, var(--accent) 45%, transparent),
    color-mix(in srgb, var(--accent) 12%, transparent));
  border: 2px solid var(--accent);
  transform: scale(0.45);
  transition-property: transform;
  transition-timing-function: ease-in-out;
  transition-duration: .6s;
  font-size: 34px;
  font-weight: 300;
  font-variant-numeric: tabular-nums;
}
/* Beim Halten steht der Kreis still und wird nur etwas kräftiger – so ist die
   Phase auch mit offenen Augen zu erkennen, ohne dass sich etwas bewegt. */
.atem-kreis[data-art="halten"] { background: radial-gradient(circle at 50% 40%,
  color-mix(in srgb, var(--accent) 60%, transparent),
  color-mix(in srgb, var(--accent) 18%, transparent)); }
.atem-wort { font-size: 17px; margin: 0; min-height: 24px; }
.atem .klein { margin: 0; }
@media (prefers-reduced-motion: reduce) {
  .atem-kreis { transition-duration: 0s !important; }
}

/* ---------- Ideen ---------- */
.ideen { list-style: none; margin: 0 0 12px; padding: 0; }
.idee {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 10px; margin-bottom: 6px;
  background: var(--bg-elev);
  border: 1px solid var(--line);
  border-left: 3px solid var(--accent);
  border-radius: 11px;
}
/* Erledigt heißt hier nicht "weg": Eine umgesetzte Idee soll sichtbar bleiben,
   damit man sieht, dass etwas daraus geworden ist. */
.idee.ab { border-left-color: var(--ok); opacity: .55; }
.idee.ab .idee-text { text-decoration: line-through; }
.idee-haken {
  flex: none;
  width: 26px; height: 26px; margin-top: 2px;
  border: 1px solid var(--line); border-radius: 8px;
  background: var(--bg-elev-2);
  cursor: pointer; line-height: 1; font-size: 14px;
}
.idee.ab .idee-haken { background: var(--ok); border-color: var(--ok); color: #1a1014; }
.idee-text { flex: 1; font-size: 15px; overflow-wrap: anywhere; }

/* ---------- Mittelübersicht ---------- */
.mittel-liste { margin-top: 12px; }
.mittel {
  border: 1px solid var(--line);
  border-radius: 11px;
  padding: 10px 12px;
  margin-bottom: 6px;
  background: var(--bg-elev-2);
}
.mittel > summary { cursor: pointer; list-style-position: outside; }
.mittel > summary::marker { color: var(--muted); }
.mittel[open] > summary { margin-bottom: 8px; }
.mittel p { font-size: 14px; }
.mittel p b { color: var(--accent); font-weight: 600; }
.mittel-hinweis {
  border-left: 2px solid var(--accent);
  padding-left: 10px;
  margin-top: 8px;
}

/* ---------- Willkommen ---------- */
.willkommen { max-width: 480px; margin: 20px auto; }
.punkte { padding-left: 18px; color: var(--muted); font-size: 14px; }
.punkte li { margin-bottom: 8px; }
.punkte b { color: var(--text); }

/* ---------- Der Eingabebogen ---------- */
.bogen-hg {
  position: fixed; inset: 0; z-index: 40;
  background: rgba(0, 0, 0, .55);
}
.bogen {
  position: fixed; z-index: 41;
  left: 0; right: 0; bottom: 0;
  max-height: 88vh;
  display: flex; flex-direction: column;
  background: var(--bg-elev);
  border-top: 1px solid var(--line);
  border-radius: 20px 20px 0 0;
}
@media (min-width: 640px) {
  .bogen { left: 50%; transform: translateX(-50%); width: 560px; border-radius: 20px; bottom: 24px; }
}
.bogen-kopf {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 16px 8px; border-bottom: 1px solid var(--line);
}
.bogen-kopf h2 { margin: 0; }
.bogen-zu {
  background: none; border: none; font-size: 26px; line-height: 1;
  color: var(--muted); cursor: pointer; width: 40px; height: 40px; border-radius: 50%;
}
.bogen-inhalt { overflow-y: auto; padding: 6px 16px 14px; -webkit-overflow-scrolling: touch; }
.bogen-fuss { padding: 10px 16px calc(12px + var(--safe-b)); border-top: 1px solid var(--line); }

/* ---------- Reiterleiste ---------- */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  display: flex;
  background: color-mix(in srgb, var(--bg) 94%, transparent);
  backdrop-filter: blur(10px);
  border-top: 1px solid var(--line);
  padding-bottom: var(--safe-b);
}
.tabbar[hidden] { display: none; }
.tab {
  flex: 1; background: none; border: none; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 8px 2px; height: var(--tabbar-h);
  font-size: 11px; color: var(--muted);
}
.tab.an { color: var(--accent); }
.ti { font-size: 19px; line-height: 1; }

/* ---------- Eigene Mittel ---------- */
.standard-zeile { margin-top: 8px; }
.standard-zeile .btn { min-height: 36px; }

/* ---------- Ungefähre Zeiten im Bogen ---------- */
.zeit-knoepfe { margin: -2px 0 12px; }
.zeit-knoepfe .marken { margin-bottom: 6px; }
.zeit-hinweis { margin: 2px 0 0; }

/* ---------- Anleitung auf den Startbildschirm ---------- */
.schritte { margin: 6px 0 10px; padding-left: 22px; font-size: 14px; }
.schritte li { margin: 4px 0; }
.willkommen-umzug { margin-top: 18px; }
/* Zwei Aufklapper direkt untereinander: Mit 23 px Höhe traf ein Tipp knapp
   unter „Neues iPhone?" schon „iOS-Update?". So sind es gut 44 px je Zeile. */
.anleitung-auf > summary { padding: 11px 0; }

/* ---------- Notausgang (index.html) ----------
   Erst nach vier Sekunden sichtbar: Startet die App normal, hat js/app.js
   ihn bis dahin längst ersetzt, und niemand sieht ihn je aufblitzen. */
.notausgang {
  text-align: center; color: var(--muted); padding: 48px 16px;
  opacity: 0; animation: notausgang-zeigen 0.3s ease 4s forwards;
}
.notausgang a { color: var(--accent); font-weight: 600; }
@keyframes notausgang-zeigen { to { opacity: 1; } }

/* ---------- Meldung ---------- */
.toast {
  position: fixed; z-index: 50;
  left: 50%; transform: translateX(-50%) translateY(12px);
  bottom: calc(var(--tabbar-h) + var(--safe-b) + 14px);
  background: var(--bg-elev-2);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 9px 16px;
  font-size: 14px;
  max-width: 90vw;
  opacity: 0;
  pointer-events: none;
  transition: opacity .18s, transform .18s;
}
.toast.an { opacity: 1; transform: translateX(-50%) translateY(0); }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}

/* ---------- Aufs Papier ----------
 *
 * Gedacht für den Reiter „Muster": die Einordnung, die Warnzeichen und der
 * Verlauf als Bild, zum Mitnehmen in die Sprechstunde.
 *
 * Umgefärbt statt eingefärbt: Der Bildschirm ist dunkel, weil man nachts
 * hineinsieht – auf Papier wäre das eine halbe Druckerpatrone und schlecht
 * lesbar dazu. Die Ampel bleibt farbig, aber gedeckt, damit sie auch in
 * Graustufen noch verschiedene Helligkeiten hat.
 */
@media print {
  :root {
    color-scheme: light;
    --bg: #fff;
    --bg-elev: #fff;
    --bg-elev-2: #fff;
    --line: #bbb;
    --text: #000;
    --muted: #444;
    --accent: #a03060;
    --accent-weich: #fff;
    --ok: #2e7d4f;
    --leicht: #8a7f1e;
    --warn: #b06a10;
    --bad: #b3261e;
  }
  html, body { background: #fff; color: #000; font-size: 11pt; }

  /* Alles, was man auf Papier nicht antippen kann. */
  .tabbar, .toast, .anlegen, .bogen, .bogen-hg, .topbar, .wahl,
  .btn, .strang-weg, .idee-haken, .tag-datum, .rat-quelle { display: none !important; }

  .view { max-width: none; padding: 0; }
  .karte {
    border: 1px solid #bbb;
    padding: 8pt 10pt;
    margin-bottom: 8pt;
    /* Eine Einordnung, die mitten im Satz auf die nächste Seite umbricht,
       liest in der Sprechstunde niemand zu Ende. */
    break-inside: avoid;
  }
  .karte-warn { border: 2pt solid #b3261e; }
  .muster, .fund, .strang-zeile, .krit, .verdacht, .versuch-zahlen li,
  .luecken li { break-inside: avoid; }

  /* Auf Papier trägt das Zeichen die Aussage, nicht die Füllfarbe: Ein blasses
     Rosa auf Weiß ist am Kopierer nicht mehr von leer zu unterscheiden, und
     ein Haken, den man nicht sieht, ist schlimmer als keiner. */
  .haken { border: 1px solid #444; background: none !important; }
  .haken.ja { border-color: #000; font-weight: 700; }
  .frage-zeile { border: 1px solid #bbb; background: none; }

  /* Aufklappbares steht offen – js/app.js öffnet es vor dem Drucken, hier
     wird nur noch der Pfeil ausgeblendet. */
  details > summary { list-style: none; }
  details > summary::-webkit-details-marker { display: none; }

  .tafel svg { height: 90pt; }
  .atem-kreis { display: none; }

  /* Ein Fuß, der auf jedem Ausdruck sagt, woher das Blatt kommt. */
  .view::after {
    content: "Selbst geführtes Tagebuch aus der App „Body Check“. Gezählt, nicht gedeutet – keine Diagnose.";
    display: block;
    margin-top: 10pt;
    padding-top: 6pt;
    border-top: 1px solid #bbb;
    font-size: 8pt;
    color: #444;
  }
}

/* ---------- Die Küche: was geht, was nicht ---------- */

/*
 * Die eine Liste in dieser App, die nichts auswertet. Deshalb sieht sie auch
 * anders aus als die Funde: keine Balken, keine Urteilsspalte, keine Farbe
 * nach Einstufung – nur zwei Daumen und Text. Wer hier etwas einträgt, soll
 * nicht das Gefühl haben, etwas zu messen.
 */
.kueche-teil { margin-top: 14px; }
.kueche-teil:first-of-type { margin-top: 8px; }
.kueche { list-style: none; margin: 6px 0 8px; padding: 0; }
.kueche-zeile {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 0; border-bottom: 1px solid var(--line);
}
.kueche-zeile:last-child { border-bottom: 0; }
.kueche-dreh {
  flex: 0 0 auto; width: 32px; height: 32px; padding: 0;
  border: 0; border-radius: 50%; background: var(--bg-elev);
  font-size: 16px; line-height: 1; cursor: pointer;
}
.kueche-dreh:hover { background: var(--line); }
.kueche-text { flex: 1 1 auto; font-size: 15px; }
/* Was nicht geht, steht gedämpft da – es ist eine Erinnerung, keine Mahnung. */
.k-nicht .kueche-text { color: var(--muted); }
.kueche-feld { flex: 1 1 auto; min-width: 0; }

/* ---------- Was schon feststeht ---------- */
.befunde { list-style: none; margin: 8px 0; padding: 0; }
.befund {
  padding: 10px 0; border-bottom: 1px solid var(--line);
}
.befund:last-child { border-bottom: 0; }

</style>

<main id="view" class="view" role="tabpanel" tabindex="-1" aria-labelledby="tab-heute">
  <!-- Der Notausgang. Auf dem Startbildschirm gibt es weder Adressleiste noch
       Herunterziehen zum Neuladen. Startet das Skript nicht – etwa weil nach

       App-Umschalter wegzuwischen, und das weiß kaum jemand. Dieser Absatz

<!-- Die Reiter füllt js/app.js. Sie stehen trotzdem hier: Seite und Skript

<nav class="tabbar" id="tabbar" role="tablist">

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module">
/* ===== js/datum.js ===== */
/*
 * Datum und Uhrzeit – die unterste Schicht. Hängt von nichts ab.
 *
 * Ein Tagebuch rechnet dauernd mit Zeit, und zwar mit *örtlicher* Zeit: Wer um
 * halb elf abends isst und um eins nachts Beschwerden bekommt, hat einen
 * Zusammenhang erlebt, den keine Tagesgrenze zerschneiden darf. Deshalb steht
 * hier neben dem Datum auch der Zeitpunkt – Datum plus Uhrzeit, zusammen
 * gerechnet.
 *
 * Alles in Ortszeit, nichts in UTC. Die Alternative wäre ein Eintrag, der nach
 * einer Reise oder der Zeitumstellung auf einem anderen Tag steht als dem, an
 * dem er gemacht wurde.
 */

const WOCHENTAGE = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];
const MONATE = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli',
  'August', 'September', 'Oktober', 'November', 'Dezember'];

/** Kürzel der Wochentage, montags zuerst – so steht ein Kalender hierzulande. */
const WOCHE_KOPF = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'];

const pad2 = (n) => String(n).padStart(2, '0');

function zuISO(d) {
  return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
}

function heuteISO() {
  return zuISO(new Date());
}

/** Aktuelle Uhrzeit als "HH:MM". */
function jetztUhr() {
  const d = new Date();
  return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
}

function ausISO(iso) {
  const [y, m, d] = iso.split('-').map(Number);
  return new Date(y, m - 1, d);
}

function plusTage(iso, tage) {
  if (!tage) return iso;
  const d = ausISO(iso);
  d.setDate(d.getDate() + tage);
  return zuISO(d);
}

/** Ganze Tage von isoA bis isoB; positiv, wenn isoB später liegt. */
function tageDazwischen(isoA, isoB) {
  return Math.round((ausISO(isoB) - ausISO(isoA)) / 86400000);
}

/**
 * Ein Zeitpunkt aus Datum und Uhrzeit, als Millisekunden.
 *
 * Fehlt die Uhrzeit oder ist sie unbrauchbar, gilt Mittag statt Mitternacht:
 * Ein Eintrag ohne Uhrzeit soll innerhalb seines Tages liegen und nicht am
 * Rand, wo er beim Rechnen mit Zeitfenstern in den Vortag rutscht.
 */
function zeitpunkt(iso, uhr) {
  const d = ausISO(iso);
  const m = /^(\d{1,2}):(\d{2})$/.exec(uhr || '');
  if (m) d.setHours(Number(m[1]), Number(m[2]), 0, 0);
  else d.setHours(12, 0, 0, 0);
  return d.getTime();
}

/** Stunden von a nach b; positiv, wenn b später liegt. */
function stundenDazwischen(a, b) {
  return (b - a) / 3600000;
}

/** Minuten seit Mitternacht – zum Sortieren innerhalb eines Tages. */
function minutenAmTag(uhr) {
  const m = /^(\d{1,2}):(\d{2})$/.exec(uhr || '');
  return m ? Number(m[1]) * 60 + Number(m[2]) : 12 * 60;
}

function fmtDatum(iso, lang) {
  const d = ausISO(iso);
  const wd = WOCHENTAGE[d.getDay()];
  if (lang) return `${wd}, ${d.getDate()}. ${MONATE[d.getMonth()]} ${d.getFullYear()}`;
  return `${wd}, ${pad2(d.getDate())}.${pad2(d.getMonth() + 1)}.`;
}

function fmtMonat(iso) {
  const d = ausISO(iso);
  return `${MONATE[d.getMonth()]} ${d.getFullYear()}`;
}

/** "heute", "gestern" oder das Datum – für Überschriften. */
function fmtTag(iso) {
  const abstand = tageDazwischen(iso, heuteISO());
  if (abstand === 0) return 'heute';
  if (abstand === 1) return 'gestern';
  if (abstand === -1) return 'morgen';
  return fmtDatum(iso, true);
}

/** Erster Tag des Monats, in dem `iso` liegt. */
function monatsStart(iso) {
  return `${iso.slice(0, 7)}-01`;
}

/** `n` Monate weiter, immer auf den Ersten. Über Jahresgrenzen hinweg. */
function plusMonate(iso, n) {
  const d = ausISO(monatsStart(iso));
  d.setMonth(d.getMonth() + n);
  return zuISO(d);
}

/**
 * Alle Tage, die ein Monatsraster zeigt: ganze Wochen von Montag bis Sonntag,
 * vorn und hinten mit den Nachbarmonaten aufgefüllt.
 */
function monatsRaster(iso) {
  const erster = ausISO(monatsStart(iso));
  const vorlauf = (erster.getDay() + 6) % 7;          // Mo = 0
  // Monatslänge über den Abstand zum nächsten Ersten. Math.round, weil eine
  // Zeitumstellung im Monat sonst eine Stunde fehlen ließe.
  const laenge = Math.round((ausISO(plusMonate(iso, 1)) - erster) / 86400000);
  const felder = Math.ceil((vorlauf + laenge) / 7) * 7;
  const raus = [];
  for (let i = 0; i < felder; i++) {
    const d = new Date(erster);
    d.setDate(d.getDate() - vorlauf + i);
    raus.push(zuISO(d));
  }
  return raus;
}

/**
 * Grobe Tageszeit einer Uhrzeit. Für die Frage, wann die Beschwerden kommen –
 * nachts ist eine andere Auskunft als nach dem Mittagessen.
 */
function tageszeit(uhr) {
  const m = minutenAmTag(uhr);
  if (m < 5 * 60) return 'nacht';
  if (m < 11 * 60) return 'morgen';
  if (m < 15 * 60) return 'mittag';
  if (m < 19 * 60) return 'nachmittag';
  return 'abend';
}

const TAGESZEIT_NAME = {
  nacht: 'nachts',
  morgen: 'morgens',
  mittag: 'mittags',
  nachmittag: 'nachmittags',
  abend: 'abends',
};

/* ===== js/text.js ===== */
/*
 * Text und Zahlen fürs Auge. Hängt von nichts ab und darf deshalb überall
 * benutzt werden.
 */

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));
}

/** Zahl in deutscher Schreibweise, ohne unnötige Null hinter dem Komma. */
function fmtZahl(n, stellen = 1) {
  if (!Number.isFinite(n)) return '–';
  return Number.isInteger(n) ? String(n) : String(+n.toFixed(stellen)).replace('.', ',');
}

function mehrzahl(n, eins, viele) {
  return `${n} ${n === 1 ? eins : viele}`;
}

/**
 * Lange Eingaben kürzen, ohne mitten im Wort abzubrechen.
 *
 * Gebraucht in der Tagesliste: „Was gegessen?" ist ein freies Feld, und
 * jemand, der ein ganzes Menü hineinschreibt, soll die Liste nicht sprengen.
 */
function kuerze(s, max = 60) {
  const t = String(s).trim();
  if (t.length <= max) return t;
  const schnitt = t.slice(0, max);
  const luecke = schnitt.lastIndexOf(' ');
  return `${(luecke > max * 0.6 ? schnitt.slice(0, luecke) : schnitt).trimEnd()} …`;
}

/* ===== js/daten.js ===== */
/*
 * Die Kataloge: was man ankreuzen kann.
 *
 * Zwei Listen tragen die App. Die eine sagt, was in einer Mahlzeit stecken
 * kann und als Magenreiz gilt; die andere, wie sich Beschwerden anfühlen.
 * Beide sind absichtlich kurz. Eine Liste mit hundert Einträgen wird nicht
 * ausgefüllt, und was nicht ausgefüllt wird, taucht in keiner Auswertung auf.
 *
 * Wichtig zur Einordnung: Die Auswahl hier ist kein medizinisches Urteil. Sie
 * sammelt, was in der Ernährungsberatung bei Magenbeschwerden üblicherweise
 * zur Sprache kommt – als *Verdachtsliste*, damit man beim Eintragen nicht
 * jedes Mal überlegen muss. Ob etwas davon bei einem bestimmten Menschen
 * tatsächlich stört, sagt allein sein eigener Verlauf. Genau dafür ist die
 * App da, und genau deshalb steht in der Auswertung immer die Fallzahl daneben.
 *
 * `id` ist der Schlüssel im Speicher und darf sich nie ändern – daran hängen
 * alle bereits gemachten Eintragungen. Namen dürfen sich ändern.
 */

/*
 * Die Klassen: warum etwas stören könnte, nicht bloß dass es stört.
 *
 * „Zwiebel" ist als Antwort schwach – nicht weil sie falsch wäre, sondern weil
 * sie zu selten vorkommt. Zwölf Mahlzeiten mit Zwiebel im ganzen Tagebuch
 * ergeben eine wackelige Zahl, und die nächste Frage („und Knoblauch? und
 * Weizen?") fängt wieder bei null an. Die Klasse fasst zusammen, was im Körper
 * denselben Weg nimmt: Zwiebel, Hülsenfrüchte, Weizen und Rohkost sind alle
 * FODMAP-reich, und über sie zusammen kommen statt zwölf Fällen achtzig
 * zusammen. Das ist der Unterschied zwischen einer Ahnung und einer Zahl.
 *
 * Und es ist die brauchbarere Auskunft: „Fruktane" beantwortet auch die Frage
 * nach dem Lebensmittel, das noch gar nicht im Tagebuch steht.
 *
 * Ehrlich dazu: Die Zuordnung unten ist grob. Ein Apfel ist FODMAP-reich, eine
 * Banane kaum, und beide wären hier „Obst". Sie taugt, um eine Spur zu finden,
 * und nicht, um eine Diagnose darauf zu bauen – deshalb steht neben jedem
 * Ergebnis, aus wie vielen Mahlzeiten es kommt, und deshalb gibt es den
 * Auslassversuch (js/versuch.js), der eine Spur zur Probe stellt.
 */
const KLASSEN = [
  {
    id: 'fodmap',
    name: 'FODMAP – vergärbare Kohlenhydrate',
    kurz: 'FODMAP',
    was: 'Zuckerarten und Ballaststoffe, die im Dünndarm nicht aufgenommen '
      + 'werden und im Dickdarm von Bakterien vergoren werden. Das macht Gas '
      + 'und zieht Wasser – Blähung und Krampf, meist Stunden nach dem Essen.',
  },
  {
    id: 'laktose',
    name: 'Laktose – Milchzucker',
    kurz: 'Laktose',
    was: 'Ein FODMAP für sich, weil es dafür einen einfachen Test gibt: Fehlt '
      + 'das spaltende Enzym, bleibt der Milchzucker liegen und wird vergoren.',
  },
  {
    id: 'fett',
    name: 'Fett',
    kurz: 'Fett',
    was: 'Verlangsamt die Magenentleerung. Was länger liegt, drückt länger – '
      + 'das ist der typische Weg zu Völlegefühl statt zu Brennen.',
  },
  {
    id: 'saeure',
    name: 'Säure und Säurelocker',
    kurz: 'Säure',
    was: 'Entweder selbst sauer oder anregend für die eigene Säurebildung. '
      + 'Auf einer gereizten Schleimhaut brennt beides.',
  },
  {
    id: 'schliessmuskel',
    name: 'Senkt den Schließmuskel',
    kurz: 'Schließmuskel',
    was: 'Lockert den Muskelring zwischen Speiseröhre und Magen, sodass '
      + 'Mageninhalt leichter hochkommt. Der klassische Weg zu Sodbrennen.',
  },
  {
    id: 'koffein',
    name: 'Koffein',
    kurz: 'Koffein',
    was: 'Regt die Säurebildung an und beschleunigt den Darm – und wirkt '
      + 'obendrein auf den Schlaf, der hier ein eigener Faktor ist.',
  },
  {
    id: 'histamin',
    name: 'Histamin',
    kurz: 'Histamin',
    was: 'Steckt in Gereiftem, Gegorenem und lange Gelagertem. Bei einer '
      + 'Unverträglichkeit kommen Kopfschmerz, Flush oder Herzklopfen dazu – '
      + 'im Bauch allein sieht es aus wie alles andere auch.',
  },
  {
    id: 'gluten',
    name: 'Weizen und Gluten',

/**
 * Zu einem eingetragenen Namen die passende Gruppe finden.
 *
 * Eingetragen wird frei: „Pantoprazol 20mg", „pantoprazol", „Panto". Deshalb
 * wird kleingeschrieben verglichen und geprüft, ob eines der Beispiele im
 * Eingetragenen vorkommt – nicht auf Gleichheit.
 */
function wissenZu(name) {
  const gesucht = String(name || '').toLowerCase().trim();
  if (!gesucht) return null;
  /*
   * Kurze Kürzel („ASS", „Ibu", „MCP") nur am Wortanfang: Als bloßes Teilwort
   * traf „ass" auch „Wasser" und „Passionsblume" – und ein Glas Wasser zählte
   * als entzündungshemmendes Schmerzmittel. Lange Namen dürfen weiter überall
   * im Eingetragenen stehen („Pantoprazol 20mg", „IbuHexal").
   */
  /*
   * Was auf der Haut bleibt, zählt nicht: Ein Diclofenac-Gel fürs Knie kommt
   * im Magen praktisch nicht an und ist kein Kopfschmerz-Akutmittel. Es
   * steht dann unter „nicht zugeordnet" statt in der Zählung. „Spray" bleibt
   * draußen aus dieser Regel – das Triptan-Nasenspray wirkt im ganzen Körper.
   */
  if (/(gel|salbe|creme|pflaster)\b/.test(gesucht)) return null;
  const passt = (b) => {
    const k = b.toLowerCase();
    if (k.length > 3) return gesucht.includes(k);
    return new RegExp(`(^|[^a-zäöüß])${k}`).test(gesucht);
  };
  return ALLE.find((g) => g.beispiele.some(passt))
    || ALLE.find((g) => gesucht.includes(g.gruppe.toLowerCase()))
    || null;
}

/*
 * Die Küche: was geht und was nicht – als Merkliste, nicht als Rechnung.
 *
 * WARUM DAS HIER UND NICHT IN DER AUSWERTUNG STEHT
 *
 * Diese App konnte bisher nur eine Richtung: was Beschwerden macht. Und sie
 * konnte es erst nach Wochen, ab einer Mindestzahl Fälle, mit Zufallsschranke.
 * Das ist richtig für einen Befund und nutzlos für die Frage, die abends um
 * sieben tatsächlich ansteht:
 *
 *     „Was kann ich jetzt essen, ohne darüber nachzudenken?"
 *
 * Darauf antwortet keine Statistik rechtzeitig. Wer eine Gastritis hat und auf
 * die meisten Sachen keinen Appetit, hat nach drei Tagen eine klare Vorstellung
 * davon, was geht – nur steht sie nirgends, und beim nächsten Einkauf fängt
 * das Überlegen wieder von vorn an.
 *
 * Deshalb: keine Fallzahl, keine Schwelle, kein Urteil. Zwei Listen, die man
 * selbst füllt. Das Gegenstück zu allem anderen in dieser App – und das Stück,
 * das vom ersten Tag an etwas wert ist.
 *
 * WAS DIE APP TROTZDEM BEITRÄGT
 *
 * Sobald die Auswertung genug Material hat, kann sie der eigenen Liste
 * widersprechen: „Du hast Haferbrei als ‚geht gut‘ notiert, nach Mahlzeiten
 * damit war es aber auffällig schlechter." Dieser Widerspruch ist das
 * Wertvollste, was hier herauskommen kann – er zeigt genau die Stelle, an der
 * jemand sich täuscht, und zwar in der Richtung, die er selbst nicht sieht.
 *
 * Er wird deshalb gezeigt und nicht aufgelöst. Die App überschreibt die Liste
 * nicht und streicht nichts durch: Was jemand über seinen eigenen Körper weiß,
 * hat Vorrang vor achtzehn Mahlzeiten Datenlage. Sie sagt nur, dass beides
 * nicht zusammenpasst.
 */

/**
 * Die beiden Listen.
 *
 * „Geht nicht" ist bewusst dabei, obwohl die Auswertung Auslöser ohnehin
 * sucht: Was jemand sicher weiß, muss er nicht erst herausrechnen lassen.
 * Eine App, die auf ihrer eigenen Rechnung besteht, wo längst eine Antwort da
 * ist, macht sich lästig.
 */
const KUECHEN_ARTEN = [
  {
    id: 'geht',
    name: 'Geht gut',
    frage: 'Was verträgst du, worauf hast du Appetit?',
    icon: '👍',
  },
  {
    id: 'nicht',
    name: 'Geht nicht',
    frage: 'Was lässt du lieber weg?',
    icon: '👎',
  },
];

/** Höchstens so viele je Liste – darüber findet niemand mehr etwas wieder. */
const JE_LISTE = 40;

/** Länger nimmt kein Eintrag an. Eine Merkliste, kein Rezeptbuch. */
const MAX_NAME = 60;

/**
 * Ab wann die Auswertung der Liste überhaupt widersprechen darf.
 *
 * Dieselbe Zurückhaltung wie überall sonst: Eine Zeile ohne genug Fälle sagt
 * nichts, und jemandem seine eigene Erfahrung mit vier Mahlzeiten Datenlage
 * auszureden wäre schlimmer als zu schweigen.
 */
function widersprechendeFunde(kueche, bilanz, namen) {
  if (!Array.isArray(kueche) || !Array.isArray(bilanz)) return [];

  /*
   * Verglichen wird über den Namen, kleingeschrieben und ohne Ränder.
   *
   * Grob, und mit Absicht: Die Liste ist frei getippt („Haferbrei"), die
   * Auswertung kennt Kennungen („hafer"). Ein unscharfer Abgleich fände mehr
   * und läge öfter daneben – und ein falscher Widerspruch ist hier teurer als
   * ein übersehener. Wer „Haferbrei mit Banane" notiert, bekommt keinen
   * Hinweis; das ist besser, als ihm die Banane auszureden.
   */
  const schluessel = (t) => String(t || '').trim().toLowerCase();
  const nachName = new Map();
  bilanz.forEach((z) => {
    const name = namen(z.id);
    if (name) nachName.set(schluessel(name), z);
  });

  const treffer = [];
  kueche.forEach((e) => {
    const z = nachName.get(schluessel(e.name));
    if (!z || !z.genug) return;

    /*
     * Nur der *deutliche* Widerspruch, und nur in beide Richtungen echt:
     *
     *   „geht gut"  + die Auswertung sieht es auffällig schlechter
     *   „geht nicht" + die Auswertung sieht keinen Unterschied
     *
     * Die zweite Richtung ist die freundlichere und wird oft vergessen: Wer
     * sich etwas verbietet, das gar nichts macht, isst ohne Grund enger.
     */
    if (e.art === 'geht' && z.differenz >= 1) {
      treffer.push({ ...e, zeile: z, richtung: 'schlechter' });
    } else if (e.art === 'nicht' && Math.abs(z.differenz) < 0.5) {
      treffer.push({ ...e, zeile: z, richtung: 'unauffaellig' });
    }
  });
  return treffer;
}

/** Der Satz zu einem Widerspruch – je Richtung einer, beide ohne Urteil. */
function widerspruchsSatz(t) {
  const n = t.zeile.faelle;
  if (t.richtung === 'schlechter') {
    return `Nach den ${n} Mahlzeiten damit war es im Schnitt `

      + 'Das muss nicht heißen, dass du dich irrst – vielleicht isst du es an '
      + 'Tagen, an denen ohnehin wenig geht. Aber es ist einen Blick wert.';

    + 'Vielleicht lohnt ein Versuch, es wieder zu probieren – wer etwas '
    + 'weglässt, das nichts macht, isst ohne Grund enger.';

/* ===== js/klang.js ===== */
/*
 * Töne – erzeugt, nicht geladen.
 *
 * Die Atemübung führt jemand mit geschlossenen Augen durch. Der Ton ist dann
 * nicht Beiwerk, sondern die ganze Bedienoberfläche: Er sagt, wann eingeatmet
 * wird, wann gehalten und wann ausgeatmet.
 *
 * Deshalb keine Audiodateien. Eine Datei wäre ein Download, in der
 * Ein-Datei-Fassung ein halbes Megabyte base64, und ohne Netz womöglich gar
 * nicht da. Hier entstehen die Töne im Browser aus einem Oszillator: ein paar
 * Zeilen, kein Byte Ladelast, funktioniert offline und in der einen Datei
 * gleichermaßen.
 *
 * Klanglich bewusst weich: Sinuston, sanft ein- und ausgeblendet. Ein harter
 * Anschlag reißt genau die Anspannung wieder hoch, gegen die die Übung läuft.
 */

let kontext = null;

/**
 * Den Tonkontext holen – und zwar erst, wenn wirklich ein Ton kommen soll.
 *
 * Browser lassen Audio nur nach einer Nutzergeste zu. Ein Kontext, der beim
 * Laden der Seite entsteht, startet gesperrt und bleibt es; einer, der beim
 * Druck auf „Start" entsteht, läuft.
 */
function holeKontext() {
  if (kontext) return kontext;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return null;
  try {
    kontext = new AC();
  } catch {
    return null;
  }
  return kontext;
}

/** Nach einer Pause im Hintergrund steht der Kontext still. */
function weckKlang() {
  const k = holeKontext();
  if (k && k.state === 'suspended') k.resume().catch(() => {});
  return !!k;
}

/**
 * Ein einzelner weicher Ton.
 *
 * @param {number} hz     Tonhöhe
 * @param {number} dauer  Sekunden
 * @param {number} laut   0 bis 1
 */
function ton(hz, dauer = 0.35, laut = 0.18) {
  const k = holeKontext();
  if (!k) return;
  if (k.state === 'suspended') k.resume().catch(() => {});
  const jetzt = k.currentTime;
  const osz = k.createOscillator();
  const huelle = k.createGain();
  osz.type = 'sine';
  osz.frequency.setValueAtTime(hz, jetzt);
  // Ein- und ausblenden über je 60 ms. Ohne das knackt es an beiden Enden,
  // und ein Knacken im Ohr ist bei geschlossenen Augen doppelt unangenehm.
  huelle.gain.setValueAtTime(0.0001, jetzt);
  huelle.gain.exponentialRampToValueAtTime(laut, jetzt + 0.06);
  huelle.gain.setValueAtTime(laut, jetzt + Math.max(0.07, dauer - 0.06));
  huelle.gain.exponentialRampToValueAtTime(0.0001, jetzt + dauer);
  osz.connect(huelle).connect(k.destination);
  osz.start(jetzt);
  osz.stop(jetzt + dauer + 0.02);
}

/*
 * Die Töne der Atemübung. Drei Höhen, die man auch schlaftrunken
 * auseinanderhält: aufwärts heißt einatmen, gleichbleibend heißt halten,
 * abwärts heißt ausatmen.
 */

/*
 * Atemübungen – die Daten dazu, nicht der Ablauf.
 *
 * Warum in einem Magentagebuch: Bauch und Nervensystem hängen zusammen, und
 * zwar in beide Richtungen. Langes Ausatmen schaltet messbar auf den Teil des
 * Nervensystems um, unter dem der Darm arbeitet statt stillzustehen. Bei
 * stressgebundenen Beschwerden ist das keine Beschäftigungstherapie, sondern

const MAP = Object.fromEntries(UEBUNGEN.map((u) => [u.id, u]));

function uebungVon(id) {
