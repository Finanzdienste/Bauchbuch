/**
 * Der ganze Zettel.
 *
 * @param {object} d
 *   kriterien (aus js/kriterien.js), stuhl (stuhlZahlen), bezug (bezugBilanz),
 *   klassen (klassenBilanz), mittel (mittelBilanz), musterIds, essen
 *   (essensbezug), nsarTage, nsarKopfTage (davon an Kopfschmerztagen), warnIds,
 *   krampfAnteil, benutzt, nachtwachAn, versuchMoeglich, versuchLaeuft,
 *   mahlzeitenOhneZutaten
 */
function luecken(d) {
  return {
    tagebuch: tagebuchLuecken(d),
    verdaechte: VERDAECHTE.map((v) => {
      const p = v.pruefe(d);
      return {
        id: v.id,
        name: v.name,
        was: v.was,
        untersuchung: v.untersuchung,
        frage: v.frage,
        ...p,
        wort: STAND_WORT[p.stand],
      };
    }).sort((a, b) => {
      const rang = { gestuetzt: 0, moeglich: 1, offen: 2, unwahrscheinlich: 3 };
      return (rang[a.stand] - rang[b.stand]) || (b.dafuer.length - a.dafuer.length);
    }),
  };
}

/*
 * Störfaktoren herausrechnen – oder: liegt es wirklich am Kaffee?
 *
 * DAS PROBLEM, DAS DIESE DATEI LÖST
 *
 * Bisher wurde jeder Auslöser für sich verglichen: Mahlzeiten mit Kaffee gegen
 * Mahlzeiten ohne. Kommt dabei ein Unterschied heraus, stand da „auffällig".
 *
 * Nur trinkt niemand Kaffee zufällig verteilt. Kaffee gibt es an
 * Arbeitstagen, und Arbeitstage sind die angespannten. Wenn Anspannung den
 * Bauch verschlechtert, sieht der Kaffee schuldig aus, ohne es zu sein – und
 * jemand streicht ihn, isst fortan einseitiger und hat nichts gewonnen.
 *
 * Der Ausweg ist alt und heißt Schichtung: Man vergleicht nicht mehr alles
 * mit allem, sondern **innerhalb** vergleichbarer Gruppen. Hält der
 * Kaffee-Unterschied auch, wenn man nur die ruhigen Tage ansieht? Und auch,
 * wenn man nur die angespannten ansieht? Dann ist es der Kaffee. Zeigt er
 * sich nur in einer Schicht, war es der Störfaktor.
 *
 * DAS IST NICHT NUR EINE ABSCHWÄCHUNG
 *
 * Die Schichtung kann einen Befund auch *erzeugen*. Wenn jemand an ruhigen
 * Tagen selten Kaffee trinkt und an Stresstagen viel, kann sich der
 * Kaffee-Effekt im Gesamtschnitt fast aufheben und erst innerhalb der
 * Schichten sichtbar werden. Beides ist derselbe Rechenfehler – das
 * Simpson-Paradox – nur in verschiedene Richtungen.
 *
 * WAS DAS KOSTET, UND WARUM DIE SCHWELLEN STEIGEN
 *
 * Jede Schicht halbiert die Fallzahl ungefähr, und drei Schichtmerkmale mal
 * zwanzig Auslöser sind schnell hundert Vergleiche. Bei hundert Vergleichen
 * ist ein „auffälliger" Zufallstreffer nicht unwahrscheinlich, sondern zu
 * erwarten. Deshalb gilt hier strenger als sonst:
 *
 *   * Jede Schicht braucht auf **beiden** Seiten genug Fälle, sonst zählt sie
 *     gar nicht mit.
 *   * Mindestens **zwei** Schichten müssen prüfbar sein. Aus einer einzigen
 *     Schicht lässt sich nichts über Störfaktoren sagen.
 *   * Der Befund muss in **allen** prüfbaren Schichten dieselbe Richtung
 *     zeigen. Einmal dafür und einmal dagegen heißt: es liegt am Störfaktor,
 *     nicht am Auslöser.
 *
 * Und wenn das nicht reicht, kommt kein abgeschwächtes Urteil heraus, sondern
 * „dafür reichen die Daten nicht". Das ist die einzige ehrliche Antwort und
 * die einzige, die niemanden in die Irre führt.
 */

/**
 * Die Schichtmerkmale.
 *
 * Alles Dinge, die den Bauch nachweislich beeinflussen und die gleichzeitig
 * beeinflussen, *was* jemand isst – genau die Kombination, die einen
 * Störfaktor ausmacht. Wetter oder Wochentag stehen nicht hier: Sie ändern
 * zwar das Essen, aber nicht den Bauch.
 */
const SCHICHTEN = [
  {
    id: 'stress',
    name: 'Anspannung',
    // Die Tagesfragen laufen von 0 (ruhig) bis 4 (sehr viel).
    teile: [
      { id: 'ruhig', name: 'an ruhigen Tagen', passt: (v) => v !== null && v <= 1 },
      { id: 'angespannt', name: 'an angespannten Tagen', passt: (v) => v !== null && v >= 3 },
    ],
  },
  {
    id: 'schlaf',
    name: 'Schlaf',
    teile: [
      { id: 'gut', name: 'nach guten Nächten', passt: (v) => v !== null && v <= 1 },
      { id: 'schlecht', name: 'nach schlechten Nächten', passt: (v) => v !== null && v >= 3 },
    ],
  },
  {
    id: 'blutung',
    name: 'Zyklus',
    teile: [
      { id: 'ohne', name: 'außerhalb der Blutung', passt: (v) => !v },
      { id: 'mit', name: 'während der Blutung', passt: (v) => v > 0 },
    ],
  },
  /*
   * Kopfschmerz als Störfaktor.
   *
   * Übelkeit und ein empfindlicher Magen gehören zu einer Migräneattacke. Wer
   * an Migränetagen Kaffee trinkt (oder gerade keinen – Koffeinentzug ist
   * selbst ein Auslöser), dessen Kaffee fällt mit schlechten Bauchtagen
   * zusammen, ohne sie zu machen. Diese Schicht fragt: Hält der Unterschied
   * auch an Tagen ohne Kopfschmerz?
   *
   * Der Wert kommt nicht aus den Tagesfragen, sondern aus den Einträgen –
   * haeltStand() bekommt die Kopfschmerztage als Menge herein. Ohne sie
   * (ältere Aufrufer) ist die Schicht schlicht nicht prüfbar.
   */
  {
    id: 'kopf',
    name: 'Kopfschmerz',
    wert: (b, extra) => (extra && extra.kopfTage ? (extra.kopfTage.has(b.am) ? 1 : 0) : null),
    teile: [
      { id: 'ohne', name: 'an Tagen ohne Kopfschmerz', passt: (v) => v === 0 },
      { id: 'mit', name: 'an Kopfschmerztagen', passt: (v) => v === 1 },
    ],
  },
];

/*
 * Die mittlere Zone bleibt bewusst außen vor.
 *
 * „Geht so" ist weder ruhig noch angespannt; Mahlzeiten von solchen Tagen in
 * eine der beiden Schichten zu stecken, würde den Vergleich verwässern, den
 * er schärfen soll. Sie fehlen dann in der Rechnung – das kostet Fälle und
 * ist der Preis dafür, dass die beiden Schichten wirklich verschieden sind.
 */

/** Ab wie vielen Mahlzeiten je Seite eine Schicht überhaupt zählt. */
const MINDEST_JE_SCHICHT = 4;

/** So viele Schichten müssen prüfbar sein, damit ein Urteil möglich ist. */
const MINDEST_SCHICHTEN = 2;

const schnitt = (liste) => (liste.length
  ? liste.reduce((s, x) => s + x, 0) / liste.length : 0);

/**
 * Einen einzelnen Auslöser gegen die Störfaktoren halten.
 *
 * @param {object[]} bewertet  [{ merkmale:Set, wert:number, am:string }]
 * @param {string} id          der Auslöser
 * @param {object} tage        der Tagesspeicher
 * @param {object} [extra]     { kopfTage: Set<string> } – die Kopfschmerztage
 * @returns {object} das Urteil samt allen Schichten, auch den nicht prüfbaren
 */
function haeltStand(bewertet, id, tage, extra = {}) {
  const schichten = [];

  SCHICHTEN.forEach((s) => {
    const paar = [];
    s.teile.forEach((teil) => {
      const drin = bewertet.filter((b) => {
        if (s.wert) return teil.passt(s.wert(b, extra));
        /*
         * Ein Tag zählt, sobald er im Tagesspeicher steht – das heißt: sobald
         * eine Tagesfrage beantwortet wurde, denn leere Tage legt der Speicher
         * gar nicht erst an.
         *
         * Bis eben stand hier zusätzlich `!tag.notiert`. Dieses Feld setzt die
         * App aber nirgends; es stand nur in der Testvorlage. In Wirklichkeit
         * fiel damit jeder Tag durch, jede Schicht blieb leer, und jeder
         * Auslöser bekam „für einen Vergleich unter gleichen Umständen fehlen
         * die Angaben" – auch bei jemandem, der jeden Abend alle Fragen
         * beantwortet hat. Der Test war grün, weil seine Tage das Feld hatten.
         */
        const tag = (tage || {})[b.am];
        if (!tag) return false;
        const v = tag[s.id];
        return teil.passt(v === undefined ? null : v);
      });
      const mit = drin.filter((b) => b.merkmale.has(id));
      const ohne = drin.filter((b) => !b.merkmale.has(id));
      const pruefbar = mit.length >= MINDEST_JE_SCHICHT && ohne.length >= MINDEST_JE_SCHICHT;
      const schnittMit = schnitt(mit.map((b) => b.wert));
      const schnittOhne = schnitt(ohne.map((b) => b.wert));

      paar.push({
        merkmal: s.id,
        merkmalName: s.name,
        id: `${s.id}:${teil.id}`,
        name: teil.name,
        pruefbar,
        faelle: mit.length,
        gegenFaelle: ohne.length,
        schnittMit,
        schnittOhne,
        differenz: pruefbar ? schnittMit - schnittOhne : 0,
        fehlt: Math.max(0, MINDEST_JE_SCHICHT - Math.min(mit.length, ohne.length)),
      });
    });

    /*
     * Eine Schicht zählt nur, wenn ihre Gegenschicht auch etwas hergibt.
     *
     * Das ist keine Feinheit, sondern der Kern der Sache – und es war im
     * ersten Entwurf falsch. Wer nie eine Blutung einträgt, dessen Mahlzeiten
     * fallen restlos in „außerhalb der Blutung". Diese eine Schicht enthält
     * dann *alles* und wiederholt damit genau den ungeschichteten Vergleich,
     * den sie prüfen soll – samt seiner Verzerrung. Sie stimmte die echten
     * Schichten nieder, und der Scheinbefund kam durch.
     *
     * Schichten gibt es deshalb nur im Paar: „ruhig" ist nur dann eine
     * Auskunft, wenn es auch „angespannt" gibt, mit dem man sie vergleichen
     * kann. Fehlt die Gegenseite, fehlt der Kontrast, und dann ist die Frage
     * nach dem Störfaktor gar nicht gestellt.
     */
    const beideDa = paar.every((x) => x.pruefbar);
    paar.forEach((x) => schichten.push({ ...x, pruefbar: x.pruefbar && beideDa }));
  });

  const pruefbare = schichten.filter((s) => s.pruefbar);

  if (pruefbare.length < MINDEST_SCHICHTEN) {
    return {
      urteil: 'unklar',
      schichten,
      pruefbare: pruefbare.length,
      satz: pruefbare.length === 0
        ? 'Für einen Vergleich unter gleichen Umständen fehlen die Angaben zu '
          + 'Anspannung, Schlaf, Zyklus oder Kopfschmerz – ohne die lässt sich '
          + 'nicht sagen, ob es am Essen liegt oder an den Umständen.'
        : 'Bisher lässt sich das nur unter einem einzigen Umstand vergleichen. '
          + 'Aus einer einzigen Schicht folgt nichts über Störfaktoren.',
    };
  }

  /*
   * Zeigen alle prüfbaren Schichten in dieselbe Richtung? „Dieselbe Richtung"
   * heißt hier: nennenswert, nicht bloß dasselbe Vorzeichen. Ein Unterschied
   * von 0,05 ist kein Beleg dafür, dass etwas hält.
   */
  const SCHWELLE = 0.5;
  const dafuer = pruefbare.filter((s) => s.differenz >= SCHWELLE);
  const dagegen = pruefbare.filter((s) => s.differenz <= -SCHWELLE);
  const neutral = pruefbare.filter((s) => Math.abs(s.differenz) < SCHWELLE);

  if (dafuer.length === pruefbare.length) {
    /*
     * Was nicht mitgeprüft wurde, steht dabei. Ohne Tagesfragen ist der
     * Kopfschmerz womöglich die einzige Schicht – dann behauptete „nicht an
     * den Umständen" mehr, als geprüft wurde.
     */
    const offen = SCHICHTEN
      .filter((s) => !schichten.some((x) => x.merkmal === s.id && x.pruefbar))
      .map((s) => s.name);
    return {
      urteil: 'haelt',
      schichten,
      pruefbare: pruefbare.length,
      satz: `Der Unterschied bleibt ${pruefbare.map((s) => s.name).join(' und ')} `
        + 'bestehen. Das spricht dafür, dass es am Essen liegt und nicht an den '
        + 'Umständen.'
        + (offen.length ? ` Nicht mitgeprüft: ${offen.join(', ')} – dafür fehlen die Angaben.` : ''),
    };
  }

  if (dafuer.length && (dagegen.length || neutral.length)) {
    const nur = dafuer.map((s) => s.name).join(' und ');
    const nicht = [...dagegen, ...neutral].map((s) => s.name).join(' und ');
    return {
      urteil: 'nur-dann',
      schichten,
      pruefbare: pruefbare.length,
      wo: dafuer.map((s) => s.name),
      satz: `Auffällig ist es ${nur}, ${nicht} dagegen nicht. Das deutet eher `
        + 'auf die Umstände als auf das Essen selbst – oder darauf, dass beides '
        + 'zusammenkommen muss.',
    };
  }

  return {
    urteil: 'verschwindet',
    schichten,
    pruefbare: pruefbare.length,
    satz: 'Unter gleichen Umständen verglichen bleibt kein Unterschied übrig. '
      + 'Der Verdacht kam vermutlich daher, dass dieses Essen und die schlechten '
      + 'Tage zusammenfallen, ohne dass eins das andere macht.',
  };
}

/** Für die Anzeige: kurzes Wort zum Urteil. */
const SCHICHT_WORT = {
  haelt: 'hält stand',
  'nur-dann': 'nur unter Umständen',
  verschwindet: 'verschwindet',
  unklar: 'nicht prüfbar',
};

/* ===== js/zeitprofil.js ===== */
/*
 * Wann kommt es? – das Zeitprofil nach dem Essen
 *
 * WARUM DAS FESTE FENSTER ZU WENIG IST
 *
 * Bisher galt: Beschwerden in den vier Stunden nach einer Mahlzeit zählen zu
 * ihr. Das ist eine brauchbare Faustregel und wirft eine der nützlichsten
 * Auskünfte weg, die in einem Tagebuch steckt – nämlich *wann genau*.
 *
 * Der Bauch braucht Zeit, und zwar je nach Ort verschieden lange:
 *
 *   0–2 Stunden   Der Magen ist noch voll. Was hier weh tut, hat mit Säure,
 *                 Dehnung und Magenentleerung zu tun – Reflux, Gastritis,
 *                 funktionelle Dyspepsie.
 *   2–4 Stunden   Der Speisebrei ist im Dünndarm. Fett und Galle brauchen
 *                 ungefähr so lange.
 *   4–8 Stunden   Jetzt erst erreicht der Rest den Dickdarm. Was Bakterien
 *                 vergären – FODMAP, Laktose, Ballaststoffe – meldet sich
 *                 nicht früher. Es *kann* nicht früher sein.
 *
 * Für die Sprechstunde ist das ein Unterschied ums Ganze: „Nach dem Essen
 * tut es weh" führt zum Säureblocker, „sechs Stunden nach dem Essen tut es
 * weh" führt zur Ernährungsberatung. Beides steht im selben Tagebuch.
 *
 * DIE FALLE, DIE DIESE DATEI VERMEIDET
 *
 * Wer dreimal am Tag isst, dessen Beschwerde vier Stunden nach dem Frühstück
 * ist gleichzeitig eine Stunde nach dem Mittagessen. Zählte man sie beiden
 * Mahlzeiten zu, stünde am Ende jede Beschwerde in jedem Fenster, und das
 * Profil wäre Rauschen mit drei Balken.
 *
 * Deshalb: Jede Beschwerde gehört **der letzten Mahlzeit davor** und keiner
 * anderen. Das hat einen Preis, und er wird hier ausgesprochen statt versteckt:
 * Das späte Fenster einer Mahlzeit lässt sich nur beobachten, wenn in diesen
 * Stunden nichts dazwischengegessen wurde. Für die meisten Mahlzeiten ist es
 * deshalb gar nicht beobachtbar – und eine nicht beobachtbare Stunde ist keine
 * beschwerdefreie Stunde. Sie zählt hier als das, was sie ist: nicht erhoben.
 *
 * Am Abendessen liegt das Fenster meist frei, am Frühstück selten. Wer also
 * wissen will, was der Dickdarm macht, muss länger Tagebuch führen als jemand,
 * der nach dem Magen fragt. Auch das sagt die App lieber, als es durch eine
 * Zahl zu ersetzen, die so aussieht, als wäre sie erhoben worden.
 */


/**
 * Die drei Fenster.
 *
 * Die Grenzen sind gerundet und stimmen für niemanden genau; die
 * Magenentleerung schwankt zwischen Menschen und Mahlzeiten erheblich. Sie
 * sind trotzdem nicht beliebig: Vergärung im Dickdarm *vor* vier Stunden gibt
 * es nicht, und darauf beruht die ganze Auskunft.
 */
const FENSTER = [
  {
    id: 'frueh',
    name: '0–2 Stunden danach',
    kurz: 'früh',
    von: 0,
    bis: 2,
    ort: 'Magen und Speiseröhre',
    deutung: 'So früh kommt Beschwerde aus dem Magen oder der Speiseröhre – '
      + 'Säure, Dehnung, verzögerte Entleerung. Für den Dickdarm ist es zu früh.',
  },
  {
    id: 'mittel',
    name: '2–4 Stunden danach',
    kurz: 'mittel',
    von: 2,
    bis: 4,
    ort: 'Dünndarm und Galle',
    deutung: 'In dieser Zeit arbeitet der Dünndarm an Fett und Galle. Das '
      + 'passt eher zu fettem Essen als zu vergärbaren Kohlenhydraten.',
  },
  {
    id: 'spaet',
    name: '4–8 Stunden danach',
    kurz: 'spät',
    von: 4,
    bis: 8,
    ort: 'Dickdarm',
    deutung: 'So spät ist der Rest im Dickdarm angekommen. Was dort vergärt – '
      + 'FODMAP, Laktose, Ballaststoffe – kann sich gar nicht früher melden.',
  },
];

/** Mindestens so viele beobachtbare Mahlzeiten je Seite und Fenster. */
const MINDEST_JE_FENSTER = 6;

/** Ab wie vielen zugeordneten Beschwerden das allgemeine Profil etwas sagt. */
const MINDEST_BESCHWERDEN = 12;

/*
 * Ein Schwerpunkt muss deutlich sein.
 *
 * Drei Fenster heißen drei Vergleiche, und wer aus drei Zahlen die größte
 * heraussucht, findet immer eine. Sie muss deshalb nicht nur die größte sein,
 * sondern die nächste um einen halben Punkt schlagen.
 */
const SCHWELLE = 1;
const ABSTAND = 0.5;

const mittelwert = (liste) => (liste.length
  ? liste.reduce((s, x) => s + x, 0) / liste.length : 0);

/**
 * Jede Beschwerde der letzten Mahlzeit davor zuordnen.
 *
 * @returns {Map} Mahlzeit-Kennung -> [{ stunden, staerke }]
 */
function zuordnen(eintraege) {
  const essen = eintraege.filter((e) => e.art === 'essen')
    .map((e) => ({ e, t: zeitpunkt(e.am, e.um) }))
    .sort((a, b) => a.t - b.t);
  const zu = new Map();
  essen.forEach((x) => zu.set(x.e.id, []));

  eintraege.filter((e) => e.art === 'beschwerde').forEach((b) => {
    const t = zeitpunkt(b.am, b.um);
    let letzte = null;
    // Rückwärts: die erste Mahlzeit, die vor der Beschwerde liegt, ist die
    // gesuchte. Gleichzeitigkeit zählt nicht – wer beim Essen schon Schmerzen
    // hat, hat sie nicht vom Essen.
    for (let i = essen.length - 1; i >= 0; i--) {
      if (essen[i].t < t) { letzte = essen[i]; break; }
    }
    if (!letzte) return;
    const stunden = stundenDazwischen(letzte.t, t);
    if (stunden > 8) return;
    zu.get(letzte.e.id).push({ stunden, staerke: Number(b.staerke) || 0, ungefaehr: !!b.ungefaehr });
  });
  return zu;
}

/**
 * Für jede Mahlzeit: was in welchem Fenster kam – und welches Fenster
 * überhaupt beobachtbar war.
 *
 * Beobachtbar heißt zweierlei: Es wurde in dieser Zeit nichts dazwischen
 * gegessen (sonst gehörte die Beschwerde der anderen Mahlzeit), und das
 * Tagebuch lief noch (sonst wäre „nichts eingetragen" als „nichts gewesen"
 * gezählt – der Fehler, den diese App nirgends macht).
 */
function fensterWerte(eintraege) {
  const essen = eintraege.filter((e) => e.art === 'essen')
    .map((e) => ({ e, t: zeitpunkt(e.am, e.um) }))
    .sort((a, b) => a.t - b.t);
  const zu = zuordnen(eintraege);
  // „Das Tagebuch lief noch" – aber nur für den Bauch: Ein abendlicher
  // Kopfeintrag macht ein Spätfenster nicht beobachtbar.
  const letzterEintrag = eintraege.filter((e) => e.art !== 'kopf').reduce(
    (m, e) => Math.max(m, zeitpunkt(e.am, e.um)), 0,
  );

  return essen.map((x, i) => {
    const naechste = essen[i + 1] ? stundenDazwischen(x.t, essen[i + 1].t) : Infinity;
    const tagebuchBis = stundenDazwischen(x.t, letzterEintrag);
    const liste = zu.get(x.e.id) || [];
    /*
     * Eine ungefähre Zeit – „abends", „nach dem Essen" – sagt, zu welcher
     * Mahlzeit etwas gehört, aber nicht, wie lange danach es kam. Hängt an
     * dieser Mahlzeit eine solche Angabe, oder ist sie selbst nur ungefähr
     * eingetragen, ist keines ihrer Fenster beobachtet: Sonst landete jede
     * „nach dem Essen"-Beschwerde künstlich nach einer halben Stunde, und das
     * Profil zeigte einen Magen, wo es nur einen Knopf zeigt.
     */
    const unklar = !!x.e.ungefaehr || liste.some((b) => b.ungefaehr);
    const werte = {};
    FENSTER.forEach((f) => {
      const beobachtbar = !unklar && naechste >= f.bis && tagebuchBis >= f.bis;
      const drin = liste.filter((b) => b.stunden > f.von && b.stunden <= f.bis);
      werte[f.id] = {
        beobachtbar,
        wert: drin.reduce((m, b) => Math.max(m, b.staerke), 0),
      };
    });
    return { m: x.e, am: x.e.am, merkmale: new Set(merkmale(x.e)), werte };
  });
}

/**
 * Wann kommen die Beschwerden überhaupt? – ohne Blick auf einzelne Auslöser.
 *
 * Diese Zahl beantwortet die erste Frage der Sprechstunde („kommt das nach dem
 * Essen?") genauer als ein Ja und ist völlig unabhängig davon, ob jemand seine
 * Zutaten sauber einträgt.
 */
function zeitBild(eintraege) {
  const zu = zuordnen(eintraege);
  const alle = [];
  zu.forEach((liste) => liste.forEach((b) => alle.push(b)));
  const gesamt = eintraege.filter((e) => e.art === 'beschwerde').length;

  const teile = FENSTER.map((f) => {
    const drin = alle.filter((b) => b.stunden > f.von && b.stunden <= f.bis);
    return {
      id: f.id,
      name: f.name,
      ort: f.ort,
      anzahl: drin.length,
      anteil: alle.length ? drin.length / alle.length : 0,
      schnitt: mittelwert(drin.map((b) => b.staerke)),
    };
  });

  if (alle.length < MINDEST_BESCHWERDEN) {
    return {
      pruefbar: false,
      teile,
      zugeordnet: alle.length,
      gesamt,
      satz: `Bisher lassen sich ${alle.length} Beschwerden einer Mahlzeit `
        + 'davor zuordnen. Für ein Zeitprofil sind das zu wenige – das heißt '
        + 'nicht, dass es keines gibt.',
    };
  }

  const sortiert = [...teile].sort((a, b) => b.anteil - a.anteil);
  const spitze = sortiert[0];
  const zweite = sortiert[1];
  // Auch hier: die größte von dreien ist noch kein Schwerpunkt. Sie muss die
  // Hälfte der Zuordnungen tragen und die nächste deutlich schlagen.
  const deutlich = spitze.anteil >= 0.45 && (spitze.anteil - zweite.anteil) >= 0.15;
  const fenster = FENSTER.find((f) => f.id === spitze.id);

  return {
    pruefbar: true,
    teile,
    zugeordnet: alle.length,
    gesamt,
    schwerpunkt: deutlich ? spitze.id : null,
    satz: deutlich
      ? `Die meisten Beschwerden kommen ${spitze.name.toLowerCase()} `
        + `(${Math.round(spitze.anteil * 100)} % der zugeordneten). ${fenster.deutung}`
      : 'Die Beschwerden verteilen sich über die Stunden nach dem Essen, ohne '
        + 'erkennbaren Schwerpunkt. Das spricht eher gegen einen einzelnen Ort '
        + 'als Ursache.',
    hinweis: 'Zugeordnet wird immer der letzten Mahlzeit davor. Späte Stunden '
      + 'sind deshalb seltener beobachtbar als frühe – wer alle drei Stunden '
      + 'isst, kann über den Dickdarm wenig erfahren.',
  };
}

/**
 * Und jetzt je Auslöser: wann meldet sich *dieses* Essen?
 *
 * Der Vergleich ist derselbe wie in der Auslöserbilanz – Mahlzeiten mit dem
 * Merkmal gegen die übrigen –, nur getrennt nach Fenster. Ein Auslöser, der
 * sich erst nach sechs Stunden zeigt, ist ein anderer Befund als einer, der
 * nach einer halben Stunde brennt, auch wenn der Vier-Stunden-Schnitt für
 * beide dasselbe sagt.
 */
function zeitProfil(bewertet, id) {
  const teile = FENSTER.map((f) => {
    const mit = bewertet.filter((b) => b.merkmale.has(id) && b.werte[f.id].beobachtbar);
    const ohne = bewertet.filter((b) => !b.merkmale.has(id) && b.werte[f.id].beobachtbar);
    const pruefbar = mit.length >= MINDEST_JE_FENSTER && ohne.length >= MINDEST_JE_FENSTER;
    const schnittMit = mittelwert(mit.map((b) => b.werte[f.id].wert));
    const schnittOhne = mittelwert(ohne.map((b) => b.werte[f.id].wert));
    return {
      id: f.id,
      name: f.name,
      kurz: f.kurz,
      ort: f.ort,
      pruefbar,
      faelle: mit.length,
      gegenFaelle: ohne.length,
      schnittMit,
      schnittOhne,
      differenz: pruefbar ? schnittMit - schnittOhne : 0,
      fehlt: Math.max(0, MINDEST_JE_FENSTER - Math.min(mit.length, ohne.length)),
    };
  });

  const pruefbare = teile.filter((t) => t.pruefbar);
  if (!pruefbare.length) {
    return {
      teile,
      pruefbare: 0,
      schwerpunkt: null,
      satz: 'Wann genau es sich meldet, lässt sich noch nicht sagen: In keinem '
        + 'Zeitfenster sind genug beobachtbare Mahlzeiten beisammen. Beobachtbar '
        + 'ist ein Fenster nur, wenn darin nichts dazwischengegessen wurde.',
    };
  }

  const sortiert = [...pruefbare].sort((a, b) => b.differenz - a.differenz);
  const spitze = sortiert[0];
  const zweite = sortiert[1];
  const deutlich = spitze.differenz >= SCHWELLE
    && (!zweite || (spitze.differenz - zweite.differenz) >= ABSTAND);

  if (!deutlich) {
    return {
      teile,
      pruefbare: pruefbare.length,
      schwerpunkt: null,
      satz: pruefbare.length === 1
        ? `Bisher ist nur das Fenster „${pruefbare[0].name}" besetzt genug; für `
          + 'einen Vergleich der Zeitpunkte fehlt der Rest.'
        : 'Ein deutlicher Zeitpunkt ist nicht zu erkennen – der Unterschied '
          + 'verteilt sich über die Stunden danach.',
    };
  }

  const f = FENSTER.find((x) => x.id === spitze.id);
  return {
    teile,
    pruefbare: pruefbare.length,
    schwerpunkt: spitze.id,
    satz: `Auffällig wird es vor allem ${spitze.name.toLowerCase()}. ${f.deutung}`,
  };
}

/**
 * Was das feste Fenster gar nicht sehen kann.
 *
 * Und das ist der eigentliche Gewinn dieser Datei. Die Auslöserbilanz zählt
 * Beschwerden in den vier Stunden nach dem Essen; ein Auslöser, der sich erst
 * nach sechs Stunden meldet, taucht dort nicht als „unauffällig" auf, sondern
 * überhaupt nicht. Er ist kein schwacher Befund, er ist ein ungestellter.
 *
 * Genau danach wird hier gesucht – und **nur** danach: Zurückgegeben wird ein
 * Auslöser nur, wenn sein Schwerpunkt jenseits des eingestellten Fensters
 * liegt. Das ist keine Feinheit, sondern der Schutz vor der Fischerei: Drei
 * Fenster mal zwanzig Auslöser sind sechzig Vergleiche, und wer in sechzig
 * Vergleichen sucht, findet immer etwas. Ein früher Schwerpunkt wäre der Bilanz
 * ohnehin aufgefallen – ihn hier ein zweites Mal zu melden hieße, dieselbe Zahl
 * zweimal zu zählen und die Trefferchance zu verdoppeln.
 *
 * @param {object[]} fenster  aus fensterWerte()
 * @param {string[]} ids      Auslöser, die die Bilanz *nicht* auffällig fand
 * @param {number} bisher     das eingestellte Fenster in Stunden
 */
function spaeteFunde(fenster, ids, bisher = 4) {
  const raus = [];
  ids.forEach((id) => {
    const p = zeitProfil(fenster, id);
    if (!p.schwerpunkt) return;
    const f = FENSTER.find((x) => x.id === p.schwerpunkt);
    // Erst ab der Stunde, an der die alte Rechnung aufhört zu schauen.
    if (f.von < bisher) return;
    const teil = p.teile.find((x) => x.id === p.schwerpunkt);
    raus.push({ id, profil: p, teil, fensterName: f.name, ort: f.ort });
  });
  return raus.sort((a, b) => b.teil.differenz - a.teil.differenz);
}

/** Für die Anzeige: das Fenster in einem Wort. */
const FENSTER_WORT = Object.fromEntries(
  FENSTER.map((f) => [f.id, f.name]),
);

/* ===== js/wechselwirkung.js ===== */
/*
 * Zyklus mal Auslöser – dieselbe Menge, andere Wirkung
 *
 * WORUM ES GEHT
 *
 * Die Auslöserbilanz fragt: Ging es nach diesem Essen schlechter? Sie fragt
 * nicht, *wann im Monat*. Und das ist bei vielen Menschen der halbe Befund.
 *
 * Die Empfindlichkeit des Bauchs schwankt mit dem Zyklus – nicht als Gefühl,
 * sondern messbar: Vor und während der Periode reagiert der Darm auf dieselbe
 * Dehnung stärker, die Passage ändert sich, Prostaglandine tun das Ihre. Wer
 * drei Wochen lang Zwiebeln verträgt und in der vierten nicht, hat keine
 * Zwiebelunverträglichkeit – und wird trotzdem Zwiebeln streichen, wenn die
 * Rechnung über alle vier Wochen mittelt.
 *
 * Herauskommt dabei nämlich etwas, das doppelt falsch ist: In drei Wochen von
 * vier ist der Auslöser unschuldig, in der vierten ist er es nicht, und der
 * Mittelwert sagt „ein bisschen auffällig" – eine Aussage, die für keinen
 * einzigen Tag stimmt.
 *
 * WAS DIESE DATEI NICHT TUT
 *
 * Sie sagt nicht voraus. Die Phasen sind aus eingetragenen Blutungstagen
 * geschätzt (siehe js/zyklus.js, und dort steht auch, wie grob das ist). Sie
 * taugen zum Zurückschauen und zu nichts sonst.
 *
 * Und sie urteilt nicht über eine einzelne Phase. Verlangt wird, dass
 * mindestens zwei Phasen prüfbar sind – eine Zahl allein ist kein Wechsel,
 * sondern eine Zahl.
 */


/**
 * Mahlzeiten je Seite und Phase, ab denen eine Phase überhaupt zählt.
 *
 * Acht und nicht fünf, und das ist teuer erkauft: Bei fünf fand diese Rechnung
 * in einem rein zufälligen Tagebuch neun von zwanzig Auslösern „wechselnd".
 * Eine Phase teilt die Fälle auf ein Viertel, und aus einem Viertel lässt sich
 * ein Unterschied von Unterschieden nicht mehr ablesen.
 */
const MINDEST_JE_PHASE = 8;

/** So viele Phasen müssen prüfbar sein. */
const MINDEST_PHASEN = 2;

/**
 * Ab welchem Unterschied zwischen den Phasen von einem Wechsel die Rede ist.
 *
 * Anderthalb Stufen, und das ist mit Absicht mehr als die Schwelle der
 * Auslöserbilanz selbst (eine Stufe). Hier werden Unterschiede von
 * Unterschieden verglichen, und die schwanken stärker als die Unterschiede
 * selbst – wer denselben Maßstab anlegte, fände in jedem Tagebuch einen
 * Wechsel.
 */
const SPANNE = 1.5;

/** Und irgendwo muss überhaupt eine Wirkung sein, sonst wechselt nichts. */
const MINDEST_WIRKUNG = 1;

const mittel = (liste) => (liste.length
  ? liste.reduce((s, x) => s + x, 0) / liste.length : 0);

/**
 * Ein Auslöser, aufgeteilt nach Zyklusphase.
 *
 * @param {object[]} bewertet  aus bewerteteMahlzeiten(): { am, merkmale, wert }
 * @param {string} id          der Auslöser
 * @param {object} tage        der Tagesspeicher, für die Phasenschätzung
 */
function phasenWirkung(bewertet, id, tage, vergleiche = 1) {
  const gruppen = PHASEN.map((p) => {
    const drin = bewertet.filter((b) => phaseVon(tage, b.am) === p.id);
    return {
      p,
      mit: drin.filter((b) => b.merkmale.has(id)).map((b) => b.wert),
      ohne: drin.filter((b) => !b.merkmale.has(id)).map((b) => b.wert),
    };
  });

  /*
   * Die Streuung wird über alle Phasen gemeinsam geschätzt, nicht je Phase.
   *
   * Das war der zweite Fehler, den das Rauschtagebuch aufgedeckt hat: Eine
   * Streuung aus acht Werten ist selbst eine sehr schwankende Zahl. Fällt sie
   * in einer Phase zufällig klein aus, wird die Schranke dort klein – und
   * ausgerechnet die Phase mit der zufällig kleinsten Streuung ist die, die
   * sich am ehesten als „stärkste" hervortut. Die gemeinsame Schätzung nimmt
   * dem Zufall diese zweite Gelegenheit.
   */
  const quadrate = gruppen.reduce((acc, g) => {
    [g.mit, g.ohne].forEach((liste) => {
      if (liste.length < 2) return;
      const m = mittel(liste);
      acc.summe += liste.reduce((x, v) => x + (v - m) ** 2, 0);
      acc.freiheit += liste.length - 1;
    });
    return acc;
  }, { summe: 0, freiheit: 0 });
  const streuung = quadrate.freiheit > 0 ? Math.sqrt(quadrate.summe / quadrate.freiheit) : 0;

  const phasen = gruppen.map(({ p, mit, ohne }) => {
    const pruefbar = mit.length >= MINDEST_JE_PHASE && ohne.length >= MINDEST_JE_PHASE;
    const schnittMit = mittel(mit);
    const schnittOhne = mittel(ohne);
    return {
      phase: p.id,
      name: p.name,
      pruefbar,
      faelle: mit.length,
      gegenFaelle: ohne.length,
      schnittMit,
      schnittOhne,
      se: pruefbar ? streuung * Math.sqrt(1 / mit.length + 1 / ohne.length) : Infinity,
      differenz: pruefbar ? schnittMit - schnittOhne : 0,
    };
  });

  const pruefbare = phasen.filter((p) => p.pruefbar);

  /*
   * Ohne zwei abgeschlossene Zyklen ist die Phaseneinteilung geraten.
   *
   * Das steht vor der Fallzahlprüfung, weil es der schwerere Einwand ist: Bei
   * einem einzigen beobachteten Zyklus ist die mittlere Länge diese eine
   * Länge, und die Phasengrenzen sind dann keine Schätzung, sondern ein Echo
   * der Daten, an denen sie geprüft werden.
   */
  if (!belastbar(tage)) {
    return {
      urteil: 'unklar',
      phasen,
      pruefbare: 0,
      satz: 'Für einen Vergleich nach Zyklusphase fehlen die Zyklen: Es braucht '
        + 'mindestens zwei vollständig eingetragene, sonst sind die Phasen '
        + 'geraten und nicht geschätzt.',
    };
  }

  if (pruefbare.length < MINDEST_PHASEN) {
    return {
      urteil: 'unklar',
      phasen,
      pruefbare: pruefbare.length,
      satz: 'Bisher ist das nur in einer Phase oder in gar keiner vergleichbar. '
        + 'Aus einer einzelnen Phase folgt nichts über den Zyklus.',
    };
  }

  const sortiert = [...pruefbare].sort((a, b) => b.differenz - a.differenz);
  const staerkste = sortiert[0];
  const schwaechste = sortiert[sortiert.length - 1];
  const spanne = staerkste.differenz - schwaechste.differenz;

  /*
   * Und jetzt die Schranke, ohne die das hier eine Fundmaschine wäre.
   *
   * Verglichen werden zwei Differenzen, und die schwanken deutlich stärker als
   * jede einzelne für sich. Wie stark, hängt von der Streuung der Werte und
   * von der Fallzahl ab – und davon, wie oft insgesamt gefragt wird. Erst wenn
   * der Abstand beides überschreitet, ist von einem Wechsel die Rede.
   */
  const zufall = abstandSpielraum(
    staerkste.se, schwaechste.se, vergleiche, pruefbare.length,
  );
  /*
   * Zwei Bedingungen, und die zweite ist die wichtigere.
   *
   * Erstens muss der Abstand zwischen den Phasen den Zufall überschreiten.
   * Zweitens muss die stärkste Phase für sich genommen überhaupt eine Wirkung
   * zeigen, die über ihren eigenen Spielraum hinausgeht. Ohne das genügte es,
   * dass eine Phase zufällig weit *unter* null liegt – und schon hieße ein
   * Auslöser „wechselt", der nirgends etwas tut.
   */
  const eigenstaendig = staerkste.differenz >= Math.max(
    MINDEST_WIRKUNG, strenge(vergleiche) * staerkste.se,
  );
  if (spanne >= Math.max(SPANNE, zufall) && eigenstaendig) {
    return {
      urteil: 'wechselt',
      phasen,
      pruefbare: pruefbare.length,
      staerkste,
      schwaechste,
      spanne,
      satz: `In der Phase „${staerkste.name}" fällt das deutlich stärker aus `
        + `(${staerkste.differenz.toFixed(1)} Stufen Unterschied) als in der Phase `
        + `„${schwaechste.name}" (${schwaechste.differenz.toFixed(1)}). Dieselbe `
        + 'Menge, andere Wirkung – das spricht eher für eine wechselnde '
        + 'Empfindlichkeit als für eine Unverträglichkeit.',
    };
  }

  return {
    urteil: 'gleich',
    phasen,
    pruefbare: pruefbare.length,
    staerkste,
    schwaechste,
    spanne,
    satz: 'Über die Zyklusphasen hinweg fällt das ähnlich aus. Der Zyklus '
      + 'erklärt hier also nichts – was gegen ihn spricht und für das Essen.',
  };
}

/**
 * Und dieselbe Frage einmal ohne Essen: Ist eine Phase für sich schon schlimmer?
 *
 * js/zyklus.js liefert dazu die Zahlen, aber bewusst kein Urteil. Hier steht
 * es, mit denselben zwei Bedingungen: zwei vollständige Zyklen, und genug Tage
 * in beiden verglichenen Phasen.
 */
function phasenUrteil(bilanz, tage, mindestTage = 5) {
  const brauchbar = (bilanz || []).filter((p) => p.tage >= mindestTage);
  if (!belastbar(tage) || brauchbar.length < 2) {
    return {
      pruefbar: false,
      satz: 'Ob eine Zyklusphase für sich schlimmer ist, lässt sich noch nicht '
        + 'sagen – dafür fehlen entweder Zyklen oder Tage in den einzelnen Phasen.',
    };
  }
  const sortiert = [...brauchbar].sort((a, b) => b.schnitt - a.schnitt);
  const schlimm = sortiert[0];
  const mild = sortiert[sortiert.length - 1];
  const spanne = schlimm.schnitt - mild.schnitt;
  if (spanne < 1) {
    return {
      pruefbar: true,
      deutlich: false,
      satz: 'Über die Zyklusphasen hinweg sind die Beschwerden ähnlich stark. '
        + 'Ein Zyklusmuster ist hier nicht zu erkennen.',
    };
  }
  return {
    pruefbar: true,
    deutlich: true,
    schlimm,
    mild,
    spanne,
    satz: `Am stärksten ist es in der Phase „${schlimm.name}" `
      + `(${schlimm.schnitt.toFixed(1)} im Mittel über ${schlimm.tage} Tage), `
      + `am schwächsten in der Phase „${mild.name}" (${mild.schnitt.toFixed(1)} `
      + `über ${mild.tage} Tage). Die Phasen sind aus den eingetragenen `
      + 'Blutungstagen geschätzt.',
  };
}

/**
 * Für die Anzeige: alle Auslöser, deren Wirkung mit dem Zyklus wechselt.
 *
 * Nur die – „ändert sich nicht" ist keine Karte wert, sondern höchstens eine
 * Zeile unter dem einzelnen Fund. Was hier steht, ist die Auskunft, die man
 * sonst nirgends bekommt.
 */
function wechselnde(bewertet, ids, tage) {
  const raus = [];
  // Wie viele Auslöser hier geprüft werden, geht in die Schranke ein: Wer
  // zwanzigmal fragt, braucht eine deutlichere Antwort als wer dreimal fragt.
  const vergleiche = (ids || []).length;
  (ids || []).forEach((id) => {
    const w = phasenWirkung(bewertet, id, tage, vergleiche);
    if (w.urteil === 'wechselt') raus.push({ id, ...w });
  });
  return raus.sort((a, b) => b.spanne - a.spanne);
}

/** Für die Anzeige: kurzes Wort zum Urteil. */
const WECHSEL_WORT = {
  wechselt: 'wechselt mit dem Zyklus',
  gleich: 'über den Zyklus gleich',
  unklar: 'nicht prüfbar',
};

/* ===== js/dosis.js ===== */
/*
 * Wie viel verträgst du – nicht ob
 *
 * DER UNTERSCHIED, UM DEN ES GEHT
 *
 * „Zwiebeln sind auffällig" ist eine Auskunft, die im Alltag genau eine
 * Handlung nahelegt: Zwiebeln streichen. Und das ist fast immer zu viel.
 *
 * Die meisten Unverträglichkeiten sind keine Allergien, sondern
 * Mengenfragen. Wer eine Zwiebelsuppe nicht verträgt, verträgt oft drei Ringe
 * auf dem Brot problemlos; wer nach einem Glas Milch Beschwerden bekommt,
 * kommt mit einem Schuss im Kaffee meist zurecht. Der Unterschied zwischen
 * diesen beiden Auskünften ist der Unterschied zwischen einem Leben mit einer
 * Streichliste und einem Leben mit einer Faustregel.
 *
 * Und er entscheidet, ob jemand dabeibleibt. Streichlisten werden aufgegeben –
 * nicht aus Nachlässigkeit, sondern weil sie das Essen unmöglich machen und
 * weil sie meistens mehr streichen, als nötig wäre.
 *
 * WOHER DIE MENGE KOMMT, OHNE DASS JEMAND WIEGT
 *
 * Beim Eintragen bekommt jede Zutat eine **Rolle**: Hauptzutat, Beilage,
 * Topping, Würze. Das ist keine Grammangabe und soll auch keine sein – es ist
 * die Angabe, die man beim Eintragen ohne Nachdenken trifft, und für diese
 * Frage ist sie die richtige: Ob eine Zwiebel stört, hängt weniger an ihren
 * Gramm als daran, ob sie die Suppe war oder die Garnitur.
 *
 * Diese vier Rollen sind eine Reihenfolge von viel nach wenig, und damit
 * lässt sich fragen: Ab welcher Stufe fällt es auf? Verglichen wird jede Stufe
 * gegen dieselbe Gruppe – die Mahlzeiten ohne diese Zutat.
 *
 * WAS AUSDRÜCKLICH NICHT MITZÄHLT
 *
 * „Getränk dazu" ist keine Menge, sondern eine Art. Ein Glas Wein ist nicht
 * die kleinere Fassung von Wein als Hauptzutat, und ein Kaffee ist nie eine
 * Beilage. Diese Rolle steht deshalb außerhalb der Reihe.
 */


/**
 * Die Mengenreihe, von wenig nach viel.
 *
 * `rang` ist die Reihenfolge, nicht eine Menge – zwischen „Topping" und
 * „Beilage" liegt kein festes Verhältnis, und so zu tun wäre eine Genauigkeit,
 * die die Angabe nicht hergibt.
 */
const STUFEN = [
  { id: 'wuerze', rang: 0, name: 'als Würze', satz: 'nur als Würze' },
  { id: 'topping', rang: 1, name: 'als Topping', satz: 'als Topping' },
  { id: 'beilage', rang: 2, name: 'als Beilage', satz: 'als Beilage' },
  { id: 'haupt', rang: 3, name: 'als Hauptzutat', satz: 'als Hauptzutat' },
];

/** Mahlzeiten je Stufe, ab denen sie überhaupt zählt. */
const MINDEST_JE_STUFE = 5;

/** Und so viele Mahlzeiten ohne die Zutat als Vergleich. */
const MINDEST_OHNE = 8;

/** Ab welchem Unterschied eine Stufe auffällt – wie in der Auslöserbilanz. */
const STUFEN_SCHWELLE = 1;

const schnittVon = (l) => (l.length ? l.reduce((s, x) => s + x, 0) / l.length : 0);

/**
 * Ab welcher Menge fällt dieser Auslöser auf?
 *
 * @param {object[]} eintraege
 * @param {string} id       der Auslöser
 * @param {number} fenster  Stunden nach dem Essen
 */
function dosisBild(eintraege, id, fenster = 4) {
  const mahlzeiten = eintraege.filter((e) => e.art === 'essen').map((m) => ({
    wert: wertNach(eintraege, m, fenster),
    rolle: (zutatenVon(m).find((z) => z.id === id) || {}).rolle || null,
  }));

  // Die Vergleichsgruppe ist für alle Stufen dieselbe: Mahlzeiten, in denen
  // diese Zutat gar nicht vorkam. Jede Stufe gegen ihre eigene Gruppe zu
  // halten, hieße vier verschiedene Maßstäbe an dieselbe Frage anzulegen.
  const ohne = mahlzeiten.filter((x) => x.rolle === null).map((x) => x.wert);
  const schnittOhne = schnittVon(ohne);

  const stufen = STUFEN.map((st) => {
    const werte = mahlzeiten.filter((x) => x.rolle === st.id).map((x) => x.wert);
    const pruefbar = werte.length >= MINDEST_JE_STUFE && ohne.length >= MINDEST_OHNE;
    const r = zufallsSpielraum(werte, ohne, STUFEN.length);
    return {
      ...st,
      pruefbar,
      faelle: werte.length,
      schnitt: schnittVon(werte),
      schnittOhne,
      differenz: pruefbar ? schnittVon(werte) - schnittOhne : 0,
      spielraum: r.spielraum,
      // Auffällig heißt hier dasselbe wie überall: groß genug, um jemanden zu
      // interessieren, und größer als das, was der Zufall ohnehin hergibt.
      auffaellig: pruefbar && (schnittVon(werte) - schnittOhne) >= Math.max(STUFEN_SCHWELLE, r.spielraum),
    };
  });

  const pruefbare = stufen.filter((s) => s.pruefbar);
  const gegenFaelle = ohne.length;

  if (!pruefbare.length) {
    /*
     * Der häufigste Fall, und er hat eine nützliche Antwort.
     *
     * Meistens kommt eine Zutat immer in derselben Rolle vor – wer Zwiebeln
     * isst, isst sie fast immer mitgekocht. Dann gibt es keine Mengenfrage zu
     * beantworten, aber sehr wohl etwas zu tun: Es einmal in kleinerer Menge
     * essen und eintragen. Das ist eine Handlung, kein Achselzucken.
     */
    const haeufigste = [...stufen].sort((a, b) => b.faelle - a.faelle)[0];
    return {
      urteil: 'unklar',
      stufen,
      gegenFaelle,
      satz: haeufigste && haeufigste.faelle
        ? `Bisher kam das fast immer ${haeufigste.satz} vor `
          + `(${haeufigste.faelle} Mal). Um eine Menge zu finden, müsste es auch `
          + 'mal in kleinerer Rolle vorkommen – als Beilage, Topping oder Würze.'
        : 'Dafür ist es noch zu selten eingetragen.',
    };
  }

  const auffaellige = pruefbare.filter((s) => s.auffaellig);
  const harmlose = pruefbare.filter((s) => !s.auffaellig);

  if (!auffaellige.length) {
    /*
     * Keine Stufe fällt auf – aber „unauffällig" ist nur so viel wert wie die
     * größte geprüfte Menge. Wer bloß die Würze geprüft hat, hat nichts über
     * die Suppe gesagt.
     */
    const groesste = pruefbare[pruefbare.length - 1];
    return {
      urteil: 'unauffaellig',
      stufen,
      gegenFaelle,
      bisStufe: groesste,
      satz: `Bis hin zu „${groesste.name}" ist nichts aufgefallen `
        + `(${groesste.faelle} Mahlzeiten). ${groesste.rang === 3
          ? 'Größere Mengen als eine Hauptzutat gibt es nicht – das spricht gegen '
            + 'diese Zutat als Auslöser.'
          : 'Über größere Mengen sagt das nichts; die sind noch nicht geprüft.'}`,
    };
  }

  const niedrigsteAuffaellig = auffaellige[0];
  const hoechsteHarmlos = harmlose.filter((s) => s.rang < niedrigsteAuffaellig.rang).pop();

  if (hoechsteHarmlos) {
    return {
      urteil: 'schwelle',
      stufen,
      gegenFaelle,
      gehtBis: hoechsteHarmlos,
      abStufe: niedrigsteAuffaellig,
      satz: `${hoechsteHarmlos.satz.replace(/^./, (c) => c.toUpperCase())} `
        + `war es unauffällig (${hoechsteHarmlos.faelle} Mahlzeiten), `
        + `${niedrigsteAuffaellig.satz} dagegen um `
        + `${niedrigsteAuffaellig.differenz.toFixed(1)} Stufen schlechter `
        + `(${niedrigsteAuffaellig.faelle} Mahlzeiten). Es sieht also nach einer `
        + 'Menge aus, nicht nach der Zutat selbst – was heißt, dass Weglassen '
        + 'vermutlich zu viel wäre.',
    };
  }

  /*
   * Auffällig, ohne dass darunter etwas Geprüftes liegt – und jetzt kommt es
   * darauf an, *welche* Stufe das ist. Das war im ersten Entwurf falsch: Der
   * Fall hieß pauschal „auch in kleiner Menge", auch wenn die auffällige
   * Stufe die Hauptzutat war. „Schon als Hauptzutat fällt es auf" ist aber
   * keine Aussage über kleine Mengen, sondern gar keine Aussage über Mengen –
   * und sie hätte jemanden dazu gebracht, eine Zutat ganz zu streichen, ohne
   * dass je eine kleinere Menge geprüft worden wäre. Genau das soll diese
   * Datei verhindern.
   */
  if (niedrigsteAuffaellig.rang <= 1) {
    return {
      urteil: 'auch-wenig',
      stufen,
      gegenFaelle,
      abStufe: niedrigsteAuffaellig,
      satz: `Schon ${niedrigsteAuffaellig.satz} fällt es auf `
        + `(${niedrigsteAuffaellig.faelle} Mahlzeiten, um `
        + `${niedrigsteAuffaellig.differenz.toFixed(1)} Stufen schlechter). Eine `
        + 'Menge, die durchgeht, ist bisher nicht dabei.',
    };
  }

  return {
    urteil: 'ab-hier',
    stufen,
    gegenFaelle,
    abStufe: niedrigsteAuffaellig,
    satz: `Auffällig wird es ${niedrigsteAuffaellig.satz} `
      + `(${niedrigsteAuffaellig.faelle} Mahlzeiten, um `
      + `${niedrigsteAuffaellig.differenz.toFixed(1)} Stufen schlechter). Ob `
      + 'kleinere Mengen durchgehen, ist damit nicht gesagt – dafür müsste es '
      + 'auch mal in kleinerer Rolle vorkommen, als Beilage, Topping oder Würze. '
      + 'Bis dahin wäre ganz weglassen womöglich mehr als nötig.',
  };
}

/** Für die Anzeige: das Urteil in einem Wort. */
const DOSIS_WORT = {
  schwelle: 'kommt auf die Menge an',
  'auch-wenig': 'auch in kleiner Menge',
  'ab-hier': 'ab dieser Menge',
  unauffaellig: 'in jeder geprüften Menge unauffällig',
  unklar: 'Menge nicht prüfbar',
};

/* ===== js/gewicht.js ===== */
/*
 * Das einzige harte Maß
 *
 * WARUM AUSGERECHNET DIE WAAGE
 *
 * Alles andere in dieser App ist Selbstauskunft. „Stärke 6" ist eine
 * Einschätzung, „Blähungen" ein Gefühl, und wie stark etwas war, verschiebt
 * sich mit der Stimmung, mit der Erwartung und mit dem, was gestern war. Das
 * ist kein Mangel – anders geht es bei Bauchbeschwerden nicht –, aber es hat
 * eine Folge: Kein Wert in dieser App lässt sich von außen nachprüfen.
 *
 * Das Gewicht schon. Es ist die eine Zahl, die eine Waage sagt und nicht der
 * Mensch, und ausgerechnet sie ist die klinisch wichtigste, die ein Tagebuch
 * beitragen kann.
 *
 * WAS SIE ENTSCHEIDET
 *
 * Bei Bauchbeschwerden verläuft die entscheidende Grenze zwischen
 * „funktionell" – unangenehm, oft langwierig, aber ohne Schaden – und „da muss
 * jemand nachsehen". Ein ungewollter Gewichtsverlust ist das stärkste einzelne
 * Zeichen, das auf die zweite Seite deutet, und er steht in jeder Leitlinie
 * unter den Alarmzeichen. Fünf Prozent des Körpergewichts in sechs Monaten
 * gilt als die Grenze, ab der nachgesehen wird.
 *
 * Bisher stand das hier nur zum Ankreuzen. Angekreuzt wird es aber von dem,
 * der es schon bemerkt hat – und schleichende Verluste bemerkt niemand.
 *
 * ZWEI DINGE, DIE DIESE DATEI RICHTIG MACHEN MUSS
 *
 *   1. **Nicht auf Wasser hereinfallen.** Ein Mensch schwankt am Tag um ein
 *      bis zwei Kilo, je nach Trinken, Salz, Stuhlgang und Zyklus. Verglichen
 *      werden deshalb keine Einzelwerte, sondern Mittel aus mehreren
 *      Messungen, und zwischen ihnen muss ordentlich Zeit liegen.
 *   2. **Nicht bei jeder Diät Alarm schlagen.** Fünf Prozent weniger sind ein
 *      Warnzeichen, wenn sie *ungewollt* kommen, und ein Erfolg, wenn jemand
 *      dafür gearbeitet hat. Den Unterschied sieht keine Rechnung – deshalb
 *      wird gefragt.
 */

/** Ab hier gilt ein Verlust als abklärungsbedürftig: fünf Prozent. */
const ALARM_ANTEIL = 0.05;

/** In diesem Zeitraum – länger zurück ist eine andere Geschichte. */
const WAAGE_FENSTER = 180;

/** So weit müssen „früher" und „jetzt" auseinanderliegen. */
const MINDEST_ABSTAND = 30;

/** Und so viele Messungen gehen höchstens in ein Mittel ein. */
const JE_SEITE = 3;

const kiloSchnitt = (l) => (l.length ? l.reduce((s, x) => s + x.kg, 0) / l.length : 0);

const tageZwischen = (a, b) => Math.round(
  (new Date(`${b}T12:00`) - new Date(`${a}T12:00`)) / 86400000,
);

/**
 * Was die Waage über die letzten Monate sagt.
 *
 * @param {object[]} messungen  [{ am, kg }], jüngste zuerst
 * @param {string} heute        ISO-Datum
 * @param {boolean} gewollt     ob gerade absichtlich abgenommen wird
 */
function gewichtsBild(messungen, heute, gewollt = false) {
  const liste = [...(messungen || [])]
    .filter((g) => g && g.am && Number.isFinite(Number(g.kg)))
    .sort((a, b) => (a.am < b.am ? 1 : -1));

  if (!liste.length) {
    return {
      urteil: 'keine',
      messungen: liste,
      satz: 'Noch nichts gewogen. Alle ein bis zwei Wochen reicht – es ist die '
        + 'einzige Zahl hier, die nicht aus dem Gefühl kommt, und ein '
        + 'ungewollter Verlust ist das wichtigste Zeichen, das ein Tagebuch '
        + 'überhaupt liefern kann.',
    };
  }

  const imFenster = liste.filter((g) => tageZwischen(g.am, heute) <= WAAGE_FENSTER);
  const jetzt = imFenster.slice(0, JE_SEITE);
  const aktuell = kiloSchnitt(jetzt);

  /*
   * „Früher" sind die ältesten Messungen im Fenster – aber nur, wenn sie weit
   * genug zurückliegen. Zwei Wiegungen aus derselben Woche zu vergleichen
   * misst den Wasserhaushalt, nicht den Verlauf.
   */
  const weitGenug = imFenster.filter((g) => tageZwischen(g.am, jetzt[0].am) >= MINDEST_ABSTAND);
  const frueher = weitGenug.slice(-JE_SEITE);

  if (!frueher.length) {
    return {
      urteil: 'zu-kurz',
      messungen: liste,
      aktuell,
      satz: `Zuletzt ${aktuell.toFixed(1)} kg. Für eine Richtung braucht es `
        + `Messungen, die mindestens ${MINDEST_ABSTAND} Tage auseinanderliegen – `
        + 'darunter misst man Wasser und nicht den Verlauf.',
    };
  }

  const davor = kiloSchnitt(frueher);
  const differenz = aktuell - davor;
  const anteil = davor ? differenz / davor : 0;
  const spanne = tageZwischen(frueher[frueher.length - 1].am, jetzt[0].am);

  const grundlage = `${aktuell.toFixed(1)} kg zuletzt gegen ${davor.toFixed(1)} kg `
    + `vor gut ${Math.round(spanne / 30)} Monaten `
    + `(${jetzt.length} gegen ${frueher.length} Messungen).`;

  if (anteil <= -ALARM_ANTEIL) {
    /*
     * Der Fall, für den das Ganze da ist. Und die Frage, die ihn entscheidet,
     * kann die App nicht selbst beantworten – deshalb steht die Antwort des
     * Menschen mit im Urteil und nicht bloß im Text.
     */
    return {
      urteil: gewollt ? 'verlust-gewollt' : 'verlust',
      messungen: liste,
      aktuell,
      davor,
      differenz,
      anteil,
      spanne,
      warnung: !gewollt,
      satz: gewollt
        ? `${grundlage} Das sind ${Math.abs(anteil * 100).toFixed(0)} Prozent – `
          + 'du hast angegeben, dass das so gewollt ist, deshalb steht hier kein '
          + 'Warnzeichen. Sollte sich das ändern, stell es unter „Mehr" um.'
        : `${grundlage} Das sind ${Math.abs(anteil * 100).toFixed(0)} Prozent `
          + 'weniger. Ein ungewollter Verlust ab fünf Prozent gehört ärztlich '
          + 'abgeklärt – das ist keine Diagnose, sondern die Grenze, ab der '
          + 'nachgesehen wird. Wenn du absichtlich abnimmst, sag es der App '
          + 'unter „Mehr", dann hört sie damit auf.',
    };
  }

  if (anteil >= ALARM_ANTEIL) {
    return {
      urteil: 'zunahme',
      messungen: liste,
      aktuell,
      davor,
      differenz,
      anteil,
      spanne,
      satz: `${grundlage} Das sind ${(anteil * 100).toFixed(0)} Prozent mehr. `
        + 'Kein Alarmzeichen – aber eine Zahl, die zum übrigen Bild gehört.',
    };
  }

  return {
    urteil: 'stabil',
    messungen: liste,
    aktuell,
    davor,
    differenz,
    anteil,
    spanne,
    satz: `${grundlage} Das Gewicht ist damit stabil, und das ist bei `
      + 'Bauchbeschwerden eine gute Nachricht: Der wichtigste Hinweis darauf, '
      + 'dass mehr dahintersteckt, ist ein ungewollter Verlust.',
  };
}

/** Für die Anzeige: das Urteil in einem Wort. */
const GEWICHT_WORT = {
  verlust: 'deutlich weniger',
  'verlust-gewollt': 'weniger, wie gewollt',
  zunahme: 'deutlich mehr',
  stabil: 'stabil',
  'zu-kurz': 'noch keine Richtung',
  keine: 'nichts gewogen',
};

/* ===== js/provokation.js ===== */
/*

 *
 * WAS HIER ANDERS IST ALS ÜBERALL SONST
 *
 * Alles Übrige in dieser App wertet aus, was ohnehin geschieht. Das hat eine
 * Grenze, die auch ein Jahr Tagebuch nicht verschiebt: Wer an schlechten Tagen
 * anders isst, findet sein Essen auffällig, ohne dass es damit zu tun hätte.
 * Der Auslassversuch (js/versuch.js) dreht das zur Hälfte um – er greift ein.
 * Aber er greift über Wochen ein, und in zwei Wochen ändert sich noch anderes:
 * Stress, Jahreszeit, Zyklus, Aufmerksamkeit.
 *
 * Ein Provokationstest macht daraus etwas Kurzes und Wiederholbares. Eine
 * festgelegte Menge, nüchtern, ein festes Beobachtungsfenster – und das Ganze
 * mehrmals. Genau so wird auf Laktose- und Fruktoseunverträglichkeit geprüft;
 * in der Klinik misst dabei ein Atemtest den Wasserstoff mit, zu Hause bleibt
 * die Beschwerdestärke. Der Aufbau ist derselbe.
 *
 * DREI DINGE MACHEN DEN UNTERSCHIED ZU „ICH TRINK MAL EIN GLAS MILCH"
 *
 *   1. NÜCHTERN. Vier Stunden nichts davor, nichts während des Fensters. Sonst
 *      steht am Ende ein Bauchweh, das ebenso gut vom Frühstück kommen kann.

 *   2. WIEDERHOLUNG. Ein einzelner Durchgang beweist nichts, weil an genau dem

 *      dieselbe Menge mehrfach dasselbe tut, ist es die Menge.
 *   3. DER LEERDURCHGANG. Derselbe Ablauf ohne die Sache – nüchtern, gleiche

 *      ist das Wertvollste am ganzen Test: Ohne ihn wird das Nüchternsein
 *      selbst zum Verdächtigen. Nüchternschmerz ist bei Magenbeschwerden ein
 *      eigenes Muster – diese App führt es an anderer Stelle sogar auf. Wer
 *      ohne Leerdurchgang testet, kann einen Magen, der leer wehtut, nicht von

 *
 * WARUM EIN GEPLANTER TEST WENIGER VERLANGT ALS EIN FUND IM TAGEBUCH
 *
 * js/zufall.js hebt die Schwelle, je mehr Vergleiche angestellt werden – wer
 * fünfzig Fragen stellt, bekommt eine zufällige Antwort geschenkt. Hier wird
 * genau eine Frage gestellt, vorher festgelegt, an einem Tag, der dafür
 * eingerichtet wurde. Deshalb rechnet diese Datei mit `vergleiche = 1`, und das
 * ist keine Nachlässigkeit, sondern der eigentliche Gewinn des Verfahrens: Ein
 * geplanter Test darf einen kleineren Unterschied ernst nehmen als eine
 * Entdeckung in derselben Datenmenge, weil vorher niemand suchen musste.
 *
 * WAS ER NICHT IST
 *
 * Nicht verblindet. Wer das Glas trinkt, weiß, was drin ist, und Erwartung
 * erzeugt bei Bauchbeschwerden echte Beschwerden – das ist keine Einbildung
 * zweiter Klasse, das ist Physiologie. Daraus folgt eine Schieflage, die in
 * jeder Ausgabe steht: **Ein Test, der nichts findet, ist verlässlicher als
 * einer, der etwas findet.** Die Erwartung schiebt nur in eine Richtung. Wer
 * nach drei sauberen Durchgängen nichts merkt, hat eine echte Entlastung; wer
 * etwas merkt, hat einen starken Verdacht und keinen Beweis.
 *
 * Reine Rechnung. Was gestartet und eingetragen wird, steht in js/store.js.
 */


/** So viele Durchgänge mit der Sache, bevor überhaupt ein Urteil fällt. */
const MINDEST_LAEUFE = 3;

/** Und so viele Leerdurchgänge, damit gegen sie verglichen werden darf. */
const MINDEST_LEER = 2;

/** Zwischen zwei Durchgängen: so viele Tage, damit nichts nachwirkt. */
const ABSTAND_TAGE = 2;

/** Eine ganze Stufe – dieselbe Schwelle wie überall in dieser App. */
const PROVOKATION_SCHWELLE = 1;

/** Vorgaben, die sich beim Anlegen ändern lassen. */
const NUECHTERN_STD = 4;
const FENSTER_STD = 4;

const mittelAus = (l) => (l.length ? l.reduce((a, b) => a + b, 0) / l.length : 0);

/**
 * Was sich zu Hause überhaupt provozieren lässt – und womit.
 *
 * Eine kurze feste Liste und keine Ableitung aus der Bilanz, denn nicht jeder
 * Verdacht taugt für dieses Verfahren. „Fettiges" hat keine Menge, die man
 * nüchtern zu sich nimmt; Milchzucker, Fruchtzucker, Zuckeralkohole und Koffein
 * schon. Genau deshalb gibt es für diese vier auch in der Klinik einen Test.
 *
 * DIE MENGEN SIND ABSICHTLICH KLEINER ALS IN DER KLINIK. Ein Atemtest arbeitet
 * mit 25 g Laktose – das sind gut 500 ml Milch, und die Menge beantwortet die
 * Frage „liegt eine Malabsorption vor". Hier steht eine alltagsübliche Menge,
 * weil hier die andere Frage zählt: „macht mir das, was ich tatsächlich esse,
 * Beschwerden". Nur die zweite ändert etwas am Alltag – und die Testdosis
 * eigenhändig zu Hause zu nehmen, macht vor allem einen scheußlichen Tag.
 */
const PRUEFBAR = [
  {
    id: 'laktose',
    name: 'Laktose – Milchzucker',
    was: '250 ml Milch',
    warum: 'Fehlt das spaltende Enzym, bleibt der Milchzucker liegen und wird im '
      + 'Dickdarm vergoren: Gas, Krämpfe, weicher Stuhl, meist ein bis vier '
      + 'Stunden danach.',
  },
  {
    id: 'fruktose',
    name: 'Fruktose – Fruchtzucker',
    was: '200 ml Apfelsaft oder ein großer Apfel',
    warum: 'Der häufigste und der am meisten übersehene: Fruchtzucker wird nur '
      + 'begrenzt aufgenommen, und was übrig bleibt, wird vergoren. Apfelsaft '
      + 'ist die unbarmherzigste Form, weil er viel davon auf einmal liefert.',
  },
  {
    id: 'sorbit',
    name: 'Sorbit – Zuckeralkohol',
    was: '3 zuckerfreie Kaugummis oder 5 Trockenpflaumen',
    warum: 'Steckt in allem „Zuckerfreien" und in getrocknetem Obst. Wird kaum '
      + 'aufgenommen und zieht Wasser in den Darm – und verstärkt obendrein die '
      + 'Wirkung von Fruchtzucker, wenn beides zusammen kommt.',
  },
  {
    id: 'koffein',
    name: 'Koffein',
    was: 'eine Tasse Kaffee',
    warum: 'Regt die Säurebildung an und beschleunigt den Darm. Nüchtern trifft '
      + 'es am deutlichsten – deshalb ist gerade hier der Leerdurchgang wichtig: '
      + 'Ein leerer Magen tut auch ohne Kaffee weh.',
  },
];

/**
 * Wofür dieses Verfahren *nicht* gedacht ist.
 *
 * Der eine Satz, der in dieser Datei aus einem anderen Grund steht als alle
 * übrigen. Eine Unverträglichkeit ist mengenabhängig und unangenehm; eine
 * Allergie ist etwas anderes und kann in Minuten gefährlich werden. Wer bei
 * einem Lebensmittel schon einmal Ausschlag, Schwellung, Atemnot oder
 * Kreislaufprobleme hatte, darf es nicht auf eigene Faust noch einmal
 * versuchen – das gehört unter Aufsicht, mit dem Nötigen im Raum.
 */
const NICHT_BEI_ALLERGIE = 'Nicht anwenden, wenn du bei dieser Sache '
  + 'schon einmal Ausschlag, Schwellung im Mund oder Hals, Atemnot oder '
  + 'Kreislaufprobleme hattest. Das wäre eine Allergie und keine '
  + 'Unverträglichkeit – die wird nicht zu Hause provoziert, sondern ärztlich '
  + 'abgeklärt.';

/**
 * Ein einzelner Durchgang: was danach kam, und ob er zählt.
 *
 * `sauber` ist die härteste Bedingung des ganzen Verfahrens, und sie wird
 * nicht geglaubt, sondern im Tagebuch nachgesehen. Steht im Nüchternfenster
 * oder im Beobachtungsfenster eine Mahlzeit, ist der Durchgang keine Antwort –
 * kein Vorwurf, aber auch kein Ergebnis. Ihn trotzdem mitzuzählen hieße, die
 * eine Eigenschaft wegzuwerfen, für die jemand auf sein Frühstück verzichtet
 * hat.
 */
function laufBild(eintraege, lauf, p, vorheriger = null) {
  const t0 = zeitpunkt(lauf.am, lauf.um);
  const nuechtern = Number(p.nuechtern) || NUECHTERN_STD;
  const fenster = Number(p.fenster) || FENSTER_STD;

  const mahlzeiten = (eintraege || []).filter((e) => e.art === 'essen');
  const davor = mahlzeiten.filter((e) => {
    const d = stundenDazwischen(zeitpunkt(e.am, e.um), t0);
    return d > 0 && d < nuechtern;
  });
  const waehrend = mahlzeiten.filter((e) => {
    const d = stundenDazwischen(t0, zeitpunkt(e.am, e.um));
    return d > 0 && d <= fenster;
  });

  const wert = (eintraege || [])
    .filter((e) => e.art === 'beschwerde')
    .filter((e) => {
      const d = stundenDazwischen(t0, zeitpunkt(e.am, e.um));
      return d >= 0 && d <= fenster;
    })
    .reduce((m, e) => Math.max(m, Number(e.staerke) || 0), 0);

  /*
   * Zu dicht am vorherigen Durchgang ist ebenfalls unsauber, und zwar aus
   * demselben Grund: Was noch von gestern nachhallt, gehört nicht dem heutigen
   * Glas.
   */
  const zuNah = vorheriger ? tageDazwischen(vorheriger.am, lauf.am) < ABSTAND_TAGE : false;

  const warum = [];
  if (davor.length) warum.push(`${davor.length}× gegessen in den ${nuechtern} Stunden davor`);
  if (waehrend.length) warum.push(`${waehrend.length}× gegessen im Beobachtungsfenster`);
  if (zuNah) warum.push(`weniger als ${ABSTAND_TAGE} Tage nach dem vorigen Durchgang`);

  return {
    am: lauf.am,
    um: lauf.um,
    leer: !!lauf.leer,
    wert,
    sauber: warum.length === 0,
    warum,
  };
}

/**
 * Der Alltagsvergleich, wenn keine Leerdurchgänge da sind.
 *
 * Genommen wird dasselbe Fenster derselben Uhrzeit an Tagen, an denen kein
 * Durchgang war – der eigene Normalzustand zur selben Tageszeit. Das ist der
 * zweitbeste Vergleich und wird auch so benannt: An diesen Tagen wurde
 * gefrühstückt, an den Testtagen nicht, und dieser Unterschied bleibt in der
 * Rechnung stehen.
 */
function alltagsWerte(eintraege, p, laufTage, heute) {
  const fenster = Number(p.fenster) || FENSTER_STD;
  const uhr = (p.laeufe && p.laeufe[0] && p.laeufe[0].um) || '08:00';
  const werte = [];
  const tage = new Set(laufTage);
  const start = p.laeufe && p.laeufe.length ? p.laeufe[p.laeufe.length - 1].am : heute;

  for (let i = 0; i <= tageDazwischen(plusTage(start, -30), heute); i++) {
    const iso = plusTage(plusTage(start, -30), i);
    if (tage.has(iso)) continue;
    const amTag = (eintraege || []).filter((e) => e.am === iso);
    // Ein Tag ohne jede Eintragung ist kein ruhiger Tag, sondern ein
    // unbekannter. Er darf den Vergleichswert nicht nach unten ziehen. Ein
    // Tag mit nur einem Kopfschmerz ebenso wenig – zum Bauch steht da nichts.
    if (!amTag.some((e) => e.art !== 'kopf')) continue;
    const t0 = zeitpunkt(iso, uhr);
    werte.push(amTag
      .filter((e) => e.art === 'beschwerde')
      .filter((e) => {
        const d = stundenDazwischen(t0, zeitpunkt(e.am, e.um));
        return d >= 0 && d <= fenster;
      })
      .reduce((m, e) => Math.max(m, Number(e.staerke) || 0), 0));
  }
  return werte;
}

const PROVOKATION_WORT = {
  laeuft: 'läuft noch',
  unsauber: 'nicht auswertbar',
  bestaetigt: 'bestätigt sich',
  wechselhaft: 'mal so, mal so',
  'nicht-bestaetigt': 'bestätigt sich nicht',
  abgebrochen: 'abgebrochen',
};

/**
 * Das Ergebnis über alle Durchgänge.
 *
 * Zwei Zahlen tragen es, und beide stehen in der Ausgabe: wie *stark* im Mittel
 * reagiert wurde, und in wie *vielen* Durchgängen überhaupt. Sie sagen
 * Verschiedenes. Dreimal mittelmäßig ist ein anderer Befund als einmal heftig
 * und zweimal gar nicht, obwohl der Mittelwert derselbe sein kann – und der
 * zweite Fall ist der häufigere, weil eine Unverträglichkeit von der Menge und
 * vom Tag abhängt. Nur den Mittelwert zu zeigen hieße, den Unterschied
 * zwischen „das ist es" und „da ist noch etwas anderes im Spiel" zu verstecken.
 */
function provokationsBild(p, eintraege, heute) {
  if (!p) return null;
  const eintr = eintraege || [];
  const laeufe = [...(p.laeufe || [])].sort((a, b) => (a.am < b.am ? -1 : 1));

  const bilder = [];
  let letzterEcht = null;
  laeufe.forEach((l) => {
    const b = laufBild(eintr, l, p, l.leer ? null : letzterEcht);
    if (!l.leer) letzterEcht = l;
    bilder.push(b);
  });

  const echte = bilder.filter((b) => !b.leer && b.sauber);
  const leere = bilder.filter((b) => b.leer && b.sauber);
  const verworfen = bilder.filter((b) => !b.sauber);

  const grund = {
    laeufe: bilder,
    echte: echte.length,
    leere: leere.length,
    verworfen: verworfen.length,
    was: p.was || '',
  };

  if (p.beendet) {
    return {
      ...grund,
      urteil: 'abgebrochen',
      wort: PROVOKATION_WORT.abgebrochen,
      satz: `Abgebrochen nach ${echte.length} auswertbaren Durchgängen. Auch das ist `
        + 'eine Auskunft – ein Test, den man nicht durchhält, ist im Alltag keine '
        + 'Antwort.',
    };
  }

  if (echte.length < MINDEST_LAEUFE) {
    const fehlt = MINDEST_LAEUFE - echte.length;
    return {
      ...grund,
      urteil: 'laeuft',
      wort: PROVOKATION_WORT.laeuft,
      satz: `Noch ${fehlt} auswertbare${fehlt === 1 ? 'r' : ''} Durchgang${fehlt === 1 ? '' : 'e'}`
        + `, dann steht hier ein Ergebnis${verworfen.length
          ? ` (${verworfen.length} zählt nicht mit, weil dabei gegessen wurde)` : ''}. `
        + `Ein einzelner Durchgang beweist nichts: An genau dem Tag können auch `
        + `Schlaf, Anspannung oder der Zyklus schuld sein. Erst die Wiederholung `
        + `trennt die Sache vom Tag.`,
    };
  }

  /*
   * Woran gemessen wird. Der Leerdurchgang ist der bessere Vergleich, weil er
   * das Nüchternsein auf beiden Seiten stehen lässt; ohne ihn bleibt der eigene
   * Alltag zur selben Uhrzeit – und mit ihm ein Rest Unklarheit, der benannt
   * gehört statt weggerechnet zu werden.
   */
  const gegenLeer = leere.length >= MINDEST_LEER;
  const vergleichsWerte = gegenLeer
    ? leere.map((b) => b.wert)
    : alltagsWerte(eintr, p, laeufe.map((l) => l.am), heute);
  const grundlage = gegenLeer ? 'leerdurchgang' : 'alltag';

  const testWerte = echte.map((b) => b.wert);
  const schnitt = mittelAus(testWerte);
  const vergleich = mittelAus(vergleichsWerte);
  const unterschied = schnitt - vergleich;

  // vergleiche = 1: genau eine Frage, vorher festgelegt. Siehe oben.
  const { spielraum } = zufallsSpielraum(testWerte, vergleichsWerte, 1);
  const schranke = Math.max(PROVOKATION_SCHWELLE, spielraum);

  // „Reagiert" heißt: über dem eigenen Vergleichswert, nicht über null.
  const reagiert = echte.filter((b) => b.wert - vergleich >= PROVOKATION_SCHWELLE).length;

  const zahlen = `${schnitt.toFixed(1).replace('.', ',')} gegen `
    + `${vergleich.toFixed(1).replace('.', ',')} von 10, aus ${echte.length} Durchgängen `
    + `gegen ${gegenLeer ? `${leere.length} Leerdurchgänge` : `${vergleichsWerte.length} Alltagstage`}.`;

  const nachsatz = gegenLeer
    ? ''
    : ' Verglichen wird hier mit dem eigenen Alltag zur selben Uhrzeit – an diesen '
      + 'Tagen wurde aber gefrühstückt und an den Testtagen nicht. Zwei '
      + 'Leerdurchgänge (nüchtern, gleiche Zeit, ohne die Sache) würden genau '
      + 'diesen Rest ausräumen: Ein Magen, der leer wehtut, sieht sonst aus wie '
      + 'eine Unverträglichkeit.';

  if (vergleichsWerte.length < 2) {
    return {
      ...grund,
      urteil: 'laeuft',
      wort: PROVOKATION_WORT.laeuft,
      grundlage,
      schnitt,
      satz: 'Es fehlt der Vergleich. Zwei Leerdurchgänge – nüchtern, gleiche Uhrzeit, '
        + 'ohne die Sache – machen aus den Durchgängen erst einen Test. Ohne sie '
        + 'ist nicht zu trennen, ob die Beschwerden von der Sache kommen oder vom '
        + 'leeren Magen.',
    };
  }

  const gemeinsam = {
    ...grund, grundlage, schnitt, vergleich, unterschied, spielraum, schranke, reagiert,
  };

  if (unterschied >= schranke && reagiert > echte.length / 2) {
    return {
      ...gemeinsam,
      urteil: 'bestaetigt',
      wort: PROVOKATION_WORT.bestaetigt,
      satz: `In ${reagiert} von ${echte.length} Durchgängen kam es, und im Mittel `
        + `deutlich stärker als ohne: ${zahlen} Weil die Frage vorher feststand, `
        + `zählt dieser Unterschied schwerer als derselbe Unterschied im Tagebuch – `
        + `hier musste niemand erst suchen. Was fehlt, ist die Verblindung: Du `
        + `wusstest jedes Mal, was du zu dir nimmst, und Erwartung erzeugt echte `
        + `Beschwerden. Das ist ein starker Verdacht und kein Nachweis.${nachsatz}`,
    };
  }

  if (reagiert > 0 && reagiert <= echte.length / 2) {
    return {
      ...gemeinsam,
      urteil: 'wechselhaft',
      wort: PROVOKATION_WORT.wechselhaft,
      satz: `In ${reagiert} von ${echte.length} Durchgängen kam es, in den übrigen `
        + `nicht (${zahlen}) Das ist selbst ein Befund und der häufigste: Dann hängt `
        + `es nicht an der Sache allein, sondern an der Menge oder am Tag – wie viel `
        + `es war, wie voll der Bauch, welche Zyklusphase. Weglassen wäre hier `
        + `wahrscheinlich zu viel; eher lohnt ein zweiter Satz Durchgänge mit einer `
        + `kleineren Menge.${nachsatz}`,
    };
  }

  return {
    ...gemeinsam,
    urteil: 'nicht-bestaetigt',
    wort: PROVOKATION_WORT['nicht-bestaetigt'],
    satz: `Kein Unterschied zum Vergleich: ${zahlen} Das ist das belastbarste `
      + `Ergebnis, das dieser Test hergibt, und zwar mehr wert als ein positives: `
      + `Die Erwartung, die hier nicht ausgeschaltet werden kann, schiebt nur in `
      + `eine Richtung – zur Reaktion hin. Wer nüchtern und mehrfach nichts merkt, `
      + `hat das trotz dieser Schieflage nicht gemerkt.${nachsatz}`,
  };
}

/**
 * Was jetzt zu tun ist – die eine Zeile für den Tagesreiter.
 *
 * Ein Test ohne diese Zeile wird vergessen. Er besteht ja gerade nicht aus
 * einem Knopf, sondern aus Terminen, die man sich selbst setzt.
 */
function naechsterSchritt(p, heute) {
  if (!p || p.beendet) return null;
  const laeufe = [...(p.laeufe || [])].sort((a, b) => (a.am < b.am ? -1 : 1));
  const letzter = laeufe[laeufe.length - 1];
  const echte = laeufe.filter((l) => !l.leer).length;
  const leere = laeufe.filter((l) => l.leer).length;

  if (letzter && tageDazwischen(letzter.am, heute) < ABSTAND_TAGE) {
    /*
     * `am` ist der Tag, an dem der nächste Durchgang dran ist. Er wird hier
     * ausgerechnet, weil hier die Frist steht – die Anzeige braucht ihn nur,
     * um daraus einen Kalendertermin zu machen, und soll sie nicht ein zweites
     * Mal nachrechnen.
     */
    return {
      dran: false,
      am: plusTage(letzter.am, ABSTAND_TAGE),
      titel: `Body Check: ${p.was || 'Provokationstest'} – nächster Durchgang`,
      satz: `Heute nicht – zwischen zwei Durchgängen liegen ${ABSTAND_TAGE} Tage, `
        + 'sonst hallt der letzte noch nach.',
    };
  }
  if (echte < MINDEST_LAEUFE) {
    return {
      dran: true,
      leer: false,
      satz: `Morgen früh nüchtern: ${p.was || 'die festgelegte Menge'}. Danach `
        + `${p.fenster || FENSTER_STD} Stunden nichts essen und eintragen, wie es dir geht.`,
    };
  }
  if (leere < MINDEST_LEER) {
    return {
      dran: true,
      leer: true,
      satz: 'Jetzt ein Leerdurchgang: derselbe Ablauf, gleiche Uhrzeit, nüchtern – '
        + 'nur ohne die Sache. Er kostet einen Morgen und ist der Teil, der aus '
        + 'den Durchgängen einen Test macht.',
    };
  }
  return { dran: false, satz: 'Genug Durchgänge beisammen – das Ergebnis steht unten.' };
}

/*
 * Der Stufenplan: erst weglassen, dann Gruppe für Gruppe zurückholen
 *
 * WORAUF DAS GANZE HINAUSLÄUFT
 *
 * Das hier ist die größte Sache, die diese App verlangt, und die einzige, die
 * am Ende einen Speiseplan hinterlässt statt einer Auskunft. Der Ablauf ist der
 * der FODMAP-Diät, wie sie in der Ernährungsberatung gemacht wird:
 *
 *   1. KARENZ. Zwei bis vier Wochen konsequent ohne die vergärbaren
 *      Kohlenhydrate. Die Frage dieser Phase ist nicht „was davon", sondern
 *      „überhaupt".
 *   2. WIEDEREINFÜHRUNG. Eine Gruppe nach der anderen, jede über drei Tage mit
 *      steigender Menge, dazwischen jedes Mal zurück auf die Karenz.
 *   3. WAS BLEIBT. Der Alltag danach ist die Karenz plus alles, was sich als
 *      verträglich erwiesen hat – und das ist bei den meisten Menschen das
 *      meiste.
 *
 * DIE WICHTIGSTE ZEILE DIESER DATEI IST EIN ABBRUCH
 *
 * Wenn die Karenz nichts bringt, ist der Plan zu Ende. Nicht „dann probieren
 * wir die Wiedereinführung trotzdem", sondern: aufhören, wieder normal essen,
 * woanders suchen. Das ist die Stelle, an der Apps und Ratgeber reihenweise
 * versagen – sie führen durch zehn Wochen Verzicht, ohne je zu fragen, ob die
 * ersten drei etwas gebracht haben.
 *
 * Und es ist keine Formalie: Eine FODMAP-Karenz streicht Weizen, Zwiebeln,
 * Hülsenfrüchte, viele Obstsorten und Milchprodukte auf einmal. Wer sie ohne
 * Nutzen weiterführt, verliert Ballaststoffe, Kalzium und Vielfalt in der
 * Darmflora und hat dafür nichts bekommen. Eine Diät ohne Wirkung ist kein
 * neutraler Zustand, sie ist ein Schaden mit Aufwand.
 *
 * DIE ZWEITWICHTIGSTE: DIE KARENZ IST NICHT DAS ZIEL
 *
 * Sie ist der Aufbau, nicht das Ergebnis. Wer nach der Karenz aufhört, weil es
 * ihm besser geht, bleibt für immer auf der strengsten Stufe – und das ist der
 * häufigste Ausgang im wirklichen Leben, weil sich niemand traut, das
 * Erreichte wieder aufs Spiel zu setzen. Deshalb steht in dieser App an jeder
 * Stelle, dass die Wiedereinführung der Punkt ist und die Karenz nur der Weg
 * dorthin.
 *
 * VOR DEM ANFANG: ZÖLIAKIE
 *
 * Eine Karenz nimmt Weizen mit heraus. Der Bluttest auf Zöliakie funktioniert
 * aber nur, solange noch Gluten gegessen wird – wer vorher wegläßt, bekommt
 * ein falsch unauffälliges Ergebnis und einen Verdacht, der jahrelang
 * unentdeckt bleibt. Deshalb steht die Frage vor dem Start und nicht im
 * Kleingedruckten.
 *
 * Reine Rechnung. Was gestartet und abgehakt wird, steht in js/store.js.
 */


/** Wie lange eine Gruppe geprüft wird: drei Tage mit steigender Menge. */
const STUFE_TAGE = 3;

/**
 * Und so lange danach wieder Karenz, bevor die nächste Gruppe kommt.
 *
 * Ohne diese Pause misst die zweite Gruppe, was die erste angerichtet hat. Sie
 * ist der Grund, warum ein Stufenplan Wochen dauert und nicht Tage.
 */
const PAUSE_TAGE = 3;

/**
 * Der erste Tag nach einer Stufe zählt noch zur Stufe.
 *
 * Was am dritten Tag in der größten Menge gegessen wurde, meldet sich oft erst
 * am nächsten Morgen – FODMAPs wirken im Dickdarm, und dorthin braucht Essen
 * seine Zeit. Diesen Tag zur Pause zu zählen hieße, die Reaktion der
 * Vergleichsgruppe zuzuschlagen: Sie fehlte dann nicht nur beim Befund, sie
 * machte den Vergleichswert obendrein schlechter.
 */
const NACHKLANG = 1;

/**
 * Die ersten Tage der Karenz zählen nicht mit.
 *
 * Eine Ernährungsumstellung braucht ein paar Tage, bis sie steht – und die
 * ersten sind erfahrungsgemäß die unruhigsten, weil sich auch der Alltag
 * umstellen muss. Sie in den Vergleichswert zu nehmen machte die Karenz
 * schlechter, als sie ist.
 */
const EINGEWOEHNUNG = 3;

/** Auf beiden Seiten so viele notierte Tage, sonst gibt es kein Urteil. */
const MINDEST_NOTIERT = 5;

/** Eine ganze Stufe – dieselbe Schwelle wie überall in dieser App. */
const PLAN_SCHWELLE = 1;

/** Kürzer als zwei Wochen zeigt nichts, länger als vier hält niemand durch. */
const KARENZ_VORSCHLAEGE = [14, 21, 28];

/**
 * Die Gruppen, und womit sie geprüft werden.
 *
 * Die Mengen steigen über drei Tage, und das ist keine Bequemlichkeit: Die
 * meisten Unverträglichkeiten sind Mengenfragen. Wer nur die größte Menge
 * prüft, erfährt nie, dass die kleine durchgeht – und streicht dann eine ganze
 * Gruppe, obwohl ein Drittel davon problemlos gewesen wäre.
 *
 * Weizen und Zwiebel stehen getrennt, obwohl beides Fruktane sind. Sie
 * vertragen sich beim selben Menschen oft verschieden gut, und für den Alltag
 * ist der Unterschied riesig: Brot betrifft jede Mahlzeit, Zwiebel fast jedes

 */
const FODMAP_GRUPPEN = [

      + 'verhält.',
  },
  {

    womit: 'Kichererbsen aus der Dose, abgespült',

  },
