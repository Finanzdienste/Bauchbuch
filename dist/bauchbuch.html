}

/** Wie lange eine Runde dauert, in Sekunden. */
function rundenDauer(uebung) {
  return uebung.phasen.reduce((s, p) => s + p.sek, 0);
}

/** Die ganze Übung, in Sekunden – für die Anzeige „etwa 2 Minuten". */
function gesamtDauer(uebung, runden) {
  return rundenDauer(uebung) * (runden || uebung.runden);
}

function dauerText(sekunden) {
  const m = Math.round(sekunden / 60);
  if (sekunden < 90) return `${Math.round(sekunden)} Sekunden`;
  return `${m} Minuten`;
}

/**
 * Der Ablauf als flache Liste: jede Phase jeder Runde, einmal ausgerollt.
 *
 * Ausgerollt statt gerechnet, weil der Ablauf dadurch selbst zum Prüfgegenstand
 * wird – man kann ihn ansehen und nachzählen, statt einer Schleife zu glauben.
 */
function ablauf(uebung, runden) {
  const n = runden || uebung.runden;
  const schritte = [];
  for (let r = 1; r <= n; r++) {
    uebung.phasen.forEach((p, i) => {
      schritte.push({
        runde: r,
        von: n,
        art: p.art,
        wort: p.wort,
        sek: p.sek,
        letzte: r === n && i === uebung.phasen.length - 1,
      });
    });
  }
  return schritte;
}

/* ===== js/zyklus.js ===== */
/*
 * Der Zyklus – gerechnet aus dem, was eingetragen wurde, und aus nichts sonst.
 *
 * Warum das in ein Magentagebuch gehört: Bei vielen Menschen schwanken
 * Übelkeit, Blähungen, Sodbrennen und Appetit mit dem Zyklus, und wer das
 * nicht mitzählt, sucht die Ursache vier Wochen lang im Essen. Ein Muster, das
 * sich alle vier Wochen wiederholt, sieht man nur, wenn man weiß, wo die
 * Wochen anfangen.
 *
 * WOFÜR DAS HIER NICHT TAUGT, und das ist keine Formalie:
 *
 *   * **Nicht zur Verhütung.** Der Eisprung wird hier nicht gemessen, sondern
 *     aus der halben Zykluslänge geschätzt. Er verschiebt sich, und zwar
 *     gerade dann, wenn jemand krank ist oder unter Druck steht – also genau
 *     in den Zeiträumen, um die es in dieser App geht.
 *   * **Nicht als Vorhersage.** „Nächste Periode am …" steht nirgends. Eine
 *     Zahl, die aus drei beobachteten Zyklen stammt, sieht genauso aus wie
 *     eine, die aus dreißig stammt – und wird genauso geglaubt.
 *
 * Was hier steht, ist eine Einordnung des *vergangenen* Verlaufs: In welcher
 * Phase lag ein bestimmter Tag, gemessen an den eingetragenen Blutungstagen.
 */

/** Ab hier gilt ein Tag als Blutungstag – Schmierblutung zählt mit. */
const BLUTUNG_AB = 1;

/**
 * Eine Lücke von so vielen Tagen trennt zwei Zyklen.
 *
 * Zwei Tage Pause mitten in der Periode sind nichts Ungewöhnliches; würde man
 * schon daraus einen neuen Zyklus machen, käme eine Zykluslänge von vier Tagen
 * heraus. Drei Tage ist die übliche Grenze.
 */
const LUECKE = 3;

const PHASEN = [
  { id: 'menstruation', name: 'Periode' },
  { id: 'follikel', name: 'erste Zyklushälfte' },
  { id: 'ovulation', name: 'Zyklusmitte' },
  { id: 'luteal', name: 'zweite Zyklushälfte' },
];

const PHASEN_MAP = Object.fromEntries(PHASEN.map((p) => [p.id, p]));

function phasenName(id) {
  return PHASEN_MAP[id] ? PHASEN_MAP[id].name : id;
}

/** Alle eingetragenen Blutungstage, aufsteigend. */
function blutungsTage(tage) {
  return Object.keys(tage || {})
    .filter((iso) => Number(tage[iso] && tage[iso].blutung) >= BLUTUNG_AB)
    .sort();
}

/**
 * Die beobachteten Zyklen: [{ start, laenge }].
 *
 * Ein Zyklus beginnt am ersten Blutungstag nach einer Lücke. Seine Länge ist
 * der Abstand zum nächsten Anfang – der letzte Zyklus hat deshalb keine, er
 * läuft noch.
 */
function zyklen(tage) {
  const bt = blutungsTage(tage);
  if (!bt.length) return [];
  const starts = [bt[0]];
  const blutungsEnden = [];
  for (let i = 1; i < bt.length; i++) {
    if (tageDazwischen(bt[i - 1], bt[i]) >= LUECKE) {
      blutungsEnden.push(bt[i - 1]);
      starts.push(bt[i]);
    }
  }
  blutungsEnden.push(bt[bt.length - 1]);
  return starts.map((start, i) => ({
    start,
    blutungBis: blutungsEnden[i],
    blutungsTage: tageDazwischen(start, blutungsEnden[i]) + 1,
    laenge: i + 1 < starts.length ? tageDazwischen(start, starts[i + 1]) : null,
  }));
}

/**
 * Die mittlere Zykluslänge aus den abgeschlossenen Zyklen.
 *
 * Ohne abgeschlossenen Zyklus gibt es keine – dann liefert das hier `null`,
 * und alles, was darauf aufbaut, hält den Mund. 28 als stille Annahme
 * einzusetzen wäre bequem und falsch: Es gibt genug Menschen, bei denen 24
 * oder 34 der Normalfall ist, und deren Phasen lägen dann durchgehend daneben.
 */
function mittlereLaenge(tage) {
  const fertig = zyklen(tage).filter((z) => z.laenge && z.laenge >= 15 && z.laenge <= 60);
  if (!fertig.length) return null;
  return Math.round(fertig.reduce((s, z) => s + z.laenge, 0) / fertig.length);
}

/** Wie stark die Zykluslänge schwankt – die Spanne zwischen kürzestem und längstem. */
function schwankung(tage) {
  const laengen = zyklen(tage).map((z) => z.laenge)
    .filter((l) => l && l >= 15 && l <= 60);
  if (laengen.length < 2) return null;
  return { von: Math.min(...laengen), bis: Math.max(...laengen), anzahl: laengen.length };
}

/**
 * Der Zyklustag eines Datums: 1 am ersten Blutungstag.
 *
 * `null`, wenn der Tag vor dem ersten eingetragenen Zyklus liegt oder mehr als
 * zwei Monate hinter seinem Anfang – dann ist die Zuordnung geraten, nicht
 * gerechnet.
 */
function zyklusTag(tage, iso) {
  const alle = zyklen(tage);
  let letzter = null;
  for (const z of alle) {
    if (z.start <= iso) letzter = z;
  }
  if (!letzter) return null;
  const tag = tageDazwischen(letzter.start, iso) + 1;
  return tag >= 1 && tag <= 60 ? tag : null;
}

/**
 * Die Phase eines Tages.
 *
 * Grob und offen gesagt grob: Die Periode kommt aus den Eintragungen, die
 * Mitte wird aus der halben Zykluslänge geschätzt, der Rest teilt sich davor
 * und danach auf. Feiner geht es ohne Temperatur- oder Hormonmessung nicht,
 * und feiner zu *tun* wäre schlimmer als grob zu sein.
 */
function phaseVon(tage, iso) {
  const tag = zyklusTag(tage, iso);
  if (!tag) return null;
  const tagInfo = (tage || {})[iso];
  if (Number(tagInfo && tagInfo.blutung) >= BLUTUNG_AB) return 'menstruation';
  const laenge = mittlereLaenge(tage);
  if (!laenge) return null;
  const mitte = Math.round(laenge / 2);
  if (tag >= mitte - 2 && tag <= mitte + 2) return 'ovulation';
  return tag < mitte ? 'follikel' : 'luteal';
}

/**
 * Beschwerdestärke je Zyklusphase.
 *
 * Die eigentliche Auskunft dieses Moduls. Zurück kommt für jede Phase, in der
 * überhaupt etwas notiert wurde: wie viele Tage, wie stark im Mittel, und wie
 * viele davon mit Beschwerden. Ohne Schwelle und ohne Urteil – die Fallzahlen
 * stehen daneben, damit man selbst sieht, ob drei Tage oder dreißig gemeint
 * sind.
 */
function phasenBilanz(eintraege, tage, tagesWert) {
  const eimer = Object.fromEntries(PHASEN.map((p) => [p.id, { tage: 0, summe: 0, mit: 0 }]));
  const gesehen = new Set();
  const alleTage = new Set([
    ...Object.keys(tage || {}),
    ...eintraege.map((e) => e.am),
  ]);
  alleTage.forEach((iso) => {
    if (gesehen.has(iso)) return;
    gesehen.add(iso);
    const p = phaseVon(tage, iso);
    if (!p) return;
    const t = tagesWert(eintraege, iso, tage);
    if (!t.notiert) return;
    eimer[p].tage += 1;
    eimer[p].summe += t.wert;
    if (t.wert > 0) eimer[p].mit += 1;
  });
  return PHASEN
    .filter((p) => eimer[p.id].tage > 0)
    .map((p) => ({
      phase: p.id,
      name: p.name,
      tage: eimer[p.id].tage,
      schnitt: eimer[p.id].summe / eimer[p.id].tage,
      anteil: eimer[p.id].mit / eimer[p.id].tage,
    }));
}

/**
 * Reicht das für eine Aussage?
 *
 * Zwei abgeschlossene Zyklen sind die Untergrenze, unter der eine Phase
 * bestenfalls ein Zufall ist. Steht hier `false`, zeigt die App die Zahlen
 * trotzdem – aber ohne den Satz, dass daraus etwas folgt.
 */
function belastbar(tage) {
  return zyklen(tage).filter((z) => z.laenge).length >= 2;
}

/** Der Stand von heute, für die Tagesansicht. */
function heutigerStand(tage, iso) {
  const tag = zyklusTag(tage, iso);
  if (!tag) return null;
  return {
    tag,
    phase: phaseVon(tage, iso),
    laenge: mittlereLaenge(tage),
    // Nur zur Einordnung des Heute, nicht als Vorhersage: Wie weit ist der
    // Zyklus, gemessen an der bisherigen mittleren Länge.
    seitAnfang: plusTage(iso, -(tag - 1)),
  };
}

/* ===== js/kopf.js ===== */
/*
 * Kopfschmerzen – eine eigene Eintragsart, und warum gerade das.
 *
 * Die Beschwerden dieser App sind Bauchbeschwerden. Jede Rechnung – der
 * Tageswert, die Auslöserbilanz, die Kriterien, die Richtung – holt sich die
 * Einträge mit `art === 'beschwerde'` und liest deren Stärke. Ein Kopfschmerz,
 * der dort als „Beschwerde mit der Art Kopf" läge, zählte überall als Bauch:
 * Eine 7 am Kopf machte aus dem Kaffee davor einen Auslöser, aus dem Tag einen
 * Beschwerdetag und aus einer ruhigen Woche eine schlechte.
 *
 * Deshalb ist der Kopf eine *Art* wie Stuhlgang oder Medikament, keine
 * Beschwerdeart. Keine der vorhandenen Rechnungen sieht ihn, und das ist kein
 * Versehen, sondern der Zweck: Was hier steht, rechnet nur mit sich selbst.
 *
 * Was den Kopf und den Bauch trotzdem verbindet, ist das Schmerzmittel.
 * Ibuprofen, Diclofenac und ASS gehören zu den häufigsten Ursachen einer
 * gereizten Magenschleimhaut – und wer Kopfschmerzen hat, greift genau dazu.
 * Bei einer Gastritis Typ C sind sie einer der Hauptverdächtigen. Deshalb
 * zählt dieses Modul, an wie vielen Kopfschmerztagen ein solches Mittel im
 * Tagebuch steht, und vergleicht den Bauch danach – und zwar, wo es geht,
 * mit Kopfschmerztagen *ohne* ein solches Mittel, damit der Kopfschmerz auf
 * beiden Seiten steht und der Unterschied das Mittel ist.
 *
 * FÜR EINE MIGRÄNE
 *
 * Ein Kopfschmerztagebuch für die Sprechstunde braucht wenige Zahlen, und sie
 * stehen hier alle: Kopfschmerztage je Monat, Tage mit Akutmedikation je Monat
 * und Klasse, Dauer und Stärke der Attacken, Begleitmerkmale, ob der Tag
 * ausgefallen ist, ob das Mittel geholfen hat, und ob die Attacken an der
 * Periode hängen. Die Schwellen, die die Neurologie dafür benutzt, stehen
 * dabei – als Frage für die Sprechstunde, nie als Urteil: Die App zählt
 * Kopfschmerztage, keine Migränetage. Und weil die Definitionen mehr als drei
 * Monate verlangen, rechnet sie drei Fenster zu dreißig Tagen; ein einzelnes
 * Fenster ist bei einer Migräne ein Zufallswert – eine schlechte Woche, ein
 * Zyklus.
 */


/*
 * Wie er sich anfühlt. Keine Diagnose-Schublade, sondern die Fragen, die in
 * der Sprechstunde gestellt werden: pochend oder drückend, eine Seite oder
 * beide, Übelkeit, Erbrechen, Licht, Bewegung, Nacken, Aura. Aus der
 * Kombination schließt eine Ärztin etwas; die App schließt nichts, sie zählt.
 *
 * „Nackenschmerz dabei", nicht „vom Nacken her": Nackenschmerz begleitet die
 * meisten Migräneanfälle, und wer ihn als Ursache einträgt, landet in der
 * falschen Sprechstunde.
 */
const KOPF_ARTEN = [
  { id: 'pochend', name: 'Pochend, pulsierend' },
  { id: 'drueckend', name: 'Drückend, wie ein Band' },
  { id: 'einseitig', name: 'Einseitig' },
  { id: 'kopfuebel', name: 'Mit Übelkeit' },
  { id: 'kopferbrechen', name: 'Erbrochen' },
  { id: 'licht', name: 'Licht oder Lärm stören' },
  { id: 'bewegung', name: 'Schlimmer bei Bewegung' },
  { id: 'nacken', name: 'Nackenschmerz dabei' },
  { id: 'aura', name: 'Aura vorher (Flimmern, Zacken, wanderndes Kribbeln, Wortsuche)' },
];

/*
 * Wie lange. Vier grobe Stufen statt einer Stundenzahl: Wer eine Attacke
 * hinter sich hat, weiß „den halben Tag" oder „bis übermorgen", aber nicht
 * „elf Stunden". Die Grenzen sind die, die etwas bedeuten: Unter vier Stunden
 * ist für eine Migräne untypisch oder früh behandelt, vier Stunden bis drei
 * Tage ist ihr Bereich, und länger als drei Tage ist ein Grund, in der Praxis
 * anzurufen. „Weiß ich nicht mehr" wird gespeichert, aber nicht gezählt.
 */
const KOPF_DAUER = [
  { id: 'kurz', name: 'unter 4 Stunden' },
  { id: 'mittel', name: '4 bis 24 Stunden' },
  { id: 'lang', name: '1 bis 3 Tage' },
  { id: 'status', name: 'länger als 3 Tage' },
];

/*
 * Wie der Tag weiterging – in den drei Stufen, nach denen die Sprechstunde
 * graduiert: Ausfalltage und Tage mit halber Leistung über drei Monate.
 * Ja/nein wäre bequemer und verlöre die Mitte, in der die meisten
 * Migränetage liegen.
 */
const KOPF_VERLAUF = [
  { id: 'normal', name: 'Normal weitergemacht', kurz: '' },
  { id: 'eingeschraenkt', name: 'Eingeschränkt, aber weitergemacht', kurz: 'eingeschränkt' },
  { id: 'ausgefallen', name: 'Ausgefallen – hinlegen müssen, Arbeit oder Pläne abgesagt', kurz: 'ausgefallen' },
];

/** Die Antwort, die man auf der Nachtrag-Karte geben darf, ohne zu raten. */
const UNBEKANNT = 'unbekannt';

/*
 * Hat das Mittel geholfen? Nach etwa zwei Stunden – das ist der Zeitpunkt, an
 * dem die Akuttherapie beurteilt und angepasst wird. Die eine Angabe, ohne
 * die ein Kopfschmerztagebuch für die Sprechstunde unvollständig ist.
 */
const MITTEL_WIRKUNG = [
  { id: 'weg', name: 'Weg' },
  { id: 'besser', name: 'Besser' },
  { id: 'nicht', name: 'Nicht geholfen' },
];

const KOPF_MAP = Object.fromEntries(KOPF_ARTEN.map((a) => [a.id, a]));
const DAUER_MAP = Object.fromEntries(KOPF_DAUER.map((d) => [d.id, d]));
const VERLAUF_MAP = Object.fromEntries(KOPF_VERLAUF.map((v) => [v.id, v]));
const WIRKUNG_MAP = Object.fromEntries(MITTEL_WIRKUNG.map((w) => [w.id, w]));

function kopfArtName(id) {
  return KOPF_MAP[id] ? KOPF_MAP[id].name : id;
}

function kopfDauerName(id) {
  return DAUER_MAP[id] ? DAUER_MAP[id].name : '';
}

function kopfVerlaufKurz(id) {
  return VERLAUF_MAP[id] ? VERLAUF_MAP[id].kurz : '';
}

function mittelWirkungName(id) {
  return WIRKUNG_MAP[id] ? WIRKUNG_MAP[id].name : '';
}

/**
 * Nur die Kopfschmerz-Einträge, und nur die mit einer Stärke. Mit `heute`
 * bleibt draußen, was danach liegt – ein Bericht für einen früheren
 * Zeitraum darf keinen späteren Anfall mitzählen.
 */
function kopfEintraege(eintraege, heute) {
  return (eintraege || []).filter((e) => e.art === 'kopf' && Number(e.staerke) >= 1
    && (!heute || e.am <= heute));
}

/** Die Kopfschmerztage als Menge – für alles, was Tage vergleicht. */
function kopfTageVon(eintraege, heute) {
  return new Set(kopfEintraege(eintraege, heute).map((e) => e.am));
}

/**
 * Alle Tage, an denen überhaupt etwas eingetragen wurde – gleich was.
 *
 * Für den Kopf ist ein Tag mit nur einem Kopfeintrag ein notierter Tag; für
 * den Bauch ist er eine Lücke (siehe tagesWert in auswertung.js). Beides ist
 * richtig, und deshalb hat der Kopf hier seine eigene Zählung.
 */
function alleNotiertenTage(eintraege, tage) {
  return new Set([
    ...(eintraege || []).map((e) => e.am),
    ...Object.keys(tage || {}),
  ]);
}

/**
 * Drei Fenster zu dreißig Tagen, das jüngste zuerst: [heute−29, heute],
 * [heute−59, heute−30], [heute−89, heute−60]. Die Definitionen der
 * Neurologie verlangen mehr als drei Monate; ein Fenster allein ist ein
 * Punktwert.
 */
const KOPF_FENSTER = 3;

function fensterGrenzen(heute, i) {
  const bis = plusTage(heute, -30 * i);
  return { von: plusTage(bis, -29), bis };
}

function imFenster(tageMenge, grenzen) {
  return [...tageMenge].filter((iso) => iso >= grenzen.von && iso <= grenzen.bis).length;
}

/** Ab so vielen Kopfschmerztagen in 30 Tagen fragt die Neurologie nach „chronisch". */
const CHRONISCH_AB = 15;

/**
 * Die Grundzahlen: wie oft, an wie vielen Tagen, wie stark, wie oft was.
 *
 * `anteil` ist Kopfschmerztage durch notierte Tage – nicht durch Kalendertage.
 * Eine Lücke im Tagebuch ist kein kopfschmerzfreier Tag, sie ist eine Lücke.
 * Die Fenster dagegen zählen Kalendertage: Die Schwelle „fünfzehn im Monat"
 * ist eine Kalenderzahl, und so wird sie auch in der Sprechstunde gefragt –
 * mit den notierten Tagen daneben, damit niemand zehn Lücken für zehn gute
 * Tage hält.
 */
function kopfZahlen(eintraege, tage, heute) {
  const kopf = kopfEintraege(eintraege, heute);
  const kopfTage = new Set(kopf.map((e) => e.am));
  const notiert = alleNotiertenTage(eintraege, tage);
  const zaehler = new Map();
  const dauern = new Map();
  const verlauf = { eingeschraenkt: new Set(), ausgefallen: new Set() };
  const wirkung = { weg: 0, besser: 0, nicht: 0 };
  let statusZuletzt = null;
  let auraAnzahl = 0;
  let erbrochenAnzahl = 0;
  // Ausfalltage über die letzten 90 Tage – der Zeitraum, nach dem gefragt wird.
  const ab90 = heute ? plusTage(heute, -89) : null;
  kopf.forEach((e) => {
    const arten = e.kopfArten || [];
    arten.forEach((id) => {
      if (KOPF_MAP[id]) zaehler.set(id, (zaehler.get(id) || 0) + 1);
    });
    if (arten.includes('aura')) auraAnzahl += 1;
    if (arten.includes('kopferbrechen')) erbrochenAnzahl += 1;
    if (DAUER_MAP[e.dauer]) dauern.set(e.dauer, (dauern.get(e.dauer) || 0) + 1);
    if (e.dauer === 'status' && (!statusZuletzt || e.am > statusZuletzt)) statusZuletzt = e.am;
    if (verlauf[e.verlauf] && (!ab90 || e.am >= ab90)) verlauf[e.verlauf].add(e.am);
    if (wirkung[e.mittelWirkung] !== undefined) wirkung[e.mittelWirkung] += 1;
  });
  const summe = kopf.reduce((s, e) => s + Number(e.staerke), 0);
  const fenster = heute
    ? Array.from({ length: KOPF_FENSTER }, (_, i) => {
      const g = fensterGrenzen(heute, i);
      return { ...g, kopfTage: imFenster(kopfTage, g), notiert: imFenster(notiert, g) };
    })
    : [];
  const chronischFenster = fenster.filter((f) => f.kopfTage >= CHRONISCH_AB).length;
  return {
    anzahl: kopf.length,
    tage: kopfTage.size,
    notierteTage: notiert.size,
    anteil: notiert.size ? kopfTage.size / notiert.size : 0,
    schnitt: kopf.length ? summe / kopf.length : 0,
    hoechster: kopf.reduce((m, e) => Math.max(m, Number(e.staerke)), 0),
    arten: [...zaehler.entries()]
      .map(([id, anzahl]) => ({ id, name: kopfArtName(id), anzahl }))
      .sort((a, b) => b.anzahl - a.anzahl),
    dauern: KOPF_DAUER
      .filter((d) => dauern.has(d.id))
      .map((d) => ({ id: d.id, name: d.name, anzahl: dauern.get(d.id) })),
    verlauf: {
      eingeschraenkt: verlauf.eingeschraenkt.size,
      ausgefallen: verlauf.ausgefallen.size,
      zeitraum: ab90 ? 90 : null,
    },
    wirkung,
    fenster,
    letzte30: fenster.length ? fenster[0].kopfTage : 0,
    notiert30: fenster.length ? fenster[0].notiert : 0,
    // Laut erst, wenn zwei der drei Fenster über der Schwelle liegen; ein
    // einzelnes Fenster ist eine Zahl, kein Verdacht.
    chronischFenster,
    chronischVerdacht: chronischFenster >= 2,
    statusZuletzt,
    auraAnzahl,
    erbrochenAnzahl,
  };
}

/*
 * Die Klassen von Akutmitteln, die hier auseinandergehalten werden.
 *
 *   nsar       greift den Magen an – die Verbindung zum Bauch
 *   kombi      ASS plus Koffein – für den Magen ein NSAR, für den Kopf die
 *              niedrige Übergebrauchsgrenze der Kombinationsmittel
 *   triptan    das Migränemittel – schont den Magen, Grenze zehn Tage
 *   nichtnsar  Paracetamol, Metamizol – ohne Entzündungshemmung
 *   opioid     Tramadol, Tilidin, Codein – Grenze zehn Tage
 *   gepant     die neuen Anfallsmittel – zählen als Akuttag, ohne eigene Grenze
 *
 * Für die Übergebrauchsregel gelten nsar und nichtnsar als EINE Klasse: die
 * einfachen Schmerzmittel, Grenze fünfzehn Tage – auch mehrere zusammen.
 * „Verschiedene durcheinander" meint Triptan, Kombination, Opioid und
 * einfache Schmerzmittel untereinander, Grenze zehn.
 *
 * Vorbeugende Mittel (Gruppe 'prophylaxe') und Magenmittel sind keine Klasse:
 * Sie zählen nirgends als Akutmittel. Welche Gruppe ein Name hat, weiß
 * mittel.js; hierher kommt nur die Kennung.
 */
const AKUT_KLASSEN = ['nsar', 'kombi', 'triptan', 'nichtnsar', 'opioid', 'gepant'];
const KLASSE_VON_GRUPPE = Object.fromEntries(AKUT_KLASSEN.map((k) => [k, k]));

/**
 * Schwellen für den Übergebrauch, Tage je 30 Tage – nach der internationalen
 * Kopfschmerzklassifikation. Die Klassifikation verlangt das über mehr als
 * drei Monate UND fünfzehn oder mehr Kopfschmerztage im Monat; deshalb wird
 * jedes der drei Fenster geprüft, und der Name fällt erst, wenn beides in
 * zwei von drei Fenstern zusammenkommt.
 */
const UEBERGEBRAUCH = { triptan: 10, kombi: 10, opioid: 10, einfach: 15, gemischt: 10 };

function fensterMittel(alle, kopfTage, grenzen) {
  const drin = (menge) => [...menge].filter((iso) => iso >= grenzen.von && iso <= grenzen.bis);
  const tage = Object.fromEntries(AKUT_KLASSEN.map((k) => [k, drin(alle[k]).length]));
  const einfach = new Set([...drin(alle.nsar), ...drin(alle.nichtnsar)]);
  const nsarKombi = new Set([...drin(alle.nsar), ...drin(alle.kombi)]);
  const akut = new Set();
  AKUT_KLASSEN.forEach((k) => drin(alle[k]).forEach((iso) => akut.add(iso)));
  // Die Klassen, zwischen denen „durcheinander" zählt.
  const gruppen = [
    einfach.size > 0, tage.kombi > 0, tage.triptan > 0, tage.opioid > 0,
  ].filter(Boolean).length;
  const uebergebrauch = tage.triptan >= UEBERGEBRAUCH.triptan
    || tage.kombi >= UEBERGEBRAUCH.kombi
    || tage.opioid >= UEBERGEBRAUCH.opioid
    || einfach.size >= UEBERGEBRAUCH.einfach
    || (akut.size >= UEBERGEBRAUCH.gemischt && gruppen >= 2);
  const kopf = imFenster(kopfTage, grenzen);
  return {
    ...grenzen,
    akut: akut.size,
    tage,
    nsarKombi: nsarKombi.size,
    einfach: einfach.size,
    kopfTage: kopf,
    uebergebrauch,
    // Erst Einnahme UND Kopfschmerztage zusammen sind das, was die
    // Klassifikation meint.
    moh: uebergebrauch && kopf >= CHRONISCH_AB,
  };
}

/** Die Sorten eines Fensters als Text: „4 Triptan, 5 entzündungshemmend, …". */
function sortenText(f) {
  if (!f) return '';
  return [
    f.tage.triptan ? `${f.tage.triptan} Triptan` : '',
    f.nsarKombi ? `${f.nsarKombi} entzündungshemmend` : '',
    f.tage.nichtnsar ? `${f.tage.nichtnsar} ohne Entzündungshemmung` : '',
    f.tage.opioid ? `${f.tage.opioid} Opioid` : '',
    f.tage.gepant ? `${f.tage.gepant} Gepant` : '',
  ].filter(Boolean).join(', ');
}

/**
 * Kopfschmerz und Akutmittel – am selben Tag und je 30-Tage-Fenster.
 *
 * Gezählt werden Tage, nicht Einnahmen: Zwei Ibuprofen an einem Tag sind ein
 * Tag mit Ibuprofen. `gruppeVon(name)` kommt von außen (mittel.js kennt die
 * Gruppen), damit dieses Modul nicht wissen muss, was Rizatriptan ist.
 *
 * „Am selben Tag" zählt nur Akutmittel. Ein täglicher Säureblocker stünde
 * sonst an jedem Kopfschmerztag als „Medikament" dabei – eine Zahl ohne
 * Aussage, die die wichtige daneben entwertet.
 *
 * Die Fenster zählen jeden Tag mit einem Akutmittel – ob daneben ein
 * Kopfschmerz eingetragen wurde oder nicht. Für die Frage, ob das Mittel
 * selbst den Kopfschmerz unterhält, ist gleichgültig, wogegen es genommen
 * wurde; und ein vergessener Kopfeintrag darf die Zahl nicht kleiner machen.
 * Den Namen aus der Klassifikation bekommt das aber erst zusammen mit
 * fünfzehn Kopfschmerztagen im selben Fenster – sonst stünde er bei jedem
 * täglichen ASS zum Blutschutz.
 *
 * Was an einem Kopfschmerztag eingetragen ist und keiner Gruppe zuzuordnen,
 * steht unter `unbekannt` mit Namen: Ein Schmerzmittel, das die App nicht
 * kennt, fehlt sonst still in der Zählung, und die Nutzerin trägt eine zu
 * kleine Zahl in die Sprechstunde. Nur Kopfschmerztage – sonst stünde dort
 * das Schilddrüsenmittel von jedem Morgen.
 */
function kopfMittel(eintraege, gruppeVon, heute) {
  const kopfTage = kopfTageVon(eintraege, heute);
  const amKopfTag = Object.fromEntries(AKUT_KLASSEN.map((k) => [k, new Set()]));
  amKopfTag.akut = new Set();
  const alle = Object.fromEntries(AKUT_KLASSEN.map((k) => [k, new Set()]));
  const unbekannt = new Map();
  (eintraege || []).filter((e) => e.art === 'medikament' && (!heute || e.am <= heute)).forEach((e) => {
    const gruppe = gruppeVon ? gruppeVon(e.mittel) : null;
    const klasse = KLASSE_VON_GRUPPE[gruppe] || null;
    if (!gruppe && kopfTage.has(e.am)) {
      const name = String(e.mittel || '').trim();
      if (name) {
        const v = unbekannt.get(name.toLowerCase()) || { name, tage: new Set() };
        v.tage.add(e.am);
        unbekannt.set(name.toLowerCase(), v);
      }
    }
    if (!klasse) return;
    alle[klasse].add(e.am);
    if (!kopfTage.has(e.am)) return;
    amKopfTag.akut.add(e.am);
    amKopfTag[klasse].add(e.am);
  });
  // Für den Magen zählt ein Kombinationsmittel mit ASS wie ein NSAR.
  const nsarKopfTage = new Set([...amKopfTag.nsar, ...amKopfTag.kombi]);
  const kopfTageOhneNsar = [...kopfTage].filter((iso) => !nsarKopfTage.has(iso)).sort();

  const fenster = heute
    ? Array.from({ length: KOPF_FENSTER }, (_, i) => fensterMittel(alle, kopfTage, fensterGrenzen(heute, i)))
    : [];
  const leer = { akut: 0, tage: Object.fromEntries(AKUT_KLASSEN.map((k) => [k, 0])), nsarKombi: 0, einfach: 0, kopfTage: 0, uebergebrauch: false, moh: false };
  const juengst = fenster[0] || leer;
  const einnahmeFenster = fenster.filter((f) => f.uebergebrauch).length;
  const mohFenster = fenster.filter((f) => f.moh).length;
  return {
    kopfTage: kopfTage.size,
    mitAkut: amKopfTag.akut.size,
    mitNsar: nsarKopfTage.size,
    mitTriptan: amKopfTag.triptan.size,
    mitNichtNsar: amKopfTag.nichtnsar.size,
    mitKombi: amKopfTag.kombi.size,
    mitOpioid: amKopfTag.opioid.size,
    mitGepant: amKopfTag.gepant.size,
    nsarTage: [...nsarKopfTage].sort(),
    kopfTageOhneNsar,
    fenster,
    akutTage30: juengst.akut,
    tage30: juengst.tage,
    triptanTage30: juengst.tage.triptan,
    nsarTage30: juengst.nsarKombi,
    // Das jüngste Fenster über der Einnahmeschwelle: eine Zahl.
    uebergebrauch: juengst.uebergebrauch,
    // Zwei von drei Fenstern über der Einnahmeschwelle: viel Mittel – aber
    // noch kein Name, solange die Kopfschmerztage fehlen.
    einnahmeHoch: einnahmeFenster >= 2,
    einnahmeFenster,
    // Zwei von drei Fenstern mit Einnahme UND Kopfschmerztagen über der
    // Schwelle: das, was die Klassifikation meint.
    mohFenster,
    uebergebrauchBestaetigt: mohFenster >= 2,
    unbekannt: [...unbekannt.values()]
      .map((v) => ({ name: v.name, tage: v.tage.size }))
      .sort((a, b) => b.tage - a.tage)
      .slice(0, 5),
  };
}

/**
 * Was der Bauch nach Kopfschmerztagen mit entzündungshemmendem Mittel macht.
 *
 * Verglichen wird der Bauch-Tageswert am Tag selbst und am Tag danach – dort
 * liegt das Signal: Der Schaden an der Schleimhaut entsteht binnen Stunden,
 * der Ausfall des Schutzfilms hält grob einen Tag an.
 *
 * Die Vergleichsgruppe ist der Punkt. Gegen „alle übrigen Tage" misst man vor
 * allem den Anfall – Übelkeit, Nüchternbleiben, Liegen –, nicht das Mittel.
 * Deshalb wird, wo es geht, *innerhalb* der Kopfschmerztage verglichen: Tage
 * mit NSAR (und der Tag danach) gegen Kopfschmerztage ohne NSAR (und der Tag
 * danach). Beide Seiten haben den Kopfschmerz; der Unterschied ist das
 * Mittel – oder die Schwere des Anfalls, denn ein Mittel nimmt man eher an
 * den schlimmeren Tagen. Deshalb steht die mittlere Kopfstärke beider Seiten
 * mit dabei. Erst wenn es keinen Kopfschmerztag ohne NSAR gibt, bleibt der
 * Vergleich gegen alle übrigen Tage – und der Satz sagt das dann auch.
 *
 * Ein Tag, der auf beide Seiten fiele (der Tag nach einem NSAR-Tag ist selbst
 * ein Kopfschmerztag ohne NSAR), gehört auf keine. `tagesWert` kommt von
 * außen, wie bei zyklus.js – der Bauch wird in auswertung.js gerechnet.
 *
 * Ab fünf Tagen auf beiden Seiten ist das eine Zahl, darunter ein Zufall.
 * „Deutlich" gilt in beide Richtungen: Ein Bauch, der nach dem Mittel
 * *niedriger* liegt, ist kein „kein Unterschied".
 */
function nsarNachwirkung(eintraege, tage, mitTagen, ohneTagen, tagesWert) {
  const fenster = (liste) => {
    const s = new Set();
    (liste || []).forEach((iso) => { s.add(iso); s.add(plusTage(iso, 1)); });
    return s;
  };
  const a = fenster(mitTagen);
  const innerhalb = (ohneTagen || []).length > 0;
  const b = innerhalb ? fenster(ohneTagen) : null;
  if (innerhalb) {
    [...a].forEach((iso) => {
      if (b.has(iso)) { a.delete(iso); b.delete(iso); }
    });
  }
  const mit = { tage: 0, summe: 0 };
  const ohne = { tage: 0, summe: 0 };
  alleNotiertenTage(eintraege, tage).forEach((iso) => {
    const t = tagesWert(eintraege, iso, tage);
    if (!t.notiert) return;
    if (a.has(iso)) {
      mit.tage += 1;
      mit.summe += t.wert;
    } else if (!innerhalb || b.has(iso)) {
      ohne.tage += 1;
      ohne.summe += t.wert;
    }
  });
  const mittel = (x) => (x.tage ? x.summe / x.tage : 0);
  // Die Kopfstärke beider Seiten – der Vorbehalt, der sich prüfen lässt.
  const kopf = kopfEintraege(eintraege);
  const staerkeVon = (liste) => {
    const menge = new Set(liste || []);
    const w = kopf.filter((e) => menge.has(e.am)).map((e) => Number(e.staerke));
    return w.length ? w.reduce((s, x) => s + x, 0) / w.length : 0;
  };
  const genug = mit.tage >= 5 && ohne.tage >= 5;
  const differenz = mittel(mit) - mittel(ohne);
  return {
    modus: innerhalb ? 'innerhalb' : 'gegenAlle',
    mit: { tage: mit.tage, schnitt: mittel(mit) },
    ohne: { tage: ohne.tage, schnitt: mittel(ohne) },
    staerke: { mit: staerkeVon(mitTagen), ohne: innerhalb ? staerkeVon(ohneTagen) : 0 },
    differenz,
    genug,
    // Eine ganze Stufe, wie bei der Richtung: Darunter ist es Schwankung.
    deutlich: genug && Math.abs(differenz) >= 1,
  };
}

/**
 * Der Bauch an Kopfschmerztagen selbst – gegen alle übrigen Tage.
 *
 * Eine Fußnote, keine Auskunft: Das Ergebnis ist in beide Richtungen
 * erwartbar, weil Übelkeit und Liegen zum Anfall gehören – und weil an
 * solchen Tagen wenig gegessen und wenig eingetragen wird. Es steht da, damit
 * niemand den Bauchwert eines Kopfschmerztages als Aussage über das Essen
 * davor liest – oder über das Mittel.
 */
function bauchAnKopfTagen(eintraege, tage, tagesWert) {
  const kopfTage = kopfTageVon(eintraege);
  const mit = { tage: 0, summe: 0 };
  const ohne = { tage: 0, summe: 0 };
  alleNotiertenTage(eintraege, tage).forEach((iso) => {
    const t = tagesWert(eintraege, iso, tage);
    if (!t.notiert) return;
    const eimer = kopfTage.has(iso) ? mit : ohne;
    eimer.tage += 1;
    eimer.summe += t.wert;
  });
  const mittel = (x) => (x.tage ? x.summe / x.tage : 0);
  const genug = mit.tage >= 5 && ohne.tage >= 5;
  const differenz = mittel(mit) - mittel(ohne);
  return {
    mit: { tage: mit.tage, schnitt: mittel(mit) },
    ohne: { tage: ohne.tage, schnitt: mittel(ohne) },
    differenz,
    genug,
    deutlich: genug && Math.abs(differenz) >= 1,
  };
}

/**
 * Ein Tageswert für den Kopf, in der Form, die auswertung.js für den Bauch
 * liefert – damit sich die Umstände-Bilanz dort (faktorBilanz) auch für den
 * Kopf rechnen lässt. `wert` ist 1 oder 0: Tag mit oder ohne Kopfschmerz.
 * Der Mittelwert darüber ist dann der Anteil der Kopfschmerztage.
 */
function kopfTagesWert(eintraege, iso, tage = {}) {
  const amTag = (eintraege || []).filter((e) => e.am === iso);
  return {
    am: iso,
    notiert: amTag.length > 0 || !!tage[iso],
    wert: amTag.some((e) => e.art === 'kopf' && Number(e.staerke) >= 1) ? 1 : 0,
  };
}

/*
 * Kopfschmerz nach Umständen: nur der Schlaf.
 *
 * Die Nacht davor ist der eine Umstand, der sauber *vor* dem Kopfschmerz
 * liegt. Anspannung am selben Tag liegt es nicht: Ein Anfall kündigt sich oft
 * einen Tag vorher an – mit Unruhe, Müdigkeit, Nackenschmerz –, und ein
 * Vergleich am selben Tag misst dann den Anfang des Anfalls und nennt ihn
 * Auslöser. Deshalb steht die Anspannung hier nicht, und auch beim Schlaf
 * steht der Vorbehalt daneben.
 *
 * Verglichen werden Anteile, und Anteile aus wenigen Tagen springen in großen
 * Schritten. Deshalb zwölf Tage je Seite, und „deutlich" nur, wenn der
 * Unterschied über dem Zufallsspielraum liegt (js/zufall.js) – derselben
 * Schwelle, die auch die Auslöserbilanz anlegt. Dazu der Vorbehalt der
 * Auswahl: Gezählt sind nur Tage mit beantworteter Tagesfrage, und gerade an
 * den schlimmsten Tagen beantwortet niemand eine.
 */
const KOPF_UMSTAENDE = [
  { id: 'schlaf', hoch: 'nach schlechten Nächten', niedrig: 'nach guten Nächten' },
];

/** Die 0/1-Reihe hinter einem Anteil, für den Zufallsspielraum. */
function nullEins(tage, anteil) {
  const einsen = Math.round(anteil * tage);
  return [...Array(einsen).fill(1), ...Array(Math.max(0, tage - einsen)).fill(0)];
}

function kopfUmstaende(eintraege, tage, faktorBilanz, zufallsSpielraum) {
  return KOPF_UMSTAENDE.map((u) => {
    const f = faktorBilanz(eintraege, tage, u.id, kopfTagesWert);
    const genug = f.hoch.tage >= 12 && f.niedrig.tage >= 12;
    const differenz = f.hoch.schnitt - f.niedrig.schnitt;
    const spielraum = genug && zufallsSpielraum
      ? zufallsSpielraum(nullEins(f.hoch.tage, f.hoch.schnitt), nullEins(f.niedrig.tage, f.niedrig.schnitt), 3).spielraum
      : 0.2;
    return {
      id: u.id,
      hochName: u.hoch,
      niedrigName: u.niedrig,
      hoch: { tage: f.hoch.tage, anteil: f.hoch.schnitt },
      niedrig: { tage: f.niedrig.tage, anteil: f.niedrig.schnitt },
      differenz,
      spielraum,
      genug,
      deutlich: genug && Math.abs(differenz) >= Math.max(0.2, spielraum),
    };
  });
}

/**
 * Kopfschmerztage je Zyklusphase – nur, wenn die Periode eingetragen wird.
 *
 * Für jede Phase: wie viele notierte Tage, wie viele davon mit Kopfschmerz.
 * Ohne Urteil; die Fallzahlen stehen daneben. Eine Phase ohne notierte Tage
 * fehlt in der Liste, statt mit 0 von 0 zu prahlen.
 */
function kopfNachPhase(eintraege, tage) {
  const kopfTage = kopfTageVon(eintraege);
  const eimer = Object.fromEntries(PHASEN.map((p) => [p.id, { tage: 0, mit: 0 }]));
  alleNotiertenTage(eintraege, tage).forEach((iso) => {
    const p = phaseVon(tage, iso);
    if (!p) return;
    eimer[p].tage += 1;
    if (kopfTage.has(iso)) eimer[p].mit += 1;
  });
  return PHASEN
    .filter((p) => eimer[p.id].tage > 0)
    .map((p) => ({
      phase: p.id,
      name: p.name,
      tage: eimer[p.id].tage,
      mit: eimer[p.id].mit,
      anteil: eimer[p.id].mit / eimer[p.id].tage,
    }));
}

/**
 * Das Fenster um die Periode: zwei Tage davor bis zum dritten Blutungstag.
 *
 * Das ist die Frage, die in der Kopfschmerzsprechstunde gestellt wird –
 * „menstruell?" –, und die vier Phasen beantworten sie nicht: Die zwei Tage
 * vor der Blutung, in denen das Östrogen fällt, verschwinden dort in der
 * breiten zweiten Zyklushälfte.
 *
 * Gezählt wird je beobachtetem Zyklus, ob im Fenster ein Kopfschmerztag lag.
 * „Beobachtet" heißt: Das Fenster ist vorbei, und an mindestens einem seiner
 * Tage wurde etwas eingetragen. Ein Zyklus, dessen Fenster noch läuft oder
 * ganz leer ist, zählt nicht als „ohne Kopfschmerz" – er zählt gar nicht.
 * Mindestens drei beobachtete Zyklen, denn die Regel heißt „zwei von drei".
 */
function kopfUmPeriode(eintraege, tage, heute) {
  const kopfTage = kopfTageVon(eintraege, heute);
  const notiert = alleNotiertenTage(eintraege, tage);
  let beobachtet = 0;
  let mit = 0;
  let offen = 0;
  zyklen(tage).forEach((z) => {
    const fenster = [-2, -1, 0, 1, 2].map((i) => plusTage(z.start, i));
    if (heute && fenster[fenster.length - 1] > heute) { offen += 1; return; }
    if (!fenster.some((iso) => notiert.has(iso))) return;
    beobachtet += 1;
    if (fenster.some((iso) => kopfTage.has(iso))) mit += 1;
  });
  return { zyklen: beobachtet, mit, offen, genug: beobachtet >= 3 };
}

/**
 * Die letzten drei Kalendermonate nebeneinander – das Format des
 * Kopfschmerzkalenders, mit dem die Neurologie chronischen Kopfschmerz und
 * Übergebrauch beurteilt.
 */
function kopfMonate(eintraege, tage, gruppeVon, heute, anzahl = 3) {
  if (!heute) return [];
  const kopfTage = kopfTageVon(eintraege, heute);
  const klasseTage = Object.fromEntries(AKUT_KLASSEN.map((k) => [k, new Set()]));
  (eintraege || []).filter((e) => e.art === 'medikament').forEach((e) => {
    const klasse = KLASSE_VON_GRUPPE[gruppeVon ? gruppeVon(e.mittel) : null];
    if (klasse) klasseTage[klasse].add(e.am);
  });
  const verlaufTage = { ausgefallen: new Set(), eingeschraenkt: new Set() };
  kopfEintraege(eintraege, heute).forEach((e) => {
    if (verlaufTage[e.verlauf]) verlaufTage[e.verlauf].add(e.am);
  });
  const notiert = alleNotiertenTage(eintraege, tage);
  const blutung = new Set(Object.keys(tage || {})
    .filter((iso) => Number(tage[iso] && tage[iso].blutung) >= 1));
  const raus = [];
  for (let i = anzahl - 1; i >= 0; i--) {
    const start = plusMonate(monatsStart(heute), -i);
    const praefix = start.slice(0, 7);
    const im = (menge) => [...menge].filter((iso) => iso.startsWith(praefix) && iso <= heute).length;
    const akut = new Set();
    AKUT_KLASSEN.forEach((k) => klasseTage[k].forEach((iso) => {
      if (iso.startsWith(praefix) && iso <= heute) akut.add(iso);
    }));
    raus.push({
      monat: praefix,
      name: fmtMonat(start),
      angefangen: i === 0,
      kopfTage: im(kopfTage),
      notiert: im(notiert),
      akut: akut.size,
      nsar: im(new Set([...klasseTage.nsar, ...klasseTage.kombi])),
      triptan: im(klasseTage.triptan),
      nichtnsar: im(klasseTage.nichtnsar),
      ausgefallen: im(verlaufTage.ausgefallen),
      eingeschraenkt: im(verlaufTage.eingeschraenkt),
      blutung: im(blutung),
    });
  }
  return raus;
}

/**
 * Fragen für die Sprechstunde, aus den Kopfzahlen – so, wie die Muster sie
 * für den Bauch stellen. Jede ist eine Frage, keine davon eine Empfehlung,
 * und keine legt der Nutzerin eine Diagnose in den Mund; die Antwort hat die
 * Praxis.
 */
function kopfFragen({ zahlen: z, mittel: m, befundIds = [] } = {}) {
  const fragen = [];
  if (!z || !z.anzahl) return fragen;
  if (z.letzte30 >= 4) {
    fragen.push(`Ich hatte ${z.letzte30} Kopfschmerztage in den letzten 30 Tagen – `
      + 'kommt für mich eine vorbeugende Behandlung infrage?');
  }
  if (m && m.uebergebrauchBestaetigt) {
    fragen.push('Kann mein Schmerz- oder Migränemittel den Kopfschmerz selbst '
      + 'unterhalten – und wie würde man das prüfen?');
  }
  if (befundIds.includes('gastritis-c') && m && m.mitNsar > 0) {
    fragen.push('Bei mir ist eine Gastritis Typ C festgestellt – welches Akutmittel '
      + 'passt bei meinen Kopfschmerzen dazu, und was, wenn ein entzündungshemmendes '
      + 'nötig ist?');
  }
  if (z.erbrochenAnzahl >= 1) {
    fragen.push(`Im Anfall habe ich ${z.erbrochenAnzahl}-mal erbrochen – gibt es für `
      + 'mich ein Mittel in einer Form, die nicht über den Magen geht?');
  }
  if (z.auraAnzahl >= 2) {
    fragen.push(`Vor dem Kopfschmerz hatte ich ${z.auraAnzahl}-mal Flimmern, Zacken oder `
      + 'wanderndes Kribbeln (eine Aura) – falls Verhütung ein Thema ist: Spielt das '
      + 'für eine Pille mit Östrogen eine Rolle?');
  }
  return fragen;
}

/* ---------- Die Sätze ---------- */

const zahlFormat = (fmt) => fmt || ((x) => String(Math.round(x * 10) / 10).replace('.', ','));
const prozentText = (x) => `${Math.round(x * 100)} %`;

/** Die Fensterzahlen als Kette: „12 · davor 9 · davor 4". */
function fensterKette(fenster, feld) {
  return fenster.map((f, i) => `${i ? 'davor ' : ''}${f[feld]}`).join(' · ');
}

/** Der Satz zur Nachwirkung – nur, wenn er deutlich ist. */
function nachwirkungSatz(n, fmt) {
  if (!n || !n.genug || !n.deutlich) return '';
  const z = zahlFormat(fmt);
  const zahlen = n.modus === 'innerhalb'
    ? 'An Kopfschmerztagen mit entzündungshemmendem Schmerzmittel und am Tag danach '
      + `lag der Bauch im Mittel bei ${z(n.mit.schnitt)}, an Kopfschmerztagen ohne ein `
      + `solches Mittel und am Tag danach bei ${z(n.ohne.schnitt)} (${n.mit.tage} gegen `
      + `${n.ohne.tage} Tage).`
    : 'An Kopfschmerztagen mit entzündungshemmendem Schmerzmittel und am Tag danach '
      + `lag der Bauch im Mittel bei ${z(n.mit.schnitt)}, an allen übrigen Tagen bei `
      + `${z(n.ohne.schnitt)} (${n.mit.tage} gegen ${n.ohne.tage} Tage).`;
  if (n.differenz < 0) {
    return `${zahlen} Also niedriger, nicht höher – an solchen Tagen wird oft wenig `
      + 'gegessen und wenig eingetragen. Ein Hinweis, kein Beweis.';
  }
  if (n.modus === 'innerhalb') {
    const staerker = n.staerke.mit - n.staerke.ohne >= 1;
    return `${zahlen} Beide Seiten haben den Kopfschmerz (im Mittel ${z(n.staerke.mit)} `
      + `gegen ${z(n.staerke.ohne)}) – aber ein Mittel nimmt man eher an den schlimmeren `
      + 'Tagen, und die haben mehr Übelkeit. '
      + (staerker
        ? 'Die Tage mit Mittel waren auch die stärkeren – der Unterschied kann daran liegen. '
        : '')
      + 'Ein Hinweis, kein Beweis, aber einer, der in die Sprechstunde gehört.';
  }
  return `${zahlen} Bisher gab es keinen Kopfschmerztag ohne ein solches Mittel, `
    + 'mit dem sich das vergleichen ließe – in dem Unterschied steckt deshalb auch '
    + 'der Anfall selbst. Ein Hinweis, kein Beweis.';
}

/** Der Bauch an Kopfschmerztagen – als Fußnote, nur wenn deutlich. */
function bauchAnKopfTagenSatz(b, fmt) {
  if (!b || !b.genug || !b.deutlich) return '';
  const z = zahlFormat(fmt);
  const zahlen = `An Kopfschmerztagen lag der Bauch im Mittel bei ${z(b.mit.schnitt)}, `
    + `an den übrigen Tagen bei ${z(b.ohne.schnitt)} (${b.mit.tage} gegen ${b.ohne.tage} Tage).`;
  if (b.differenz < 0) {
    return `${zahlen} Also niedriger. An solchen Tagen wird oft wenig gegessen und `
      + 'wenig eingetragen; die Zahl sagt wenig.';
  }
  return `${zahlen} Übelkeit, Erbrechen, Nüchternbleiben und stundenlanges Liegen `
    + 'gehören zu einem Anfall – das allein reicht, damit der Bauch an solchen Tagen '
    + 'schlechter aussieht; mit Reflux oder Zwerchfellbruch erst recht. Ein Bauchwert '
    + 'an einem Kopfschmerztag sagt deshalb wenig über das Essen davor und nichts '
    + 'über das Mittel.';
}

/**
 * Der Satz zum Übergebrauch.
 *
 * Drei Stufen. Den Namen aus der Sprechstunde gibt es erst, wenn in zwei
 * der drei Fenster sowohl die Einnahme als auch die Kopfschmerztage über der
 * Schwelle liegen – das ist, was die Klassifikation meint. Viel Mittel ohne
 * viele Kopfschmerztage (das tägliche ASS zum Blutschutz, das Diclofenac fürs
 * Knie) bekommt die Zahlen und die Regel, keinen Namen. Und ein einzelnes
 * Fenster bekommt nur die Zahlen: Zehn Triptan-Tage in einem Monat sind bei
 * einer Migräne nichts Ungewöhnliches – ein Zyklus, eine schlechte Woche –,
 * und wer danach den Diagnosenamen liest, lässt das Mittel womöglich von
 * sich aus weg und liegt mit unbehandelten Anfällen da.
 */
function uebergebrauchSatz(m) {
  if (!m || !m.fenster || !m.fenster.length) return '';
  if (!m.uebergebrauch && !m.einnahmeHoch) return '';
  const j = m.fenster[0];
  const zahlen = `An ${j.akut} der letzten 30 Tage ein Schmerz- oder Migränemittel `
    + `(${sortenText(j) || 'ohne Zuordnung'}); in den 30 Tagen davor an `
    + `${m.fenster[1] ? m.fenster[1].akut : 0}, davor an ${m.fenster[2] ? m.fenster[2].akut : 0} Tagen.`;
  const regel = 'Ab zehn Tagen mit Triptan, Kombinationsmittel oder Opioid, fünfzehn mit '
    + 'einfachen Schmerzmitteln (auch mehreren zusammen) oder zehn, wenn verschiedene '
    + 'Sorten durcheinandergehen';
  if (m.uebergebrauchBestaetigt) {
    return `${zahlen} Dazu ${j.kopfTage} Kopfschmerztage im jüngsten Fenster. ${regel} – `
      + 'über mehr als drei Monate und zusammen mit fünfzehn oder mehr Kopfschmerztagen '
      + 'im Monat – kann das Mittel den Kopfschmerz selbst unterhalten; die Neurologie '
      + 'nennt das Kopfschmerz bei Medikamentenübergebrauch. Eine Frage für die '
      + 'Sprechstunde, keine Anweisung – auch nicht die, es wegzulassen.';
  }
  if (m.einnahmeHoch) {
    return `${zahlen} ${regel}, über mehr als drei Monate, wird daraus eine Frage für `
      + 'die Sprechstunde – aber erst zusammen mit fünfzehn oder mehr Kopfschmerztagen '
      + `im Monat, und davon stehen hier ${j.kopfTage}. Die Zahl gehört trotzdem mit.`;
  }
  return `${zahlen} ${regel}, über mehr als drei Monate, wird daraus eine Frage für die `
    + 'Sprechstunde – ein einzelner Monat ist noch keine.';
}

/** Der Satz zur Häufigkeit – laut ab zwei von drei Fenstern, sonst nur die Zahlen. */
function chronischSatz(z) {
  if (!z || !z.fenster || !z.fenster.length) return '';
  if (!z.chronischVerdacht && z.letzte30 < CHRONISCH_AB) return '';
  const zahlen = `${fensterKette(z.fenster, 'kopfTage')} Kopfschmerztage je 30 Tage `
    + `(${z.notiert30} der letzten 30 Tage notiert).`;
  if (!z.chronischVerdacht) {
    return `${zahlen} Ab fünfzehn Tagen im Monat über mehr als drei Monate fragt die `
      + 'Neurologie nach einem chronischen Kopfschmerz – ein einzelner Monat ist dafür '
      + 'noch kein Grund.';
  }
  return `${zahlen} In ${z.chronischFenster} der drei Fenster über fünfzehn. Ab fünfzehn `
    + 'Tagen im Monat über mehr als drei Monate spricht die Neurologie von einem '
    + 'chronischen Kopfschmerz – ob chronische Migräne oder etwas anderes, und ob ein '
    + 'Mittel beteiligt ist, klärt die Sprechstunde, nicht diese Zahl. Nimm die '
    + 'Monatszahlen mit.';
}

/** Ein Anfall über drei Tage – nur, wenn er frisch ist. */
function statusSatz(z, heute) {
  if (!z || !z.statusZuletzt || !heute) return '';
  if (z.statusZuletzt < plusTage(heute, -13)) return '';
  return 'Ein Anfall, der länger als drei Tage nicht aufhört, ist ein Grund, in der '
    + 'Praxis anzurufen und nicht auf den nächsten Termin zu warten.';
}

/** Das Fenster um die Periode – nur ab drei beobachteten Zyklen. */
function umPeriodeSatz(u) {
  if (!u || !u.genug) return '';
  return `In ${u.mit} von ${u.zyklen} beobachteten Zyklen lag ein Kopfschmerztag in den `
    + 'Tagen um die Periode – zwei Tage davor bis zum dritten Blutungstag'
    + `${u.offen ? ` (${u.offen === 1 ? 'ein Zyklus' : `${u.offen} Zyklen`} noch offen)` : ''}. `
    + 'Genau danach fragt die Neurologie: In mindestens zwei von drei Zyklen heißt das '
    + 'menstruationsgebunden – gezählt werden dort Migräneanfälle; ob deine '
    + 'Kopfschmerztage welche sind, klärt die Sprechstunde.';
}

/** Die Sätze zu den Umständen – nur die deutlichen. */
function umstaendeSaetze(liste) {
  return (liste || []).filter((u) => u.genug && u.deutlich).map((u) => {
    const zahlen = `${u.hochName.charAt(0).toUpperCase()}${u.hochName.slice(1)} an `
      + `${prozentText(u.hoch.anteil)} der Tage Kopfschmerz, ${u.niedrigName} an `
      + `${prozentText(u.niedrig.anteil)} (${u.hoch.tage} gegen ${u.niedrig.tage} Tage).`;
    return `${zahlen} Ein Anfall kündigt sich oft schon am Vortag an – mit Unruhe, `
      + 'Müdigkeit, Nackenschmerz oder schlechtem Schlaf. Was Vorbote war und was '
      + 'Auslöser, sieht man an Zahlen allein nicht. Gezählt sind nur Tage mit '
      + 'beantworteter Tagesfrage.';
  });
}

/**
 * Alles, was verglichen wurde und nichts hergab, in einer Zeile – statt
 * dreimal „kein deutlicher Unterschied" untereinander.
 */
function unauffaelligeVergleiche({ nach, bauch, umstaende } = {}) {
  const teile = [];
  if (nach && nach.genug && !nach.deutlich) {
    teile.push(`Bauch nach dem Schmerzmittel (${nach.mit.tage} gegen ${nach.ohne.tage} Tage)`);
  }
  (umstaende || []).filter((u) => u.genug && !u.deutlich).forEach((u) => {
    teile.push(`${u.id === 'schlaf' ? 'Schlaf' : u.id} (${u.hoch.tage} gegen ${u.niedrig.tage} Tage)`);
  });
  if (bauch && bauch.genug && !bauch.deutlich) {
    teile.push(`Bauch an Kopfschmerztagen (${bauch.mit.tage} gegen ${bauch.ohne.tage} Tage)`);
  }
  return teile.length ? `Kein deutlicher Unterschied: ${teile.join(', ')}.` : '';
}

/* ===== js/chart.js ===== */
/*
 * Ein Balkendiagramm als SVG-Zeichenkette. Ohne Bibliothek, ohne Leinwand.
 *
 * Warum SVG und nicht <canvas>: Die Tafel wird zusammen mit dem übrigen HTML
 * neu gezeichnet, sobald sich der Zustand ändert. Eine Leinwand müsste dafür
 * nach jedem Rendern eigens angemalt werden – bei einer Zeichenkette fällt
 * dieser zweite Schritt weg, und die Tafel kann nicht „vergessen" werden.
 *
 * Ein Tag ohne Eintragung ist etwas anderes als ein Tag ohne Beschwerden.
 * Deshalb zwei getrennte Darstellungen: kein Balken, aber ein Grundstrich für
 * „nichts eingetragen", ein flacher Strich in Grün für „eingetragen, aber
 * beschwerdefrei". Wer das zusammenwirft, liest aus einer Lücke im Tagebuch
 * einen guten Tag heraus.
 */

const TAFEL_HOCH = 100;
const TAFEL_MAX = 10;

/**
 * @param {{am: string, wert: number|null, notiert: boolean}[]} punkte
 * @param {{titel?: string, hinweis?: string}} opt
 */
function verlaufTafel(punkte, opt = {}) {
  if (!punkte.length) return '';
  const n = punkte.length;
  const breite = 300;
  const spalte = breite / n;
  const balken = Math.max(1.5, Math.min(spalte * 0.62, 10));

  const stuecke = punkte.map((p, i) => {
    const x = i * spalte + (spalte - balken) / 2;
    if (!p.notiert) {
      // Ein Tag mit nur einem Kopfschmerz ist für den Bauch eine Lücke – aber
      // keine stumme: Der Strich sagt, was dort steht.
      const was = p.kopf ? `nur Kopfschmerz ${p.kopf} – zum Bauch nichts eingetragen` : 'nichts eingetragen';
      return `<rect x="${x.toFixed(2)}" y="${TAFEL_HOCH - 1.5}" width="${balken.toFixed(2)}" height="1.5" `
        + `rx="0.75" fill="${p.kopf ? 'var(--leicht)' : 'var(--line)'}"><title>${fmtDatum(p.am)}: ${was}</title></rect>`;
    }
    const wert = Math.max(0, Math.min(TAFEL_MAX, p.wert || 0));
    const h = Math.max(2, (wert / TAFEL_MAX) * TAFEL_HOCH);
    const farbe = wert === 0 ? 'var(--ok)' : (wert >= 7 ? 'var(--bad)' : (wert >= 4 ? 'var(--warn)' : 'var(--leicht)'));
    return `<rect x="${x.toFixed(2)}" y="${(TAFEL_HOCH - h).toFixed(2)}" width="${balken.toFixed(2)}" `
      + `height="${h.toFixed(2)}" rx="${(balken / 2.5).toFixed(2)}" fill="${farbe}">`
      + `<title>${fmtDatum(p.am)}: ${wert === 0 ? 'beschwerdefrei' : `Stärke ${wert}`}</title></rect>`;
  }).join('');

  // Hilfslinie bei 5 – ohne Bezugspunkt sagt die Höhe eines Balkens nichts.
  const mitte = `<line x1="0" y1="${TAFEL_HOCH / 2}" x2="${breite}" y2="${TAFEL_HOCH / 2}" `
    + 'stroke="var(--line)" stroke-width="0.6" stroke-dasharray="3 3"/>';

  return `<figure class="tafel">
    ${opt.titel ? `<figcaption class="tafel-titel">${opt.titel}</figcaption>` : ''}
    <svg viewBox="0 0 ${breite} ${TAFEL_HOCH}" preserveAspectRatio="none" role="img"
         aria-label="${opt.titel || 'Verlauf'}: Balken je Tag, Höhe ist die stärkste Beschwerde von 0 bis 10">
      ${mitte}${stuecke}
    </svg>
    <div class="tafel-fuss">
      <span>${fmtDatum(punkte[0].am)}</span>
      ${opt.hinweis ? `<span class="tafel-hinweis">${opt.hinweis}</span>` : ''}
      <span>${fmtDatum(punkte[n - 1].am)}</span>
    </div>
  </figure>`;
}

/**
 * Ein waagerechter Vergleichsbalken: mit Auslöser gegen ohne.
 *
 * Zwei Balken übereinander statt einer Differenzzahl, weil die Differenz allein
 * täuscht – „2 Punkte mehr" heißt bei einem Grundpegel von 1 etwas anderes als
 * bei einem von 7.
 *
 * Die Beschriftungen lassen sich überschreiben. Beim Auslöser heißt es „danach"
 * und „sonst", beim Medikament „darunter" und „davor" – dieselbe Zeichnung,
 * aber ein falsches Wort daneben macht aus einer Auskunft eine Irreführung.
 */
function vergleichBalken(mit, ohne, worte = {}) {
  const anteil = (v) => `${Math.max(1.5, Math.min(100, (v / TAFEL_MAX) * 100)).toFixed(1)}%`;
  return `<div class="vgl">
    <div class="vgl-zeile"><span class="vgl-mark">${worte.mit || 'danach'}</span>
      <span class="vgl-spur"><i style="width:${anteil(mit)};background:var(--warn)"></i></span>
      <b>${mit.toFixed(1).replace('.', ',')}</b></div>
    <div class="vgl-zeile"><span class="vgl-mark">${worte.ohne || 'sonst'}</span>
      <span class="vgl-spur"><i style="width:${anteil(ohne)};background:var(--muted)"></i></span>
      <b>${ohne.toFixed(1).replace('.', ',')}</b></div>
  </div>`;
}

const klon = (o) => JSON.parse(JSON.stringify(o));

/**
 * Jede Idee bekommt ihr eigenes `geschickt`.
 *
 * Ein alter Stand kennt nur die Zahl `ideenGeschickt`. Neue Ideen wurden vorn
 * eingefügt, also sind die hinteren die alten – und so viele davon gelten als
 * verschickt, wie die Zahl sagt. Das ist genau die Auskunft, die die alte
 * Buchführung gab, nur ab jetzt je Idee.
 */
function ideenMitMarke(ideen, geschicktAlt) {
  const liste = (Array.isArray(ideen) ? ideen : [])
    .filter((x) => x && typeof x === 'object' && typeof x.text === 'string');
  const n = Math.max(0, Math.min(liste.length, Number(geschicktAlt) || 0));
  return liste.map((x, i) => (typeof x.geschickt === 'boolean'
    ? x
    : { ...x, geschickt: i >= liste.length - n }));
}

let zustand = laden();
const hoerer = new Set();

function laden() {
  try {
    const roh = localStorage.getItem(KEY);
    if (!roh) return klon(VORGABE);
    const gelesen = JSON.parse(roh);
    const s = Object.assign(klon(VORGABE), gelesen);
    // Wer schon etwas eingetragen hat, hat die Begrüßung hinter sich – auch
    // wenn der Stand aus einer Fassung stammt, die den Schlüssel noch nicht
    // kannte. Sonst stünde die Einführung eines Tages wieder vor dem Tagebuch.
    if (!('begruesst' in gelesen) && s.eintraege.length) s.begruesst = true;
    // Ein Stand ohne diesen Schlüssel hat eine Fassung von vor der
    // Umbenennung geschrieben – das Symbol dazu heißt noch „Bauchbuch".
    if (!('alterName' in gelesen)) s.alterName = 'offen';
    s.eintraege = sortiert((Array.isArray(s.eintraege) ? s.eintraege : []).map(mahlzeitFrisch));
    s.ideen = ideenMitMarke(s.ideen, s.ideenGeschickt);
    return s;
  } catch {
    return klon(VORGABE);
  }
}

/**
 * Eine Mahlzeit auf den heutigen Stand bringen.
 *
 * Früher standen die Zutaten als bloße Liste von IDs unter `tags`. Seit sie
 * eine Rolle tragen – Hauptzutat, Beilage, Topping … –, stehen sie unter
 * `zutaten`. Umgerechnet wird beim Laden und beim Einlesen einer Sicherung,
 * also an genau den zwei Stellen, an denen fremde Daten hereinkommen.
 *
 * Alte Eintragungen bekommen `haupt`. Das ist die einzig ehrliche Annahme:
 * Wer damals „Zwiebel" angekreuzt hat, hat nicht gesagt, es sei nur ein Hauch
 * gewesen – und die harmlosere Rolle nachträglich zu unterstellen, würde alte
 * Auffälligkeiten stillschweigend kleinrechnen.
 *
 * `tags` fällt dabei weg, damit es die Angabe nur an einer Stelle gibt. Was an
 * dieser Umrechnung vorbeikommt, fängt zutatenVon() in js/auswertung.js ab.
 */
function mahlzeitFrisch(e) {
  if (!e || e.art !== 'essen' || Array.isArray(e.zutaten)) return e;
  const { tags, ...rest } = e;
  return {
    ...rest,
    zutaten: (Array.isArray(tags) ? tags : [])
      .filter((id) => typeof id === 'string')
      .map((id) => ({ id, rolle: 'haupt' })),
  };
}

/** Nach Tag und Uhrzeit. Die Liste wird nirgends anders sortiert. */
function sortiert(liste) {
  return [...liste].sort((a, b) => (a.am === b.am
    ? minutenAmTag(a.um) - minutenAmTag(b.um)
    : (a.am < b.am ? -1 : 1)));
}

/* ---------- Schreiben ---------- */

let schreibUhr = null;

/**
 * Warum nicht gespeichert werden kann – und das sind zwei verschiedene Lagen.
 *
 *   'gesperrt'  Der Browser lässt gar nicht erst speichern: privates Fenster,
 *               eingebettete Ansicht, blockierte Website-Daten. Nichts bleibt,
 *               aber es war auch nie etwas da.
 *
 *   'voll'      Es ging bisher, und jetzt nicht mehr. Das ist die gefährliche
 *               Lage: Monate an Eintragungen liegen gespeichert, der heutige
 *               Eintrag kommt nicht mehr dazu. Hier gehört der Rat zur
 *               Sicherung hin, sofort und deutlich.
 */
function warumNicht(fehler) {
  // Chrome/Safari melden QuotaExceededError, Firefox NS_ERROR_DOM_QUOTA_REACHED,
  // ältere Fassungen nur den Code 22. Alles andere ist eine Sperre.
  const name = fehler && (fehler.name || '');
  const code = fehler && fehler.code;
  return (name === 'QuotaExceededError' || name === 'NS_ERROR_DOM_QUOTA_REACHED'
    || code === 22 || code === 1014) ? 'voll' : 'gesperrt';
}

let speicherGeht = true;
let speicherFehler = null;

try {
  localStorage.setItem(`${KEY}.probe`, '1');
  localStorage.removeItem(`${KEY}.probe`);
} catch {
  // Beim Start ist auch ein voller Speicher eine Sperre: Es gibt noch nichts
  // zu retten, und der Rat wäre derselbe wie bei jeder anderen Ursache.
  speicherGeht = false;
  speicherFehler = 'gesperrt';
}

/** false, wenn der Browser nichts speichern kann – Eintragungen sind flüchtig. */
function kannSpeichern() { return speicherGeht; }

/** 'gesperrt', 'voll' oder null – siehe warumNicht(). */
function speicherGrund() { return speicherGeht ? null : speicherFehler; }

function schreibe() {
  schreibUhr = null;
  const vorher = speicherGeht;
  try {
    localStorage.setItem(KEY, JSON.stringify(zustand));
    speicherGeht = true;
    speicherFehler = null;
  } catch (e) {
    speicherGeht = false;
    speicherFehler = warumNicht(e);
  }
  // Beim Wechsel melden, in *beide* Richtungen: Der Schreibvorgang läuft nach
  // dem Zeichnen, die Warnung stünde sonst einen Eintrag zu spät da – und
  // bliebe nach dem Aufräumen kleben, bis zufällig etwas anderes neu zeichnet.
  if (speicherGeht !== vorher) melde();
}

function merke() {
  clearTimeout(schreibUhr);
  schreibUhr = setTimeout(schreibe, 120);
}

/**
 * Ausstehenden Schreibvorgang sofort ausführen. Nötig, bevor die App in den
 * Hintergrund geht: mobile Browser verwerfen die Seite dort ohne Vorwarnung,
 * und der letzte Eintrag wäre verloren.
 */
function sofortSchreiben() {
  if (schreibUhr === null) return;
  clearTimeout(schreibUhr);
  schreibe();
}

function melde() {
  hoerer.forEach((fn) => fn(zustand));
}

function horche(fn) {
  hoerer.add(fn);
  return () => hoerer.delete(fn);
}

function zustandLesen() { return zustand; }

/* ---------- Eintragungen ---------- */

/**
 * Eine Kennung, die auch dann eindeutig bleibt, wenn zwei Einträge in
 * derselben Millisekunde entstehen – beim Einlesen einer Sicherung etwa, oder
 * wenn jemand schnell hintereinander tippt.
 */
let zaehler = 0;
function neueId() {
  zaehler += 1;
  return `e${Date.now().toString(36)}${zaehler.toString(36)}`;
}

/**
 * Einen Eintrag anlegen. Datum und Uhrzeit sind optional und stehen sonst auf
 * jetzt – der Normalfall ist „ich trage gerade ein, was gerade war".
 */
function eintragen(eintrag) {
  const neu = {
    id: neueId(),
    am: eintrag.am || heuteISO(),
    um: eintrag.um || jetztUhr(),
    ...eintrag,
  };
  zustand.eintraege = sortiert([...zustand.eintraege, neu]);
  merke();
  melde();
  return neu.id;
}

function eintragAendern(id, patch) {
  const i = zustand.eintraege.findIndex((e) => e.id === id);
  if (i < 0) return;
  zustand.eintraege[i] = { ...zustand.eintraege[i], ...patch, id };
  zustand.eintraege = sortiert(zustand.eintraege);
  merke();
  melde();
}

function eintragLoeschen(id) {
  const vorher = zustand.eintraege.length;
  zustand.eintraege = zustand.eintraege.filter((e) => e.id !== id);
  if (zustand.eintraege.length === vorher) return;
  merke();
  melde();
}

function eintragVon(id) {
  return zustand.eintraege.find((e) => e.id === id) || null;
}

/** Alle Eintragungen eines Tages, in zeitlicher Reihenfolge. */
function eintraegeAm(iso) {
  return zustand.eintraege.filter((e) => e.am === iso);
}

/** Der Tag der jüngsten Eintragung – oder heute, wenn es keine gibt. */
function letzterTag() {
  const e = zustand.eintraege;
  return e.length ? e[e.length - 1].am : heuteISO();
}

/**
 * Wann zuletzt etwas eingetragen wurde, als Zeitpunkt. Die Tagesansicht
 * braucht das, um „seit 6 Stunden nichts" sagen zu können.
 */
function letzterZeitpunkt() {
  const e = zustand.eintraege;
  return e.length ? zeitpunkt(e[e.length - 1].am, e[e.length - 1].um) : null;
}

/* ---------- Tagesangaben ---------- */

function tagLesen(iso) {
  return zustand.tage[iso] || {};
}

function tagSetzen(iso, patch) {
  const neu = { ...tagLesen(iso), ...patch };
  // Einen leeren Tag gar nicht erst anlegen: Sonst wächst `tage` mit jedem
  // angetippten und wieder abgewählten Regler, und die Sicherung füllt sich
  // mit Zeilen, die nichts aussagen. Geprüft wird über alle Felder, nicht über
  // eine feste Liste – sonst hinterlässt jede neue Tagesfrage leere Tage.
  const leer = Object.values(neu).every((v) => v === null || v === undefined
    || v === '' || (typeof v === 'string' && !v.trim()));
  if (leer) delete zustand.tage[iso];
  else zustand.tage[iso] = neu;
  merke();
  melde();
}

/* ---------- Einstellungen ---------- */

function einstellen(schluessel, wert) {
  if (!(schluessel in VORGABE)) return;
  zustand[schluessel] = wert;
  merke();
  melde();
}

/** Ein eigener Auslöser. Doppelte Namen führen auf denselben Eintrag zurück. */
function ausloeserAnlegen(id, name) {
  if (zustand.eigeneAusloeser.some((a) => a.id === id)) return;
  zustand.eigeneAusloeser = [...zustand.eigeneAusloeser, { id, name }];
  merke();
  melde();
}

/**
 * Einen eigenen Auslöser wieder loswerden.
 *
 * Er verschwindet aus der Auswahl, aber nicht aus den Eintragungen, in denen
 * er steht. Das ist Absicht: Ein Tagebuch rückwirkend zu verändern, weil eine
 * Auswahlliste sich geändert hat, wäre das Gegenteil von dem, wofür man es
 * führt.
 */
function ausloeserLoeschen(id) {
  zustand.eigeneAusloeser = zustand.eigeneAusloeser.filter((a) => a.id !== id);
  merke();
  melde();
}

/* ---------- Die eigenen Mittel ---------- */

const STANDARD_HOECHSTENS = 12;

/** Woran zwei Standardmittel als dasselbe erkannt werden: Name und Dosis. */
function mittelSchluessel(x) {
  return `${String(x.mittel || '').trim().toLowerCase()}|${String(x.dosis || '').trim().toLowerCase()}`;
}

/**
 * Ein Mittel als eigenes Standardmittel merken.
 *
 * Steht dasselbe Mittel mit derselben Dosis schon da, wird nur die übliche
 * Zeit aufgefrischt – sonst stünde „Pantoprazol 40 mg" nach dem zweiten
 * Merken zweimal in der Reihe. Eine andere Dosis ist dagegen ein eigener
 * Eintrag: Wer morgens 40 und abends 20 nimmt, will beides mit einem Tipp.
 */
function standardMerken({ mittel, dosis, tageszeit, bezug }) {
  const neu = {
    id: neueId(),
    mittel: String(mittel || '').trim().slice(0, 80),
    dosis: String(dosis || '').trim().slice(0, 40),
    tageszeit: tageszeit || null,
    bezug: bezug || null,
  };
  if (!neu.mittel) return null;
  const i = zustand.standardMittel.findIndex((x) => mittelSchluessel(x) === mittelSchluessel(neu));
  if (i >= 0) {
    zustand.standardMittel[i] = { ...zustand.standardMittel[i], tageszeit: neu.tageszeit, bezug: neu.bezug };
  } else {
    zustand.standardMittel = [...zustand.standardMittel, neu].slice(0, STANDARD_HOECHSTENS);
  }
  merke();
  melde();
  return i >= 0 ? zustand.standardMittel[i].id : neu.id;
}

/** Das Standardmittel mit diesem Namen und dieser Dosis – oder null. */
function standardVon(mittel, dosis) {
  const k = mittelSchluessel({ mittel, dosis });
  return zustand.standardMittel.find((x) => mittelSchluessel(x) === k) || null;
}

function standardEntfernen(id) {
  const vorher = zustand.standardMittel.length;
  zustand.standardMittel = zustand.standardMittel.filter((x) => x.id !== id);
  if (zustand.standardMittel.length === vorher) return;
  merke();
  melde();
}

/** Ein benutztes Mittel als Vorschlag merken – die fünf jüngsten. */
function mittelMerken(name) {
  const sauber = String(name).trim();
  if (!sauber) return;
  zustand.zuletztMittel = [sauber, ...zustand.zuletztMittel.filter((m) => m !== sauber)].slice(0, 5);
  merke();
}

/* ---------- Auslassversuch ---------- */

/**
 * Einen Auslassversuch beginnen.
 *
 * Nur einer zur Zeit, und ein laufender wird nicht stillschweigend ersetzt –
 * wer einen neuen anfängt, verwirft den alten sichtbar (die Anzeige fragt
 * vorher). Alles Weitere rechnet js/versuch.js aus den Daten; hier steht nur,
 * was sich nicht ausrechnen lässt: was, ab wann, wie lange.
 */
function versuchStarten(art, ziel, tage = 14) {
  zustand.versuch = {
    id: neueId(),
    art,
    ziel,
    start: heuteISO(),
    tage: Math.max(7, Math.min(28, Number(tage) || 14)),
    provokation: null,   // ISO-Tag der bewussten Wiedereinführung
    beendet: null,       // ISO-Tag des Abbruchs, falls abgebrochen
  };
  merke();
  melde();
  return zustand.versuch.id;
}

/** Der Tag der Provokation – ab hier wird wieder gegessen und weiter gezählt. */
function versuchProvozieren(iso) {
  if (!zustand.versuch) return;
  zustand.versuch = { ...zustand.versuch, provokation: iso || heuteISO() };
  merke();
  melde();
}

/**
 * Abbrechen. Der Versuch bleibt stehen statt zu verschwinden: Ein abgebrochener
 * Versuch ist selbst eine Auskunft („zwei Tage durchgehalten"), und ihn zu
 * löschen hieße, das Tagebuch schönzumachen.
 */
function versuchBeenden() {
  if (!zustand.versuch) return;
  zustand.versuch = { ...zustand.versuch, beendet: heuteISO() };
  merke();
  melde();
}

/**
 * Den laufenden Versuch abhaken und in die Historie legen.
 *
 * Früher hieß dieser Knopf „Wegräumen" und warf ihn weg. Das war die falsche
 * Bewegung: Ein fertiger Versuch ist das Wertvollste, was dieses Tagebuch
 * hervorbringt – zwei Wochen Verzicht plus eine bewusste Wiedereinführung –,
 * und er ist genau dann weg, wenn man ihn ein halbes Jahr später bräuchte.
 */
function versuchAblegen() {
  if (!zustand.versuch) return;
  const abgelegt = { ...zustand.versuch, abgelegt: heuteISO() };
  zustand.versuche = [abgelegt, ...zustand.versuche].slice(0, 40);
  zustand.versuch = null;
  merke();
  melde();
}

/** Einen abgelegten Versuch endgültig löschen – die eine Stelle, die vergisst. */
function versuchLoeschen(id) {
  const vorher = zustand.versuche.length;
  zustand.versuche = zustand.versuche.filter((v) => v.id !== id);
  if (zustand.versuche.length === vorher) return;
  merke();
  melde();
}

/* ---------- Stufenplan ---------- */

/**
 * Einen Stufenplan beginnen.
 *
 * `gruppen` ist die Auswahl und ihre Reihenfolge – beides trifft der Mensch
 * und nicht die App. Wer viel Brot isst, prüft Weizen zuerst, weil diese
 * Antwort seinen Alltag am stärksten ändert; wer selten auswärts isst, kann
 * die Zwiebel hinten anstellen.
 */
function planStarten(gruppen, karenzTage = 21) {
  zustand.stufenplan = {
    id: neueId(),
    start: heuteISO(),
    karenzTage: Math.max(14, Math.min(42, Number(karenzTage) || 21)),
    gruppen: (gruppen || []).filter((g) => typeof g === 'string').slice(0, 10),
    stufen: [],
    beendet: null,
  };
  merke();
  melde();
  return zustand.stufenplan.id;
}

/** Eine Gruppe ab heute prüfen – drei Tage mit steigender Menge. */
function stufeStarten(gruppe) {
  const p = zustand.stufenplan;
  if (!p || p.beendet) return;
  if (p.stufen.some((st) => st.gruppe === gruppe)) return;
  zustand.stufenplan = { ...p, stufen: [...p.stufen, { gruppe, start: heuteISO() }] };
  merke();
  melde();
}

/**
 * Eine Stufe verwerfen.
 *
 * Für den Fall, der im wirklichen Leben garantiert eintritt: Mitten in der
 * Weizenstufe kommt ein Magen-Darm-Infekt, eine Geburtstagsfeier oder eine
 * schlaflose Nacht. Diese drei Tage messen dann nicht die Gruppe. Sie
 * stehenzulassen wäre schlimmer als sie zu wiederholen – die Gruppe fiele zu
 * Unrecht durch, und jemand striche sie für Jahre vom Speiseplan.
 */
function stufeVerwerfen(gruppe) {
  const p = zustand.stufenplan;
  if (!p) return;
  const stufen = p.stufen.filter((st) => st.gruppe !== gruppe);
  if (stufen.length === p.stufen.length) return;
  zustand.stufenplan = { ...p, stufen };
  merke();
  melde();
}

/** Abbrechen. Bleibt stehen – auch ein abgebrochener Plan ist eine Auskunft. */
function planBeenden() {
  if (!zustand.stufenplan) return;
  zustand.stufenplan = { ...zustand.stufenplan, beendet: heuteISO() };
  merke();
  melde();
}

function planAblegen() {
  if (!zustand.stufenplan) return;
  const abgelegt = { ...zustand.stufenplan, abgelegt: heuteISO() };
  zustand.stufenplaene = [abgelegt, ...zustand.stufenplaene].slice(0, 10);
  zustand.stufenplan = null;
  merke();
  melde();
}

function planLoeschen(id) {
  const vorher = zustand.stufenplaene.length;
  zustand.stufenplaene = zustand.stufenplaene.filter((p) => p.id !== id);
  if (zustand.stufenplaene.length === vorher) return;
  merke();
  melde();
}

/* ---------- Provokationstest ---------- */

/**
 * Einen Provokationstest anlegen.
 *
 * `was` ist Freitext und mit Absicht keine Auswahlliste: Die Menge ist der
 * halbe Test, und „250 ml Milch" oder „ein Apfel" sagt mehr, als eine App
 * vorgeben könnte. Sie muss nur jedes Mal dieselbe sein – deshalb steht sie
 * einmal hier und nicht bei jedem Durchgang neu.
 */
function provokationStarten(art, ziel, was, opt = {}) {
  zustand.provokation = {
    id: neueId(),
    art,
    ziel,
    was: String(was || '').slice(0, 120),
    // Zwei bis acht Stunden sind der Rahmen, in dem das noch alltagstauglich
    // ist. Zwölf Stunden nüchtern wären klinisch sauberer und macht niemand.
    nuechtern: Math.max(2, Math.min(8, Number(opt.nuechtern) || 4)),
    fenster: Math.max(2, Math.min(8, Number(opt.fenster) || 4)),
    laeufe: [],
    beendet: null,
  };
  merke();
  melde();
  return zustand.provokation.id;
}

/**
 * Einen Durchgang eintragen – mit der Sache oder als Leerdurchgang.
 *
 * Der Zeitpunkt wird festgehalten und nicht bloß der Tag: Das Fenster hängt an
 * der Uhrzeit, und „irgendwann am Dienstag" ist kein Protokoll.
 */
function provokationLauf(leer = false, iso = null, uhr = null) {
  if (!zustand.provokation || zustand.provokation.beendet) return;
  const lauf = { am: iso || heuteISO(), um: uhr || jetztUhr(), leer: !!leer };
  zustand.provokation = {
    ...zustand.provokation,
    laeufe: [...zustand.provokation.laeufe, lauf],
  };
  merke();
  melde();
}

/** Einen Durchgang zurücknehmen – für den Fehlgriff, nicht für das Ergebnis. */
function provokationLaufWeg(am, um) {
  if (!zustand.provokation) return;
  const laeufe = zustand.provokation.laeufe.filter((l) => !(l.am === am && l.um === um));
  if (laeufe.length === zustand.provokation.laeufe.length) return;
  zustand.provokation = { ...zustand.provokation, laeufe };
  merke();
  melde();
}

/** Abbrechen. Bleibt stehen – ein Test, den man nicht durchhält, ist auch eine Auskunft. */
function provokationBeenden() {
  if (!zustand.provokation) return;
  zustand.provokation = { ...zustand.provokation, beendet: heuteISO() };
  merke();
  melde();
}

/** Abhaken und in die Historie legen. */
function provokationAblegen() {
  if (!zustand.provokation) return;
  const abgelegt = { ...zustand.provokation, abgelegt: heuteISO() };
  zustand.provokationen = [abgelegt, ...zustand.provokationen].slice(0, 40);
  zustand.provokation = null;
  merke();
  melde();
}

function provokationLoeschen(id) {
  const vorher = zustand.provokationen.length;
  zustand.provokationen = zustand.provokationen.filter((p) => p.id !== id);
  if (zustand.provokationen.length === vorher) return;
  merke();
  melde();
}

/* ---------- Gewicht ---------- */

/**
 * Ein Gewicht notieren – ein Wert je Tag, der neuere ersetzt den alten.
 *
 * Zweimal am Tag zu wiegen ergibt zwei Zahlen, die sich um ein Kilo
 * unterscheiden können, ohne dass sich am Menschen etwas geändert hätte.
 * Gespeichert wird deshalb der letzte Wert des Tages und nicht beide.
 */
function gewichtNotieren(iso, kg) {
  const wert = Number(kg);
  if (!/^\d{4}-\d{2}-\d{2}$/.test(String(iso || ''))) return;
  // Unter 20 und über 400 Kilo ist ein Tippfehler, keine Messung.
  if (!Number.isFinite(wert) || wert < 20 || wert > 400) return;
  zustand.gewicht = [{ am: iso, kg: Math.round(wert * 10) / 10 }]
    .concat(zustand.gewicht.filter((g) => g.am !== iso))
    .sort((a, b) => (a.am < b.am ? 1 : -1));
  merke();
  melde();
}

function gewichtLoeschen(iso) {
  const vorher = zustand.gewicht.length;
  zustand.gewicht = zustand.gewicht.filter((g) => g.am !== iso);
  if (zustand.gewicht.length === vorher) return;
  merke();
  melde();
}

/* ---------- Arzttermine ---------- */

 * Einen Termin eintragen. Doppelte Daten fallen weg, sortiert wird absteigend –
 * der jüngste steht vorn, weil ihn der Bericht braucht.
 */

  if (!/^\d{4}-\d{2}-\d{2}$/.test(String(iso || ''))) return;
  if (zustand.termine.includes(iso)) return;
  zustand.termine = [...zustand.termine, iso].sort().reverse();
  merke();
  melde();

function terminLoeschen(iso) {
  const vorher = zustand.termine.length;
  zustand.termine = zustand.termine.filter((t) => t !== iso);
  if (zustand.termine.length === vorher) return;
  merke();
  melde();
}

/**
 * Der jüngste Termin, der nicht in der Zukunft liegt.
 *
 * Ein Termin nächste Woche ist der *nächste*, nicht der letzte – der Bericht
 * müsste sonst über einen Zeitraum von minus drei Tagen berichten.

/* ---------- Was schon feststeht ---------- */

function befundNotieren(id) {
  if (!BEFUND_VON[id]) return false;
  if (zustand.befunde.some((b) => b.id === id)) return false;
  if (zustand.befunde.length >= JE_BEFUNDE) return false;

/* ---------- Die Küche: was geht, was nicht ---------- */

/**
 * Etwas auf eine der beiden Listen setzen.
 *
 * Steht derselbe Name schon auf der *anderen* Liste, wandert er hinüber statt
 * doppelt dazustehen. Das ist der häufige Fall und kein Sonderfall: Was im
 * Januar nicht ging, geht im März vielleicht wieder, und wer dann zweimal
 * „Kaffee" dastehen hat, glaubt der Liste nicht mehr.

  const sauber = String(name || '').trim().slice(0, MAX_NAME);
  if (!sauber) return null;
  if (!KUECHEN_ARTEN.some((a) => a.id === art)) return null;

  const gleich = (x) => x.name.toLowerCase() === sauber.toLowerCase();
  const vorhanden = zustand.kueche.find(gleich);
  if (vorhanden) {
    if (vorhanden.art === art) return vorhanden.id;
    zustand.kueche = zustand.kueche.map((x) => (gleich(x) ? { ...x, art, am: heuteISO() } : x));
    merke();
    melde();

  // gehen, soll deshalb nichts aufschreiben können, das nicht geht.

  const neu = { id: neueId(), name: sauber, art, am: heuteISO() };
  zustand.kueche = [neu, ...zustand.kueche];
  merke();
  melde();
  return neu.id;

  if (i < 0) return;

  melde();

function kuecheLoeschen(id) {

/* ---------- Ideen weitergeben ---------- */

/**
 * Wie viele Ideen noch niemand gesehen hat.

 * solange sie sie nicht selbst weitergibt. Bisher stand der Knopf dafür unten
 * auf dem Ideenreiter und wurde übersehen – eine Idee, die niemand liest, ist

/**
 * Ist eine Sicherung fällig?
 *
 * Es gibt schon einen Hinweis unter „Mehr", der sagt, wann zuletzt gesichert
 * wurde. Nur liest den niemand – Hinweise an Stellen, die man selten aufmacht,
 * sind Dekoration. Deshalb fragt die App von sich aus, und zwar nach der
 * Anzahl *oder* nach der Zeit: Wer zwei Wochen lang nichts einträgt, hat
 * genauso viel zu verlieren wie jemand mit dreißig neuen Einträgen.
 *

 * was sie daraus macht.
 */
function sicherungFaellig() {
  const heute = heuteISO();
  if (zustand.sicherungSpaeter && zustand.sicherungSpaeter > heute) return null;
  if (!zustand.eintraege.length) return null;

  const b = zustand.lastBackup;
  if (!b) {
    // Noch nie gesichert: erst fragen, wenn wirklich etwas zu verlieren ist.
    // Nach dem dritten Eintrag zu betteln, treibt Leute aus der App.
    return zustand.eintraege.length >= 15
      ? { grund: 'nie', neue: zustand.eintraege.length, seit: null }
      : null;

  const neue = zustand.eintraege.length - (b.anzahl || 0);
  const seit = tageSeit(b.on, heute);
  if (neue >= 30) return { grund: 'anzahl', neue, seit };
  if (seit >= 14 && neue > 0) return { grund: 'zeit', neue, seit };
  return null;

/** Ganze Tage zwischen zwei ISO-Daten. Klein gehalten, damit js/store.js
 *  nicht wegen einer Subtraktion an der Datumsschicht hängt. */
function tageSeit(vonISO, bisISO) {
  const t = (iso) => {
    const [y, m, d] = iso.split('-').map(Number);
    return new Date(y, m - 1, d).getTime();
  };
  return Math.round((t(bisISO) - t(vonISO)) / 86400000);

  d.setDate(d.getDate() + 7);

  melde();

/**
 * Sicherung einlesen.
 *
 * Geprüft wird nicht aus Misstrauen, sondern weil eine halb passende Datei
 * sonst still einen Zustand hinterlässt, in dem die App merkwürdig wird –
 * `eintraege` als Zeichenkette etwa. Alles Unbekannte fällt weg, alles
 * Bekannte wird auf seinen Typ gebracht, und jeder einzelne Eintrag muss
 * mindestens Datum und Art haben, sonst fliegt er raus.
 */
function sicherungLesen(text) {
  const gelesen = JSON.parse(text);
  if (!gelesen || typeof gelesen !== 'object' || Array.isArray(gelesen)
      || !Array.isArray(gelesen.eintraege)) {
    throw new Error('Unerwartetes Format – die Liste "eintraege" fehlt.');
  }

    const v = gelesen[k];
    if (v === undefined || v === null) return;
    const soll = VORGABE[k];
    if (Array.isArray(soll) !== Array.isArray(v)) return;
    if (soll !== null && typeof soll !== typeof v) return;
    frisch[k] = v;

    e && typeof e === 'object' && typeof e.am === 'string' && typeof e.art === 'string'
  )).map((e) => mahlzeitFrisch({ ...e, id: e.id || neueId() })));
  frisch.standardMittel = frisch.standardMittel
    .filter((x) => x && typeof x === 'object' && typeof x.mittel === 'string' && x.mittel.trim())
    .map((x) => ({ ...x, id: x.id || neueId(), dosis: String(x.dosis || '') }));

    .map((x) => ({ ...x, id: x.id || neueId(), erledigt: !!x.erledigt }));

  // Ein halb gelesener Versuch würde die Tagesansicht mit „Tag NaN von
  // undefined" begrüßen. Was nicht vollständig ist, gilt als keiner.
  const v = frisch.versuch;
  if (!v || typeof v !== 'object' || typeof v.start !== 'string'
      || typeof v.ziel !== 'string' || !Number.isFinite(Number(v.tage))) {
    frisch.versuch = null;
  }
  /*
   * Dasselbe für den Provokationstest, mit einer Zeile mehr: Die Durchgänge
   * tragen das Fenster, in dem gerechnet wird. Ein Eintrag ohne Uhrzeit ließe
   * das Fenster auf Mittag rutschen und rechnete dann Beschwerden mit, die
   * Stunden nach dem Durchgang kamen.
   */
  const pv = frisch.provokation;
  if (!pv || typeof pv !== 'object' || typeof pv.ziel !== 'string'
      || !Array.isArray(pv.laeufe)) {
    frisch.provokation = null;
  } else {
    frisch.provokation = {
      ...pv,
      laeufe: pv.laeufe.filter((l) => l && typeof l.am === 'string' && typeof l.um === 'string'),
    };
  }
  /*
   * Und für den Stufenplan. Ohne `start` und `karenzTage` gäbe es keine
   * Zeitrechnung, ohne `stufen` keine Wiedereinführung – ein halb gelesener
   * Plan würde den Tagesreiter mit „Tag NaN von undefined" begrüßen.
   */
  const sp = frisch.stufenplan;
  if (!sp || typeof sp !== 'object' || typeof sp.start !== 'string'
      || !Number.isFinite(Number(sp.karenzTage)) || !Array.isArray(sp.gruppen)) {
    frisch.stufenplan = null;
  } else {
    frisch.stufenplan = {
      ...sp,
      stufen: (Array.isArray(sp.stufen) ? sp.stufen : [])
        .filter((st) => st && typeof st.gruppe === 'string' && typeof st.start === 'string'),
    };
  }
  return frisch;
}

/* ---------- Einlesen, ohne etwas zu verlieren ---------- */

/*
 * Hier stand bis zum 28.10.2026 nur ausJSON(): Der eingelesene Stand ersetzte
 * den vorhandenen, ohne Rückfrage und ohne Kopie. Solange eine Sicherung nur
 * nach einem verlorenen Gerät eingelesen wurde, ging das gut. Mit dem Umzug
 * von Safari in die App auf dem Startbildschirm wurde es zur Falle: Wer in
 * der neuen App erst ein Frühstück einträgt und danach die Safari-Einträge
 * holt, hätte das Frühstück verloren – oder umgekehrt, wer zweimal holt, die

 *

 *      Schlüssel und lässt sich mit rueckgaengig() zurückholen.
 *   2. Ist schon etwas da, wird zusammengeführt statt ersetzt: Einträge,

  return !s.eintraege.length && !Object.keys(s.tage || {}).length && !s.ideen.length
    && !s.kueche.length && !s.befunde.length && !s.termine.length && !s.gewicht.length
    && !s.eigeneAusloeser.length && !s.versuche.length && !s.provokationen.length
    && !s.stufenplaene.length && !s.versuch && !s.provokation && !s.stufenplan;
}

function vorherAblegen() {
  try {
    localStorage.setItem(VORHER, JSON.stringify({ am: new Date().toISOString(), zustand }));
    return true;
  } catch {
    return false;
  }

/** Liegt ein Stand von vor dem letzten Einlesen? { am, anzahl } oder null. */

  try {

    const v = JSON.parse(roh);
