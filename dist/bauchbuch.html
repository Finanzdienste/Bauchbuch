const GRUPPE_VON = Object.fromEntries(FODMAP_GRUPPEN.map((g) => [g.id, g]));

const tagesSchnitt = (werte) => (werte.length
  ? werte.reduce((a, b) => a + b, 0) / werte.length : 0);

/** Die notierten Tageswerte eines Zeitraums, beide Ränder eingeschlossen. */
function zeitraum(eintraege, tage, von, bis) {
  const werte = [];
  const n = tageDazwischen(von, bis);
  if (n < 0) return { werte, notierte: 0, schnitt: 0, von, bis };
  for (let i = 0; i <= n; i++) {
    const t = tagesWert(eintraege, plusTage(von, i), tage);
    // Eine Lücke im Tagebuch ist kein beschwerdefreier Tag. Dieselbe Regel wie
    // überall – und hier zählt sie doppelt, weil ein Stufenplan über Wochen
    // läuft und niemand über Wochen lückenlos einträgt.
    if (t.notiert) werte.push(t.wert);
  }
  return { werte, notierte: werte.length, schnitt: tagesSchnitt(werte), von, bis };
}

/** Der Zeitraum einer Stufe: die drei Tage plus den Nachklang. */
function stufenFenster(st) {
  return { von: st.start, bis: plusTage(st.start, STUFE_TAGE - 1 + NACHKLANG) };
}

/**
 * Wo der Plan gerade steht.
 *
 *   'karenz'    die Auslasszeit läuft
 *   'entscheid' die Karenz ist um – jetzt fällt die Frage, ob es überhaupt hilft
 *   'stufe'     eine Gruppe wird gerade geprüft
 *   'pause'     Karenz zwischen zwei Gruppen
 *   'bereit'    die Pause ist um, die nächste Gruppe kann anfangen
 *   'fertig'    alle gewählten Gruppen durch
 *   'beendet'   von Hand abgebrochen
 */
function planStand(plan, heute) {
  if (!plan) return null;
  if (plan.beendet) return { phase: 'beendet' };

  const stufen = plan.stufen || [];
  const laufend = stufen.find((st) => {
    const f = stufenFenster(st);
    return heute >= st.start && heute <= f.bis;
  });
  if (laufend) {
    return {
      phase: 'stufe',
      gruppe: laufend.gruppe,
      tag: Math.min(STUFE_TAGE, tageDazwischen(laufend.start, heute) + 1),
      nachklang: tageDazwischen(laufend.start, heute) >= STUFE_TAGE,
    };
  }

  const karenzBis = plusTage(plan.start, plan.karenzTage - 1);
  if (!stufen.length) {
    return tageDazwischen(plan.start, heute) >= plan.karenzTage
      ? { phase: 'entscheid', karenzBis }
      : {
        phase: 'karenz',
        tag: Math.max(1, tageDazwischen(plan.start, heute) + 1),
        von: plan.karenzTage,
        rest: Math.max(0, plan.karenzTage - (tageDazwischen(plan.start, heute) + 1)),
      };
  }

  const offen = (plan.gruppen || []).filter((g) => !stufen.some((st) => st.gruppe === g));
  if (!offen.length) return { phase: 'fertig' };

  const letzte = stufen[stufen.length - 1];
  const seit = tageDazwischen(stufenFenster(letzte).bis, heute);
  /*
   * `ab` ist der Tag, an dem die nächste Gruppe drankommt – und er wird hier
   * ausgerechnet und nicht in der Anzeige. Die Anzeige braucht ihn für den
   * Kalendereintrag, und eine zweite Stelle, die dieselbe Frist noch einmal
   * nachrechnet, wäre die sicherste Art, sie irgendwann auseinanderlaufen zu
   * lassen.
   */
  const ab = plusTage(stufenFenster(letzte).bis, PAUSE_TAGE);
  return seit >= PAUSE_TAGE
    ? { phase: 'bereit', naechste: offen[0], offen, ab }
    : {
      phase: 'pause', naechste: offen[0], offen, rest: PAUSE_TAGE - seit, ab,
    };
}

const KARENZ_URTEIL = {
  laeuft: 'läuft noch',
  zuwenig: 'zu wenige notierte Tage',
  hilft: 'die Karenz hilft',
  'hilft-nicht': 'die Karenz hilft nicht',
};

/**
 * Bringt die Karenz überhaupt etwas?
 *
 * Die Weiche, an der der ganze Plan hängt. Verglichen wird die Karenz – ohne
 * ihre Eingewöhnungstage – mit dem gleich langen Zeitraum davor, also mit dem
 * eigenen Alltag und nicht mit null.
 */
function karenzBild(plan, eintraege, tage, heute) {
  if (!plan) return null;
  const bis0 = plusTage(plan.start, plan.karenzTage - 1);
  const bis = heute < bis0 ? heute : bis0;
  const von = plusTage(plan.start, EINGEWOEHNUNG);
  const karenz = zeitraum(eintraege, tage, von, bis);
  const vorher = zeitraum(eintraege, tage,
    plusTage(plan.start, -plan.karenzTage), plusTage(plan.start, -1));
  const besserung = vorher.schnitt - karenz.schnitt;

  const zahlen = `${karenz.schnitt.toFixed(1).replace('.', ',')} während der Karenz `
    + `gegen ${vorher.schnitt.toFixed(1).replace('.', ',')} davor `
    + `(${karenz.notierte} gegen ${vorher.notierte} notierte Tage).`;

  if (vorher.notierte < MINDEST_NOTIERT || karenz.notierte < MINDEST_NOTIERT) {
    return {
      urteil: 'zuwenig',
      wort: KARENZ_URTEIL.zuwenig,
      vorher,
      karenz,
      besserung,
      satz: `Für den Vergleich braucht es auf beiden Seiten mindestens `
        + `${MINDEST_NOTIERT} notierte Tage – bisher ${vorher.notierte} davor und `
        + `${karenz.notierte} währenddessen. Eine Lücke im Tagebuch ist kein `
        + `beschwerdefreier Tag, und gerade in einer Karenz wird weniger `
        + `eingetragen, weil weniger passiert.`,
    };
  }

  if (heute <= bis0) {
    return {
      urteil: 'laeuft',
      wort: KARENZ_URTEIL.laeuft,
      vorher,
      karenz,
      besserung,
      satz: besserung >= PLAN_SCHWELLE
        ? `Bisher ${besserung.toFixed(1).replace('.', ',')} Stufen besser: ${zahlen} `
          + `Das sieht gut aus – und es ist noch keine Antwort darauf, *was* davon. `
          + `Die kommt erst mit der Wiedereinführung.`
        : `Bisher kein deutlicher Unterschied: ${zahlen} Weiter bis zum Ende der `
          + `Karenz; darunter ist es zu früh für ein Urteil.`,
    };
  }

  if (besserung >= PLAN_SCHWELLE) {
    return {
      urteil: 'hilft',
      wort: KARENZ_URTEIL.hilft,
      vorher,
      karenz,
      besserung,
      satz: `${besserung.toFixed(1).replace('.', ',')} Stufen besser: ${zahlen} `
        + `Damit steht fest, dass es sich lohnt weiterzumachen – und jetzt kommt `
        + `der Teil, auf den alles hinausläuft. **Die Karenz ist nicht das Ziel.** `
        + `Sie ist der Aufbau: Erst die Wiedereinführung sagt, welche Gruppe `
        + `es war, und alles andere darf zurück auf den Teller.`,
    };
  }

  /*
   * Der Abbruch. Die wichtigste Ausgabe dieser Datei, und sie muss unmissver-
   * ständlich sein: nicht „vielleicht doch noch weiterprobieren", sondern
   * aufhören.
   */
  return {
    urteil: 'hilft-nicht',
    wort: KARENZ_URTEIL['hilft-nicht'],
    vorher,
    karenz,
    besserung,
    satz: `Kein deutlicher Unterschied: ${zahlen} Damit ist dieser Plan zu Ende, `
      + `und das ist die richtige Folgerung und kein Fehlschlag: Wenn `
      + `${plan.karenzTage} Tage ohne diese Kohlenhydrate nichts geändert haben, `
      + `wird die Wiedereinführung es auch nicht klären – dann liegt es nicht `
      + `daran. Iss wieder normal. Eine Diät, die nichts bringt, ist kein `
      + `neutraler Zustand: Sie kostet Ballaststoffe, Kalzium und Vielfalt, und `
      + `dafür bekommst du hier nichts. Was stattdessen dransteht, steht unter `
      + `„Was noch fehlt".`,
  };
}

const STUFEN_URTEIL = {
  laeuft: 'läuft noch',
  zuwenig: 'zu wenig eingetragen',
  vertraegt: 'verträgst du',
  menge: 'kommt auf die Menge an',
  reagiert: 'reagiert – kleine Menge ungeprüft',
  'vertraegt-nicht': 'verträgst du nicht',
};

/**
 * Was bei den Karenz-Tagen herauskommt, gegen die eine Stufe gehalten wird.
 *
 * Nicht nur die ursprüngliche Karenz, sondern auch die Pausen zwischen den
 * Stufen: Der Plan läuft über Wochen, und wie es jemandem „ohne" geht, ändert
 * sich in dieser Zeit. Der Nachklangtag nach jeder Stufe bleibt draußen – er
 * gehört zur Stufe.
 */
function grundlinie(plan, eintraege, tage, heute) {
  const werte = [];
  const bis0 = plusTage(plan.start, plan.karenzTage - 1);
  const k = zeitraum(eintraege, tage, plusTage(plan.start, EINGEWOEHNUNG),
    heute < bis0 ? heute : bis0);
  werte.push(...k.werte);

  (plan.stufen || []).forEach((st) => {
    const nach = plusTage(stufenFenster(st).bis, 1);
    const p = zeitraum(eintraege, tage, nach,
      heute < plusTage(nach, PAUSE_TAGE - 1) ? heute : plusTage(nach, PAUSE_TAGE - 1));
    werte.push(...p.werte);
  });

  return { werte, notierte: werte.length, schnitt: tagesSchnitt(werte) };
}

/**
 * Eine einzelne Stufe: verträgst du die Gruppe – und in welcher Menge?
 *
 * Die Mengenfrage fällt hier fast umsonst ab, weil die Stufe ohnehin über drei
 * Tage steigert. Sie zu verschweigen wäre die teuerste Auslassung des ganzen
 * Plans: „Weizen verträgst du nicht" streicht Brot, Nudeln und Couscous;
 * „ab zwei Scheiben wird es zu viel" streicht gar nichts.
 */
function stufenBild(plan, st, eintraege, tage, heute) {
  const g = GRUPPE_VON[st.gruppe] || { name: st.gruppe, mengen: [] };
  const basis = grundlinie(plan, eintraege, tage, heute);
  const f = stufenFenster(st);

  const tageswerte = [];
  for (let i = 0; i < STUFE_TAGE; i++) {
    const iso = plusTage(st.start, i);
    const t = tagesWert(eintraege, iso, tage);
    tageswerte.push(t.notiert ? t.wert : null);
  }
  // Der Nachklangtag zählt zum letzten, größten Tag – dort wurde am meisten
  // gegessen, und dorthin gehört, was sich am Morgen danach meldet.
  const nach = tagesWert(eintraege, plusTage(st.start, STUFE_TAGE), tage);
  if (nach.notiert && tageswerte[STUFE_TAGE - 1] !== null) {
    tageswerte[STUFE_TAGE - 1] = Math.max(tageswerte[STUFE_TAGE - 1], nach.wert);
  }

  const gemessen = tageswerte.filter((x) => x !== null);
  const schnitt = tagesSchnitt(gemessen);
  const unterschied = schnitt - basis.schnitt;

  const gemeinsam = {
    gruppe: st.gruppe,
    name: g.name,
    start: st.start,
    bis: f.bis,
    tageswerte,
    mengen: g.mengen,
    basis: basis.schnitt,
    basisTage: basis.notierte,
    schnitt,
    unterschied,
  };

  if (heute <= f.bis) {
    return { ...gemeinsam, urteil: 'laeuft', wort: STUFEN_URTEIL.laeuft, satz: '' };
  }
  if (gemessen.length < 2 || basis.notierte < MINDEST_NOTIERT) {
    return {
      ...gemeinsam,
      urteil: 'zuwenig',
      wort: STUFEN_URTEIL.zuwenig,
      satz: `An ${gemessen.length} der ${STUFE_TAGE} Tage steht etwas im Tagebuch, `
        + `und als Vergleich ${basis.notierte} Karenztage. Das reicht nicht – `
        + `diese Gruppe müsste noch einmal geprüft werden. Ärgerlich, aber `
        + `ehrlicher, als aus zwei Tagen einen Speiseplan zu machen.`,
    };
  }

  const zahlen = `${schnitt.toFixed(1).replace('.', ',')} an den Testtagen gegen `
    + `${basis.schnitt.toFixed(1).replace('.', ',')} in der Karenz `
    + `(${basis.notierte} Tage).`;

  if (unterschied < PLAN_SCHWELLE) {
    return {
      ...gemeinsam,
      urteil: 'vertraegt',
      wort: STUFEN_URTEIL.vertraegt,
      satz: `Kein deutlicher Unterschied: ${zahlen} Diese Gruppe darf zurück auf `
        + `den Teller – bis ${g.mengen[STUFE_TAGE - 1] || 'zur geprüften Menge'} `
        + `${g.womit ? `${g.womit} ` : ''}war nichts zu merken. Jede Gruppe, die `
        + `zurückkommt, ist der eigentliche Ertrag des ganzen Plans.`,
    };
  }

  /*
   * Reagiert hat es. Jetzt die Frage, die den Unterschied zwischen einer
   * Streichliste und einer Faustregel macht: ab welcher Menge?
   */
  const erste = tageswerte[0];
  const ruhigAmAnfang = erste !== null && erste - basis.schnitt < PLAN_SCHWELLE;
  const abTag = tageswerte.findIndex((w) => w !== null && w - basis.schnitt >= PLAN_SCHWELLE);

  if (ruhigAmAnfang && abTag > 0) {
    return {
      ...gemeinsam,
      urteil: 'menge',
      wort: STUFEN_URTEIL.menge,
      abTag: abTag + 1,
      gehtBis: g.mengen[abTag - 1],
      satz: `${zahlen} Aber nicht von Anfang an: ${g.mengen[abTag - 1]} `
        + `${g.womit || ''} ging noch, ab ${g.mengen[abTag]} kam es. Das ist die `
        + `nützlichste Antwort, die dieser Plan geben kann – **streichen wäre `
        + `hier zu viel.** Behalte die kleinere Menge und lass die größere weg.`,
    };
  }

  /*
   * Der erste Tag fehlt im Tagebuch – und damit ausgerechnet der, der über die
   * kleine Menge entscheidet.
   *
   * Hier „schon die kleinste Menge schlägt durch" zu schreiben, wäre eine
   * Aussage über etwas, das nie beobachtet wurde, und sie hätte Folgen: Sie
   * streicht eine ganze Gruppe. Derselbe Fehler steckte einmal in
   * js/dosis.js – dort hieß es „auch in kleiner Menge", obwohl nur die große
   * je vorkam. Was nicht erhoben wurde, heißt nicht unauffällig, und es heißt
   * genauso wenig auffällig.
   */
  if (erste === null) {
    return {
      ...gemeinsam,
      urteil: 'reagiert',
      wort: STUFEN_URTEIL.reagiert,
      satz: `${zahlen} Diese Gruppe hat reagiert – aber am ersten Tag, dem mit der `
        + `kleinsten Menge (${g.mengen[0] || 'die erste Stufe'}), steht nichts im `
        + `Tagebuch. Ob die kleine Menge durchgeht, ist damit offen, und das ist `
        + `genau die Frage, an der hängt, ob du die Gruppe streichen musst oder `
        + `nur begrenzen. Diese Stufe lohnt eine Wiederholung.`,
    };
  }

  return {
    ...gemeinsam,
    urteil: 'vertraegt-nicht',
    wort: STUFEN_URTEIL['vertraegt-nicht'],
    satz: `${zahlen} Schon die kleinste geprüfte Menge `
      + `(${g.mengen[0] || 'die erste Stufe'}${g.womit ? ` ${g.womit}` : ''}) hat `
      + `durchgeschlagen. Diese Gruppe bleibt vorerst draußen – und lohnt in `
      + `einem halben Jahr einen zweiten Versuch: Verträglichkeiten ändern sich, `
      + `besonders wenn sich der Darm zwischendurch beruhigt hat.`,
  };
}

/**
 * Der ganze Plan auf einen Blick – und vor allem: was heute zu tun ist.
 *
 * Ein Plan über zehn Wochen, der nicht jeden Tag sagt, was heute dran ist, ist
 * keiner. Genau daran scheitert die FODMAP-Diät im Alltag am häufigsten: nicht
 * am Verzicht, sondern daran, dass nach der dritten Woche niemand mehr weiß,
 * welche Gruppe als Nächstes kommt und wann.
 */
function planBild(plan, eintraege, tage, heute) {
  if (!plan) return null;
  const stand = planStand(plan, heute);
  const karenz = karenzBild(plan, eintraege, tage, heute);
  const stufen = (plan.stufen || []).map((st) => stufenBild(plan, st, eintraege, tage, heute));
  const offen = (plan.gruppen || []).filter((g) => !(plan.stufen || []).some((st) => st.gruppe === g));

  let schritt = null;
  if (stand.phase === 'karenz') {
    schritt = {
      satz: `Tag ${stand.tag} von ${plan.karenzTage} der Karenz. Noch `
        + `${stand.rest} Tage – einfach weiter eintragen, mehr ist heute nicht zu tun.`,
    };
  } else if (stand.phase === 'entscheid') {
    schritt = {
      entscheid: true,
      satz: karenz.urteil === 'hilft'
        ? 'Die Karenz ist um und sie hat geholfen. Jetzt die Wiedereinführung – '
          + 'wähle die Gruppe, deren Antwort dir am meisten bringt.'
        : (karenz.urteil === 'hilft-nicht'
          ? 'Die Karenz ist um und hat nichts gebracht. Hier ist Schluss: wieder '
            + 'normal essen.'
          : 'Die Karenz ist um, aber es fehlen notierte Tage für ein Urteil.'),
    };
  } else if (stand.phase === 'stufe') {
    const g = GRUPPE_VON[stand.gruppe] || {};
    schritt = stand.nachklang
      ? {
        satz: `Heute nichts davon mehr – der Tag nach der Stufe gehört noch dazu. `
          + `Was sich vom gestrigen Tag noch meldet, gehört zu ${g.name || stand.gruppe}.`,
      }
      : {
        satz: `${g.name || stand.gruppe}, Tag ${stand.tag} von ${STUFE_TAGE}: `
          + `${(g.mengen || [])[stand.tag - 1] || 'die vorgesehene Menge'} `
          + `${g.womit || ''}. Sonst weiter wie in der Karenz – nur diese eine Sache dazu.`,
      };
  } else if (stand.phase === 'pause') {
    const g = GRUPPE_VON[stand.naechste] || {};
    schritt = {
      am: stand.ab,
      gruppe: stand.naechste,
      titel: `Body Check: ${g.name || stand.naechste} anfangen`,
      satz: `Pause: noch ${stand.rest} Tage zurück auf die Karenz, damit die `
        + `nächste Gruppe nicht misst, was die letzte hinterlassen hat.`,
    };
  } else if (stand.phase === 'bereit') {
    const g = GRUPPE_VON[stand.naechste] || {};
    schritt = {
      bereit: true,
      gruppe: stand.naechste,
      satz: `Bereit für die nächste Gruppe: ${g.name || stand.naechste}, `
        + `drei Tage mit ${(g.mengen || []).join(', ')} ${g.womit || ''}.`,
    };
  } else if (stand.phase === 'fertig') {
    const gut = stufen.filter((x) => x.urteil === 'vertraegt').length;
    const teils = stufen.filter((x) => x.urteil === 'menge').length;
    schritt = {
      satz: `Alle gewählten Gruppen durch. ${gut} davon verträgst du, `
        + `${teils} in kleiner Menge. Dein Alltag ist ab jetzt die Karenz plus `
        + `alles, was zurückdurfte – und nicht die Karenz.`,
    };
  }

  return {
    stand, karenz, stufen, offen, schritt,
  };
}

/* ===== js/anfang.js ===== */
/*
 * Die ersten Wochen – oder: wie man „noch nicht" sagt, ohne zehnmal nein zu sagen
 *
 * WAS HIER SCHIEFLIEF
 *
 * Am fünften Tag hatte der Muster-Reiter über neuntausend Zeichen, und der weit
 * überwiegende Teil davon war eine Absage: „noch nichts Belastbares", „fehlt
 * noch Material", „ab etwa zwei Wochen", „noch keine Klasse mit genug Fällen",
 * „zu wenige", „zählt noch". Zehn Karten, die alle dasselbe sagten.
 *
 * Jede einzelne davon war richtig – daran ändert sich nichts, und daran soll
 * sich nichts ändern. Aber die Menge war das Problem, und zwar ausgerechnet in
 * den Wochen, die über alles Weitere entscheiden. Im README dieses Projekts
 * steht der Satz: „Das größte Risiko für ein Tagebuch ist nicht ein Fehler in
 * der Auswertung, sondern dass nach drei Wochen niemand mehr etwas einträgt."
 * Genau dagegen arbeitete dieser Reiter.
 *
 * WAS STATTDESSEN
 *
 * Dieselbe Auskunft, einmal statt zehnmal – und in die andere Richtung
 * formuliert. Nicht „dafür reicht es noch nicht", sondern „dafür fehlen noch
 * vier Tage". Das ist kein Schönreden: Die Zahlen sind dieselben, die Schwellen
 * sind dieselben, und was noch nicht gesagt werden kann, wird weiterhin nicht
 * gesagt. Es steht nur als Ziel da statt als Zurückweisung.
 *
 * WAS DIESE DATEI AUSDRÜCKLICH NICHT TUT
 *
 * Sie schaltet nichts frei und rechnet nichts aus. Die Schwellen stehen dort,
 * wo sie hingehören – in js/bild.js, js/kriterien.js, in den Einstellungen der
 * Bilanz. Hier wird nur nachgesehen, wie weit es noch ist. Und sie verdeckt
 * nichts: Warnzeichen stehen auch am ersten Tag oben, ohne Schwelle und ohne
 * Fortschrittsbalken. Ein einziges Mal Blut ist ein einziges Mal zu viel, und
 * das hat mit Fallzahlen nichts zu tun.
 */

/** Ab so vielen notierten Tagen lohnt der Stufenplan – siehe js/app.js. */
const PLAN_AB = 14;

/**
 * Wie weit ist es noch bis wohin?
 *
 * @param {object} z  { notierteTage, beschwerden, zuordenbar, mahlzeiten,
 *                      naechsteBilanz: {name, faelle, gegen} | null,
 *                      mindestFaelle }
 * @returns {{fertig: boolean, schritte: object[]}}
 */
function freischaltung(z) {
  const schritte = [];
  const offen = (jetzt, brauch) => Math.max(0, brauch - jetzt);

  /*
   * Die Reihenfolge ist dieselbe wie auf dem Reiter selbst, damit sich die
   * Liste später an derselben Stelle wiederfindet, an der sie versprochen
   * wurde.
   */
  schritte.push({
    id: 'bild',
    titel: 'Die Einordnung deines Musters',
    was: 'wonach das Bild aussieht, in den Worten, die in einer Praxis benutzt werden',
    offen: Math.max(offen(z.notierteTage, 10), offen(z.beschwerden, 5)),
    stand: `${z.notierteTage} von 10 notierten Tagen, ${z.beschwerden} von 5 Eintragungen zu Beschwerden`,
  });

  schritte.push({
    id: 'kriterien',
    titel: 'Rom IV und GerdQ',
    was: 'die Regelwerke, mit denen in der Sprechstunde eingeordnet wird',
    offen: offen(z.notierteTage, 14),
    stand: `${z.notierteTage} von 14 notierten Tagen`,
  });

  /*
   * Die Bilanz hat keine Tagesschwelle, sondern eine je Merkmal: fünf
   * Mahlzeiten damit und fünf ohne. Deshalb steht hier nicht „noch n Tage",
   * sondern der eine Auslöser, der am nächsten dran ist – das ist die Zahl, die
   * sich durch Eintragen tatsächlich bewegt.
   */
  if (z.naechsteBilanz) {
    const b = z.naechsteBilanz;
    schritte.push({
      id: 'bilanz',
      titel: 'Der erste Auslöser mit Zahlen',
      was: 'was nach welchem Essen wie oft kam – verglichen mit deinem eigenen Alltag',
      offen: Math.max(offen(b.faelle, z.mindestFaelle), offen(b.gegen, z.mindestFaelle)),
      stand: `am nächsten dran: ${b.name} – ${b.faelle} Mahlzeiten damit, `
        + `${b.gegen} ohne, gebraucht werden je ${z.mindestFaelle}`,
    });
  } else {
    schritte.push({
      id: 'bilanz',
      titel: 'Der erste Auslöser mit Zahlen',
      was: 'was nach welchem Essen wie oft kam – verglichen mit deinem eigenen Alltag',
      offen: Math.max(1, z.mindestFaelle - z.mahlzeiten),
      stand: `${z.mahlzeiten} Mahlzeiten eingetragen; je Merkmal braucht es `
        + `${z.mindestFaelle} damit und ${z.mindestFaelle} ohne`,
    });
  }

  schritte.push({
    id: 'plan',
    titel: 'Der Stufenplan',
    was: 'das Verfahren, das am Ende einen Speiseplan hinterlässt statt einer Auskunft',
    offen: offen(z.notierteTage, PLAN_AB),
    stand: `${z.notierteTage} von ${PLAN_AB} notierten Tagen`,
  });

  return { fertig: schritte.every((s) => s.offen === 0), schritte };
}

/**
 * Ein Satz darüber, was als Nächstes dazukommt.
 *
 * Er nennt *eine* Schwelle und nur die. Eine Liste aus vier Entfernungen ist
 * wieder nur eine Wand.
 *
 * Genommen wird die erste offene in der Reihenfolge oben – und ausdrücklich
 * nicht die mit der kleinsten Zahl. Die Zahlen messen Verschiedenes: „noch acht
 * Tage" und „noch fünf Mahlzeiten" lassen sich nicht vergleichen, und wer sie
 * gegeneinander sortiert, sortiert Äpfel gegen Birnen und nennt das Ergebnis
 * dann auch noch „am nächsten dran".
 */
function naechsteSchwelle(schritte) {
  const naechster = schritte.find((s) => s.offen > 0);
  if (!naechster) return null;
  return { ...naechster, satz: `Als Nächstes: ${naechster.titel} – ${naechster.stand}.` };
}

/* ===== js/kalender.js ===== */
/*
 * Die Erinnerung – die einzige Funktion hier, die mehr bringt als jede Rechnung
 *
 * WARUM ÜBERHAUPT
 *
 * Alles in dieser App hängt daran, dass eingetragen wird. Die Auswertung kann
 * so sauber sein, wie sie will: Ein Tagebuch, an das niemand erinnert, endet
 * nach drei Wochen, und dann war die ganze Statistik für nichts. Im README
 * steht der Satz seit dem ersten Tag – nur gab es bis jetzt nichts, was ihn
 * beantwortet hätte.
 *
 * WARUM ES KEINE PUSH-NACHRICHT IST
 *
 * Weil das nicht geht, ohne die Zusage dieser App zu brechen. Eine
 * Benachrichtigung, die ankommt, während die App geschlossen ist, braucht auf
 * dem iPhone die Push-API – und die braucht einen Server, der sie verschickt,
 * plus eine Kennung des Geräts, die dort liegt. Beides gibt es hier nicht und
 * soll es nicht geben. „Kein Server" ist keine Sparmaßnahme, sondern der Grund,
 * warum das Tagebuch nirgends landen kann.
 *
 * WAS STATTDESSEN GEHT
 *
 * Der Kalender, den das Telefon ohnehin hat. Diese Datei baut einen ganz
 * gewöhnlichen Termineintrag nach RFC 5545 – täglich, mit Wecker –, und der
 * wird einmal in den Kalender gelegt. Ab da erinnert das Telefon selbst, auch
 * offline, auch wenn die App nie wieder geöffnet wird, und ohne dass irgendwo
 * eine Adresse, ein Konto oder ein Gerät vermerkt wäre. Der Text entsteht im
 * Browser aus ein paar Zeilen; herausgereicht wird eine Datei, sonst nichts.
 *
 * Die Kehrseite steht in der App: Es ist ein Kalendereintrag und keine
 * Funktion dieser App. Wer ihn löscht, wird nicht mehr erinnert, und die App
 * merkt davon nichts – sie kann in den Kalender nicht hineinsehen. Das ist die
 * Kehrseite davon, dass sie auch sonst nirgends hineinsieht.
 */

/**
 * Zeilen nach RFC 5545 umbrechen: höchstens 75 Oktette, Fortsetzung mit einem
 * führenden Leerzeichen.
 *
 * Sieht nach Kleinkram aus, ist aber der Unterschied zwischen „wird importiert"
 * und „Datei defekt": Manche Kalender lehnen zu lange Zeilen rundheraus ab. Ein
 * Umlaut zählt dabei als zwei Oktette, deshalb wird nach Bytes gemessen und
 * nicht nach Zeichen.
 */
function falten(zeile) {
  const kodierer = new TextEncoder();
  if (kodierer.encode(zeile).length <= 75) return zeile;
  const teile = [];
  let jetzt = '';
  let bytes = 0;
  for (const zeichen of zeile) {
    const n = kodierer.encode(zeichen).length;
    // Fortsetzungszeilen haben ein Leerzeichen vorn, also ein Oktett weniger.
    if (bytes + n > (teile.length ? 74 : 75)) {
      teile.push(jetzt);
      jetzt = '';
      bytes = 0;
    }
    jetzt += zeichen;
    bytes += n;
  }
  teile.push(jetzt);

  /*
   * Kein Umbruch direkt hinter einem Leerzeichen.
   *
   * Beim Auffalten wird die Fortsetzungszeile hinten angehängt und ihr erstes
   * Zeichen (das Faltzeichen) verworfen. Endet die vorige Zeile auf einem
   * *echten* Leerzeichen, steht das am Zeilenende – und Leerzeichen am
   * Zeilenende überleben nicht jeden Transport. Fällt es weg, klebt
   * „Eintragungist" zusammen. Das Leerzeichen wandert deshalb an den Anfang
   * der nächsten Zeile, wo es geschützt hinter dem Faltzeichen steht.
   */
  return teile.reduce((raus, teil, i) => {
    if (i === 0) return [teil];
    const vorher = raus[raus.length - 1];
    if (vorher.endsWith(' ')) {
      raus[raus.length - 1] = vorher.slice(0, -1);
      return [...raus, ` ${teil}`];
    }
    return [...raus, teil];
  }, []).join('\r\n ');
}

/** In einem Textfeld sind Komma, Semikolon, Backslash und Umbruch zu maskieren. */
const schuetzen = (t) => String(t)
  .replace(/\\/g, '\\\\')
  .replace(/;/g, '\\;')
  .replace(/,/g, '\\,')
  .replace(/\n/g, '\\n');

const zwei = (n) => String(n).padStart(2, '0');

/** Ein Zeitstempel in UTC, wie ihn DTSTAMP verlangt. */
function utcStempel(d) {
  return `${d.getUTCFullYear()}${zwei(d.getUTCMonth() + 1)}${zwei(d.getUTCDate())}`
    + `T${zwei(d.getUTCHours())}${zwei(d.getUTCMinutes())}${zwei(d.getUTCSeconds())}Z`;
}

/** Vorschläge für die Uhrzeit – abends, wenn der Tag zu Ende ist. */
const ZEIT_VORSCHLAEGE = ['12:00', '18:00', '20:00', '21:00'];

const KALENDER_NAME = 'body-check-erinnerung.ics';

/** Der gemeinsame Rahmen, in den ein oder mehrere Termine kommen. */
function kalender(inhalt) {
  const zeilen = [
    'BEGIN:VCALENDAR',
    'VERSION:2.0',
    'PRODID:-//Body Check//Erinnerung//DE',
    'CALSCALE:GREGORIAN',
    'METHOD:PUBLISH',
    ...inhalt,
    'END:VCALENDAR',
  ];
  // CRLF ist im Format vorgeschrieben, und manche Kalender sind darin streng.
  return `${zeilen.map(falten).join('\r\n')}\r\n`;
}

/** Kopfzeilen, die jeder Termin braucht. */
function kopf(jetzt) {
  return [
    // Die Kennung ist aus Zufall und Zeit gebaut und sagt über niemanden etwas.
    `UID:bauchbuch-${Math.random().toString(36).slice(2, 10)}-${utcStempel(jetzt)}`,
    `DTSTAMP:${utcStempel(jetzt)}`,
  ];
}

const wecker = (titel) => [
  'BEGIN:VALARM',
  'ACTION:DISPLAY',
  'TRIGGER:PT0S',
  `DESCRIPTION:${schuetzen(titel)}`,
  'END:VALARM',
];

/**
 * Ein einzelner Termin an einem bestimmten Tag.
 *
 * Für alles, worauf die App wartet und was sie nicht selbst anstoßen kann: die
 * nächste Stufe im Stufenplan, der nächste Durchgang beim Provokationstest.
 * Beides sind Termine in ein paar Tagen, und beides scheitert im Alltag an
 * derselben Stelle – man vergisst es. Die App kann nicht klingeln, der
 * Kalender schon.
 *
 * Wichtig ist die Trennung zur täglichen Erinnerung: Das hier wiederholt sich
 * *nicht*. Ein Termin, der nach dem Durchgang weiter jeden Tag klingelt, wird
 * gelöscht, und mit ihm meistens der tägliche gleich mit.
 *
 * @param {{am: string, uhr?: string, titel: string, text?: string}} was
 */
function terminEintrag(was, jetzt = new Date()) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(was.am || ''));
  if (!m) return null;
  const u = /^(\d{1,2}):(\d{2})$/.exec(String(was.uhr || '')) || ['', '09', '00'];
  const stunde = Math.max(0, Math.min(23, Number(u[1])));
  const minute = Math.max(0, Math.min(59, Number(u[2])));

  return kalender([
    'BEGIN:VEVENT',
    ...kopf(jetzt),
    `DTSTART:${m[1]}${m[2]}${m[3]}T${zwei(stunde)}${zwei(minute)}00`,
    'DURATION:PT15M',
    `SUMMARY:${schuetzen(was.titel)}`,
    ...(was.text ? [`DESCRIPTION:${schuetzen(was.text)}`] : []),
    'TRANSP:TRANSPARENT',
    ...wecker(was.titel),
    'END:VEVENT',
  ]);
}

/**
 * Der Termineintrag als Text.
 *
 * Bewusst *ohne* Zeitzone: DTSTART steht als „lokale Zeit ohne Angabe" da
 * (Form 1 nach RFC 5545). Der Termin ist damit um 20 Uhr dort, wo das Telefon
 * gerade steht – und bleibt es auch auf Reisen. Mit einer festen Zeitzone würde
 * die Erinnerung im Urlaub mitten in der Nacht klingeln, und eine vollständige
 * VTIMEZONE-Angabe wäre für einen täglichen Wecker um 20 Uhr eine Menge
 * Zeremonie für nichts.
 *
 * @param {string} uhr    'HH:MM'
 * @param {Date} [jetzt]  für den Test einsetzbar
 */
function erinnerungsTermin(uhr, jetzt = new Date()) {
  const m = /^(\d{1,2}):(\d{2})$/.exec(String(uhr || '')) || ['', '20', '00'];
  const stunde = Math.max(0, Math.min(23, Number(m[1])));
  const minute = Math.max(0, Math.min(59, Number(m[2])));

  /*
   * Beginn ist heute. Liegt die Uhrzeit schon in der Vergangenheit, wäre der
   * erste Termin vorbei, bevor er angelegt ist – dann fängt die Reihe morgen
   * an. Sonst hätte jemand, der das um 22 Uhr einrichtet, den Eindruck, es
   * funktioniere nicht.
   */
  const start = new Date(jetzt);
  start.setHours(stunde, minute, 0, 0);
  if (start <= jetzt) start.setDate(start.getDate() + 1);

  const lokal = `${start.getFullYear()}${zwei(start.getMonth() + 1)}${zwei(start.getDate())}`
    + `T${zwei(stunde)}${zwei(minute)}00`;

  return kalender([
    'BEGIN:VEVENT',
    ...kopf(jetzt),
    `DTSTART:${lokal}`,
    'DURATION:PT10M',
    'RRULE:FREQ=DAILY',
    `SUMMARY:${schuetzen('Body Check: Tag eintragen')}`,
    `DESCRIPTION:${schuetzen(
      'Zwei Minuten: Was gegessen, wie es dem Bauch ging, Stuhlgang. '
      + 'Auch ein Tag ohne Beschwerden gehört hinein – ein Tag ohne Eintragung '
      + 'ist etwas anderes als ein Tag ohne Beschwerden, und nur der '
      + 'eingetragene zählt in der Auswertung mit.',
    )}`,
    'TRANSP:TRANSPARENT',
    ...wecker('Body Check: Tag eintragen'),
    'END:VEVENT',
  ]);
}

/* ===== js/wach.js ===== */
/*
 * Den Bildschirm wach halten, solange die Atemübung läuft
 *
 * DAS EIGENTLICHE PROBLEM
 *
 * Die Übung führt jemand mit geschlossenen Augen durch, das Telefon liegt
 * daneben. Nach zwanzig, dreißig Sekunden schaltet der Bildschirm ab – und
 * damit friert das Betriebssystem die Zeitgeber dieser Seite ein. Der nächste
 * Ton kommt zu spät oder gar nicht, und die Übung, die gerade beim Ausatmen
 * war, steht still. Genau in dem Moment, in dem sie am ehesten wirkt.
 *
 * Der erste Gedanke war, den Phasenwechsel als Benachrichtigung zu schicken.
 * Das löst es nicht, sondern beschreibt es nur aus einer anderen Richtung: Eine
 * Benachrichtigung, die aus einem eingefrorenen Zeitgeber kommt, kommt genauso
 * spät. Die Frage ist nicht, wie die Nachricht herauskommt, sondern wie die Uhr
 * weiterläuft.
 *
 * DIE ANTWORT
 *
 * `navigator.wakeLock` – eine Bitte an das Betriebssystem, den Bildschirm
 * anzulassen. Damit läuft alles weiter: der Kreis, der Ton, die Zeitrechnung.
 * Man kann das Telefon weglegen und die Augen zumachen, und genau darum ging es.
 *
 * DREI DINGE, DIE MAN DABEI FALSCH MACHEN KANN
 *
 *   1. Sie nicht wieder loslassen. Eine Sperre, die nach der Übung stehen
 *      bleibt, hält den Bildschirm für immer an und leert den Akku. Sie wird
 *      deshalb an *jedem* Ende der Übung gelöst – auch beim Abbrechen.
 *   2. Vergessen, dass das Betriebssystem sie von sich aus wegnimmt. Sobald
 *      die Seite in den Hintergrund geht, ist die Sperre weg und kommt nicht
 *      von allein zurück; wer beim Zurückkehren nicht neu bittet, hat sie
 *      still verloren.
 *   3. Sich darauf verlassen. Es ist eine Bitte, keine Garantie: bei niedrigem
 *      Akku, im Stromsparmodus oder in einem Browser ohne diese Schnittstelle
 *      wird sie abgelehnt. Deshalb gibt jede Funktion hier zurück, ob es
 *      geklappt hat, und die Anzeige sagt es weiter – statt zu versprechen,
 *      was sie nicht halten kann.
 */

let sperre = null;

/**
 * Den Bildschirm anlassen. Gibt zurück, ob es geklappt hat.
 *
 * Muss aus einer Nutzergeste heraus aufgerufen werden – „Anfangen" ist diese
 * Geste.
 */
export async function wachHalten() {
  if (sperre) return true;
  try {
    if (!navigator.wakeLock || !navigator.wakeLock.request) return false;
    sperre = await navigator.wakeLock.request('screen');
    // Das Betriebssystem kann jederzeit loslassen. Dann darf hier keine
    // Leiche stehen bleiben, sonst hält sich die App für wach und ist es nicht.
    sperre.addEventListener('release', () => { sperre = null; });
    return true;
  } catch {
    sperre = null;
    return false;
  }
}

/** Wieder loslassen. Ohne das bleibt der Bildschirm an, bis der Akku leer ist. */
export async function wachLoslassen() {
  const s = sperre;
  sperre = null;
  if (!s) return;
  try {
    await s.release();
  } catch { /* schon weg – dann ist ja gut */ }
}

/** Ob die Sperre gerade steht. */
function istWach() {
  return !!sperre;
}

/* ===== js/lage.js ===== */
/*
 * Was Sache ist – drei bis fünf Sätze, ganz oben
 *
 * DAS PROBLEM
 *
 * Der Reiter „Muster" zeigt inzwischen zehn Karten, der Arztbericht zwölf
 * Abschnitte. Alles darin ist geprüft, mit Fallzahlen versehen und ehrlich
 * gerechnet – und trotzdem ist die Frage unbeantwortet, mit der jemand die App
 * überhaupt aufmacht: *Was ist jetzt eigentlich los?*
 *
 * Wer Beschwerden hat, liest keine zehn Karten. Wer sie in der Sprechstunde
 * vorzeigt, hat dafür keine zehn Minuten. Eine Auswertung, die man erst
 * zusammensetzen muss, ist für den, der sie am nötigsten braucht, keine.
 *
 * WAS HIER PASSIERT – UND VOR ALLEM, WAS NICHT
 *
 * Diese Datei rechnet **nichts**. Sie bekommt die fertigen Befunde der anderen
 * Module gereicht und tut genau zwei Dinge: auswählen und in einen Satz
 * bringen. Das ist Absicht. Jede Schwelle, die hier stünde, wäre eine
 * Schwelle, die zweimal existiert und irgendwann auseinanderläuft – und dann
 * stünde oben etwas anderes als unten, im selben Bild.
 *
 * Daraus folgt die Regel, an der sich alles hier messen lässt: **Es steht
 * nichts oben, was nicht unten mit seinen Zahlen steht.** Wer einen Satz hier
 * nicht wiederfindet, hat einen Fehler gefunden.
 *
 * DIE REIHENFOLGE IST DIE AUSSAGE
 *
 * Warnzeichen zuerst, immer, auch wenn sonst alles gut aussieht. Dann die
 * Richtung, weil sie die Frage beantwortet, die sich jeder zuerst stellt. Dann
 * der stärkste Befund, der die Störfaktorenprüfung überstanden hat – nicht der
 * stärkste überhaupt. Und zum Schluss, was fehlt.
 *
 * Fünf Sätze sind das Höchste. Der sechste würde nicht gelesen, und ein Satz,
 * der nicht gelesen wird, verdrängt einen, der gelesen worden wäre.
 */

/** Mehr als das liest niemand, und mehr braucht auch niemand. */
const HOECHSTENS = 5;

/**
 * Aus den fertigen Befunden ein paar Sätze machen.
 *
 * Alle Angaben sind freiwillig; was fehlt, wird übersprungen. Genau deshalb
 * kann diese Funktion auch nichts kaputt machen: Sie erfindet keinen Befund,
 * sie wählt unter den vorhandenen.
 *
 * @param {object} q
 * @param {object[]} [q.warnungen]  aus bildLesen(): { name, dringlichkeit }
 * @param {object} [q.trend]        aus trend(): { pruefbar, richtung, ... }
 * @param {object[]} [q.funde]      { name, differenz, faelle, gegenFaelle, urteil,
 *                                  menge, mengeSatz } – urteil ist das der
 *                                  Schichtung, menge das der Dosisrechnung
 * @param {object[]} [q.spaet]      { name, fensterName, ort }
 * @param {object[]} [q.wechsel]    { name, phase }
 * @param {object} [q.zeit]         aus zeitBild()
 * @param {object[]} [q.mittel]     { name, urteil, satz }
 * @param {object} [q.versuch]      { was, wort }
 * @param {object} [q.gewicht]      aus gewichtsBild(): { warnung, satz }
 * @param {object} [q.luecke]       { satz }
 * @param {number} [q.notierteTage]
 */
function wasSacheIst(q = {}) {
  const saetze = [];
  const sag = (art, text) => saetze.push({ art, text });

  /*
   * 1. Warnzeichen. Immer, und immer zuerst.
   *
   * Sie sind der einzige Teil dieser App, bei dem ein übersehener Befund
   * teurer ist als ein überflüssiger Hinweis.
   */
  const warn = q.warnungen || [];
  if (warn.length) {
    const sofort = warn.filter((w) => w.dringlichkeit === 'sofort');
    const liste = warn.slice(0, 3).map((w) => w.name.toLowerCase()).join(', ');
    sag('warnung', sofort.length
      ? `Im Tagebuch stehen Dinge, die ärztlich abgeklärt gehören, und zwar `
        + `bald: ${liste}. Das ist keine Diagnose, sondern der Grund, einen `
        + 'Termin zu machen.'
      : `Im Tagebuch stehen Dinge, die ärztlich abgeklärt gehören – beim `
        + `nächsten Termin anzusprechen: ${liste}.`);
  }

  /*
   * 1b. Die Waage – direkt hinter den Warnzeichen, weil sie eines ist.
   *
   * Sie steht vor der Richtung und vor jedem Auslöser, und zwar aus einem
   * Grund: Ein ungewollter Gewichtsverlust ist das stärkste einzelne Zeichen
   * dafür, dass hinter Bauchbeschwerden mehr steckt als eine gereizte
   * Verdauung. Welche Zutat auffällt, ist daneben zweitrangig.
   */
  if (q.gewicht && q.gewicht.warnung) {
    sag('warnung', q.gewicht.satz);
  }

  /*
   * 2. Wird es besser oder schlechter?
   *
   * Die Frage, die sich jeder zuerst stellt und die aus dem Kopf niemand
   * beantwortet – „mal so, mal so" ist die ehrliche und die nutzloseste
   * Antwort.
   */
  const t = q.trend;
  if (t && t.pruefbar) {
    const wort = {
      besser: 'Zuletzt wurde es besser',
      schlechter: 'Zuletzt wurde es schlechter',
      gleich: 'Zuletzt hat sich nichts Deutliches geändert',
    }[t.richtung] || 'Zuletzt hat sich nichts Deutliches geändert';
    sag('trend', `${wort}: ${t.jetzt.schnitt.toFixed(1)} im Mittel über die `
      + `letzten ${t.jetzt.tage} notierten Tage gegen ${t.davor.schnitt.toFixed(1)} `
      + `über die ${t.davor.tage} davor.`);
  }

  /*
   * 3. Der stärkste Befund, der die Prüfung überstanden hat.
   *
   * „Überstanden" heißt: Er ist auch dann noch da, wenn man nur Tage mit
   * gleicher Anspannung, gleichem Schlaf und gleicher Zyklusphase miteinander
   * vergleicht. Ein Fund, der das nicht übersteht, gehört nicht in den ersten
   * Absatz – und er steht unten trotzdem, mit seinem Grund.
   */
  const haltbar = (q.funde || []).filter((f) => f.urteil === 'haelt' || f.urteil === 'unklar');
  const bester = haltbar.sort((a, b) => b.differenz - a.differenz)[0];
  if (bester) {
    const gehalten = bester.urteil === 'haelt'
      ? ' Der Unterschied bleibt auch bestehen, wenn man nur Tage mit gleicher '
        + 'Anspannung, gleichem Schlaf und gleicher Zyklusphase vergleicht.'
      : ' Ob das an den Umständen liegt, ließ sich noch nicht prüfen.';
    /*
     * Und wenn es eine Menge gibt, gehört sie in denselben Satz.
     *
     * „Zwiebeln fallen auf" führt zum Streichen; „Zwiebeln fallen als
     * Hauptzutat auf, als Würze nicht" führt zu einer Faustregel, die jemand
     * auch in vier Wochen noch einhält. Der Zusatz ist deshalb keine
     * Verfeinerung, sondern der Unterschied zwischen einer brauchbaren und
     * einer schädlichen Auskunft.
     */
    const menge = bester.menge === 'schwelle'
      ? ` Es kommt dabei auf die Menge an: ${bester.mengeSatz}`
      : (bester.menge === 'ab-hier'
        ? ' Ob kleinere Mengen davon durchgehen, ist noch nicht geprüft – ganz '
          + 'weglassen wäre womöglich mehr als nötig.'
        : '');
    sag('fund', `Am deutlichsten fällt ${bester.name} auf: danach war es im `
      + `Mittel um ${bester.differenz.toFixed(1)} Stufen schlechter `
      + `(${bester.faelle} Mahlzeiten damit, ${bester.gegenFaelle} ohne).${gehalten}${menge}`);
  }

  /*
   * 4. Was der Schnitt versteckt.
   *
   * Zwei Befunde, die es nur gibt, weil jemand genauer hingesehen hat – und
   * die deshalb auch oben stehen dürfen: der Auslöser, der erst nach dem
   * Fenster wirkt, und der, dessen Wirkung mit dem Zyklus wechselt.
   */
  const w = (q.wechsel || [])[0];
  if (w) {
    sag('wechsel', `${w.name} wirkt nicht immer gleich, sondern vor allem in `
      + `der Phase „${w.phase}". Dieselbe Menge, andere Wirkung – das spricht `
      + 'eher für eine wechselnde Empfindlichkeit als für eine Unverträglichkeit.');
  }
  const sp = (q.spaet || [])[0];
  if (sp && saetze.length < HOECHSTENS) {
    sag('spaet', `${sp.name} fällt im üblichen Zeitfenster nicht auf, wohl aber `
      + `${sp.fensterName.toLowerCase()} – so spät entsteht Beschwerde im `
      + `${sp.ort}, nicht im Magen.`);
  }

  /*
   * 5. Wann es überhaupt kommt.
   *
   * Nur, wenn ein Schwerpunkt da ist. „Verteilt sich" ist unten eine
   * brauchbare Zeile und oben eine verschenkte.
   */
  if (q.zeit && q.zeit.pruefbar && q.zeit.schwerpunkt && saetze.length < HOECHSTENS) {
    const teil = q.zeit.teile.find((x) => x.id === q.zeit.schwerpunkt);
    sag('zeit', `Die meisten Beschwerden kommen ${teil.name.toLowerCase()} – das `
      + `deutet auf ${teil.ort} als Ort.`);
  }

  /*
   * 6. Ob die Mittel etwas bewirken.
   *
   * Das Ausbleiben einer Wirkung ist hier der wertvollere Befund: Ein
   * Säureblocker, der nach Wochen nichts tut, spricht gegen die Säure als
   * Ursache – und niemand rechnet das im Kopf nach.
   */
  const ohneWirkung = (q.mittel || []).find((m) => m.urteil === 'unveraendert');
  if (ohneWirkung && saetze.length < HOECHSTENS) {
    sag('mittel', `${ohneWirkung.name} hat in dieser Zeit nichts geändert. Das `
      + 'ist selbst ein Befund und gehört in die Sprechstunde – nicht als Grund, '
      + 'etwas abzusetzen, sondern als Frage.');
  }

  /*
   * 7. Und was fehlt.
   *
   * Der letzte Satz gehört dem, was noch nicht beantwortbar ist. Ohne ihn
   * liest sich der Absatz vollständiger, als er ist.
   */
  if (q.luecke && q.luecke.satz && saetze.length < HOECHSTENS) {
    sag('luecke', q.luecke.satz);
  }

  /*
   * Und wenn gar nichts zusammenkam.
   *
   * Dann steht hier kein beruhigender Satz. „Alles unauffällig" wäre die
   * bequemste Lüge dieser App: Was nicht erhoben wurde, ist nicht unauffällig,
   * sondern nicht erhoben.
   *
   * Gezählt wird dabei nur, was wirklich eine Auskunft ist. Der Hinweis, was
   * noch fehlt, ist keine – er sagt gerade, dass etwas fehlt. Stünde er
   * alleine da, läse sich die Karte wie eine Antwort, wo keine ist.
   */
  const auskunft = saetze.filter((x) => x.art !== 'luecke');
  if (!auskunft.length) {
    return {
      genug: false,
      saetze: [{
        art: 'wenig',
        text: q.notierteTage
          ? `Aus ${q.notierteTage} notierten Tagen lässt sich noch nichts `
            + 'Belastbares sagen. Das heißt nicht, dass nichts da ist – es heißt, '
            + 'dass die Zahlen dafür noch nicht reichen.'
          : 'Noch ist nichts eingetragen. Sobald ein paar Tage beisammen sind, '
            + 'steht hier, was sich daraus ergibt.',
      // Der Hinweis, was am meisten hülfe, darf bleiben – er ist dann der
      // einzige nützliche Satz, den es zu sagen gibt.
      }, ...saetze],
    };
  }

  return { genug: true, saetze: saetze.slice(0, HOECHSTENS) };
}

/* ===== js/unterleib.js ===== */
/*
 * Der Unterleib – und warum ein Magentagebuch danach fragt.
 *
 * Endometriose wird im Mittel sieben bis zehn Jahre lang nicht erkannt, und
 * die häufigste Fehldeutung auf diesem Weg ist „Reizdarm". Das ist kein
 * Zufall: Endometrioseherde am Darm oder im Douglasraum machen Blähungen,
 * Krämpfe, Durchfall und Verstopfung – dieselben Beschwerden, die dieses
 * Tagebuch ohnehin zählt, nur mit einer anderen Ursache.
 *
 * Was die beiden auseinanderhält, steht in Daten, die eine Magensprechstunde
 * nicht erhebt:
 *
 *   * **Zyklusbindung.** Reizdarmbeschwerden schwanken auch, aber nicht
 *     verlässlich mit der Blutung. Endometriose tut das.
 *   * **Tiefer Schmerz beim Sex.** Das ist das Merkmal mit dem größten
 *     Gewicht und zugleich das, nach dem am seltensten gefragt wird. Schmerz
 *     am Eingang deutet woanders hin (Beckenboden, Trockenheit, Vaginismus) –
 *     deshalb wird hier getrennt gezählt.
 *   * **Starker Regelschmerz**, der Schmerzmittel oder Fehltage erzwingt.
 *   * **Darmbeschwerden, die zur Blutung hin schlimmer werden**, oft mit
 *     schmerzhaftem Stuhlgang während der Periode.
 *
 * WAS DIESES MODUL NICHT TUT: eine Diagnose stellen. Endometriose wird
 * bildgebend und letztlich durch eine Bauchspiegelung festgestellt, nie durch
 * ein Tagebuch. Was hier herauskommt, ist ein Satz für die Sprechstunde – und
 * der ist trotzdem viel wert, weil er eine Frage auslöst, die sonst über Jahre
 * nicht gestellt wird.
 *
 * UND ES SCHWEIGT LIEBER. Alle vier Merkmale sind nur zu haben, wenn jemand
 * die Fragen dazu eingeschaltet und ein paar Wochen ausgefüllt hat. Fehlen
 * sie, steht hier nicht „unauffällig", sondern „nicht prüfbar" – der
 * Unterschied ist der ganze Punkt. Ein „unauffällig" auf leerer Grundlage
 * hätte genau die Wirkung, die es hier zu vermeiden gilt: dass niemand mehr
 * nachfragt.
 */

/** Ab wie vielen Tagen mit einer Angabe ein Merkmal überhaupt zählt. */
const GENUG_TAGE = 8;

/** Ab wie vielen Gelegenheiten mit Sex die Schmerzfrage etwas hergibt. */
const GENUG_SEX = 4;

/** Ab wie vielen Blutungstagen sich der Regelschmerz beurteilen lässt. */
const GENUG_BLUTUNG = 6;

const zahl = (x) => (Number.isFinite(x) ? x : null);

/**
 * Die vier Merkmale, jedes mit seiner eigenen Prüfbarkeit.
 *
 * @param {object[]} eintraege
 * @param {object} tage       der Tagesspeicher
 * @param {function} tagesWert (eintraege, iso, tage) -> { notiert, wert }
 */
function unterleibsBild(eintraege, tage, tagesWert) {
  /*
   * Jeder Tag, der im Tagesspeicher steht – leere Tage legt der Speicher
   * nicht an. Bis eben stand hier `t.notiert`; das Feld setzt die App aber
   * nirgends, es stand nur in den Testvorlagen. Damit war diese ganze
   * Rechnung in Wirklichkeit leer: kein Tag kam durch, nichts war prüfbar,
   * und der Test blieb grün, weil seine Tage das Feld hatten.
   */
  const alle = Object.entries(tage || {}).filter(([, t]) => t && typeof t === 'object');

  /* ---------- 1. Schmerz beim Sex ---------- */

  // Gezählt werden nur Tage, an denen es Sex gab – sonst sagt „kein Schmerz"
  // nichts aus. Das ist der Unterschied zwischen „tut nicht weh" und
  // „kam nicht vor".
  const mitSex = alle.filter(([, t]) => zahl(t.sex) > 0);
  const mitAngabe = mitSex.filter(([, t]) => zahl(t.sexschmerz) !== null);
  const schmerzhaft = mitAngabe.filter(([, t]) => zahl(t.sexschmerz) > 0);
  const tief = mitAngabe.filter(([, t]) => zahl(t.sextief) > 0);

  const sexSchmerz = {
    pruefbar: mitAngabe.length >= GENUG_SEX,
    gelegenheiten: mitAngabe.length,
    mitSchmerz: schmerzhaft.length,
    tief: tief.length,
    anteil: mitAngabe.length ? schmerzhaft.length / mitAngabe.length : 0,
    // Der stärkste einzelne Hinweis: tiefer Schmerz, mehrfach.
    tiefWiederholt: tief.length >= 2,
    fehlt: Math.max(0, GENUG_SEX - mitAngabe.length),
  };

  /* ---------- 2. Regelschmerz ---------- */

  const blutungsTage = alle.filter(([, t]) => zahl(t.blutung) > 0);
  const mitRegelAngabe = blutungsTage.filter(([, t]) => zahl(t.regelschmerz) !== null);
  const starkeTage = mitRegelAngabe.filter(([, t]) => zahl(t.regelschmerz) >= 3);

  const regel = {
    pruefbar: mitRegelAngabe.length >= GENUG_BLUTUNG,
    blutungsTage: mitRegelAngabe.length,
    starkeTage: starkeTage.length,
    anteilStark: mitRegelAngabe.length ? starkeTage.length / mitRegelAngabe.length : 0,
    // „Stark" heißt hier: mindestens die Hälfte der Blutungstage deutlich.
    auffaellig: mitRegelAngabe.length >= GENUG_BLUTUNG
      && starkeTage.length / mitRegelAngabe.length >= 0.5,
    fehlt: Math.max(0, GENUG_BLUTUNG - mitRegelAngabe.length),
  };

  /* ---------- 3. Beschwerden zur Blutung hin ---------- */

  /*
   * Verglichen wird der Bauch an Blutungstagen gegen den Bauch an allen
   * übrigen notierten Tagen. Gegen null zu vergleichen wäre sinnlos – fast
   * jeder hat irgendwann Beschwerden; interessant ist der Abstand zum eigenen
   * Alltag.
   */
  const wertVon = ([iso]) => tagesWert(eintraege, iso, tage).wert;
  const beiBlutung = blutungsTage.map(wertVon);
  const sonst = alle.filter(([, t]) => !(zahl(t.blutung) > 0)).map(wertVon);
  const schnitt = (a) => (a.length ? a.reduce((x, y) => x + y, 0) / a.length : 0);

  const zyklisch = {
    pruefbar: beiBlutung.length >= GENUG_TAGE && sonst.length >= GENUG_TAGE,
    blutungsTage: beiBlutung.length,
    andereTage: sonst.length,
    beiBlutung: schnitt(beiBlutung),
    sonst: schnitt(sonst),
    differenz: schnitt(beiBlutung) - schnitt(sonst),
    // Eine ganze Stufe Unterschied, dieselbe Schwelle wie beim Verlauf.
    auffaellig: beiBlutung.length >= GENUG_TAGE && sonst.length >= GENUG_TAGE
      && schnitt(beiBlutung) - schnitt(sonst) >= 1,
    fehlt: Math.max(0, GENUG_TAGE - Math.min(beiBlutung.length, sonst.length)),
  };

  /* ---------- 4. Schmerzhafter Stuhlgang während der Blutung ---------- */

  const blutungsSet = new Set(blutungsTage.map(([iso]) => iso));
  const stuhl = eintraege.filter((e) => e.art === 'stuhl');
  const stuhlBeiBlutung = stuhl.filter((e) => blutungsSet.has(e.am));
  const schmerzhaftBeiBlutung = stuhlBeiBlutung.filter((e) => e.schmerz || e.dringend);

  const stuhlgang = {
    pruefbar: stuhlBeiBlutung.length >= 3,
    waehrendBlutung: stuhlBeiBlutung.length,
    davonSchwer: schmerzhaftBeiBlutung.length,
  };

  /* ---------- Zusammengesetzt ---------- */

  /*
   * Wie viele der Merkmale sprechen dafür – und wie viele ließen sich
   * überhaupt prüfen. Das zweite ist genauso wichtig: „eins von vier" heißt
   * etwas ganz anderes als „eins von vier, drei nicht prüfbar".
   */
  const merkmale = [
    {
      id: 'sextief',
      name: 'Tiefer Schmerz beim Sex',
      gewicht: 2,
      pruefbar: sexSchmerz.pruefbar,
      erfuellt: sexSchmerz.pruefbar && sexSchmerz.tiefWiederholt,
      text: sexSchmerz.pruefbar
        ? `${sexSchmerz.tief} von ${sexSchmerz.gelegenheiten} Malen mit tiefem Schmerz`
        : `noch ${sexSchmerz.fehlt} Angaben nötig`,
    },
    {
      id: 'regelschmerz',
      name: 'Starker Regelschmerz',
      gewicht: 1,
      pruefbar: regel.pruefbar,
      erfuellt: regel.auffaellig,
      text: regel.pruefbar
        ? `an ${regel.starkeTage} von ${regel.blutungsTage} Blutungstagen stark`
        : `noch ${regel.fehlt} Blutungstage mit Angabe nötig`,
    },
    {
      id: 'zyklisch',
      name: 'Bauch schlechter zur Blutung hin',
      gewicht: 1,
      pruefbar: zyklisch.pruefbar,
      erfuellt: zyklisch.auffaellig,
      text: zyklisch.pruefbar
        ? `${zyklisch.beiBlutung.toFixed(1).replace('.', ',')} gegen `
          + `${zyklisch.sonst.toFixed(1).replace('.', ',')} an anderen Tagen`
        : `noch ${zyklisch.fehlt} Tage nötig`,
    },
    {
      id: 'stuhlgang',
      name: 'Stuhlgang während der Blutung schwer',
      gewicht: 1,
      pruefbar: stuhlgang.pruefbar,
      erfuellt: stuhlgang.pruefbar && stuhlgang.davonSchwer >= 2,
      text: stuhlgang.pruefbar
        ? `${stuhlgang.davonSchwer} von ${stuhlgang.waehrendBlutung} Mal`
        : 'zu wenige Einträge während der Blutung',
    },
  ];

  const pruefbare = merkmale.filter((m) => m.pruefbar);
  const erfuellte = merkmale.filter((m) => m.erfuellt);
  const punkte = erfuellte.reduce((s, m) => s + m.gewicht, 0);

  /*
   * Wann ein Satz in den Bericht gehört – und warum die Schwelle nicht
   * niedriger sein darf, als sie beim ersten Entwurf war.
   *
   * Erst hieß die Regel „zwei Punkte genügen". Die Prüfung hat gezeigt, was
   * das bedeutet: Schmerzhafte Perioden und ein Bauch, der zur Blutung hin
   * schlechter wird, sind zusammen bei sehr vielen Menschen der Normalzustand.
   * Eine App, die daraufhin bei jeder Zweiten Endometriose in den Raum stellt,
   * schickt Leute in Sprechstunden, in denen nichts gefunden wird – und beim
   * nächsten Mal, wenn es wirklich etwas wäre, glaubt ihr niemand mehr.
   *
   * Deshalb zwei Wege statt eines Schwellwerts:
   *
   *   * Tiefer Schmerz beim Sex, wiederholt. Das ist das Merkmal mit der
   *     eigenen Aussagekraft und trägt allein.
   *   * Oder ALLE drei übrigen zusammen. Einzeln sind sie alltäglich, zu
   *     dritt sind sie es nicht mehr.
   */
  const ansprechen = (sexSchmerz.pruefbar && sexSchmerz.tiefWiederholt) || punkte >= 3;

  /*
   * Wurden die Fragen, um die es hier geht, überhaupt beantwortet?
   *
   * Ohne sie bleiben nur Blutung und Stuhlgang – und dafür gibt es bereits das
   * Zyklusmuster, das Endometriose ohnehin als Möglichkeit nennt. Ein zweites,
   * fast gleiches Muster daneben wäre keine zusätzliche Auskunft, sondern
   * doppelte Lautstärke bei gleichem Inhalt.
   */
  const neueFragen = sexSchmerz.pruefbar || regel.pruefbar;

  return {
    sexSchmerz,
    regel,
    zyklisch,
    stuhlgang,
    merkmale,
    punkte,
    pruefbare: pruefbare.length,
    erfuellte: erfuellte.length,
    ansprechen,
    neueFragen,
    /*
     * Ob überhaupt jemand die Fragen eingeschaltet hat. Ohne diese
     * Unterscheidung sähe „keine Merkmale" wie Entwarnung aus, obwohl gar
     * nichts erhoben wurde.
     */
    erhoben: pruefbare.length > 0,
  };
}

/**
 * Lohnt es sich, die Fragen überhaupt vorzuschlagen?
 *
 * Nur wenn das Tagebuch schon von sich aus in diese Richtung zeigt: Blutungen
 * eingetragen und der Bauch dabei auffällig schlechter. Dann – und nur dann –
 * ist der Hinweis eine Hilfe und keine Zudringlichkeit.
 */
function fragenVorschlagen(eintraege, tage, tagesWert, tagesfragen) {
  const schon = Array.isArray(tagesfragen) ? tagesfragen : [];
  if (schon.includes('sexschmerz') && schon.includes('regelschmerz')) return null;

  const bild = unterleibsBild(eintraege, tage, tagesWert);
  if (!bild.zyklisch.pruefbar || !bild.zyklisch.auffaellig) return null;

  return {
    differenz: bild.zyklisch.differenz,
    blutungsTage: bild.zyklisch.blutungsTage,
    fehlende: ['sexschmerz', 'sextief', 'regelschmerz'].filter((f) => !schon.includes(f)),
  };
}

 *

 * Refluxkrankheit, funktionelle Dyspepsie und ein Reizdarm machen im Tagebuch

 */

function warnzeichenVon(id) {

}

/**
 * Welche Warnzeichen im Tagebuch stehen – mit Datum und Häufigkeit.
 *
 * Ohne Zeitgrenze und ohne Schwelle: Ein einziges Mal Blut erbrochen ist ein
 * einziges Mal zu viel, und ein Eintrag von vor drei Monaten, der nie
 * abgeklärt wurde, ist keine alte Nachricht.
 *
 * Gesucht wird in *allen* Eintragungen, nicht nur in den Beschwerden. Seit es
 * den Stuhlgang als eigene Art gibt, stehen die zwei wichtigsten Warnzeichen
 * überhaupt – schwarzer Stuhl und frisches Blut – genau dort. Sie nur im
 * Beschwerdebogen zu suchen, hieße sie da zu suchen, wo sie nicht sind.
 */
function warnungen(eintraege) {
  const zaehler = new Map();
  eintraege.filter((e) => Array.isArray(e.warnzeichen)).forEach((e) => {
    (e.warnzeichen || []).forEach((id) => {
      const w = WARN_MAP[id];
      if (!w) return;
      const v = zaehler.get(id) || { ...w, anzahl: 0, zuerst: e.am, zuletzt: e.am };
      v.anzahl += 1;
      if (e.am < v.zuerst) v.zuerst = e.am;
      if (e.am > v.zuletzt) v.zuletzt = e.am;
      zaehler.set(id, v);
    });
  });
  // Das Dringende zuerst, sonst nach Häufigkeit.
  const rang = { sofort: 0, zeitnah: 1 };
  return [...zaehler.values()]
    .sort((a, b) => (rang[a.dringlichkeit] - rang[b.dringlichkeit]) || (b.anzahl - a.anzahl));
}

/*

 * 2. Die Muster
 * ---------------------------------------------------------------------------
 *
 * Jedes Muster prüft ein paar Bedingungen an den eigenen Daten. Jede erfüllte
 * Bedingung bringt Punkte *und* einen Beleg im Klartext – ein Punktestand ohne
 * Begründung wäre ein Orakel. Angezeigt wird nur, was mindestens zwei Belege
 * hat: Ein einzelner Treffer ist noch kein Bild.
 */

const SAEURE_ARTEN = ['brennen', 'sodbrennen', 'aufstossen'];
const FUELLE_ARTEN = ['druck', 'uebelkeit', 'appetit'];
const DARM_ARTEN = ['blaehung', 'krampf'];

const pz = (x) => `${Math.round(x * 100)} %`;

function musterSaeure(d) {
  const belege = [];
  let punkte = 0;
  const a = artAnteil(d.eintraege, SAEURE_ARTEN);
  if (a.gesamt >= 5 && a.anteil >= 0.5) {
    punkte += 2;
    belege.push(`In ${a.anzahl} von ${a.gesamt} Eintragungen ging es um Brennen, `
      + `Sodbrennen oder Aufstoßen (${pz(a.anteil)}).`);
  }
  const nacht = d.zeiten.find((z) => z.id === 'nacht');
  const abend = d.zeiten.find((z) => z.id === 'abend');
  const spaet = (nacht ? nacht.anzahl : 0) + (abend ? abend.anzahl : 0);
  const gesamtZeiten = d.zeiten.reduce((s, z) => s + z.anzahl, 0);
  if (gesamtZeiten >= 5 && spaet / gesamtZeiten >= 0.4) {
    punkte += 1;
    belege.push(`${spaet} von ${gesamtZeiten} Beschwerden traten abends oder nachts auf.`);
  }
  const spaetEssen = d.bilanz.find((b) => b.id === 'spaet');
  if (spaetEssen && spaetEssen.genug && spaetEssen.differenz >= 1) {
    punkte += 1;
    belege.push('Nach spätem Essen war es im Mittel deutlich schlechter als sonst.');
  }
  return { punkte, belege };
}

function musterFuelle(d) {
  const belege = [];
  let punkte = 0;
  const a = artAnteil(d.eintraege, FUELLE_ARTEN);
  if (a.gesamt >= 5 && a.anteil >= 0.5) {
    punkte += 2;
    belege.push(`In ${a.anzahl} von ${a.gesamt} Eintragungen ging es um Völlegefühl, `
      + `Übelkeit oder fehlenden Appetit (${pz(a.anteil)}).`);
  }
  if (d.essen.bewertbar >= 8 && d.essen.anteilNachDemEssen >= 0.6) {
    punkte += 2;
    belege.push(`${d.essen.nachDemEssen} von ${d.essen.bewertbar} zuordenbaren `
      + `Beschwerden kamen innerhalb von zwei Stunden nach dem Essen.`);
  }
  const gross = d.bilanz.find((b) => b.id === 'gross');
  if (gross && gross.genug && gross.differenz >= 1) {
    punkte += 1;
    belege.push('Nach großen Portionen war es im Mittel schlechter als nach kleinen.');
  }
  return { punkte, belege };
}

function musterNuechtern(d) {
  const belege = [];
  let punkte = 0;
  if (d.essen.bewertbar >= 8 && d.essen.anteilNuechtern >= 0.5) {
    // Höher gewichtet als die anderen Muster, und das mit Absicht: „Brennen"
    // haben fast alle, aber *wann* es kommt, ist die spezifische Angabe. Sie
    // trennt den Nüchternschmerz vom Völlegefühl nach dem Essen – und das sind
    // zwei verschiedene Sprechstunden.
    punkte += 4;
    belege.push(`${d.essen.nuechtern} von ${d.essen.bewertbar} zuordenbaren `
      + `Beschwerden kamen erst vier Stunden oder länger nach der letzten Mahlzeit.`);
    // Die Gegenprobe gehört dazu: Dass es *nicht* nach dem Essen kommt, ist
    // hier der halbe Befund, und ohne ihn stünde die Aussage auf einem Bein.
    punkte += 1;
    belege.push(`Nur ${d.essen.nachDemEssen} davon kamen innerhalb von zwei `
      + `Stunden nach einer Mahlzeit.`);
  }
  const nacht = d.zeiten.find((z) => z.id === 'nacht');
  if (nacht && nacht.anzahl >= 3) {
    punkte += 1;
    belege.push(`${nacht.anzahl}-mal traten Beschwerden nachts auf.`);
  }
  return { punkte, belege };
}

function musterDarm(d) {
  const belege = [];
  let punkte = 0;
  const a = artAnteil(d.eintraege, DARM_ARTEN);
  if (a.gesamt >= 5 && a.anteil >= 0.4) {
    punkte += 2;
    belege.push(`In ${a.anzahl} von ${a.gesamt} Eintragungen ging es um Blähungen `
      + `oder Krämpfe (${pz(a.anteil)}).`);
  }
  ['huelsen', 'milch', 'rohkost', 'vollkorn'].forEach((id) => {
    const b = d.bilanz.find((x) => x.id === id);
    if (b && b.genug && b.differenz >= 1) {
      punkte += 1;
      belege.push(`Auffällig nach Mahlzeiten mit ${d.name(id)} `
        + `(${b.faelle} Mahlzeiten damit, ${b.gegenFaelle} ohne).`);
    }
  });
  return { punkte, belege };
}

function musterNsar(d) {
  const belege = [];
  let punkte = 0;
  if (d.nsarTage >= 3) {
    punkte += 3;
    belege.push(`An ${d.nsarTage} Tagen wurde ein entzündungshemmendes `
      + `Schmerzmittel eingetragen (Ibuprofen, Diclofenac, ASS oder ähnlich).`);
    if (d.nsarSchnitt > d.schnittGesamt + 0.5) {
      punkte += 1;
      belege.push(`An diesen Tagen lag die Beschwerdestärke bei `
        + `${d.nsarSchnitt.toFixed(1).replace('.', ',')} statt `
        + `${d.schnittGesamt.toFixed(1).replace('.', ',')}.`);
    }
  }
  return { punkte, belege };
}

function musterStress(d) {
  const belege = [];
  let punkte = 0;
  [['stress', 'Anspannung'], ['schlaf', 'schlechtem Schlaf'], ['stimmung', 'gedrückter Stimmung']]
    .forEach(([id, wort]) => {
      const f = d.faktoren[id];
      if (f && f.genug && f.differenz >= 1) {
        punkte += 2;
        belege.push(`An Tagen mit ${wort} lag die Beschwerdestärke bei `
          + `${f.hoch.schnitt.toFixed(1).replace('.', ',')} statt `
          + `${f.niedrig.schnitt.toFixed(1).replace('.', ',')} `
          + `(${f.hoch.tage} gegen ${f.niedrig.tage} Tage).`);
      }
    });
  return { punkte, belege };
}

function musterZyklus(d) {
  const belege = [];
  let punkte = 0;
  if (!d.zyklusBelastbar || d.phasen.length < 2) return { punkte, belege };
  const sortiert = [...d.phasen].sort((a, b) => b.schnitt - a.schnitt);
  const hoch = sortiert[0];
  const tief = sortiert[sortiert.length - 1];
  if (hoch.schnitt - tief.schnitt >= 1.5 && hoch.tage >= 4 && tief.tage >= 4) {
    punkte += 3;
    belege.push(`In der Phase „${hoch.name}" lag die Beschwerdestärke bei `
      + `${hoch.schnitt.toFixed(1).replace('.', ',')} (${hoch.tage} Tage), `
      + `in der Phase „${tief.name}" bei ${tief.schnitt.toFixed(1).replace('.', ',')} `
      + `(${tief.tage} Tage).`);
  }
  return { punkte, belege };
}

/*
 * Das Muster, wegen dem dieses Modul überhaupt nach dem Unterleib fragt.
 *
 * Endometriose wird im Mittel sieben bis zehn Jahre lang nicht erkannt, und
 * die häufigste Fehldeutung auf diesem Weg heißt „Reizdarm" – dieselben
 * Blähungen, Krämpfe und Stuhlveränderungen, nur mit anderer Ursache. Was die
 * beiden trennt, steht in Daten, die eine Magensprechstunde nicht erhebt.
 *
 * Deshalb wiegt der tiefe Schmerz beim Sex hier doppelt: Er ist das Merkmal
 * mit der größten Aussagekraft und zugleich das, nach dem am seltensten
 * gefragt wird.
 */
function musterUnterleib(d) {
  const belege = [];
  let punkte = 0;
  const u = d.unterleib;
  // Ohne die eigens dafür eingeschalteten Fragen gibt es hier nichts zu sagen,
  // was das Zyklusmuster nicht schon sagt.
  if (!u || !u.neueFragen || !u.ansprechen) return { punkte, belege };

  u.merkmale.filter((m) => m.erfuellt).forEach((m) => {
    punkte += m.gewicht;
    belege.push(`${m.name}: ${m.text}.`);
  });

  const offen = u.merkmale.filter((m) => !m.pruefbar);
  if (offen.length) {
    belege.push(`Nicht prüfbar: ${offen.map((m) => m.name.toLowerCase()).join(', ')} `
      + `– das kann dafür sprechen oder dagegen, es ist schlicht offen.`);
  }
  return { punkte, belege };
}

/**
 * Das ganze Bild.
 *
 * @param {{eintraege, tage, fenster, mindestFaelle, bilanz, nsarNamen}} d
 *   `bilanz` ist das Ergebnis von ausloeserBilanz(), `nsarNamen` die Prüfung,
 *   ob ein eingetragenes Mittel ein NSAR ist – beides kommt von außen herein,
 *   damit diese Datei nichts doppelt rechnet und nichts über die Anzeige weiß.
 */
function bildLesen(d) {
  const eintraege = d.eintraege || [];
  const tage = d.tage || {};

  const tageMitBeschwerden = [...new Set(eintraege
    .filter((e) => e.art === 'beschwerde').map((e) => e.am))];
  const alleNotiert = [...new Set([...eintraege.map((e) => e.am), ...Object.keys(tage)])]
    .filter((iso) => tagesWert(eintraege, iso, tage).notiert);
  const schnittGesamt = alleNotiert.length
    ? alleNotiert.reduce((s, iso) => s + tagesWert(eintraege, iso, tage).wert, 0) / alleNotiert.length
    : 0;

  const nsarTageListe = [...new Set(eintraege
    .filter((e) => e.art === 'medikament' && d.istNsar(e.mittel))
    .map((e) => e.am))];
  const nsarSchnitt = nsarTageListe.length
    ? nsarTageListe.reduce((s, iso) => s + tagesWert(eintraege, iso, tage).wert, 0) / nsarTageListe.length
    : 0;

  const daten = {
    eintraege,
    tage,
    bilanz: d.bilanz || [],
    name: d.name || ((id) => id),
    zeiten: nachTageszeit(eintraege),
    essen: essensbezug(eintraege),
    faktoren: Object.fromEntries(['stress', 'schlaf', 'stimmung']
      .map((id) => [id, faktorBilanz(eintraege, tage, id, tagesWert)])),
    phasen: phasenBilanz(eintraege, tage, tagesWert),
    zyklusBelastbar: belastbar(tage),
    nsarTage: nsarTageListe.length,
    nsarSchnitt,
    schnittGesamt,
    unterleib: unterleibsBild(eintraege, tage, tagesWert),
  };

  const muster = MUSTER
    .map((m) => ({ ...m, ...m.pruefe(daten) }))
    // Zwei Belege sind die Untergrenze. Ein einzelner Treffer ist ein Zufall,
    // und ein Zufall, der als „Bild" ausgegeben wird, führt jemanden in die
    // falsche Sprechstunde.
    .filter((m) => m.belege.length >= 2)
    .sort((a, b) => b.punkte - a.punkte);

  return {
    warnungen: warnungen(eintraege),
    muster,
    // Woran das alles hängt – steht in der Anzeige daneben, damit sichtbar ist,
    // wie dünn oder dick die Grundlage ist.
    basis: {
      beschwerden: eintraege.filter((e) => e.art === 'beschwerde').length,
      tageMitBeschwerden: tageMitBeschwerden.length,
      notierteTage: alleNotiert.length,
      zuordenbar: daten.essen.bewertbar,
    },
    fragen: [...new Set(muster.flatMap((m) => m.fragen))].slice(0, 6),
  };
}

/** Reicht die Grundlage, damit die Einordnung überhaupt etwas bedeutet? */
function genugFuerBild(basis) {
  return basis.notierteTage >= 10 && basis.beschwerden >= 5;
}

/* ===== js/rat.js ===== */
/*
 * Vorschläge für heute – hergeleitet, nicht ausgedacht.
 *
 * Jeder Vorschlag trägt ein `warum`, und das ist keine Höflichkeit: Ein Rat
 * ohne Begründung ist ein Befehl, und Befehle über das eigene Essen befolgt man
 * entweder blind oder gar nicht. Beides ist schlecht. Steht daneben „weil es
 * nach deinen letzten 14 Mahlzeiten mit Kaffee im Mittel schlechter war",
 * kann man widersprechen – und genau das soll möglich sein.
 *
 * Zwei Quellen, sauber getrennt und in der Anzeige unterscheidbar:
 *
 *   'eigen'      Kommt aus ihren eigenen Eintragungen. Belastbar, soweit die
 *                Fallzahl reicht, und die steht dabei.
 *   'allgemein'  Kommt aus dem, was bei Magenbeschwerden üblicherweise
 *                empfohlen wird. Gilt für einen Durchschnitt, den es nicht
 *                gibt – deshalb immer nachrangig hinter dem eigenen Verlauf.
 *
 * WAS HIER NICHT VORKOMMT: welches Medikament sie nehmen soll. Diese Wahl
 * hängt an Diagnose, anderen Medikamenten, Nieren, Leber, Schwangerschaft –
 * nichts davon weiß diese App, und keines davon kann sie erfragen, ohne so zu
 * tun, als wüsste sie es dann. Was stattdessen kommt: was sie selbst
 * eingenommen hat, wann zuletzt, und die Frage dazu für den nächsten Termin.
 */



/**
 * Was bei gereiztem Magen üblicherweise gut vertragen wird.
 *
 * Bewusst kurz und bewusst langweilig. Das ist keine Diät und keine
 * Empfehlung auf Dauer – wer wochenlang nur das isst, isst zu einseitig.
 * Gedacht für die zwei, drei Tage, an denen ohnehin nichts anderes geht.
 */
const SCHONKOST = [
  'Haferbrei mit Wasser', 'Kartoffeln, gestampft', 'gedünstete Karotte oder Zucchini',
  'Reis', 'Banane', 'mageres Geflügel oder Fisch', 'Zwieback',
  'Kamillen- oder Fencheltee', 'stilles Wasser',
];

const rat = (id, bereich, titel, text, warum, quelle) => ({
  id, bereich, titel, text, warum, quelle,
});

/**
 * @param {object} d
 *   eintraege, tage, heute (ISO), bilanz (aus ausloeserBilanz),
 *   faktoren ({stress, schlaf, stimmung} aus faktorBilanz),
 *   phasen (aus phasenBilanz), eigene (eigene Auslöser),
 *   letzteMahlzeitStunden (Zahl oder null), mittel (zuletzt eingenommene)
 */
function raete(d) {
  const raus = [];
  const heute = tagesWert(d.eintraege, d.heute, d.tage);
  const heuteWert = heute.wert;
  /*
   * Ob für heute überhaupt etwas dasteht – und nicht nur, ob der Wert 0 ist.
   *
   * `tagesWert` liefert für einen leeren Tag 0, und das ist richtig gerechnet:
   * Es gibt keine Beschwerde. Es heißt aber nicht, dass keine da war. Wer
   * daraus einen Rat ableitet, sagt jemandem am Morgen, bevor irgendetwas
   * eingetragen ist, wie es ihm heute geht.
   */
  const heuteNotiert = heute.notiert;
  const heuteTag = d.tage[d.heute] || {};
  const akut = heuteWert >= 6;
  const leicht = heuteWert > 0 && heuteWert < 6;

  /* ---------- Essen ---------- */

  // Was ihr eigener Verlauf hergibt, steht vor allem Allgemeinen.
  const auffaellig = (d.bilanz || [])
    .filter((b) => b.genug && ['auffaellig', 'moeglich'].includes(einstufung(b)))
    .filter((b) => !['gross', 'spaet'].includes(b.id))
    .slice(0, 3);

  if (auffaellig.length) {
    const namen = auffaellig.map((b) => ausloeserName(b.id, d.eigene)).join(', ');
    raus.push(rat('essen-eigen', 'essen',
      `Heute eher ohne ${namen}`,
      'Nicht für immer streichen – nur an Tagen wie diesem einmal weglassen und '
      + 'schauen, ob es einen Unterschied macht. Ein Auslöser, der sich in zwei '
      + 'Wochen ohne ihn nicht bestätigt, war keiner.',
      auffaellig.map((b) => `${ausloeserName(b.id, d.eigene)}: danach im Mittel `
        + `${b.schnittMit.toFixed(1).replace('.', ',')} statt `
        + `${b.schnittOhne.toFixed(1).replace('.', ',')} `
        + `(${b.faelle} Mahlzeiten damit, ${b.gegenFaelle} ohne)`).join(' · '),
      'eigen'));
  }

  if (akut) {
    raus.push(rat('essen-schon', 'essen',
      'Heute klein und mild',
      `Mehrere kleine Portionen statt zwei großen, und dabei bleiben bei: `
      + `${SCHONKOST.slice(0, 6).join(', ')}.`,
      `Der heutige Wert liegt bei ${heuteWert} von 10.`,
      'allgemein'));
  }

  const spaet = (d.bilanz || []).find((b) => b.id === 'spaet');
  if (spaet && spaet.genug && spaet.differenz >= 1) {
    raus.push(rat('essen-spaet', 'essen',
      'Die letzte Mahlzeit früher legen',
      'Zwischen dem letzten Essen und dem Hinlegen etwa drei Stunden – im Liegen '
      + 'hat der Magen keine Schwerkraft mehr auf seiner Seite.',
      `Nach Mahlzeiten nach 20 Uhr lag der Wert bei `
      + `${spaet.schnittMit.toFixed(1).replace('.', ',')} statt `
      + `${spaet.schnittOhne.toFixed(1).replace('.', ',')} (${spaet.faelle} Fälle).`,
      'eigen'));
  }

  const gross = (d.bilanz || []).find((b) => b.id === 'gross');
  if (gross && gross.genug && gross.differenz >= 1) {
    raus.push(rat('essen-portion', 'essen',
      'Lieber öfter und kleiner',
      'Fünf kleine Mahlzeiten belasten weniger als drei große – der Magen muss '
      + 'dann nie viel auf einmal bewegen.',
      `Nach großen Portionen lag der Wert bei `
      + `${gross.schnittMit.toFixed(1).replace('.', ',')} statt `
      + `${gross.schnittOhne.toFixed(1).replace('.', ',')} (${gross.faelle} Fälle).`,
      'eigen'));
  }

  /* ---------- Entspannung ---------- */

  const stress = d.faktoren && d.faktoren.stress;
  const heuteAngespannt = Number(heuteTag.stress) >= 3;
  const schlechtGeschlafen = Number(heuteTag.schlaf) >= 3;

  if (stress && stress.genug && stress.differenz >= 1) {
    raus.push(rat('ruhe-eigen', 'ruhe',
      heuteAngespannt ? 'Heute wäre eine Atemrunde dran' : 'Anspannung ist bei dir ein Faktor',
      'Bei dir hängen Anspannung und Beschwerden messbar zusammen. Langes '
      + 'Ausatmen schaltet auf den Teil des Nervensystems um, unter dem der Darm '
      + 'arbeitet – unter „Ruhe" liegt 4–7–8, gut zwei Minuten.',
      `An angespannten Tagen ${stress.hoch.schnitt.toFixed(1).replace('.', ',')} `
      + `statt ${stress.niedrig.schnitt.toFixed(1).replace('.', ',')} `
      + `(${stress.hoch.tage} gegen ${stress.niedrig.tage} Tage).`,
      'eigen'));
  } else if (heuteAngespannt || akut) {
    raus.push(rat('ruhe-heute', 'ruhe',
      'Zwei Minuten Atmen',
      'Unter „Ruhe": 4–7–8 zum Runterkommen, Gleichmaß fürs Sitzen zwischendurch. '
      + 'Mit Ton, damit die Augen zubleiben können.',
      heuteAngespannt ? 'Du hast heute viel Anspannung eingetragen.'
        : `Der heutige Wert liegt bei ${heuteWert} von 10.`,
      'allgemein'));
  }

  if (schlechtGeschlafen) {
    raus.push(rat('ruhe-schlaf', 'ruhe',
      'Heute Abend 4–7–8 vor dem Schlafen',
      'Die Übung ist ursprünglich fürs Einschlafen gedacht. Vier Runden im Bett, '
      + 'Licht schon aus.',
      'Du hast für heute schlechten Schlaf eingetragen.',
      'allgemein'));
  }

  /* ---------- Sport ---------- */

  raus.push(sportRat(d, {
    heuteWert, heuteNotiert, akut, leicht, heuteTag, heuteAngespannt,
  }));

  /* ---------- Medikamente: kein Rat, sondern der Stand ---------- */

  if (d.mittel && d.mittel.length) {
    raus.push(rat('mittel', 'mittel',
      'Was du nimmst',
      d.mittel.map((m) => `${m.name} – zuletzt ${m.zuletzt}`).join(' · ')
      + '. Was die Mittel bewirken, steht unter „Mehr".',
      'Diese App schlägt bewusst kein Medikament vor: Das hängt an Diagnose, '
      + 'anderen Mitteln und Vorerkrankungen, und nichts davon weiß sie. Nimm '
      + 'die Liste mit zum Termin.',
      'allgemein'));
  }

  return raus.filter(Boolean);
}

/**
 * Intensiv oder moderat?
 *
 * Bewegung hilft bei fast allem hier – aber nicht jede Bewegung zu jeder
 * Stunde. Zwei Regeln sind unstrittig genug, um sie hinzuschreiben: nicht
 * intensiv direkt nach dem Essen (im Liegen und Springen kommt hoch, was
 * unten bleiben soll), und nicht intensiv, während es akut weh tut. Alles
 * andere kommt aus ihrem eigenen Verlauf.
 */
function sportRat(d, k) {
  const seitEssen = d.letzteMahlzeitStunden;
  const frischGegessen = seitEssen !== null && seitEssen < 2;
  const phase = phaseVon(d.tage, d.heute);
  const phasenSchlecht = phase && (d.phasen || [])
    .some((p) => p.phase === phase && p.schnitt >= 4 && p.tage >= 4);

  if (k.akut) {
    return rat('sport', 'sport', 'Heute nur spazieren',
      'Bei einem Wert wie heute bringt intensives Training nichts und kann die '
      + 'Beschwerden verstärken. Zwanzig Minuten gehen hilft der Verdauung '
      + 'trotzdem.',
      `Der heutige Wert liegt bei ${k.heuteWert} von 10.`, 'allgemein');
  }
  if (frischGegessen) {
    return rat('sport', 'sport', 'Erst in zwei Stunden intensiv',
      'Jetzt passt ein Spaziergang. Intensives Training kurz nach dem Essen '
      + 'drückt auf den vollen Magen – danach spricht nichts dagegen.',
      `Die letzte Mahlzeit ist ${Math.round(seitEssen * 10) / 10} Stunden her.`,
      'allgemein');
  }
  if (phasenSchlecht) {
    return rat('sport', 'sport', 'Heute eher moderat',
      'Ausdauer in ruhigem Tempo, 30 bis 45 Minuten. In dieser Zyklusphase war '
      + 'es bei dir bisher schwerer – das heißt nicht „gar nichts", sondern '
      + '„nicht auf Zeit".',
      `In der Phase „${phasenName(phase)}" lagen deine Werte höher als sonst.`,
      'eigen');
  }
  if (k.heuteAngespannt) {
    return rat('sport', 'sport', 'Moderate Ausdauer wäre heute richtig',
      'Laufen, Rad, zügiges Gehen in einem Tempo, bei dem Reden noch geht – das '
      + 'baut Anspannung ab, ohne neuen Stress zu machen. Intensive Intervalle '
      + 'tun an einem angespannten Tag das Gegenteil.',
      'Du hast heute viel Anspannung eingetragen.', 'allgemein');
  }
  if (k.leicht) {
    return rat('sport', 'sport', 'Moderat spricht nichts dagegen',
      'Bei leichten Beschwerden ist Bewegung eher hilfreich als schädlich. '
      + 'Intensiv würde ich heute noch nicht ansetzen.',
      `Der heutige Wert liegt bei ${k.heuteWert} von 10.`, 'allgemein');
  }
  /*
   * Der letzte Fall – und die Stelle, an der dieser Rat einmal falsch war.
   *
   * Er sagte „beschwerdefrei und ausgeruht", wenn der Tageswert 0 war, und der
   * Beleg darunter sagte im selben Atemzug „bisher nichts eingetragen". Das
   * sind zwei verschiedene Dinge, und der Unterschied ist das Leitmotiv dieser
   * App: Ein Tag ohne Beschwerden ist etwas anderes als ein Tag ohne
   * Eintragung. Weil ein Tag naturgemäß leer anfängt, erschien der Satz jeden
   * Morgen – auch bei jemandem, der an jedem der letzten Tage eine Sechs
   * eingetragen hatte. Ein Rat, der einem den eigenen Zustand mitteilt, statt
   * ihn zu erfragen, verliert genau das Vertrauen, von dem alles Übrige hier
   * lebt.
   *
   * Also: Steht für heute etwas da, darf der Rat sich darauf berufen. Steht
   * nichts da, sagt er nichts über den Tag, sondern stellt eine Bedingung.
   */
  if (!k.heuteNotiert) {
    return rat('sport', 'sport', 'Wenn es dir heute gut geht, geht auch intensiv',
      'Für heute steht noch nichts im Tagebuch, deshalb keine Aussage über den '
      + 'Tag – nur die Regel: An beschwerdefreien Tagen spricht nichts gegen '
      + 'intensives Training, und danach mindestens eine Stunde, bevor du dich '
      + 'hinlegst.',
      'Für heute ist noch nichts eingetragen – das heißt nicht, dass nichts war.',
      'allgemein');
  }

  return rat('sport', 'sport', 'Heute geht auch intensiv',
    'Beschwerdefrei und ausgeruht: Wenn du intensiv trainieren willst, ist heute '
    + 'der Tag dafür. Danach mindestens eine Stunde, bevor du dich hinlegst.',
    'Für heute ist etwas eingetragen, aber keine Beschwerden und keine hohe '
    + 'Anspannung.',
    'allgemein');
}
