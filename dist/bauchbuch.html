const ALLE = [...MITTEL_WISSEN, ...REIZSTOFFE];

/**
 * Zu einem eingetragenen Namen die passende Gruppe finden.
 *
 * Eingetragen wird frei: „Pantoprazol 20mg", „pantoprazol", „Panto". Deshalb
 * wird kleingeschrieben verglichen und geprüft, ob eines der Beispiele im
 * Eingetragenen vorkommt – nicht auf Gleichheit.
 */
function wissenZu(name) {
  const gesucht = String(name || '').toLowerCase().trim();
  if (!gesucht) return null;
  return ALLE.find((g) => g.beispiele.some((b) => gesucht.includes(b.toLowerCase())))
    || ALLE.find((g) => gesucht.includes(g.gruppe.toLowerCase()))
    || null;
}

/* ===== js/klang.js ===== */
/*
 * Töne – erzeugt, nicht geladen.
 *
 * Die Atemübung führt jemand mit geschlossenen Augen durch. Der Ton ist dann
 * nicht Beiwerk, sondern die ganze Bedienoberfläche: Er sagt, wann eingeatmet
 * wird, wann gehalten und wann ausgeatmet.
 *
 * Deshalb keine Audiodateien. Eine Datei wäre ein Download, in der
 * Ein-Datei-Fassung ein halbes Megabyte base64, und ohne Netz womöglich gar
 * nicht da. Hier entstehen die Töne im Browser aus einem Oszillator: ein paar
 * Zeilen, kein Byte Ladelast, funktioniert offline und in der einen Datei
 * gleichermaßen.
 *
 * Klanglich bewusst weich: Sinuston, sanft ein- und ausgeblendet. Ein harter
 * Anschlag reißt genau die Anspannung wieder hoch, gegen die die Übung läuft.
 */

let kontext = null;

/**
 * Den Tonkontext holen – und zwar erst, wenn wirklich ein Ton kommen soll.
 *
 * Browser lassen Audio nur nach einer Nutzergeste zu. Ein Kontext, der beim
 * Laden der Seite entsteht, startet gesperrt und bleibt es; einer, der beim
 * Druck auf „Start" entsteht, läuft.
 */
function holeKontext() {
  if (kontext) return kontext;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return null;
  try {
    kontext = new AC();
  } catch {
    return null;
  }
  return kontext;
}

/** Nach einer Pause im Hintergrund steht der Kontext still. */
function weckKlang() {
  const k = holeKontext();
  if (k && k.state === 'suspended') k.resume().catch(() => {});
  return !!k;
}

/**
 * Ein einzelner weicher Ton.
 *
 * @param {number} hz     Tonhöhe
 * @param {number} dauer  Sekunden
 * @param {number} laut   0 bis 1
 */
function ton(hz, dauer = 0.35, laut = 0.18) {
  const k = holeKontext();
  if (!k) return;
  if (k.state === 'suspended') k.resume().catch(() => {});
  const jetzt = k.currentTime;
  const osz = k.createOscillator();
  const huelle = k.createGain();
  osz.type = 'sine';
  osz.frequency.setValueAtTime(hz, jetzt);
  // Ein- und ausblenden über je 60 ms. Ohne das knackt es an beiden Enden,
  // und ein Knacken im Ohr ist bei geschlossenen Augen doppelt unangenehm.
  huelle.gain.setValueAtTime(0.0001, jetzt);
  huelle.gain.exponentialRampToValueAtTime(laut, jetzt + 0.06);
  huelle.gain.setValueAtTime(laut, jetzt + Math.max(0.07, dauer - 0.06));
  huelle.gain.exponentialRampToValueAtTime(0.0001, jetzt + dauer);
  osz.connect(huelle).connect(k.destination);
  osz.start(jetzt);
  osz.stop(jetzt + dauer + 0.02);
}

/*
 * Die Töne der Atemübung. Drei Höhen, die man auch schlaftrunken
 * auseinanderhält: aufwärts heißt einatmen, gleichbleibend heißt halten,
 * abwärts heißt ausatmen.
 */
const KLAENGE = {
  ein: () => { ton(523.25, 0.3); setTimeout(() => ton(659.25, 0.34), 110); },
  halten: () => ton(587.33, 0.22, 0.12),
  aus: () => { ton(523.25, 0.3); setTimeout(() => ton(392.0, 0.5), 110); },
  fertig: () => {
    ton(523.25, 0.5, 0.16);
    setTimeout(() => ton(659.25, 0.5, 0.16), 160);
    setTimeout(() => ton(783.99, 0.9, 0.16), 320);
  },
  tick: () => ton(880, 0.06, 0.05),
};

/** Ein kurzer Rüttler, wo das Gerät ihn kann – hilft, wenn es leise sein muss. */
function ruettel(muster) {
  try {
    if (navigator.vibrate) navigator.vibrate(muster);
  } catch { /* dann eben nicht */ }
}

/* ===== js/atem.js ===== */
/*
 * Atemübungen – die Daten dazu, nicht der Ablauf.
 *
 * Warum in einem Magentagebuch: Bauch und Nervensystem hängen zusammen, und
 * zwar in beide Richtungen. Langes Ausatmen schaltet messbar auf den Teil des
 * Nervensystems um, unter dem der Darm arbeitet statt stillzustehen. Bei
 * stressgebundenen Beschwerden ist das keine Beschäftigungstherapie, sondern
 * das Mittel, das man ohne Rezept und ohne Nebenwirkung hat.
 *
 * Deshalb ist bei allen Übungen hier das Ausatmen mindestens so lang wie das
 * Einatmen. Umgekehrt – kurz aus, lang ein – täte das Gegenteil.
 *
 * Reine Daten, keine Abhängigkeiten. Wer die Übung *ausführt*, ist js/app.js;
 * getaktet wird sie mit den Tönen aus js/klang.js.
 */

/**
 * Eine Übung besteht aus Phasen. `sek: 0` heißt: Phase fällt weg.
 *
 * `runden` ist der Vorschlag, nicht die Vorschrift – wer mehr will, stellt um.
 */
const UEBUNGEN = [
  {
    id: '478',
    name: '4–7–8',
    zweck: 'Zum Runterkommen und zum Einschlafen',
    beschreibung: 'Vier Sekunden durch die Nase ein, sieben halten, acht durch '
      + 'den Mund aus. Das lange Ausatmen ist der Wirkstoff; die Zahlen sind nur '
      + 'die Verpackung. Wenn sieben Sekunden Halten zu lang sind, ist es keine '
      + 'schlechtere Übung, wenn man kürzer macht.',
    runden: 4,
    phasen: [
      { art: 'ein', sek: 4, wort: 'Einatmen' },
      { art: 'halten', sek: 7, wort: 'Halten' },
      { art: 'aus', sek: 8, wort: 'Ausatmen' },
    ],
  },
  {
    id: 'box',
    name: 'Quadrat',
    zweck: 'Wenn der Kopf rattert',
    beschreibung: 'Vier ein, vier halten, vier aus, vier halten. Der gleiche '
      + 'Takt in alle vier Richtungen gibt dem Denken etwas zu tun, ohne es zu '
      + 'beschäftigen.',
    runden: 6,
    phasen: [
      { art: 'ein', sek: 4, wort: 'Einatmen' },
      { art: 'halten', sek: 4, wort: 'Halten' },
      { art: 'aus', sek: 4, wort: 'Ausatmen' },
      { art: 'halten', sek: 4, wort: 'Halten' },
    ],
  },
  {
    id: 'kohaerenz',
    name: 'Gleichmaß',
    zweck: 'Für zwischendurch, auch im Sitzen am Schreibtisch',
    beschreibung: 'Fünfeinhalb Sekunden ein, fünfeinhalb aus, ohne Halten – gut '
      + 'sechs Atemzüge in der Minute. Der Takt, bei dem Puls und Atem in einen '
      + 'gemeinsamen Rhythmus fallen. Unauffällig genug für den Bus.',
    runden: 10,
    phasen: [
      { art: 'ein', sek: 5.5, wort: 'Einatmen' },
      { art: 'aus', sek: 5.5, wort: 'Ausatmen' },
    ],
  },
  {
    id: 'bauch',
    name: 'Bauchatmung',
    zweck: 'Direkt auf den Bauch, bei Druck und Krämpfen',
    beschreibung: 'Eine Hand auf den Bauch, vier Sekunden so einatmen, dass sich '
      + 'die Hand hebt und nicht die Schulter, sechs Sekunden aus. Das Zwerchfell '
      + 'massiert dabei, was darunter liegt.',
    runden: 8,
    phasen: [
      { art: 'ein', sek: 4, wort: 'Einatmen, Bauch hebt sich' },
      { art: 'aus', sek: 6, wort: 'Ausatmen, Bauch senkt sich' },
    ],
  },
];

const MAP = Object.fromEntries(UEBUNGEN.map((u) => [u.id, u]));

function uebungVon(id) {
  return MAP[id] || UEBUNGEN[0];
}

/** Wie lange eine Runde dauert, in Sekunden. */
function rundenDauer(uebung) {
  return uebung.phasen.reduce((s, p) => s + p.sek, 0);
}

/** Die ganze Übung, in Sekunden – für die Anzeige „etwa 2 Minuten". */
function gesamtDauer(uebung, runden) {
  return rundenDauer(uebung) * (runden || uebung.runden);
}

function dauerText(sekunden) {
  const m = Math.round(sekunden / 60);
  if (sekunden < 90) return `${Math.round(sekunden)} Sekunden`;
  return `${m} Minuten`;
}

/**
 * Der Ablauf als flache Liste: jede Phase jeder Runde, einmal ausgerollt.
 *
 * Ausgerollt statt gerechnet, weil der Ablauf dadurch selbst zum Prüfgegenstand
 * wird – man kann ihn ansehen und nachzählen, statt einer Schleife zu glauben.
 */
function ablauf(uebung, runden) {
  const n = runden || uebung.runden;
  const schritte = [];
  for (let r = 1; r <= n; r++) {
    uebung.phasen.forEach((p, i) => {
      schritte.push({
        runde: r,
        von: n,
        art: p.art,
        wort: p.wort,
        sek: p.sek,
        letzte: r === n && i === uebung.phasen.length - 1,
      });
    });
  }
  return schritte;
}

/* ===== js/zyklus.js ===== */
/*
 * Der Zyklus – gerechnet aus dem, was eingetragen wurde, und aus nichts sonst.
 *
 * Warum das in ein Magentagebuch gehört: Bei vielen Menschen schwanken
 * Übelkeit, Blähungen, Sodbrennen und Appetit mit dem Zyklus, und wer das
 * nicht mitzählt, sucht die Ursache vier Wochen lang im Essen. Ein Muster, das
 * sich alle vier Wochen wiederholt, sieht man nur, wenn man weiß, wo die
 * Wochen anfangen.
 *
 * WOFÜR DAS HIER NICHT TAUGT, und das ist keine Formalie:
 *
 *   * **Nicht zur Verhütung.** Der Eisprung wird hier nicht gemessen, sondern
 *     aus der halben Zykluslänge geschätzt. Er verschiebt sich, und zwar
 *     gerade dann, wenn jemand krank ist oder unter Druck steht – also genau
 *     in den Zeiträumen, um die es in dieser App geht.
 *   * **Nicht als Vorhersage.** „Nächste Periode am …" steht nirgends. Eine
 *     Zahl, die aus drei beobachteten Zyklen stammt, sieht genauso aus wie
 *     eine, die aus dreißig stammt – und wird genauso geglaubt.
 *
 * Was hier steht, ist eine Einordnung des *vergangenen* Verlaufs: In welcher
 * Phase lag ein bestimmter Tag, gemessen an den eingetragenen Blutungstagen.
 */

/** Ab hier gilt ein Tag als Blutungstag – Schmierblutung zählt mit. */
const BLUTUNG_AB = 1;

/**
 * Eine Lücke von so vielen Tagen trennt zwei Zyklen.
 *
 * Zwei Tage Pause mitten in der Periode sind nichts Ungewöhnliches; würde man
 * schon daraus einen neuen Zyklus machen, käme eine Zykluslänge von vier Tagen
 * heraus. Drei Tage ist die übliche Grenze.
 */
const LUECKE = 3;

const PHASEN = [
  { id: 'menstruation', name: 'Periode' },
  { id: 'follikel', name: 'erste Zyklushälfte' },
  { id: 'ovulation', name: 'Zyklusmitte' },
  { id: 'luteal', name: 'zweite Zyklushälfte' },
];

const PHASEN_MAP = Object.fromEntries(PHASEN.map((p) => [p.id, p]));

function phasenName(id) {
  return PHASEN_MAP[id] ? PHASEN_MAP[id].name : id;
}

/** Alle eingetragenen Blutungstage, aufsteigend. */
function blutungsTage(tage) {
  return Object.keys(tage || {})
    .filter((iso) => Number(tage[iso] && tage[iso].blutung) >= BLUTUNG_AB)
    .sort();
}

/**
 * Die beobachteten Zyklen: [{ start, laenge }].
 *
 * Ein Zyklus beginnt am ersten Blutungstag nach einer Lücke. Seine Länge ist
 * der Abstand zum nächsten Anfang – der letzte Zyklus hat deshalb keine, er
 * läuft noch.
 */
function zyklen(tage) {
  const bt = blutungsTage(tage);
  if (!bt.length) return [];
  const starts = [bt[0]];
  const blutungsEnden = [];
  for (let i = 1; i < bt.length; i++) {
    if (tageDazwischen(bt[i - 1], bt[i]) >= LUECKE) {
      blutungsEnden.push(bt[i - 1]);
      starts.push(bt[i]);
    }
  }
  blutungsEnden.push(bt[bt.length - 1]);
  return starts.map((start, i) => ({
    start,
    blutungBis: blutungsEnden[i],
    blutungsTage: tageDazwischen(start, blutungsEnden[i]) + 1,
    laenge: i + 1 < starts.length ? tageDazwischen(start, starts[i + 1]) : null,
  }));
}

/**
 * Die mittlere Zykluslänge aus den abgeschlossenen Zyklen.
 *
 * Ohne abgeschlossenen Zyklus gibt es keine – dann liefert das hier `null`,
 * und alles, was darauf aufbaut, hält den Mund. 28 als stille Annahme
 * einzusetzen wäre bequem und falsch: Es gibt genug Menschen, bei denen 24
 * oder 34 der Normalfall ist, und deren Phasen lägen dann durchgehend daneben.
 */
function mittlereLaenge(tage) {
  const fertig = zyklen(tage).filter((z) => z.laenge && z.laenge >= 15 && z.laenge <= 60);
  if (!fertig.length) return null;
  return Math.round(fertig.reduce((s, z) => s + z.laenge, 0) / fertig.length);
}

/** Wie stark die Zykluslänge schwankt – die Spanne zwischen kürzestem und längstem. */
function schwankung(tage) {
  const laengen = zyklen(tage).map((z) => z.laenge)
    .filter((l) => l && l >= 15 && l <= 60);
  if (laengen.length < 2) return null;
  return { von: Math.min(...laengen), bis: Math.max(...laengen), anzahl: laengen.length };
}

/**
 * Der Zyklustag eines Datums: 1 am ersten Blutungstag.
 *
 * `null`, wenn der Tag vor dem ersten eingetragenen Zyklus liegt oder mehr als
 * zwei Monate hinter seinem Anfang – dann ist die Zuordnung geraten, nicht
 * gerechnet.
 */
function zyklusTag(tage, iso) {
  const alle = zyklen(tage);
  let letzter = null;
  for (const z of alle) {
    if (z.start <= iso) letzter = z;
  }
  if (!letzter) return null;
  const tag = tageDazwischen(letzter.start, iso) + 1;
  return tag >= 1 && tag <= 60 ? tag : null;
}

/**
 * Die Phase eines Tages.
 *
 * Grob und offen gesagt grob: Die Periode kommt aus den Eintragungen, die
 * Mitte wird aus der halben Zykluslänge geschätzt, der Rest teilt sich davor
 * und danach auf. Feiner geht es ohne Temperatur- oder Hormonmessung nicht,
 * und feiner zu *tun* wäre schlimmer als grob zu sein.
 */
function phaseVon(tage, iso) {
  const tag = zyklusTag(tage, iso);
  if (!tag) return null;
  const tagInfo = (tage || {})[iso];
  if (Number(tagInfo && tagInfo.blutung) >= BLUTUNG_AB) return 'menstruation';
  const laenge = mittlereLaenge(tage);
  if (!laenge) return null;
  const mitte = Math.round(laenge / 2);
  if (tag >= mitte - 2 && tag <= mitte + 2) return 'ovulation';
  return tag < mitte ? 'follikel' : 'luteal';
}

/**
 * Beschwerdestärke je Zyklusphase.
 *
 * Die eigentliche Auskunft dieses Moduls. Zurück kommt für jede Phase, in der
 * überhaupt etwas notiert wurde: wie viele Tage, wie stark im Mittel, und wie
 * viele davon mit Beschwerden. Ohne Schwelle und ohne Urteil – die Fallzahlen
 * stehen daneben, damit man selbst sieht, ob drei Tage oder dreißig gemeint
 * sind.
 */
function phasenBilanz(eintraege, tage, tagesWert) {
  const eimer = Object.fromEntries(PHASEN.map((p) => [p.id, { tage: 0, summe: 0, mit: 0 }]));
  const gesehen = new Set();
  const alleTage = new Set([
    ...Object.keys(tage || {}),
    ...eintraege.map((e) => e.am),
  ]);
  alleTage.forEach((iso) => {
    if (gesehen.has(iso)) return;
    gesehen.add(iso);
    const p = phaseVon(tage, iso);
    if (!p) return;
    const t = tagesWert(eintraege, iso, tage);
    if (!t.notiert) return;
    eimer[p].tage += 1;
    eimer[p].summe += t.wert;
    if (t.wert > 0) eimer[p].mit += 1;
  });
  return PHASEN
    .filter((p) => eimer[p.id].tage > 0)
    .map((p) => ({
      phase: p.id,
      name: p.name,
      tage: eimer[p.id].tage,
      schnitt: eimer[p.id].summe / eimer[p.id].tage,
      anteil: eimer[p.id].mit / eimer[p.id].tage,
    }));
}

/**
 * Reicht das für eine Aussage?
 *
 * Zwei abgeschlossene Zyklen sind die Untergrenze, unter der eine Phase
 * bestenfalls ein Zufall ist. Steht hier `false`, zeigt die App die Zahlen
 * trotzdem – aber ohne den Satz, dass daraus etwas folgt.
 */
function belastbar(tage) {
  return zyklen(tage).filter((z) => z.laenge).length >= 2;
}

/** Der Stand von heute, für die Tagesansicht. */
function heutigerStand(tage, iso) {
  const tag = zyklusTag(tage, iso);
  if (!tag) return null;
  return {
    tag,
    phase: phaseVon(tage, iso),
    laenge: mittlereLaenge(tage),
    // Nur zur Einordnung des Heute, nicht als Vorhersage: Wie weit ist der
    // Zyklus, gemessen an der bisherigen mittleren Länge.
    seitAnfang: plusTage(iso, -(tag - 1)),
  };
}

/* ===== js/chart.js ===== */
/*
 * Ein Balkendiagramm als SVG-Zeichenkette. Ohne Bibliothek, ohne Leinwand.
 *
 * Warum SVG und nicht <canvas>: Die Tafel wird zusammen mit dem übrigen HTML
 * neu gezeichnet, sobald sich der Zustand ändert. Eine Leinwand müsste dafür
 * nach jedem Rendern eigens angemalt werden – bei einer Zeichenkette fällt
 * dieser zweite Schritt weg, und die Tafel kann nicht „vergessen" werden.
 *
 * Ein Tag ohne Eintragung ist etwas anderes als ein Tag ohne Beschwerden.
 * Deshalb zwei getrennte Darstellungen: kein Balken, aber ein Grundstrich für
 * „nichts eingetragen", ein flacher Strich in Grün für „eingetragen, aber
 * beschwerdefrei". Wer das zusammenwirft, liest aus einer Lücke im Tagebuch
 * einen guten Tag heraus.
 */

const TAFEL_HOCH = 100;
const TAFEL_MAX = 10;

/**
 * @param {{am: string, wert: number|null, notiert: boolean}[]} punkte
 * @param {{titel?: string, hinweis?: string}} opt
 */
function verlaufTafel(punkte, opt = {}) {
  if (!punkte.length) return '';
  const n = punkte.length;
  const breite = 300;
  const spalte = breite / n;
  const balken = Math.max(1.5, Math.min(spalte * 0.62, 10));

  const stuecke = punkte.map((p, i) => {
    const x = i * spalte + (spalte - balken) / 2;
    if (!p.notiert) {
      return `<rect x="${x.toFixed(2)}" y="${TAFEL_HOCH - 1.5}" width="${balken.toFixed(2)}" height="1.5" `
        + `rx="0.75" fill="var(--line)"><title>${fmtDatum(p.am)}: nichts eingetragen</title></rect>`;
    }
    const wert = Math.max(0, Math.min(TAFEL_MAX, p.wert || 0));
    const h = Math.max(2, (wert / TAFEL_MAX) * TAFEL_HOCH);
    const farbe = wert === 0 ? 'var(--ok)' : (wert >= 7 ? 'var(--bad)' : (wert >= 4 ? 'var(--warn)' : 'var(--leicht)'));
    return `<rect x="${x.toFixed(2)}" y="${(TAFEL_HOCH - h).toFixed(2)}" width="${balken.toFixed(2)}" `
      + `height="${h.toFixed(2)}" rx="${(balken / 2.5).toFixed(2)}" fill="${farbe}">`
      + `<title>${fmtDatum(p.am)}: ${wert === 0 ? 'beschwerdefrei' : `Stärke ${wert}`}</title></rect>`;
  }).join('');

  // Hilfslinie bei 5 – ohne Bezugspunkt sagt die Höhe eines Balkens nichts.
  const mitte = `<line x1="0" y1="${TAFEL_HOCH / 2}" x2="${breite}" y2="${TAFEL_HOCH / 2}" `
    + 'stroke="var(--line)" stroke-width="0.6" stroke-dasharray="3 3"/>';

  return `<figure class="tafel">
    ${opt.titel ? `<figcaption class="tafel-titel">${opt.titel}</figcaption>` : ''}
    <svg viewBox="0 0 ${breite} ${TAFEL_HOCH}" preserveAspectRatio="none" role="img"
         aria-label="${opt.titel || 'Verlauf'}: Balken je Tag, Höhe ist die stärkste Beschwerde von 0 bis 10">
      ${mitte}${stuecke}
    </svg>
    <div class="tafel-fuss">
      <span>${fmtDatum(punkte[0].am)}</span>
      ${opt.hinweis ? `<span class="tafel-hinweis">${opt.hinweis}</span>` : ''}
      <span>${fmtDatum(punkte[n - 1].am)}</span>
    </div>
  </figure>`;
}

/**
 * Ein waagerechter Vergleichsbalken: mit Auslöser gegen ohne.
 *
 * Zwei Balken übereinander statt einer Differenzzahl, weil die Differenz allein
 * täuscht – „2 Punkte mehr" heißt bei einem Grundpegel von 1 etwas anderes als
 * bei einem von 7.
 *
 * Die Beschriftungen lassen sich überschreiben. Beim Auslöser heißt es „danach"
 * und „sonst", beim Medikament „darunter" und „davor" – dieselbe Zeichnung,
 * aber ein falsches Wort daneben macht aus einer Auskunft eine Irreführung.
 */
function vergleichBalken(mit, ohne, worte = {}) {
  const anteil = (v) => `${Math.max(1.5, Math.min(100, (v / TAFEL_MAX) * 100)).toFixed(1)}%`;
  return `<div class="vgl">
    <div class="vgl-zeile"><span class="vgl-mark">${worte.mit || 'danach'}</span>
      <span class="vgl-spur"><i style="width:${anteil(mit)};background:var(--warn)"></i></span>
      <b>${mit.toFixed(1).replace('.', ',')}</b></div>
    <div class="vgl-zeile"><span class="vgl-mark">${worte.ohne || 'sonst'}</span>
      <span class="vgl-spur"><i style="width:${anteil(ohne)};background:var(--muted)"></i></span>
      <b>${ohne.toFixed(1).replace('.', ',')}</b></div>
  </div>`;
}

/* ===== js/store.js ===== */
/*
 * Der Speicher. Alles, was eingetragen wird, liegt hier – und nur hier.
 *
 * Es gibt keinen Server, kein Konto und keine Anmeldung. Der gesamte Zustand
 * steht im localStorage dieses einen Browsers auf diesem einen Gerät. Das ist
 * keine Sparmaßnahme, sondern die Bauart: Ein Tagebuch über den eigenen Körper
 * soll nirgendwohin gehen, wo es jemand anders lesen könnte, und was nie
 * verschickt wird, kann auch nicht abhandenkommen.
 *
 * Die Kehrseite steht ehrlich in der App: Ein gelöschter Browser-Speicher
 * nimmt alles mit. Dagegen hilft nur die Sicherung unter „Mehr" – deshalb
 * erinnert die App daran, und deshalb ist der Export eine gewöhnliche
 * JSON-Datei, die man auch ohne diese App noch lesen kann.
 */

const KEY = 'bauchbuch.state.v1';

const VORGABE = {
  // Alle Eintragungen in einer Liste, nach Zeitpunkt sortiert gehalten.
  // Ein Eintrag ist immer { id, am, um, art } plus die Felder seiner Art:
  //   essen       { was, zutaten: [{ id, rolle }], portion: 'klein'|'normal'|'gross' }
  //   beschwerde  { staerke: 0..10, arten: [beschwerdeId], notiz, stuhlbezug }
  //   stuhl       { form: 1..7, dringend, unvollstaendig, warnzeichen: [id] }
  //   medikament  { mittel, dosis }
  //   notiz       { text }
  eintraege: [],
  // Was für einen ganzen Tag gilt, nicht für einen Zeitpunkt. Welche Angaben
  // es gibt, steht in TAGESFRAGEN (js/daten.js):
  // { 'YYYY-MM-DD': { stimmung, stress, schlaf, bewegung, blutung, sex, nachtwach, notiz } }
  tage: {},
  // In wie vielen Stunden nach einer Mahlzeit eine Beschwerde ihr noch
  // zugerechnet wird. Vier Stunden sind der Vorschlag, nicht das Gesetz –
  // wer weiß, dass es bei ihm später kommt, stellt es unter Mehr um.
  fenster: 4,
  // Ab wie vielen Mahlzeiten mit einem Auslöser die Auswertung überhaupt
  // etwas dazu sagt. Darunter ist jede Aussage Zufall, und eine App, die aus
  // zwei Fällen eine Regel macht, schadet mehr als sie nützt.
  mindestFaelle: 5,
  // Verbesserungsvorschläge zur App selbst: [{ id, am, text, erledigt }].
  // Bewusst neben den Eintragungen und nicht in ihnen – eine Idee ist kein
  // Tagebucheintrag und hat in keiner Auswertung etwas zu suchen.
  ideen: [],
  eigeneAusloeser: [],   // [{ id: 'x:...', name }]
  zuletztMittel: [],     // zuletzt eingetragene Medikamente, als Vorschlag
  // Welche Tagesfragen erscheinen. Im Auslieferungszustand alle – wer eine
  // davon nicht beantworten will, schaltet sie unter Mehr ab.
  tagesfragen: ['stimmung', 'stress', 'schlaf', 'bewegung', 'blutung', 'sex', 'nachtwach'],
  /*
   * Seit wann die Beschwerden bestehen, als 'YYYY-MM'.
   *
   * Die eine Angabe, die aus dem Tagebuch grundsätzlich nicht hervorgeht: Es
   * beginnt an dem Tag, an dem jemand anfängt zu schreiben, und das ist fast
   * nie der Tag, an dem es angefangen hat. Die Rom-Kriterien verlangen aber
   * genau das – Beginn mindestens ein halbes Jahr her, Beschwerden in den
   * letzten drei Monaten. Ohne diese Zeile könnte js/kriterien.js die
   * Zeitbedingung nur behaupten.
   */
  beschwerdenSeit: null,
  /*
   * Der laufende oder letzte Auslassversuch – siehe js/versuch.js:
   * { id, art: 'ausloeser'|'klasse', ziel, start, tage, provokation, beendet }
   *
   * Einer zur Zeit. Zwei gleichzeitig wären zwei Versuche, die sich gegenseitig
   * die Aussage nehmen: Wird es besser, weiß hinterher niemand, wovon.
   */
  versuch: null,
  /*
   * Abgeschlossene Auslassversuche, der jüngste zuerst.
   *
   * Sie werden behalten statt weggeräumt, und zwar aus zwei Gründen: Ein
   * geprüfter Verdacht soll nicht in einem halben Jahr noch einmal geprüft
   * werden – zwei Wochen ohne Milch macht niemand gern zweimal –, und ein
   * Versuch, der *dagegen* sprach, ist für den Termin genauso ein Beleg wie
   * einer, der dafür sprach.
   *
   * Gespeichert wird nur der Versuch selbst, nicht sein Ergebnis: Das rechnet
   * js/versuch.js jedes Mal neu aus den Eintragungen. Sonst stünden hier
   * Zahlen, die zu den Eintragungen nicht mehr passen, sobald jemand einen
   * Eintrag korrigiert.
   */
  versuche: [],
  /*
   * Arzttermine als ISO-Daten, der jüngste zuerst.
   *
   * Der Bericht lief bisher über 30 oder 90 Tage – Fenster, die mit nichts zu
   * tun haben. Gefragt wird in der Sprechstunde aber nach der Zeit *seit dem
   * letzten Mal*, und genau die kennt nur sie.
   */
  termine: [],
  // Wie viele Ideen beim letzten Weitergeben in der Liste standen. Daran
  // erkennt die App, welche noch niemand gesehen hat – siehe ideenOffen().
  ideenGeschickt: 0,
  // Wurde der Hinweis auf die Unterleibsfragen schon einmal weggetippt? Dann
  // kommt er nicht wieder – ein Vorschlag, den man mehrfach abwehren muss,
  // ist keiner.
  unterleibGefragt: false,
  atemUebung: '478',     // zuletzt gewählte Atemübung
  atemRunden: null,      // eigene Rundenzahl; null = Vorschlag der Übung
  ton: true,             // Ton bei der Atemübung – der einzige der App
  theme: 'rosa',
  begruesst: false,
  tab: 'heute',
  lastBackup: null,      // { on, anzahl } – wann zuletzt gesichert wurde
  // Bis wann nicht mehr an die Sicherung erinnert wird (ISO-Datum). „Später"
  // heißt sieben Tage, nicht „nie" – wer einmal wegtippt, hat das Tagebuch
  // deshalb nicht aufgegeben.
  sicherungSpaeter: null,
};

const klon = (o) => JSON.parse(JSON.stringify(o));

let zustand = laden();
const hoerer = new Set();

function laden() {
  try {
    const roh = localStorage.getItem(KEY);
    if (!roh) return klon(VORGABE);
    const gelesen = JSON.parse(roh);
    const s = Object.assign(klon(VORGABE), gelesen);
    // Wer schon etwas eingetragen hat, hat die Begrüßung hinter sich – auch
    // wenn der Stand aus einer Fassung stammt, die den Schlüssel noch nicht
    // kannte. Sonst stünde die Einführung eines Tages wieder vor dem Tagebuch.
    if (!('begruesst' in gelesen) && s.eintraege.length) s.begruesst = true;
    s.eintraege = sortiert((Array.isArray(s.eintraege) ? s.eintraege : []).map(mahlzeitFrisch));
    return s;
  } catch {
    return klon(VORGABE);
  }
}

/**
 * Eine Mahlzeit auf den heutigen Stand bringen.
 *
 * Früher standen die Zutaten als bloße Liste von IDs unter `tags`. Seit sie
 * eine Rolle tragen – Hauptzutat, Beilage, Topping … –, stehen sie unter
 * `zutaten`. Umgerechnet wird beim Laden und beim Einlesen einer Sicherung,
 * also an genau den zwei Stellen, an denen fremde Daten hereinkommen.
 *
 * Alte Eintragungen bekommen `haupt`. Das ist die einzig ehrliche Annahme:
 * Wer damals „Zwiebel" angekreuzt hat, hat nicht gesagt, es sei nur ein Hauch
 * gewesen – und die harmlosere Rolle nachträglich zu unterstellen, würde alte
 * Auffälligkeiten stillschweigend kleinrechnen.
 *
 * `tags` fällt dabei weg, damit es die Angabe nur an einer Stelle gibt. Was an
 * dieser Umrechnung vorbeikommt, fängt zutatenVon() in js/auswertung.js ab.
 */
function mahlzeitFrisch(e) {
  if (!e || e.art !== 'essen' || Array.isArray(e.zutaten)) return e;
  const { tags, ...rest } = e;
  return {
    ...rest,
    zutaten: (Array.isArray(tags) ? tags : [])
      .filter((id) => typeof id === 'string')
      .map((id) => ({ id, rolle: 'haupt' })),
  };
}

/** Nach Tag und Uhrzeit. Die Liste wird nirgends anders sortiert. */
function sortiert(liste) {
  return [...liste].sort((a, b) => (a.am === b.am
    ? minutenAmTag(a.um) - minutenAmTag(b.um)
    : (a.am < b.am ? -1 : 1)));
}

/* ---------- Schreiben ---------- */

let schreibUhr = null;

/**
 * Warum nicht gespeichert werden kann – und das sind zwei verschiedene Lagen.
 *
 *   'gesperrt'  Der Browser lässt gar nicht erst speichern: privates Fenster,
 *               eingebettete Ansicht, blockierte Website-Daten. Nichts bleibt,
 *               aber es war auch nie etwas da.
 *
 *   'voll'      Es ging bisher, und jetzt nicht mehr. Das ist die gefährliche
 *               Lage: Monate an Eintragungen liegen gespeichert, der heutige
 *               Eintrag kommt nicht mehr dazu. Hier gehört der Rat zur
 *               Sicherung hin, sofort und deutlich.
 */
function warumNicht(fehler) {
  // Chrome/Safari melden QuotaExceededError, Firefox NS_ERROR_DOM_QUOTA_REACHED,
  // ältere Fassungen nur den Code 22. Alles andere ist eine Sperre.
  const name = fehler && (fehler.name || '');
  const code = fehler && fehler.code;
  return (name === 'QuotaExceededError' || name === 'NS_ERROR_DOM_QUOTA_REACHED'
    || code === 22 || code === 1014) ? 'voll' : 'gesperrt';
}

let speicherGeht = true;
let speicherFehler = null;

try {
  localStorage.setItem(`${KEY}.probe`, '1');
  localStorage.removeItem(`${KEY}.probe`);
} catch {
  // Beim Start ist auch ein voller Speicher eine Sperre: Es gibt noch nichts
  // zu retten, und der Rat wäre derselbe wie bei jeder anderen Ursache.
  speicherGeht = false;
  speicherFehler = 'gesperrt';
}

/** false, wenn der Browser nichts speichern kann – Eintragungen sind flüchtig. */
function kannSpeichern() { return speicherGeht; }

/** 'gesperrt', 'voll' oder null – siehe warumNicht(). */
function speicherGrund() { return speicherGeht ? null : speicherFehler; }

function schreibe() {
  schreibUhr = null;
  const vorher = speicherGeht;
  try {
    localStorage.setItem(KEY, JSON.stringify(zustand));
    speicherGeht = true;
    speicherFehler = null;
  } catch (e) {
    speicherGeht = false;
    speicherFehler = warumNicht(e);
  }
  // Beim Wechsel melden, in *beide* Richtungen: Der Schreibvorgang läuft nach
  // dem Zeichnen, die Warnung stünde sonst einen Eintrag zu spät da – und
  // bliebe nach dem Aufräumen kleben, bis zufällig etwas anderes neu zeichnet.
  if (speicherGeht !== vorher) melde();
}

function merke() {
  clearTimeout(schreibUhr);
  schreibUhr = setTimeout(schreibe, 120);
}

/**
 * Ausstehenden Schreibvorgang sofort ausführen. Nötig, bevor die App in den
 * Hintergrund geht: mobile Browser verwerfen die Seite dort ohne Vorwarnung,
 * und der letzte Eintrag wäre verloren.
 */
function sofortSchreiben() {
  if (schreibUhr === null) return;
  clearTimeout(schreibUhr);
  schreibe();
}

function melde() {
  hoerer.forEach((fn) => fn(zustand));
}

function horche(fn) {
  hoerer.add(fn);
  return () => hoerer.delete(fn);
}

function zustandLesen() { return zustand; }

/* ---------- Eintragungen ---------- */

/**
 * Eine Kennung, die auch dann eindeutig bleibt, wenn zwei Einträge in
 * derselben Millisekunde entstehen – beim Einlesen einer Sicherung etwa, oder
 * wenn jemand schnell hintereinander tippt.
 */
let zaehler = 0;
function neueId() {
  zaehler += 1;
  return `e${Date.now().toString(36)}${zaehler.toString(36)}`;
}

/**
 * Einen Eintrag anlegen. Datum und Uhrzeit sind optional und stehen sonst auf
 * jetzt – der Normalfall ist „ich trage gerade ein, was gerade war".
 */
function eintragen(eintrag) {
  const neu = {
    id: neueId(),
    am: eintrag.am || heuteISO(),
    um: eintrag.um || jetztUhr(),
    ...eintrag,
  };
  zustand.eintraege = sortiert([...zustand.eintraege, neu]);
  merke();
  melde();
  return neu.id;
}

function eintragAendern(id, patch) {
  const i = zustand.eintraege.findIndex((e) => e.id === id);
  if (i < 0) return;
  zustand.eintraege[i] = { ...zustand.eintraege[i], ...patch, id };
  zustand.eintraege = sortiert(zustand.eintraege);
  merke();
  melde();
}

function eintragLoeschen(id) {
  const vorher = zustand.eintraege.length;
  zustand.eintraege = zustand.eintraege.filter((e) => e.id !== id);
  if (zustand.eintraege.length === vorher) return;
  merke();
  melde();
}

function eintragVon(id) {
  return zustand.eintraege.find((e) => e.id === id) || null;
}

/** Alle Eintragungen eines Tages, in zeitlicher Reihenfolge. */
function eintraegeAm(iso) {
  return zustand.eintraege.filter((e) => e.am === iso);
}

/** Der Tag der jüngsten Eintragung – oder heute, wenn es keine gibt. */
function letzterTag() {
  const e = zustand.eintraege;
  return e.length ? e[e.length - 1].am : heuteISO();
}

/**
 * Wann zuletzt etwas eingetragen wurde, als Zeitpunkt. Die Tagesansicht
 * braucht das, um „seit 6 Stunden nichts" sagen zu können.
 */
function letzterZeitpunkt() {
  const e = zustand.eintraege;
  return e.length ? zeitpunkt(e[e.length - 1].am, e[e.length - 1].um) : null;
}

/* ---------- Tagesangaben ---------- */

function tagLesen(iso) {
  return zustand.tage[iso] || {};
}

function tagSetzen(iso, patch) {
  const neu = { ...tagLesen(iso), ...patch };
  // Einen leeren Tag gar nicht erst anlegen: Sonst wächst `tage` mit jedem
  // angetippten und wieder abgewählten Regler, und die Sicherung füllt sich
  // mit Zeilen, die nichts aussagen. Geprüft wird über alle Felder, nicht über
  // eine feste Liste – sonst hinterlässt jede neue Tagesfrage leere Tage.
  const leer = Object.values(neu).every((v) => v === null || v === undefined
    || v === '' || (typeof v === 'string' && !v.trim()));
  if (leer) delete zustand.tage[iso];
  else zustand.tage[iso] = neu;
  merke();
  melde();
}

/* ---------- Einstellungen ---------- */

function einstellen(schluessel, wert) {
  if (!(schluessel in VORGABE)) return;
  zustand[schluessel] = wert;
  merke();
  melde();
}

/** Ein eigener Auslöser. Doppelte Namen führen auf denselben Eintrag zurück. */
function ausloeserAnlegen(id, name) {
  if (zustand.eigeneAusloeser.some((a) => a.id === id)) return;
  zustand.eigeneAusloeser = [...zustand.eigeneAusloeser, { id, name }];
  merke();
  melde();
}

/**
 * Einen eigenen Auslöser wieder loswerden.
 *
 * Er verschwindet aus der Auswahl, aber nicht aus den Eintragungen, in denen
 * er steht. Das ist Absicht: Ein Tagebuch rückwirkend zu verändern, weil eine
 * Auswahlliste sich geändert hat, wäre das Gegenteil von dem, wofür man es
 * führt.
 */
function ausloeserLoeschen(id) {
  zustand.eigeneAusloeser = zustand.eigeneAusloeser.filter((a) => a.id !== id);
  merke();
  melde();
}

/** Ein benutztes Mittel als Vorschlag merken – die fünf jüngsten. */
function mittelMerken(name) {
  const sauber = String(name).trim();
  if (!sauber) return;
  zustand.zuletztMittel = [sauber, ...zustand.zuletztMittel.filter((m) => m !== sauber)].slice(0, 5);
  merke();
}

/* ---------- Auslassversuch ---------- */

/**
 * Einen Auslassversuch beginnen.
 *
 * Nur einer zur Zeit, und ein laufender wird nicht stillschweigend ersetzt –
 * wer einen neuen anfängt, verwirft den alten sichtbar (die Anzeige fragt
 * vorher). Alles Weitere rechnet js/versuch.js aus den Daten; hier steht nur,
 * was sich nicht ausrechnen lässt: was, ab wann, wie lange.
 */
function versuchStarten(art, ziel, tage = 14) {
  zustand.versuch = {
    id: neueId(),
    art,
    ziel,
    start: heuteISO(),
    tage: Math.max(7, Math.min(28, Number(tage) || 14)),
    provokation: null,   // ISO-Tag der bewussten Wiedereinführung
    beendet: null,       // ISO-Tag des Abbruchs, falls abgebrochen
  };
  merke();
  melde();
  return zustand.versuch.id;
}

/** Der Tag der Provokation – ab hier wird wieder gegessen und weiter gezählt. */
function versuchProvozieren(iso) {
  if (!zustand.versuch) return;
  zustand.versuch = { ...zustand.versuch, provokation: iso || heuteISO() };
  merke();
  melde();
}

/**
 * Abbrechen. Der Versuch bleibt stehen statt zu verschwinden: Ein abgebrochener
 * Versuch ist selbst eine Auskunft („zwei Tage durchgehalten"), und ihn zu
 * löschen hieße, das Tagebuch schönzumachen.
 */
function versuchBeenden() {
  if (!zustand.versuch) return;
  zustand.versuch = { ...zustand.versuch, beendet: heuteISO() };
  merke();
  melde();
}

/**
 * Den laufenden Versuch abhaken und in die Historie legen.
 *
 * Früher hieß dieser Knopf „Wegräumen" und warf ihn weg. Das war die falsche
 * Bewegung: Ein fertiger Versuch ist das Wertvollste, was dieses Tagebuch
 * hervorbringt – zwei Wochen Verzicht plus eine bewusste Wiedereinführung –,
 * und er ist genau dann weg, wenn man ihn ein halbes Jahr später bräuchte.
 */
function versuchAblegen() {
  if (!zustand.versuch) return;
  const abgelegt = { ...zustand.versuch, abgelegt: heuteISO() };
  zustand.versuche = [abgelegt, ...zustand.versuche].slice(0, 40);
  zustand.versuch = null;
  merke();
  melde();
}

/** Einen abgelegten Versuch endgültig löschen – die eine Stelle, die vergisst. */
function versuchLoeschen(id) {
  const vorher = zustand.versuche.length;
  zustand.versuche = zustand.versuche.filter((v) => v.id !== id);
  if (zustand.versuche.length === vorher) return;
  merke();
  melde();
}

/* ---------- Arzttermine ---------- */

/**
 * Einen Termin eintragen. Doppelte Daten fallen weg, sortiert wird absteigend –
 * der jüngste steht vorn, weil ihn der Bericht braucht.
 */
function terminAnlegen(iso) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(String(iso || ''))) return;
  if (zustand.termine.includes(iso)) return;
  zustand.termine = [...zustand.termine, iso].sort().reverse();
  merke();
  melde();
}

function terminLoeschen(iso) {
  const vorher = zustand.termine.length;
  zustand.termine = zustand.termine.filter((t) => t !== iso);
  if (zustand.termine.length === vorher) return;
  merke();
  melde();
}

/**
 * Der jüngste Termin, der nicht in der Zukunft liegt.
 *
 * Ein Termin nächste Woche ist der *nächste*, nicht der letzte – der Bericht
 * müsste sonst über einen Zeitraum von minus drei Tagen berichten.
 */
function letzterTermin(bis) {
  return zustand.termine.find((t) => t <= bis) || null;
}

/* ---------- Ideen weitergeben ---------- */

/**
 * Wie viele Ideen noch niemand gesehen hat.
 *
 * Die App hat keinen Server, also kommen ihre Vorschläge bei niemandem an,
 * solange sie sie nicht selbst weitergibt. Bisher stand der Knopf dafür unten
 * auf dem Ideenreiter und wurde übersehen – eine Idee, die niemand liest, ist
 * dasselbe wie keine.
 *
 * Gezählt wird schlicht die Länge der Liste beim letzten Weitergeben. Das ist
 * gröber als eine Markierung je Idee und dafür ehrlich: Wer zwischendurch
 * etwas löscht, bekommt eher zu wenig „neu" angezeigt als zu viel.
 */
function ideenOffen() {
  return Math.max(0, zustand.ideen.length - (zustand.ideenGeschickt || 0));
}

function ideenGeschicktMerken() {
  zustand.ideenGeschickt = zustand.ideen.length;
  merke();
  melde();
}

/* ---------- Ideen zur App ---------- */

function ideeAnlegen(text) {
  const sauber = String(text || '').trim();
  if (!sauber) return null;
  const neu = { id: neueId(), am: heuteISO(), text: sauber, erledigt: false };
  zustand.ideen = [neu, ...zustand.ideen];
  merke();
  melde();
  return neu.id;
}

/*
 * Die Rechenschicht: aus Eintragungen Muster machen.
 *
 * Reine Funktionen, keine Anzeige, kein Speicherzugriff – alles kommt als
 * Argument herein. Das ist nicht Ordnungsliebe: Diese Datei ist der einzige
 * Ort, an dem die App etwas *behauptet*, und Behauptungen über den eigenen
 * Körper muss man einzeln nachrechnen können. Genau das tut tests/rechnen.mjs.
 *
 * Die Grundfrage lautet immer gleich: Geht es nach Mahlzeiten mit einem
 * bestimmten Merkmal schlechter als nach Mahlzeiten ohne? Verglichen wird
 * also nicht gegen Null, sondern gegen den eigenen Alltag. Ohne diesen
 * Vergleich fände man bei jedem Menschen mit täglichen Beschwerden jedes
 * Lebensmittel „auffällig", das er täglich isst.
 *
 * Drei Regeln, die verhindern, dass daraus Kaffeesatzleserei wird:
 *
 *   1. Mindestens `mindestFaelle` Mahlzeiten *mit* dem Merkmal und ebenso
 *      viele *ohne*. Aus drei Fällen wird hier keine Aussage.
 *   2. Die Fallzahl steht immer daneben, auch wenn sie unbequem ist.
 *   3. Es heißt „auffällig", nicht „verursacht". Was hier herauskommt, ist
 *      ein Anhaltspunkt fürs Gespräch beim Arzt, keine Diagnose.
 */


/** Späte Mahlzeit ab dieser Stunde – siehe UMSTAENDE in js/daten.js. */
const SPAET_AB = 20;

/**
 * Die Zutaten einer Mahlzeit als [{ id, rolle }].
 *
 * Seit die Rolle dazugehört, stehen sie unter `zutaten`. Vorher war es eine
 * bloße Liste von IDs unter `tags`. Der Speicher rechnet alte Stände beim
 * Laden um (siehe mahlzeitFrisch in js/store.js) – die Zeile hier ist der
 * zweite Riegel, für alles, was an dieser Umrechnung vorbeikommt: eine
 * Sicherung aus einer älteren Fassung, ein von Hand gesetzter Zustand, ein
 * Test, der die Rechenschicht direkt aufruft.
 */
function zutatenVon(eintrag) {
  if (Array.isArray(eintrag.zutaten)) {
    return eintrag.zutaten
      .filter((z) => z && typeof z.id === 'string')
      .map((z) => ({ id: z.id, rolle: z.rolle || ROLLE_VORGABE }));
  }
  if (Array.isArray(eintrag.tags)) {
    return eintrag.tags.map((id) => ({ id, rolle: ROLLE_VORGABE }));
  }
  return [];
}

/**
 * Alle Merkmale einer Mahlzeit: die Zutaten plus die beiden Umstände, die
 * sich aus Portion und Uhrzeit von selbst ergeben.
 *
 * Die Rolle spielt hier bewusst *keine* Rolle: Für die Frage „war es drin?"
 * zählt jede Zutat gleich. Was die Rolle unterscheidet, steht getrennt in
 * rollenBilanz() – und zwar mit Fallzahlen, statt still eine Gewichtung in
 * die Hauptzahl zu rechnen, die niemand nachvollziehen könnte.
 */
function merkmale(eintrag) {
  if (eintrag.art !== 'essen') return [];
  const raus = zutatenVon(eintrag).map((z) => z.id);
  if (eintrag.portion === 'gross') raus.push('gross');
  const std = Number(String(eintrag.um || '').split(':')[0]);
  if (Number.isFinite(std) && std >= SPAET_AB) raus.push('spaet');
  return [...new Set(raus)];

/**
 * Die Beschwerden, die einer Mahlzeit im Zeitfenster folgen.
 *
 * `> 0` und nicht `>= 0`: Eine Beschwerde, die zur selben Minute eingetragen
 * ist wie die Mahlzeit, war schon da. Sie der Mahlzeit zuzurechnen hieße, die
 * Ursache nach der Wirkung zu suchen.
 */
function folgende(eintraege, mahlzeit, fensterStunden) {
  const t0 = zeitpunkt(mahlzeit.am, mahlzeit.um);
  return eintraege.filter((e) => {
    if (e.art !== 'beschwerde') return false;
    const abstand = stundenDazwischen(t0, zeitpunkt(e.am, e.um));
    return abstand > 0 && abstand <= fensterStunden;
  });
}

/** Die stärkste Beschwerde im Fenster, oder 0, wenn keine kam. */
function wertNach(eintraege, mahlzeit, fensterStunden) {
  const nach = folgende(eintraege, mahlzeit, fensterStunden);
  return nach.reduce((m, e) => Math.max(m, Number(e.staerke) || 0), 0);

/**
 * Die Bilanz je Auslöser.
 *
 * Ein Auslöser taucht nur auf, wenn er überhaupt vorkommt. Ob genug Fälle
 * beisammen sind, sagt `genug` – die Zeile wird trotzdem geliefert, denn „noch
 * 2 Mahlzeiten, dann kann ich etwas dazu sagen" ist eine nützliche Auskunft.
 *
 * @param {object[]} eintraege  alle Eintragungen
 * @param {{fenster: number, mindestFaelle: number, eigene: object[]}} opt
 */
/**
 * Jede Mahlzeit mit ihren Merkmalen und dem, was danach kam.
 *
 * Einmal gerechnet und dann herumgereicht: Bei einem Jahr Tagebuch und zwei
 * Dutzend Auslösern wäre das je Auslöser neu das Quadrat der Arbeit. Seit die
 * Schichtung dazugekommen ist, braucht auch js/schichten.js genau diese Liste
 * – deshalb steht sie hier für sich und nicht mehr eingebacken in die Bilanz.
 *
 * `am` liegt bewusst obenauf: Die Schichtung schlägt damit den Tag nach, an
 * dem die Mahlzeit war, ohne den ganzen Eintrag auseinandernehmen zu müssen.
 */

  return eintraege.filter((e) => e.art === 'essen').map((m) => ({
    m,
    am: m.am,
    merkmale: new Set(merkmale(m)),
    wert: wertNach(eintraege, m, fenster),
  }));
}

function ausloeserBilanz(eintraege, opt = {}) {
  const fenster = opt.fenster || 4;
  const mindest = opt.mindestFaelle || 5;
  const bewertet = bewerteteMahlzeiten(eintraege, fenster);
  if (!bewertet.length) return [];

  const bekannt = new Set(ALLE_AUSLOESER.map((a) => a.id));
  (opt.eigene || []).forEach((a) => bekannt.add(a.id));
  // Auch Auslöser zählen, die nur in alten Eintragungen stehen – etwa ein
  // eigener, den jemand später aus der Auswahl entfernt hat.
  bewertet.forEach((b) => b.merkmale.forEach((id) => bekannt.add(id)));

  const zeilen = [];
  bekannt.forEach((id) => {
    const mit = bewertet.filter((b) => b.merkmale.has(id));
    if (!mit.length) return;
    const ohne = bewertet.filter((b) => !b.merkmale.has(id));
    const schnitt = (liste) => (liste.length
      ? liste.reduce((s, b) => s + b.wert, 0) / liste.length : 0);
    const quote = (liste) => (liste.length
      ? liste.filter((b) => b.wert > 0).length / liste.length : 0);
    const schnittMit = schnitt(mit);
    const schnittOhne = schnitt(ohne);
    zeilen.push({
      id,
      faelle: mit.length,
      gegenFaelle: ohne.length,
      schnittMit,
      schnittOhne,
      differenz: schnittMit - schnittOhne,
      quoteMit: quote(mit),
      quoteOhne: quote(ohne),
      genug: mit.length >= mindest && ohne.length >= mindest,
      fehlt: Math.max(0, mindest - mit.length),
      zuletzt: mit[mit.length - 1].m.am,

  // sie mehr wert ist.
  return zeilen.sort((a, b) => (b.differenz - a.differenz) || (b.faelle - a.faelle));

/**

 *
 * Der Grund ist die Fallzahl. „Zwiebel" kommt in einem halben Jahr vielleicht
 * zwölfmal vor – daraus wird nie eine belastbare Zahl, und die nächste Frage

 * zusammen, was denselben Weg nimmt: Über alle FODMAP-reichen Mahlzeiten

 * mehr als ein ganzer über zwölf. Gefordert werden trotzdem Fälle auf beiden
 * Seiten – wer *jede* Mahlzeit mit FODMAP isst, hat keine Vergleichsgruppe und
 * bekommt hier keine Zeile.

 * Koffein, Säure und Schließmuskel, und das ist richtig so: Er wirkt auf allen

 * sondern der Auslassversuch.

  // die in fast jeder Mahlzeit steckt, sonst mit acht Gegenfällen „auffällig"
  // hieße.
  const mindest = opt.mindestFaelle || 8;

  if (!mahlzeiten.length) return [];

    klassen: new Set(zutatenVon(m).flatMap((z) => klassenVon(z.id))),
    wert: wertNach(eintraege, m, fenster),

    const mit = bewertet.filter((b) => b.klassen.has(k.id));
    if (!mit.length) return;
    const ohne = bewertet.filter((b) => !b.klassen.has(k.id));
    const schnitt = (liste) => (liste.length
      ? liste.reduce((s, b) => s + b.wert, 0) / liste.length : 0);
    const quote = (liste) => (liste.length
      ? liste.filter((b) => b.wert > 0).length / liste.length : 0);
    const schnittMit = schnitt(mit);
    const schnittOhne = schnitt(ohne);
    zeilen.push({
      id: k.id,
      name: k.name,
      kurz: k.kurz,
      was: k.was,
      faelle: mit.length,
      gegenFaelle: ohne.length,
      schnittMit,
      schnittOhne,
      differenz: schnittMit - schnittOhne,
      quoteMit: quote(mit),
      quoteOhne: quote(ohne),
      genug: mit.length >= mindest && ohne.length >= mindest,
      fehlt: Math.max(0, mindest - mit.length),
      fehltGegen: Math.max(0, mindest - ohne.length),

/**

 * Ohne diese Aufschlüsselung wäre „FODMAP ist auffällig" eine Sackgasse: Man

/**

/**

/**

/* ---------- Die übrigen Faktoren ---------- */

/**

 * verschiedene Dinge.
 */
function stundenSeitEssen(eintraege, beschwerde) {
  const t = zeitpunkt(beschwerde.am, beschwerde.um);
  let letzte = null;
  eintraege.filter((e) => e.art === 'essen').forEach((e) => {
    const te = zeitpunkt(e.am, e.um);
    if (te < t && (letzte === null || te > letzte)) letzte = te;
  });

  const std = stundenDazwischen(letzte, t);
  return std <= 24 ? std : null;

/**

 * schwerste aus dem Kopf zu beantworten. Aus dem Tagebuch fällt sie ab.
 */

  const beschwerden = eintraege.filter((e) => e.art === 'beschwerde');
  let nah = 0;
  let fern = 0;
  let unbekannt = 0;
  beschwerden.forEach((b) => {
    const std = stundenSeitEssen(eintraege, b);
    if (std === null) unbekannt += 1;
    else if (std <= nahStunden) nah += 1;
    else if (std >= fernStunden) fern += 1;

  return {
    gesamt: beschwerden.length,
    nachDemEssen: nah,
    nuechtern: fern,
    unbekannt,

    anteilNuechtern: bewertbar ? fern / bewertbar : 0,
