<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141013">
<meta name="description" content="Tagebuch für Magen und Verdauung: Essen, Beschwerden, Zyklus, Stimmung. Alles bleibt auf dem Gerät.">
<!-- Kein Robots-Eintrag nötig: Die Seite enthält keine Daten. Die stehen im
     Browser dessen, der sie benutzt, und kommen dort nie heraus. -->
<title>Body Check</title>
<!-- Ohne diese drei behandelt iOS die Seite auch dann als Lesezeichen, wenn
     sie auf dem Startbildschirm liegt: mit Adressleiste und Browserleiste.
     Safari liest das Manifest dafür nicht. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Body Check">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <h1 class="brand">Body Check</h1>
    <p class="brand-sub">bleibt auf diesem Gerät</p>
  </div>
</header>

<main id="view" class="view" role="tabpanel" tabindex="-1" aria-labelledby="tab-heute">
  <!-- Der Notausgang. Auf dem Startbildschirm gibt es weder Adressleiste noch
       Herunterziehen zum Neuladen. Startet das Skript nicht – etwa weil nach
       einer Aktualisierung eine Datei fehlt –, bliebe nur, die App im
       App-Umschalter wegzuwischen, und das weiß kaum jemand. Dieser Absatz
       erscheint erst nach vier Sekunden (css/styles.css, .notausgang) und
       verschwindet, sobald js/app.js den Inhalt zeichnet. -->
  <p class="notausgang">Lädt nicht? <a href="">Neu laden</a></p>
</main>

<!-- Die Reiter füllt js/app.js. Sie stehen trotzdem hier: Seite und Skript
     können aus unterschiedlich alten Zwischenspeichern stammen, und eine leere
     Leiste mit einem älteren Skript wäre eine App ohne Navigation. -->
<nav class="tabbar" id="tabbar" role="tablist">
  <button type="button" class="tab" id="tab-heute" data-act="tab" data-tab="heute" role="tab" aria-controls="view"><span class="ti">📓</span><span>Tag</span></button>
  <button type="button" class="tab" id="tab-verlauf" data-act="tab" data-tab="verlauf" role="tab" aria-controls="view"><span class="ti">📅</span><span>Verlauf</span></button>
  <button type="button" class="tab" id="tab-muster" data-act="tab" data-tab="muster" role="tab" aria-controls="view"><span class="ti">🔍</span><span>Muster</span></button>
  <button type="button" class="tab" id="tab-ideen" data-act="tab" data-tab="ideen" role="tab" aria-controls="view"><span class="ti">💡</span><span>Ideen</span></button>
  <button type="button" class="tab" id="tab-mehr" data-act="tab" data-tab="mehr" role="tab" aria-controls="view"><span class="ti">⚙️</span><span>Mehr</span></button>
</nav>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
