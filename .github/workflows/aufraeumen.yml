# Einmalig: die Läufe der alten, umgeschriebenen Geschichte löschen.
#
# Am 29.10.2026 wurde die Geschichte von main neu geschrieben. Die Läufe von
# davor zeigen weiter die alten Commit-Nachrichten und verweisen auf die alten
# Commits. Behalten wird jeder Lauf, dessen Commit in der heutigen Geschichte
# von main steht, und dieser Lauf selbst; alles andere wird gelöscht.
#
# Nur von Hand zu starten. Ohne wirklich=ja wird nur gezählt, nichts gelöscht.
# Ausgegeben werden nur Zahlen, keine Nachrichten. Die Datei wird danach
# wieder entfernt.
name: Aufräumen

on:
  workflow_dispatch:
    inputs:
      wirklich:
        description: 'ja = löschen, alles andere = nur zählen'
        required: false
        default: 'nein'

permissions:
  actions: write
  contents: read

jobs:
  laeufe:
    name: Läufe der alten Geschichte
    runs-on: ubuntu-latest
    steps:
      - name: Zählen und löschen
        env:
          GH_TOKEN: ${{ github.token }}
          WIRKLICH: ${{ inputs.wirklich }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/commits?sha=main&per_page=100" \
            --jq '.[].sha' | sort -u > behalten.txt
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" \
            --jq '.workflow_runs[] | "\(.id) \(.head_sha)"' > laeufe.txt
          echo "Commits in main: $(wc -l < behalten.txt)"
          echo "Läufe insgesamt: $(wc -l < laeufe.txt)"
          if [ "$(wc -l < behalten.txt)" -lt 50 ]; then
            echo "Zu wenige Commits in main gefunden – breche ab, bevor zu viel gelöscht wird."
            exit 1
          fi
          weg=0
          bleibt=0
          fehler=0
          while read -r id sha; do
            if [ "$id" = "$GITHUB_RUN_ID" ] || grep -qx "$sha" behalten.txt; then
              bleibt=$((bleibt + 1))
            elif [ "$WIRKLICH" = "ja" ]; then
              if gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$id" < /dev/null > /dev/null; then
                weg=$((weg + 1))
              else
                fehler=$((fehler + 1))
              fi
            else
              weg=$((weg + 1))
            fi
          done < laeufe.txt
          if [ "$WIRKLICH" = "ja" ]; then
            echo "Behalten: $bleibt, gelöscht: $weg, fehlgeschlagen: $fehler"
          else
            echo "Nur gezählt. Behalten: $bleibt, würde löschen: $weg"
          fi
          [ "$fehler" -eq 0 ]
