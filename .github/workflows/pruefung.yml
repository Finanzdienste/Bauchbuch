# Bei jedem Push: nachsehen, nachbauen, nachklicken.
#
# Die App hat keinen Bauschritt – aber sie hat eine erzeugte Datei
# (dist/bauchbuch.html) und eine Zusage, die nur so lange gilt, wie sie geprüft
# wird: dass nichts das Gerät verlässt.
name: Prüfung

# Lesen genügt. Dieser Ablauf führt bei jedem Push den Code des Zweiges aus –
# npm ci, die Testsuite, den Ein-Datei-Bau. Auf einem Zweig aus dem Briefkasten
# ist das Code, der aus fremden Zetteln entstanden ist. Ohne diesen Block gilt
# die Voreinstellung des Repositories, und die kann Schreibrecht sein: Dann
# hinge an der Prüfung mehr, als sie prüfen soll.
permissions:
  contents: read

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lesen:
    name: Schichtung und erzeugte Dateien
    runs-on: ubuntu-latest
    steps:
      # Mit voller Vorgeschichte, weil die Bot-Grenzen unten den Zweig gegen
      # den Hauptzweig vergleichen.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Ein Entwurf, der aus dem Briefkasten stammt, darf die Wächter nicht
      # anfassen. Das steht hier und nicht im Ablauf des Bots: Was er selbst
      # ausführt, kann er auch umgehen – diese Stelle entscheidet dagegen
      # darüber, ob zusammengeführt werden darf.
      #
      # Ohne --depth: Der Checkout hat die volle Vorgeschichte, und ein
      # flacher Fetch schnitte sie an der Spitze von main ab. Danach sähe der
      # Schritt „Allgemein“ nur noch einen Commit-Text statt aller.
      - name: Grenzen für Entwürfe aus dem Briefkasten
        run: |
          git fetch origin main 2>/dev/null || true
          python3 tools/pruefung/bot-grenzen.py origin/main

      # Die Zusage der App: genau ein Versandweg, an genau eine Adresse, und
      # Gesundheitsdaten gehen nie mit. Der schnelle Nachweis ohne Browser –
      # die gründlichen stehen in tests/test-still.mjs (was auf Tastendruck
      # hinausgeht) und tests/test-schweigen.mjs (dass ohne Tastendruck nichts
      # passiert).
      - name: Nur der eine Weg nach draußen
        run: python3 tools/pruefung/keine-leitung.py

      # Das Repository ist öffentlich, die App für alle gebaut. Kein
      # Kommentar, kein Test und kein Commit-Text darf nach einem bestimmten
      # Menschen klingen – wer was nimmt, wer was trägt. Ohne Namensliste:
      # Die prüft nur der lokale Haken (tools/haken/).
      #
      # Alle Commit-Texte, die HEAD erreicht, nicht die seit origin/main:
      # Jede Fassung geht hier direkt auf main, und nach dem Checkout zeigt
      # origin/main auf genau den gepushten Stand – der Bereich wäre leer, und
      # die Prüfung liefe ins Leere. Öffentlich ist ohnehin die ganze
      # Vorgeschichte.
      - name: Allgemein, ohne Personenbezug
        run: python3 tools/pruefung/allgemein.py --commits HEAD

      # Die Rechnung darf nicht an der Anzeige hängen, und ein neues Modul muss
      # in beiden Listen stehen: im Bündel und im Offline-Vorrat. Beides geht
      # sonst still kaputt – die Ein-Datei-Fassung endet in einem
      # ReferenceError, während index.html weiterläuft.
      - name: Module sind sauber geschichtet und vollständig gelistet
        run: python3 tools/pruefung/schichten.py

      # Die Ein-Datei-Fassung noch einmal erzeugen. Kommt etwas anderes heraus
      # als eingecheckt ist, wurde von Hand hineingeschrieben oder der Bau
      # vergessen – und weitergegeben wird genau diese Datei.
      #
      # Dasselbe für den Fingerabdruck in sw.js. An ihm erkennt der Browser
      # eine neue Fassung; steht er auf dem alten Stand, kommt eine Änderung
      # auf keinem Startbildschirm an, und niemand merkt es.
      - name: dist/bauchbuch.html und sw.js sind aktuell
        run: |
          python3 tools/build-single.py
          git diff --exit-code -- dist/bauchbuch.html \
            || { echo "::error::dist/bauchbuch.html ist nicht neu erzeugt worden – python3 tools/build-single.py"; exit 1; }
          git diff --exit-code -- sw.js \
            || { echo "::error::Der Stand in sw.js ist veraltet – python3 tools/build-single.py, sonst kommt die Änderung nicht an"; exit 1; }

  klicken:
    name: Browsertests
    # Fest auf 24.04: Auf ubuntu-latest (26.04) kann die Playwright-Fassung
    # aus package-lock.json die Abhängigkeiten von Chromium nicht installieren,
    # und kein einziger Test liefe an.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: npm ci
      # Nur Chromium: die App ist fürs Handy gebaut, und drei Browser
      # herunterzuladen kostet mehr Zeit als der ganze Testlauf.
      - run: npx playwright install --with-deps chromium

      # Zwei Tests prüfen die Ein-Datei-Fassung – die muss vorher da sein.
      - run: python3 tools/build-single.py

      - name: Alle Tests
        run: node tests/lauf.mjs

      # Bildschirmfotos aus dem Lauf – bei einem Fehlschlag der schnellste Weg
      # zu sehen, was die App wirklich angezeigt hat.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bildschirmfotos
          path: .testlauf/*.png
          if-no-files-found: ignore
          retention-days: 7
